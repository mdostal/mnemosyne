# From the idea brief
claude_md_summary: |
  Mnemosyne is the Pantheon's memory god — the single unified layer that writes
  and recalls across every memory scope. It wraps existing infrastructure
  (Qdrant Cloud, swarm-memory, Obsidian vault) rather than reinventing them.

  Key constraints:
  - Do NOT wipe existing Qdrant collections or Obsidian vault
  - Multica-native scheduling only (no localized cron)
  - Loud failure is a hard requirement
  - Build ON what exists (swarm-memory at ~/Documents/work/dostal/code/swarm-memory)

