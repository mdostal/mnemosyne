design_decisions:
  - decision: "persona show is the harness-agnostic fetch contract that any future adapter (per design-discussion.md §7a) would call instead of reading persona YAML files directly."
    rationale: "design-discussion.md §7a: 'H5's query-up/persona show mechanism already supports either style' of future adapter — this story is what makes that concretely true, not just a design intention."

