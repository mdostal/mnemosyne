description: |
  Extends pf-05's integration test suite (Slice 1) to cover global-tier sync,
  and adds an explicit regression test proving Slice 1's repo-local/
  code-architect sync still passes unchanged after Slice 2's changes. This
  is the concrete, automated proof — not just an assumption — that Slice 2
  is non-regressive, matching the vertical plan's stated pattern of carrying
  forward each prior slice's tests as regression checks.

acceptance_criteria:
  - "Given the real-world fixture corpus from pf-05, when synced with global-tier content (top-orchestrator/company-director/project-orchestrator), then the same round-trip/no-corruption guarantees hold as for code-architect"
  - "Given pf-05's full Slice 1 acceptance suite, when run against the codebase after pf-06 through pf-09's changes, then every assertion still passes without modification"

steps:
  - id: research
    description: Re-read pf-05's sync.integration.test.ts (now on this branch) to extend it consistently rather than duplicating fixture/test scaffolding.
    agent: researcher
  - id: test-spec
    description: Write failing tests for global-tier fixture round-trips and add an explicit "Slice 1 still passes" regression assertion set.
    agent: tester
    depends_on: [research]
  - id: implement
    description: Extend the fixture corpus and integration suite; this story should not need any production-code changes if pf-06 through pf-09 are correct — if it does, that's a signal one of those stories has a bug.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Review that the regression assertions genuinely re-exercise Slice 1's code paths (not just re-import the same test file without running it against the new codebase state).
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feature branch. This is Slice 2's final story — confirm the full Slice 1 + Slice 2 story set is green together before moving to Slice 3.
    agent: developer
    depends_on: [review]

