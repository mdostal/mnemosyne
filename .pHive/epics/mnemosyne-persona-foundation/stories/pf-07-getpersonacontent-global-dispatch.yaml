id: pf-07-getpersonacontent-global-dispatch
epic: mnemosyne-persona-foundation
title: getPersonaContent global-tier dispatch
status: complete
complexity: medium
methodology: tdd

note_on_completion: >
  Merged 2026-08-15 (commit 3854286). Real TDD with an actual red/green
  proof (builder git-stashed the implementation, confirmed 7 tests failed,
  restored, confirmed green). Independently verified: reran vitest (109/109),
  persona-cli tests, and tsc myself. Fallback-and-warn logic genuinely shared
  between code-architect and global-tier paths via one helper. Two pf-02
  placeholder tests legitimately updated (spot-checked the diff myself) --
  they asserted the old unconditional-return behavior pf-02's own docstring
  said would change here; still assert the same end-state fallback result,
  just via the real path. All acceptance criteria met.
depends_on: [pf-06-global-persona-store-module]

description: |
  Extends pf-02's getPersonaContent (built in Slice 1 for code-architect
  only) to route top-orchestrator/company-director/project-orchestrator
  through pf-06's global store instead of the Slice-1 fallback-only path.
  This is where the fallback-to-TIER_CONTENT safety net (already built in
  pf-02) becomes actually exercisable for real, since a real global store
  now exists to be empty or populated.

acceptance_criteria:
  - "Given a global-store persona exists for a (tier, scopeId) pair, when getPersonaContent is called for a global tier, then it returns that persona's content, MANDATE_SECTIONS re-injected"
  - "Given no global-store persona exists yet for a (tier, scopeId) pair, when getPersonaContent is called, then it falls back to TIER_CONTENT[tier] and logs/warns (same safety-net contract as pf-02's code-architect fallback)"
  - "Given pf-05's Slice 1 acceptance suite, when re-run against this story's changes, then it still passes unmodified — code-architect/repo-local dispatch is untouched by this story"

steps:
  - id: research
    description: Re-read pf-02's getPersonaContent implementation (now on this branch) and pf-06's global store read function to confirm the exact dispatch shape before extending it.
    agent: researcher
  - id: test-spec
    description: Write failing tests for global-tier dispatch (persona exists vs. fallback), and a regression test that re-runs pf-05's Slice 1 fixtures/assertions unchanged.
    agent: tester
    depends_on: [research]
  - id: implement
    description: Extend getPersonaContent's dispatch (keyed off PERSONA_STORE_BY_TIER) to route global tiers through pf-06's read function, with the same fallback-and-warn behavior pf-02 established for code-architect.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Review that the fallback-and-warn logic is not duplicated/drifted between the code-architect path (pf-02) and the global-tier path (this story) — should share one implementation.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/mdostal/Documents/work/pantheon/mnemosyne
  key_files:
