    change: "getPersonaContent's dispatch logic extended to route global tiers through persona-store-global.ts's read function."
  - file: lib/mnemosyne/layer1/__tests__/persona.test.ts
    change: "Add global-tier dispatch tests alongside the existing code-architect tests from pf-02."

design_decisions:
  - decision: "Fallback-and-warn behavior is shared logic between the code-architect path and the global-tier path, not duplicated."
    rationale: "Avoids the two paths drifting — a bug fix to one fallback behavior should apply to both without a second patch."

cross_cutting: []

risks:
