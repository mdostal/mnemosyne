    description: "If this story's dispatch extension accidentally changes the code-architect path's behavior (e.g. by restructuring shared dispatch code), Slice 1's non-regression guarantee breaks silently."
    mitigation: "Acceptance criteria explicitly requires pf-05's Slice 1 suite to pass unmodified — this is the concrete regression proof."

