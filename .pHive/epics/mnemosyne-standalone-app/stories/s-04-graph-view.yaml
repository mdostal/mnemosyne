id: s-04-graph-view
epic: mnemosyne-standalone-app
title: Impact graph view (node-link render of swarm-memory graph)
status: complete
complexity: medium
methodology: tdd
depends_on: [s-03-collections-search]

description: |
  Add a "Graph" panel to the /ui shell rendering swarm-memory's real impact
  graph (`swarm-memory graph stats` / `graph edges`, backed by
  ~/.local/share/swarm-memory/graph.sqlite — 22 nodes / 30 edges today from
  markdown-link + python-import scans) as a node-link diagram, vanilla
  SVG/canvas, no charting library (zero-dep guardrail). Add two new engine
  functions (graphStats, graphEdges) wrapping the corresponding swarm-memory
  CLI subcommands, and GET /graph/stats + GET /graph/edges routes. Clicking a
  node shows its impact (`graph impact NODE`) and deps (`graph deps NODE`) in
  a side panel — read-only exploration only; this story does NOT expose
  `graph add`/`graph remove` (graph mutation) through the UI, since nothing
  in the design discussion calls for editing the graph from the UI and doing
  so silently would be scope creep beyond what was asked.

acceptance_criteria:
  - "Given the graph panel loads, when GET /graph/stats and GET /graph/edges succeed, then the rendered diagram shows the same node/edge counts as `swarm-memory graph stats`"
  - "Given a node is clicked, when GET /graph/impact/:node and GET /graph/deps/:node are called, then the side panel shows the same results as running `swarm-memory graph impact NODE` / `graph deps NODE` directly"
  - "Given the graph has zero edges (fresh install), when this happens, then the panel shows an explicit empty-state, not a broken render"
  - "Given this story ships, when the UI is used, then no UI action calls `swarm-memory graph add` or `graph remove` — graph mutation is out of scope"

steps:
  - id: research
    description: Confirm the exact JSON/text shape of `swarm-memory graph edges`, `graph impact`, and `graph deps` output (run them against the live graph.sqlite) to know what the engine wrapper needs to parse.
    agent: researcher
  - id: test-spec
    description: Write failing tests for graphStats(), graphEdges(), graphImpact(), graphDeps() in engine.mjs and their corresponding GET routes, including the zero-edges empty case.
    agent: tester
    depends_on: [research]
  - id: implement
    description: Implement the four engine wrapper functions, the four GET routes, and the vanilla-JS/SVG node-link render with click-to-inspect.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Confirm no UI path reaches `graph add`/`graph remove` (grep the implementation for those CLI args to be sure) and that zero-dep is preserved (no charting/graph-viz npm package pulled in).
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feat/mnemosyne-standalone-app.
    agent: developer
    depends_on: [review]

context:
  codebase: .
  key_files:
    - path: src/engine.mjs
      purpose: "New graphStats/graphEdges/graphImpact/graphDeps functions follow the existing run()/CLI-wrapper pattern used by health() and recall()"

files_to_modify:
  - file: src/engine.mjs
    change: "Add graphStats(), graphEdges(), graphImpact(node), graphDeps(node) wrapping `swarm-memory graph {stats,edges,impact,deps}`"
  - file: src/server.mjs
    change: "Add GET /graph/stats, GET /graph/edges, GET /graph/impact/:node, GET /graph/deps/:node"

design_decisions:
  - decision: "Read-only graph exploration only — no add/remove edge from the UI in v1"
    rationale: "Not requested by the design discussion; graph mutation via the UI is a meaningfully different trust/safety surface than viewing it, and should be its own explicit decision later if actually needed"
  - decision: "Vanilla SVG/canvas render, no graph-viz library"
    rationale: "Zero-dep guardrail (SERVICE.md); 22 nodes today is well within vanilla-JS force-layout territory"

cross_cutting:
  - concern: documentation
    action: "Add the four new GET /graph/* endpoints to SERVICE.md's endpoint table"

risks:
  - severity: low
    description: "swarm-memory graph edges/impact/deps text output format may not be JSON-clean, requiring text parsing that's fragile to CLI output changes"
    mitigation: "Research step confirms actual output shape before implement; if not structured, wrap with defensive parsing and surface a clear error rather than crashing"

references:
  - path: src/engine.mjs
    relevant_excerpt: |
      async function run(args, { timeout = CLI_TIMEOUT_MS } = {}) {
        const { stdout, stderr } = await execFileP(CLI, args, {
          timeout, maxBuffer: 32 * 1024 * 1024, env: CHILD_ENV,
        });
        return { stdout, stderr };
      }
