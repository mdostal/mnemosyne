id: la-05-recall-status-filtering
epic: mnemosyne-layer-architecture-v2
title: Recall status filtering (confirmed-default, provisional same-branch)
status: complete
note: "Built lib/mnemosyne/status-filter.ts + src/status-filter.mjs (zero-dep JS mirror for engine.mjs, same duplicated-on-purpose precedent as la-04's flight-status.ts/.mjs pair). Both resolve a hit's flight status by reading the status=/branch=/commit= HTML-comment header off the note file remember() wrote (hit.provenance.source in the TS shape, hit.full_path/location/source in engine.mjs's raw swarm-memory shape) -- there is no separate structured status field in swarm-memory's --json output today, so this reads the actual file on disk, never guesses. isEntryVisible() is the pure filtering rule, unit-tested directly (18 tests in status-filter.test.ts): no header (pre-la-04 legacy data or non-tracked content) -> always visible; status=confirmed -> always visible; status=provisional on the CALLER's own branch -> visible; status=provisional on any other/unknown branch -> hidden; status=superseded -> hidden by default (terminal, never the caller's live work); includeCrossBranchProvisional:true opt-in -> surfaces provisional+superseded across branches on demand. Wired into both real recall paths: MnemosyneClient.recall() (lib/mnemosyne/client.ts, TS) gained an additional optional 4th param (query, scope, intent?, statusOptions?) -- an extra optional param stays assignable to interfaces.ts's 3-arg RecallFn contract, so no existing 3-arg call site broke (confirmed by the untouched client.test.ts suite passing) -- and engine.mjs's recall() (the zero-dep JS entrypoint src/server.mjs's HTTP service actually dogfoods) gained opts.cwd/opts.includeCrossBranchProvisional, applied post-merge across vector+file+code-graph hits with total_hits recomputed to match; server.mjs's POST /recall now threads cwd/cross_branch_provisional from the request body (and GET /search from query params), and POST /remember now threads cwd through too (previously only {tag} was passed, which meant every write through the shared HTTP server used the SERVER PROCESS's own cwd for git-context auto-detection, not the calling agent's actual worktree -- a real gap this story had to close to make the integration test meaningful, since one shared server handles requests from many different worktrees). Both git-context-unresolvable paths (detached HEAD, no repo, no git binary) are non-fatal for recall (unlike remember()'s la-04 loud-fail write contract) -- they degrade to callerBranch:null, which the filter rule treats as 'no branch to prove same-branch-ness against', so cross-branch provisional entries stay safely excluded rather than the whole recall call failing. REAL subprocess-level integration test (test/recall-status-filtering.mjs, now wired into npm test ahead of the pre-existing http-api.mjs crash point so it actually executes in the aggregate chain): creates a REAL git repo via `git init` plus a REAL second `git worktree add -b <branch>` (two genuinely distinct directories, each on its own real branch -- verified via `git rev-parse --abbrev-ref HEAD` in both, not assumed), spawns ONE real `node src/server.mjs` subprocess (the actual live-service entrypoint hooks/lib/mnemo-client.mjs talks to on :8477) over real HTTP, extends the existing fake-swarm-memory CLI test double with a new FAKE_SWARM_INDEX_STORE env option (backward-compatible / opt-in, every pre-existing caller unaffected -- confirmed by write-through.mjs/reindex.mjs/vector.mjs/code-graph.mjs all still passing unchanged) so `recall` returns hits pointing at the REAL note files remember() wrote on disk, exercising status-filter.mjs's actual read-the-header-off-a-real-file code path end-to-end rather than a stubbed shortcut. Confirms: AC1 (provisional written on the feature-branch worktree is excluded when recalling from the main worktree, by default), AC2 (that same entry IS included when recalling from the feature-branch worktree itself), AC3 (the cross_branch_provisional:true opt-in surfaces it from main on demand), plus a bonus check that a confirmed entry (written on main) is visible from every branch regardless -- all against the real HTTP surface, not an in-process call. Full test suite: npx tsc --noEmit clean; vitest run lib/mnemosyne lib/minerva benchmarks src/planning src/config src/runners -> 283/286 passing (the 3 gap is CodeGraphLayerAdapter.test.ts's worker crash); the full node test/*.mjs chain (bundle/inject/write-through/health-drift/code-graph/reindex/vector/recall-status-filtering/review-auto-merge) all pass; http-api.mjs hits the SAME pre-existing better-sqlite3/CodeGraphLayerAdapter native-binding crash la-01 and la-04 already documented -- re-confirmed byte-for-byte identical failure (same SocketError at the same POST /recall call) on the unmodified pre-la-05 tree via `git stash`/`git stash pop`, so not a regression from this story. Live dogfooding: this repo IS the live dogfood target per the story's design -- the integration test above spawns and exercises the exact same src/server.mjs entrypoint the always-on :8477 Mnemosyne service on this machine runs, over real HTTP, with real git branches, not a mock. Deliberately did NOT restart the shared long-running :8477 service itself as part of this story (other concurrent agents on this same feature branch depend on it for real remember/recall calls right now -- ways-of-working: don't take disruptive actions against shared infra other agents rely on); it will pick up this code on its next normal restart/deploy cycle, at which point every write through it also gains the cwd threading fix described above.

  Deviations from the story spec, with reasoning: (1) files_to_modify named lib/mnemosyne/client.ts and src/engine.mjs specifically -- also touched src/server.mjs (necessary glue: the HTTP layer has to actually thread cwd/cross_branch_provisional from requests into engine.mjs's opts, and remember()'s cwd threading was a real pre-existing gap for a multi-worktree-caller scenario, not just a nice-to-have) and test/fixtures/fake-swarm-memory.mjs (needed a way for the integration test's fake CLI to return hits pointing at real files on disk, additive/opt-in via a new env var, zero behavior change for existing callers). (2) The plan doc's language is 'confirmed-only' by default; interpreted narrowly per the acceptance criteria (which only describe provisional filtering) to also exclude superseded from default recall (same non-ground-truth reasoning flight-status.ts's own doc comments already use for why superseded is excluded from KG-style 'current state' queries) while keeping it retrievable via the same opt-in as cross-branch provisional -- not explicitly required by the acceptance criteria but a direct, minimal extension of the same rule, not new scope. (3) Did not add status filtering to grep()'s keyword-only recall path (used by the separate /grep hybrid-recall endpoint from a prior story) -- out of this story's explicit scope (recall() specifically); grep hits reached via recall()'s own zero-hit escalation fallback ARE filtered, since that escalation happens inside recall()'s own return path."
complexity: medium
methodology: tdd
depends_on: [la-04-flight-status-schema]

description: |
  Consumes la-04's status/source_ref schema on the recall side. Default recall behavior must
  be confirmed-only across repos/company tier, so another agent on a different branch never
  inherits unmerged work as ground truth. Same-branch/same-session recall may include the
  caller's own provisional writes (an agent should see its own in-flight work).

  Testing bar (decided 2026-08-13): unit tests on status transitions, a real subprocess
  integration test, and live dogfooding in this repo — all three.

acceptance_criteria:
  - "Given entries with status=provisional written on branch X, when an agent on a different branch Y recalls, then those entries are excluded by default"
  - "Given entries with status=provisional written on the CALLER's own current branch, when that same caller recalls, then those entries ARE included by default"
  - "Given an explicit opt-in flag/param, when recall is called with it, then cross-branch provisional entries can be included on demand (for explicit review/debugging use cases)"
  - "Given a real subprocess-level integration test (per the decided testing bar), when a provisional write happens on a real branch and a recall happens from a different real branch/process, then filtering behaves correctly end-to-end, not just at the unit level"

steps:
  - id: research
    description: Review la-04's shipped schema and hive-memory's own existing valid_from/valid_until read-path filtering (if any) for a consistent filtering approach.
    agent: researcher
  - id: test-spec
    description: Write failing unit tests for status-based filtering logic, plus a real subprocess integration test spawning two branch contexts.
    agent: tester
    depends_on: [research]
  - id: implement
    description: Implement recall-side status filtering with the same-branch-provisional-inclusive default.
    agent: developer
