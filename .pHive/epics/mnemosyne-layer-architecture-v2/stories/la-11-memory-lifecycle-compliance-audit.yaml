id: la-11-memory-lifecycle-compliance-audit
epic: mnemosyne-layer-architecture-v2
title: Memory-lifecycle compliance audit
status: complete
note: "Built lib/mnemosyne/audit/ (types.ts, gitVerify.ts, provisionalDrift.ts, mandateCompliance.ts, report.ts, index.ts, cli.ts), a runnable on-demand audit exposed as `bin/mnemosyne-audit-lifecycle` (bash shim exec'ing tsx over lib/mnemosyne/audit/cli.ts, mirroring bin/mnemosyne-client-api's own shim-over-server.ts pattern) -- the explicitly-designed backstop for la-06's own documented risk ('git hooks only fire on the machine where the merge happens -- la-11's compliance audit is the backstop for exactly this gap'). AC2/AC3 (primary deliverable, stale-provisional drift + conservative auto-remediation): gitVerify.ts runs three real git subprocess checks -- isAncestorOf (`git merge-base --is-ancestor <sha> <defaultBranch>`, one command whose exit code alone distinguishes all 3 real outcomes: 0=ancestor, 1=known-but-not-ancestor, other=unknown object -- never a second guess-call), refExists (`git show-ref --verify`, local then remote-tracking), grepMergeCommitMessage (a real `git log --grep` search of default-branch history for a merge-commit message naming the branch, mirroring gitAdapter.ts's own message-parsing heuristic, run retrospectively). provisionalDrift.ts's classifyEntry walks these in order into 4 classifications (verified-merged / still-open / ambiguous / out-of-scope -- full reasoning in types.ts's DriftClassification doc comment): ONLY verified-merged (structural ancestry proof) is auto-remediation-eligible; ambiguous (unknown commit + deleted branch + a real merge-message trace) is flagged with a specific reason but never promoted -- not structurally provable via ancestry alone; out-of-scope (no trace at all) is counted, never itemized as a finding, since la-04's header schema carries no repo-identity field and this audit must not manufacture false alarms for entries that may simply belong to a different repository sharing the same global notes directory -- a limitation documented in code, not silently ignored. Auto-remediation reuses la-06's applyLifecycleEvent UNMODIFIED (imported, never reimplemented) -- classifyEntry only ever hands it a `promote` LifecycleTriggerEvent matched by the entry's own commit sha once ancestry is structurally proven; la-06's own NotesDirectoryStatusStore is reused unmodified too. AC3 (every remediation logged with justifying evidence): every classification and every RemediationAction carries an Evidence[] array (exact command argv, cwd, human-readable result, raw stdout when present) -- report.ts renders it in full, cli.ts's --json mode emits it verbatim; verified by test/lifecycle-compliance-audit.mjs asserting a real remediation's evidence array literally contains the `merge-base` command that justified it. AC1 (mandate compliance, specific evidence not vague warnings): mandateCompliance.ts checks whether la-07's automatic enforcement mechanisms are ACTUALLY installed, not just described in tier-1 prose -- checkClaudeCodeHooksInstalled reads a real settings.json for pre-recall.mjs/post-remember.mjs command entries (the same shape bin/mnemosyne-install-hooks writes), checkGitLifecycleHooksInstalled resolves a repo's real hooks dir via `git rev-parse --git-path hooks` (same as bin/mnemosyne-install-git-hooks's own resolveHooksDir) and checks for the `# mnemosyne-git-hook:` marker that installer writes -- every check's evidence field names the exact file path checked and what was/wasn't found there, never a bare true/false. TDD: wrote all 4 new vitest suites (gitVerify.test.ts 9 tests, provisionalDrift.test.ts 5 tests, mandateCompliance.test.ts 5 tests, index.test.ts 1 test -- 20 new tests total, all against real temp git repos/real temp fs state, zero mocked git output) and confirmed each red (Cannot find module) against the not-yet-written implementation before writing it, green after. THE mandated real subprocess integration test (test/lifecycle-compliance-audit.mjs, mirroring test/git-hooks.mjs's exact rigor): creates a real throwaway temp git repo, writes a real provisional note via the REAL src/engine.mjs remember() write path (fake-swarm-memory fixture standing in for live Qdrant only), performs an ACTUAL `git merge --no-ff` WITHOUT ever running bin/mnemosyne-install-git-hooks against that repo -- so no post-merge hook fires, reproducing la-06's exact documented gap -- then spawns the REAL runnable command (`node node_modules/.bin/tsx lib/mnemosyne/audit/cli.ts`, exactly as bin/mnemosyne-audit-lifecycle does) as a real subprocess and asserts against the real note file read back off disk afterward: (a) CORRECTLY PROMOTED -- the real merge is detected via real `git merge-base --is-ancestor` and the note flips provisional->confirmed on disk with the exact evidence logged; (b) CORRECTLY HELD BACK -- a real still-open (never-merged) control branch's note is left untouched, not even reported as a finding; and a fabricated-commit/deleted-branch case with a real merge-commit message on main naming it is classified 'ambiguous' and left untouched on disk, never guessed into confirmed. 19/19 checks pass. One real bug this integration test caught and fixed: cli.ts originally called `process.exit()` immediately after a large `console.log(JSON.stringify(report))` -- a real Node.js gotcha where `process.exit()` can truncate a piped stdout write before it flushes; fixed to `process.exitCode = ...` and let the event loop drain naturally, verified by the same test (JSON now parses in full from a real subprocess pipe every run). Deviations from spec, with reasoning: (1) session-level 'did an agent actually call recall/remember' (AC1's literal framing) has no durable signal to check beyond whether the enforcement MECHANISM itself is installed -- this repo's hooks write no separate invocation log, and Claude Code session transcripts are outside this repo's control/schema -- so AC1 is satisfied via the mechanism-installation check (real, git/fs-verifiable, specific evidence) rather than transcript mining, consistent with this story's own scoping step ('scope what compliance signals are actually detectable'). (2) no scheduling/cron cadence, per the story's own steps.implement note ('a follow-on decision, not required for this story's completion') -- bin/mnemosyne-audit-lifecycle is on-demand only. Full suite: `npx tsc --noEmit` clean. `npm test`'s node test/*.mjs chain passes through test/install-git-hooks.mjs and the new test/lifecycle-compliance-audit.mjs, then hits the SAME pre-existing http-api.mjs POST /recall SocketError documented by la-06/la-07/la-08 -- reproduced byte-for-byte identical on the unmodified tree via `git stash` (same crash point, same UND_ERR_SOCKET signature), confirming zero regression. `vitest run lib/mnemosyne lib/minerva benchmarks src/planning src/config src/runners` -> 336/340 passing with the audit suite excluded (25/26 files, 1 worker-crash error) and 357/360 with it included (20/20 new tests all pass) -- the same single pre-existing CodeGraphLayerAdapter/better-sqlite3 native-binding worker crash la-06/la-07/la-08 already documented, not worsened. Merged la-08-lifecycle-outcome-feedback (landed on origin concurrently, extending lib/mnemosyne/triggers/types.ts/notesStore.ts/gitAdapter.ts with an optional outcome/recordOutcome pair) after this story's own implementation was complete -- purely additive/backward-compatible (optional fields only), applyLifecycleEvent's call shape this story depends on was unchanged, no code changes needed on this side, re-ran the full suite after merging to confirm."
complexity: high
methodology: classic
depends_on: [la-06-lifecycle-trigger-system, la-07-layer1-enforcement-mandate]

description: |
  Decided 2026-08-13: baking the mandate into Layer 1 (la-07) and building trigger adapters
  (la-06) isn't sufficient on its own — per the operator, "it is another system that has to
  ensure we actually call those correctly." This echoes the operator's original idea from
  earlier in this session: "mnemosyne can have a deep dive, check, and we can let it sleep
  where it goes through, cleans, and fixes."

  Build a periodic/on-demand audit that checks, for real, whether the mandate is actually
  being followed:
    - Are agents/sessions actually calling recall on entry / remember on exit (la-07)?
    - Are provisional entries getting promoted/superseded in reasonable time (la-06), or
      accumulating stale (e.g. a merge happened on a machine without the git hook installed —
      the exact gap la-06's own risk section flags)?
    - Surface drift as a report, and where safe, auto-remediate (e.g. detect an actually-merged
      branch with still-provisional entries and promote them after independently verifying the
      merge against real git state — not blindly).

  This is a detection/reporting system first; auto-remediation should be conservative and only
  cover cases independently verifiable against real state (e.g. git log), never guessed.

acceptance_criteria:
  - "Given a session that never calls recall/remember despite la-07's mandate being active, when the audit runs, then it flags that session/repo as non-compliant with specific evidence, not a vague warning"
  - "Given a branch that was actually merged (verifiable via real git state) but still has provisional entries (the git-hook-missed-it case), when the audit runs, then it detects the mismatch and either promotes the entries after independent verification or flags them for review — documented which, and why"
  - "Given the audit's auto-remediation path, when it acts, then every action is logged with the evidence that justified it — no silent fixes"

steps:
  - id: research
    description: Review la-06/la-07's shipped behavior and known gaps (esp. the git-hook-machine-coverage gap flagged in la-06's risks) to scope what compliance signals are actually detectable.
    agent: researcher
  - id: test-spec
    description: Write failing tests for drift detection (stale provisional entries with verifiably-merged branches) and for the audit's report output.
    agent: tester
    depends_on: [research]
  - id: implement
    description: Implement the audit as a runnable command (on-demand first; scheduling/"sleep" cadence is a follow-on decision, not required for this story's completion).
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Confirm auto-remediation only fires on independently-verified real state, confirm every action is logged with evidence.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feat/mnemosyne-layer-architecture-v2 (based on dev).
    agent: developer
    depends_on: [review]

context:
  codebase: .
  key_files:
    - path: docs/layer-architecture-v2-plan.md
      purpose: "§2, §6 — this story's origin as the explicit compliance-verification counterpart to la-06/la-07"

files_to_modify:
  - file: lib/mnemosyne/audit/
    change: "New: compliance-audit command, drift detection, conservative auto-remediation"

design_decisions:
  - decision: "Detection-and-report first, auto-remediation only on independently-verified state"
    rationale: "A compliance system that silently 'fixes' things on guesses is worse than one that just reports — matches this session's own established practice of verifying agent self-reports before trusting them"

risks:
  - severity: medium
    description: "Auto-remediation logic could itself become a new source of silent, hard-to-trace state changes"
    mitigation: "Every remediation action logged with its justifying evidence; conservative scope (only independently git-verifiable cases) rather than broad heuristics"
