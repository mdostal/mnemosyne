id: la-08-lifecycle-outcome-feedback
epic: mnemosyne-layer-architecture-v2
title: Lifecycle-outcome to memory feedback loop
status: complete
note: "Extended la-06's EXISTING firing path, not a separate mechanism: types.ts's LifecycleTriggerEvent gained an optional `outcome?: LifecycleOutcome` ({summary, detail?}) and MemoryStatusStore gained an optional `recordOutcome?(entry, outcome)`; applyLifecycleEvent calls store.recordOutcome right after a successful updateStatus, only when both are present, best-effort (a recordOutcome throw is swallowed -- the status transition that already succeeded must never be undone by an outcome-write failure, verified by a dedicated ThrowingOutcomeStore test). NotesDirectoryStatusStore.recordOutcome (notesStore.ts + its src/triggers.mjs mirror) appends a '## Lifecycle outcome' section to the note body -- never touches the status= header token (updateStatus's job), never overwrites a prior outcome (appends again on a second call).

  Promote side (gitAdapter.ts's deriveMergeOutcome, called from detectMergePromotion): derives mergeShape ('fast-forward' vs 'merge-commit', from HEAD's own parent count via `git rev-list --parents -n 1 HEAD`) and the real commit subject(s) that landed (`git log --reverse --pretty=%s ORIG_HEAD..HEAD`) -- verified against both a real --no-ff merge and a real --ff-only merge in gitAdapter.test.ts.

  Supersede side required an actual design correction mid-implementation, confirmed by direct experiment against real git (not assumed from documentation): a real `git branch -D`'s own reference-transaction line reports OLD-VALUE as the null OID too, at EVERY state (prepared/committed/aborted) -- because -D deletes without a compare-and-swap check, git's own transaction record never carries a real old value to give the hook (git update-ref -d <ref> <old-sha>, which explicitly supplies one to verify, DOES surface a real old value, but that's not the command an operator runs). This meant the originally-planned 'read the old-value off the delete's own reference-transaction line' approach was dead on arrival for the realistic case. The fix, also confirmed by direct experiment: at the 'prepared' state -- BEFORE the ref is actually removed -- `git rev-parse --verify refs/heads/<branch>` still resolves. So gitAdapter.ts's resolveBranchSha + stashPendingBranchSha capture the branch's sha then (a small JSON scratch file inside the real git dir, resolved via `git rev-parse --git-path`, so it follows worktrees); takePendingBranchSha reads it back once deletedLocalBranches confirms, at 'committed', that the SAME branch was actually deleted. hooks/git/reference-transaction.mjs (+ its src/triggers.mjs mirror) now acts at BOTH 'prepared' (read-only sha pre-resolution + own-scratch-file write only, never touching the ref update itself, so no abort risk) and 'committed' (the actual supersede). deriveAbandonedBranchOutcome resolves the abandoned branch's last commit subject from that sha and falls back to a still-real (if sparser) summary when no sha was ever resolved.

  TESTING BAR: (1) unit tests -- engine.test.ts gained a 5-test 'outcome-tagged writes (la-08)' describe block (FakeOutcomeStore) covering promote, supersede, no-outcome-on-event, no-recordOutcome-on-store, and the recordOutcome-throws-but-transition-survives case. notesStore.test.ts gained 3 real-temp-dir tests for recordOutcome (appends without disturbing the header, appends again rather than replacing on a second call, findByStatus still resolves correctly afterward). gitAdapter.test.ts gained 12 tests, all real git subprocess: outcome assertions folded into the existing real --no-ff/--ff-only merge tests (mergeShape + real commit subject present), plus new real-git coverage for resolveBranchSha, stashPendingBranchSha/takePendingBranchSha (including the REAL git-branch--D round-trip scenario proving the stash survives a real forced delete), deriveAbandonedBranchOutcome (real sha, undefined sha, and an unresolvable sha), and branchDeletionEventsWithOutcome. lib/mnemosyne/triggers now 51 vitest tests total (was 39 before this story), all real-git/real-fs. (2) THE mandated real-subprocess extension: test/git-hooks.mjs's existing real-merge/real-branch-delete scenarios (same temp repo, same installed hooks, git itself invoking them) gained 4 new assertions reading the actual note files off disk afterward -- the merge scenario's note now also carries a '## Lifecycle outcome' section naming the merged branch, correctly identified as a real (non-fast-forward) merge, including the real commit message, while the unrelated control branch's note got no outcome recorded; the branch-delete scenario's note now also carries an outcome naming the branch and quoting its actual last commit message -- recovered ONLY because the installed reference-transaction hook resolved+stashed it during git's real 'prepared' phase, which is the load-bearing proof this actually works end-to-end through installed hooks, not just the unit-level primitives.

  Full suite: npm run typecheck clean. node test/git-hooks.mjs and test/install-git-hooks.mjs pass (16 and 18 checks respectively). vitest run lib/mnemosyne lib/minerva benchmarks src/planning src/config src/runners -> 351 tests passed across 25 of 26 files (was 331 before this story), with the SAME single pre-existing CodeGraphLayerAdapter/better-sqlite3 native-binding worker crash present on the unmodified tree too (confirmed via git stash, identical failure signature/file-count) -- not a regression, not re-diagnosed. test/http-api.mjs hits that same pre-existing, unrelated crash (confirmed identical on the unmodified tree via git stash) -- known, not worsened.

  DEVIATION FROM THE STORY SPEC'S LITERAL PLAN (files_to_modify said 'lib/mnemosyne/triggers/' only): also modified hooks/git/reference-transaction.mjs and its src/triggers.mjs mirror, because the corrected supersede-side design (above) requires the hook to act at git's 'prepared' state too, not just 'committed' -- this is squarely within 'extend la-06's trigger firing path' (the story's stated intent) even though it touches one more file than the spec's shorthand listed. hooks/git/post-merge.mjs needed NO changes at all: detectMergePromotion now returns outcome pre-attached to the event it already produces, and applyLifecycleEvent's existing recordOutcome call handles the rest automatically -- the clearest evidence this reused la-06's firing path rather than adding a parallel one."
complexity: medium
methodology: tdd
depends_on: [la-06-lifecycle-trigger-system]

description: |
  Not a new layer — a write-path event. Test/lessons-learned feedback (CI pass/fail, review
  feedback, or any other lifecycle outcome reachable through la-06's adapter interface) becomes
  an outcome-tagged memory write at the same merge/close moment as the flight-status
  promote/supersede transition, reusing la-06's trigger rather than building a separate one.

  Generalized beyond "CI" deliberately — the operator's git-hook-first, pluggable-adapter
  decision in la-06 means this should consume whatever outcome data a given adapter can supply
  (test results, review comments, ticket-close reason), not assume a GitHub-Actions-specific
  shape.

acceptance_criteria:
  - "Given a real merge event through la-06's git-hook adapter, when it fires, then an outcome-tagged memory entry is written (e.g. status=confirmed with an outcome/lesson field), not just the status transition alone"
  - "Given a branch abandoned/closed without merging, when la-06's supersede transition fires, then an outcome-tagged entry captures why it didn't land (where that information is available), not just a bare status flip"

steps:
  - id: research
    description: Confirm what outcome data is realistically available at the moment la-06's git-hook adapter fires (commit messages, test result files if present, etc.).
    agent: researcher
  - id: test-spec
    description: Write failing tests for outcome-tagged writes on both promote and supersede transitions.
    agent: tester
    depends_on: [research]
  - id: implement
    description: Wire outcome-tagged memory writes into la-06's trigger firing path.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Confirm outcome writes are genuinely informative (not empty/boilerplate) and reuse la-06's trigger rather than duplicating it.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feat/mnemosyne-layer-architecture-v2 (based on dev).
    agent: developer
    depends_on: [review]

