id: la-03-graphify-doc-index
epic: mnemosyne-layer-architecture-v2
title: Graphify doc-index wiring into recall
status: complete
note: "Ran `graphify update .` for real against this repo (1467 nodes/2480 edges/104 communities, 'no LLM needed' per its own stdout) and read the raw graph.json directly to confirm the doc-node shape before touching code: 390 real markdown document nodes (file_type: \"document\", _origin: \"ast\"), distinct from 1056 code / 6 rationale / 15 concept nodes. Cross-checked a real node against real file content by hand: node id `phive_epics_ingest_a10ab2c1_docs_vertical_plan_acceptance_criteria` reports source_location \"L31\" for `.pHive/epics/ingest-a10ab2c1/docs/vertical-plan.md` -- line 31 of that file on disk is literally `### Acceptance Criteria`, an exact match, no LLM involved. Wrote failing tests FIRST (GraphifyLayerAdapter.test.ts, new 'doc-index recall (la-03)' describe block) against a real fixture repo with a real docs/guide.md (markdown headings at real line numbers) run through the REAL graphify CLI (no mocked graph.json for the positive-path tests) -- confirmed via `npx vitest run` that 3 of 4 new tests already passed against la-02's existing generic node-matching code unmodified (matchNodes()/buildHits() don't discriminate node type, so doc nodes were already reachable via recall()), and exactly 1 failed red: a hand-crafted malformed-source_location doc node did NOT produce a loud RecallFailure, it silently built a Hit with a bogus location. That failing test pinpointed the one real gap and is the only production code this story needed: added `isDocNode()`/`assertValidDocSourceLocation()` (validates graphify's \"L<n>\" line-pointer format) and split `nodeHit()` into `codeNodeHit()`/`docNodeHit()` in GraphifyLayerAdapter.ts -- a doc node whose source_location doesn't parse as `L<n>` now throws inside buildHits(), caught by recall()'s existing try/catch and surfaced as a RecallFailure (not a silently wrong line number), directly implementing this story's own risk mitigation. docNodeHit() also gives doc hits distinguishable content wording ('Doc: \"<heading>\" -- <file>:<line>') vs code hits, the 'query-shape distinction, not a second tool integration' the story asked for -- same adapter, same graph.json, same recall() entrypoint, no second tool. Verified the reported line numbers against real fixture file content programmatically in the test (read the real fixture file after recall(), split lines, assert the 1-indexed reported line equals the real heading text) for both a heading node ('## Usage Examples') and the whole-file L1 node. Also verified no-LLM-by-default by stripping GEMINI_API_KEY/GOOGLE_API_KEY from the test's env before running real graphify update and confirming doc recall still succeeds -- matches the PoC's own 'no LLM needed' finding, no code changes were needed for this since GraphifyLayerAdapter never opts into the LLM path (la-02's existing design). Full verification: `npx tsc --noEmit` clean; `npx vitest run lib/mnemosyne/layers/__tests__/GraphifyLayerAdapter.test.ts` 14/14 passing (10 real-binary-gated, 4 new for this story); full `npx vitest run lib/mnemosyne lib/minerva benchmarks src/planning src/config src/runners` 281/284 (21/22 files) -- the 3 uncounted are the pre-existing CodeGraphLayerAdapter.test.ts vitest-worker crash (better-sqlite3 native binding), reproduced byte-for-byte identically with this story's changes stashed out via `git stash`, confirming zero regression; `npm test`'s combined script also hits the pre-existing test/http-api.mjs socket-close flake, likewise reproduced identically on the unmodified tree. Deviation from spec: none -- extended the existing adapter in place (no sibling adapter, no second tool integration) exactly as the story's description suggested as the preferred option."
complexity: medium
methodology: tdd
depends_on: [la-02-graphify-adapter]

description: |
  la-02 adds Graphify as a code-graph layer. This story wires its confirmed doc-indexing
  capability into recall as the "indexed docs" layer (CBA layer 3): Graphify's `graph.json`
  markdown document nodes each carry a real `source_location` (e.g. "L17") via deterministic
  AST-level parsing (`_origin: "ast"`), verified in the PoC with no LLM required.

  Extend GraphifyLayerAdapter (or add a sibling adapter sharing its graph.json read path) so
  recall() can return doc hits with line-number pointers, not just code-symbol hits — same
  adapter, same underlying graph, a query-shape distinction (doc vs. code nodes) rather than
  a second tool integration.

acceptance_criteria:
  - "Given a repo with markdown docs indexed by graphify, when recall() is queried with intent suited to documentation, then results include doc hits with real line-number source_location pointers, verified against the actual file content at that line"
  - "Given a query that graphify's LLM-assisted path is not needed to answer (i.e. the deterministic AST path covers it), when recall() runs, then no LLM call is made — matches the PoC's proven no-LLM-required finding"

steps:
  - id: research
    description: Confirm the exact graph.json schema for doc nodes (source_location format, _origin field) against a fresh graphify run in this repo, building on la-02's adapter.
    agent: researcher
  - id: test-spec
    description: Write failing tests for doc-hit recall with real line-number verification against fixture content.
    agent: tester
    depends_on: [research]
  - id: implement
    description: Extend the adapter's recall() to surface doc nodes with source_location, defaulting to the no-LLM deterministic path.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Verify line numbers returned actually correspond to the real file content, not approximate/stale.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feat/mnemosyne-layer-architecture-v2 (based on dev).
    agent: developer
    depends_on: [review]

