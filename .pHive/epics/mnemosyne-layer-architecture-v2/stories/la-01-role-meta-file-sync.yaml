design_decisions:
  - decision: "Piggyback on native harness files, don't invent a new loader convention"
    rationale: "Harness-agnostic by construction — works with any agentic tool that already has a startup-context convention, no bespoke wiring per harness"

risks:
  - severity: medium
    description: "Overwriting or duplicating human-authored content in CLAUDE.md/AGENTS.md on repeated syncs"
    mitigation: "Managed content lives in a clearly delimited, idempotent block; everything outside it is never touched"
