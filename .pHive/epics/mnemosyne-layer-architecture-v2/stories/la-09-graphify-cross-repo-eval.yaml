id: la-09-graphify-cross-repo-eval
epic: mnemosyne-layer-architecture-v2
title: Graphify cross-repo eval (graphify global / merge-graphs) for company-director tier
status: complete
note: "Confirmed the real CLI surface first (`graphify --help`, not the CBA's paraphrase): `graphify global add <graph.json> --as <tag>` (accumulates into ~/.graphify/global-graph.json + global-manifest.json) and `graphify merge-graphs <g1> <g2> --out <path>` (one-shot merge, no persistent store) are the real subcommands. Ran `graphify update .` against this repo (1467 nodes/2480 edges/104 communities) and a second real Pantheon repo, /Users/mdostal/Documents/work/pantheon/minerva (849 nodes/1526 edges/57 communities), then both cross-repo commands against the two real graph.json files -- both produced numerically identical merges (2316 nodes, 4006 edges), confirming they share the same merge logic under two persistence models. Directly inspected the real ~/.graphify/global-graph.json (2.5MB): confirmed 2316 = 1467 + 849 exactly (a structural union with repo-namespaced IDs, not a synthesis); confirmed via a direct source/target repo comparison on all 4006 edges that ZERO cross-repo edges exist -- the merge does not discover or infer any real relationship between repos, it only avoids ID collisions; live-ran `graphify query \"how does mnemosyne relate to minerva\" --graph ~/.graphify/global-graph.json` and confirmed the BFS traversal stayed entirely local to one repo's own package.json/docs nodes, not a real cross-repo path; found community IDs collide numerically across repos (mitigated by the per-node repo/id fields, but a footgun for naive `community`-only grouping). Recommendation, written into docs/layer-architecture-v2-plan.md section 1a: DON'T adopt the merged graph.json as the company-director tier's data source -- it is full per-repo AST-level depth for every repo concatenated with unbounded linear growth (2.5MB for just 2 modest repos), which is exactly the 'full per-repo depth' this tier is meant to avoid holding, and its only plausible value-add (real cross-repo relationship discovery) doesn't exist. Adopt-with-modification narrowly: the global-manifest.json side effect of `global add` (repo tag, node/edge counts, freshness, provenance -- a few hundred bytes per repo) is a legitimate cheap 'which repos/products exist' inventory signal worth holding at that tier; real cross-repo impact questions should be answered by querying DOWN into a specific project's own already-adopted (la-02) per-repo Graphify graph on demand, not by maintaining one permanently-fused blob. Sketched, not built -- this story is evaluation-only per its own spec, no company-director-tier integration code was written."
complexity: medium
methodology: classic
depends_on: [la-02-graphify-adapter]

description: |
  docs/cba-memory-layers.md flags this as a real, not-yet-deep-dived finding: Graphify ships
  real cross-repo graph merging (`graphify global add/remove/list`, `graphify merge-graphs`,
  writing to ~/.graphify/global-graph.json) — directly relevant to the reconciled 4-tier
  hierarchy's company-director tier, which needs a light understanding of a company's
  resources/products/repos without holding full per-repo depth.

  This is an EVALUATION story, not a commitment to a specific integration shape — determine
  whether `graphify global`/`merge-graphs` genuinely fits the company-director tier's needs
  (a lightweight, queryable cross-repo view) or whether it's a false fit that needs a different
  mechanism. Output should be a clear recommendation, not a half-built integration.

acceptance_criteria:
  - "Given 2+ real repos with graphify graphs, when `graphify global add`/`merge-graphs` is run against them, then the resulting merged view is directly inspected and its actual content/query shape is documented against the company-director tier's stated needs"
  - "Given the evaluation, when complete, then it produces a clear recommendation (adopt / adopt with modification / don't adopt) with reasoning, added to docs/layer-architecture-v2-plan.md — not left as an open question"

steps:
  - id: research
    description: Run graphify global/merge-graphs for real against 2+ repos (this repo plus at least one other), inspect the actual merged output.
    agent: researcher
  - id: implement
    description: Document the findings and recommendation in docs/layer-architecture-v2-plan.md.
    agent: technical-writer
    depends_on: [research]
  - id: review
    description: Confirm the recommendation is grounded in the actual inspected output, not inferred from the tool's docs alone.
    agent: reviewer
    depends_on: [implement]

