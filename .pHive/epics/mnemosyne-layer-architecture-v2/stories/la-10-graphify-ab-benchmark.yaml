id: la-10-graphify-ab-benchmark
epic: mnemosyne-layer-architecture-v2
title: "A/B: Graphify vs. retired in-house code-graph"
status: complete
note: "Extended the existing pl-03 harness (benchmarks/layer-ab-test.ts) with a 'graphify' NamedLayerStackConfig (graphify -> vector -> file) run alongside the existing 'baseline (code-graph)' config (code-graph -> vector -> file) -- vector/file held identical on both sides so the graph layer is the only variable -- plus a printHeadToHead() summary so the comparison isn't left implicit in raw output. Reused the harness's own existing default query set (mnemosyne / layer registry / secrets-adapter) unchanged, per the story's guidance not to invent a new one. Ran for real via `npm run benchmark:layer-ab` against this repo, steady-state (graph.json cached, matching real operational use): baseline (code-graph) totals hits=12 tokens=4808 avg_latency=2502.7ms (3/3 ok); graphify totals hits=28 tokens=4797 avg_latency=1666.0ms (3/3 ok). Per-query: for 'mnemosyne', graphify matched directly (20 hits/174 tokens/7ms, graph layer alone) while code-graph missed and fell through to vector (4 hits/185 tokens/2483ms); for 'layer registry' and 'secrets-adapter', neither graph layer matched so both configs tied on an identical vector fallback (4 hits/3414 tokens and 4 hits/1209 tokens respectively, both sides) -- graphify never lost a query. Root-caused the gap by directly inspecting code-graph's real backing store (~/.local/share/swarm-memory/graph.sqlite): 22 nodes total, zero from this repo (mnemosyne) -- all 22 are from two unrelated repos (dostal-swarm/..., swarm-memory/...); confirmed in CodeGraphLayerAdapter.ts too, it takes no repoRoot/per-repo scoping at all, so it structurally cannot reflect this repo's code no matter the query. A fresh `graphify update .` against this repo indexed 1470 nodes/2484 links from this repo's own source, confirming la-02's PoC scale held (and grew) since that story shipped. Qualitative spot-check of actual hit content for 'mnemosyne' (not just counts): code-graph's 4 fallback hits are generic vector-matched changelog/memory-log entries that happen to mention the word; graphify's 20 hits are real line-addressable code/doc structure nodes/edges naming this repo directly (.mcp.json:L1, README.md:L1, package.json:L11, bin/mnemosyne:L1, 'README.md --contains--> Mnemosyne') -- actual impact-graph answers, which is code-graph's stated job and what it cannot deliver against this repo today. Recommendation documented in docs/layer-architecture-v2-plan.md #7: GO on retiring the in-house code-graph implementations (CodeGraphLayerAdapter.ts's better-sqlite3 path + the JS CLI wrapper) as a separate later story (not bundled here, per this story's explicit scope) -- graphify matched or beat code-graph on every metric measured and the root-cause finding means this isn't a close call; one pre-removal check flagged for that later story: confirm no other consumer depends on the shared swarm-memory graph.sqlite for a DIFFERENT repo's data before deleting the wiring, since its 22 nodes span other repos and swarm-memory itself may still serve other consumers. Neither 'code-graph' nor 'graphify' was removed or retired -- both stay registered side by side in registry.ts, exactly as la-02 left them. Added a new vitest test (benchmarks/__tests__/layer-ab-test.test.ts) exercising the real graphify binary end-to-end through the harness (skipIf-gated like GraphifyLayerAdapter.test.ts's real-binary tests, so CI's graphify-less Node-only setup skips rather than fails it); `npx vitest run benchmarks/__tests__/layer-ab-test.test.ts` 4/4 passing locally (real graphify binary present), `npx tsc --noEmit` clean."
complexity: medium
methodology: tdd
depends_on: [la-02-graphify-adapter]

description: |
  Real comparison before fully retiring the two thin in-house code-graph implementations
  (CodeGraphLayerAdapter's better-sqlite3 path + the JS CLI wrapper onto the same
  swarm-memory graph.sqlite). Extends the EXISTING pl-03 A/B benchmark harness
  (benchmarks/layer-ab-test.ts) — this is not a new harness.

  Only after this story shows Graphify performing at least as well (recall quality, token
  cost per benchmarks/recall-vs-find.ts's estimateTokens()) should the old implementations
  actually be removed — that removal is explicitly NOT bundled into this story.

acceptance_criteria:
  - "Given benchmarks/layer-ab-test.ts, when extended to include a graphify-configured stack alongside the existing code-graph-configured stack, then it runs both against the same real query set and reports comparable metrics"
  - "Given the results, when reviewed, then a clear go/no-go recommendation on retiring the in-house implementations is documented — not left implicit in raw benchmark output"

steps:
  - id: implement
    description: Extend benchmarks/layer-ab-test.ts with a graphify-configured stack option; run against this repo's real recall queries.
    agent: developer
  - id: review
    description: Confirm the comparison is apples-to-apples (same queries, same scoring) and the recommendation is grounded in the actual numbers.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feat/mnemosyne-layer-architecture-v2 (based on dev). Document the recommendation in docs/layer-architecture-v2-plan.md.
    agent: developer
    depends_on: [review]

context:
  codebase: .
  key_files:
    - path: benchmarks/layer-ab-test.ts
      purpose: "Existing A/B harness from pl-03 — extend, do not replace"
    - path: benchmarks/recall-vs-find.ts
      purpose: "Source of estimateTokens() reused for cost comparison"

files_to_modify:
  - file: benchmarks/layer-ab-test.ts
    change: "Add a graphify-configured stack comparison option"

risks:
  - severity: low
    description: "Retiring the in-house implementations prematurely, before this story's results are in"
    mitigation: "This story explicitly does NOT bundle removal — removal is a separate, later decision gated on these results"
