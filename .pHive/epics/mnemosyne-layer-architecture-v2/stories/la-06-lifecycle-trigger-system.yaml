id: la-06-lifecycle-trigger-system
epic: mnemosyne-layer-architecture-v2
title: Pluggable lifecycle-trigger system — local git hooks first
status: complete
note: "Built the pluggable adapter interface (lib/mnemosyne/triggers/types.ts: LifecycleTriggerEvent{transition:'promote'|'supersede', matcher:{branch?,commitShas?}, adapter, detail} + applyLifecycleEvent(event, store) -- the ONE integration point: looks up store.findByStatus('provisional'), filters by matchesSourceRef (branch OR commit-sha match, OR not AND, so a rebase that changes shas still matches on branch name), calls la-04's assertValidStatusTransition (imported, never reimplemented) before every flip, then store.updateStatus()) against a MemoryStatusStore interface. First concrete store: notesStore.ts's NotesDirectoryStatusStore, over the local notes directory both real write paths (src/engine.mjs, lib/mnemosyne/layers/VectorLayerAdapter.ts) already write to -- rewrites only the note's `status=` header token in place, never deletes a file (supersede stays exactly as present on disk as confirmed). First concrete adapter: gitAdapter.ts -- detectMergePromotion (post-merge: only fires when HEAD is on the resolved default branch; matches merged commits via `git rev-list ORIG_HEAD..HEAD`, which is uniformly correct for both fast-forward and real merge commits, confirmed by direct experiment against real git 2.48, not assumed from docs; also best-effort parses the merged branch name from the merge commit's subject line as a rebase-safe fallback) and parseReferenceTransactionLines/deletedLocalBranches/branchDeletionEvents (reference-transaction hook: only acts on state==='committed' -- never risks vetoing a ref update by treating 'prepared' as actionable, since a non-zero exit at 'prepared' can abort the transaction; a real local branch delete shows up as a refs/heads/<name> line whose new-value is the null OID, confirmed by direct experiment with `git branch -D` against a real repo, not assumed). Installable via bin/mnemosyne-install-git-hooks (resolveHooksDir() uses `git rev-parse --git-path hooks`, so it correctly follows worktrees/custom core.hooksPath rather than assuming a literal `<repo>/.git/hooks`; writes tiny absolutized `#!/bin/sh` shims with a `# mnemosyne-git-hook:` marker for idempotent re-install; a pre-existing FOREIGN hook is backed up to `<name>.pre-mnemosyne` and preserved, never silently clobbered, with a warning -- auto-chaining an arbitrary existing hook script was judged not generically safe, so this is a deliberate, documented simplification, not an oversight). Zero-dep JS mirror at src/triggers.mjs (same duplicated-not-shared-across-TS/JS-boundary precedent la-04 established with flight-status.ts/.mjs -- a git hook installed into an arbitrary repo must run via plain `node`, no tsx/build step available at hook-fire time) backs the actual executable hooks/git/post-merge.mjs and hooks/git/reference-transaction.mjs, both defensive-by-contract (try/catch everything, always exit 0, never block or fail a real git operation).

  TESTING BAR (all three, as decided for la-04/05/06 collectively): (1) unit tests for the adapter interface contract -- lib/mnemosyne/triggers/__tests__/engine.test.ts (14 tests) uses ONLY an in-memory fake MemoryStatusStore and a hand-rolled fake 'ticket-queue' adapter (never importing gitAdapter.ts/notesStore.ts) to prove AC3 directly: a hypothetical second adapter drives applyLifecycleEvent identically, with zero changes needed to types.ts, la-04, or la-05. notesStore.test.ts (12 tests, real temp-dir files) and gitAdapter.test.ts (13 tests, real git subprocess: real merges -- both no-ff and fast-forward --, a real `git branch -D` with a REAL installed reference-transaction hook capturing REAL stdin to prove the parser handles real wire format, not a hand-written fixture string) round out the TS unit layer -- 39 new vitest tests total, all real-git/real-fs, no mocked git output anywhere. (2) THE mandated real subprocess-level integration test: test/git-hooks.mjs -- creates a real throwaway temp git repo, runs the REAL bin/mnemosyne-install-git-hooks installer against it (writing real executable shims into that repo's real `.git/hooks/`), writes real provisional note files via the REAL src/engine.mjs remember() write path (fake-swarm-memory fixture standing in for live Qdrant only, same test double write-through.mjs already uses -- never touches the real Qdrant corpus), then performs an ACTUAL `git merge --no-ff` and an ACTUAL `git branch -D` as real subprocesses -- GIT ITSELF invokes the installed hooks, this test never calls the detect/apply functions directly. Asserts against the real note files on disk afterward: two provisional entries on the merged branch flip to confirmed, a control entry on an unrelated branch does NOT flip (proves real matching, not blanket promotion), and an abandoned branch's entry flips to superseded with its content still fully present (never deleted) after a real `git branch -D`. Plus test/install-git-hooks.mjs (9 tests: idempotent re-run, path-rewrite after a simulated checkout move, foreign-hook preservation+backup, worktree-aware hooks-dir resolution, fails loud outside a git repo). (3) Live dogfooding: verified `bin/mnemosyne-install-git-hooks` for real against a genuine FULL CLONE of this actual mnemosyne repo (`git clone` of this exact worktree -- real commit history/content, not a synthetic fixture) -- ran both scenarios against it for real: a real `git checkout -b`/real commit/real `remember()` write/real `git merge --no-ff` promoted a real note from provisional to confirmed, AND a separate real branch + real `git branch -D` superseded a real note (content still fully present, never deleted) -- both verified by reading the actual note files back off disk afterward, not asserted from memory. (One harness-only wrinkle worth recording: the clone's `origin/HEAD` inherited whatever branch the source worktree had checked out at clone time, so the hook's own default-branch auto-detection needed the documented `MNEMOSYNE_DEFAULT_BRANCH=main` override to match this scenario -- an artifact of dogfooding from a feature-branch worktree rather than a real `main`-tracking remote, not a bug in the detection logic itself.) Deliberately did NOT install into this checkout's own shared `.git/hooks`: this worktree's git-dir resolves (`git rev-parse --git-path hooks`) to the COMMON hooks directory shared by every worktree of this repo, including sibling worktrees other concurrently-running agents (la-05 et al.) were actively using for real git operations in this same session -- installing real hooks there mid-session risked firing on their unrelated merges/branch-deletes. Flagged, not silently avoided; a human operator (or a follow-on story) should run `bin/mnemosyne-install-git-hooks` against the actual shared checkout when no concurrent agent session is using it.

  Full suite: npm run typecheck clean; vitest run lib/mnemosyne lib/minerva benchmarks src/planning src/config src/runners -> 300 tests passed across 24 files (was 268/21 before this story), with the SAME single pre-existing CodeGraphLayerAdapter/better-sqlite3 native-binding worker crash present on the unmodified tree too (confirmed via git stash, byte-identical failure signature) -- not a regression. node test/{bundle,inject,write-through,health-drift,code-graph,reindex,vector,review-auto-merge,git-hooks,install-git-hooks}.mjs all pass (git-hooks.mjs and install-git-hooks.mjs are this story's new real-subprocess suites). test/http-api.mjs hits that same pre-existing, unrelated better-sqlite3 crash on POST /recall (confirmed identical on the unmodified tree via git stash) -- known, already documented in that file's own comments, not re-diagnosed here, not worsened.

  KNOWN GAP (intentionally out of scope for this story, per its own risk section): git hooks only fire on the machine where the merge/branch-delete happens -- a merge or branch delete on a machine without the hook installed (or done entirely through a GitHub/hosted-PR UI merge with no local git operation on any hooked machine) silently never promotes/supersedes. la-11 (compliance audit) is the explicitly-designed backstop for exactly this gap, not this story. Also out of scope, per the decision log: no ticket-queue adapter, no CI/GitHub-Actions-based adapter -- the interface supports them (proven by the fake-ticket-queue test in engine.test.ts) but neither is built here."
complexity: high
methodology: tdd
depends_on: [la-04-flight-status-schema]

description: |
  Decided 2026-08-13 (docs/layer-architecture-v2-plan.md §2, §6): NOT GitHub Actions —
  explicit operator preference ("I hate github actions and it is already costing a fortune, I
  prefer my own build boxes"). Not all teams use git the same way either, so the trigger
  mechanism must be pluggable, not hardcoded to one source.

  Build:
    1. A trigger adapter interface — something that can fire promote (provisional→confirmed)
       or supersede (provisional→superseded) given a repo/branch/PR-state change.
    2. The FIRST real adapter: local git hooks (post-merge, etc.), auto-installed per
       repo/agent setup, firing the promote/supersede transition for real merges/closes
       happening on that machine.
    3. The interface must genuinely support future adapters (ticket-queue transitions, other
       lifecycle/process events) — not a git-only path with an unused interface around it.

  This story does NOT build a ticket-queue adapter or any CI-based adapter — those are
  evaluated later, when a concrete need exists (per the decision log, no speculative build-out
  beyond the git-hook adapter and the interface it plugs into).

acceptance_criteria:
  - "Given a local repo with the hook installed, when a real merge to the default branch happens, then provisional entries with matching source_ref are promoted to confirmed — verified via a real git merge in a test repo, not a simulated call"
  - "Given a local repo with the hook installed, when a branch is deleted/abandoned without merging (or a tracked PR-equivalent is closed), then matching provisional entries are marked superseded, never deleted"
  - "Given the trigger adapter interface, when a new adapter type is implemented against it, then no changes to la-04/la-05's schema or recall filtering are required — the interface is the only integration point"

steps:
  - id: research
    description: Design the adapter interface shape (what a trigger receives — repo, branch, resulting state — and what it's allowed to call) before implementing the git-hook adapter against it.
    agent: researcher
  - id: test-spec
    description: Write failing tests for the adapter interface contract and a real subprocess-level test that performs an actual git merge and asserts promotion (per the decided testing bar).
    agent: tester
    depends_on: [research]
  - id: implement
    description: Implement the trigger adapter interface and the local git-hook adapter (installable post-merge hook script + install command).
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Confirm the real-merge integration test actually exercises git, not a mock; confirm supersede-not-delete on close; confirm the interface is genuinely reusable for a hypothetical second adapter.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feat/mnemosyne-layer-architecture-v2 (based on dev).
    agent: developer
    depends_on: [review]

context:
  codebase: .
  key_files:
    - path: docs/layer-architecture-v2-plan.md
      purpose: "§2/§6 — trigger architecture decision and rationale, read before designing the adapter interface"

files_to_modify:
  - file: lib/mnemosyne/triggers/
    change: "New: trigger adapter interface + local git-hook adapter"
  - file: hooks/
    change: "New: installable post-merge hook script"

design_decisions:
  - decision: "Local git hooks as the first adapter, explicitly not GitHub Actions"
    rationale: "Operator's direct instruction — cost and build-box-preference reasons, and not every team merges via GitHub PR"
  - decision: "Pluggable interface even though only one adapter ships in this story"
    rationale: "Ticket-queue and other lifecycle-event triggers are real anticipated future adapters per the operator's stated intent, not hypothetical scope creep"

risks:
  - severity: medium
    description: "Git hooks only fire on the machine where the merge happens — a merge on a machine without the hook installed silently never promotes"
    mitigation: "la-11's compliance audit is the backstop for exactly this gap — flagged explicitly in this epic's design, not assumed away"
