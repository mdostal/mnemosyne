design_decisions:
  - decision: "Collapse persists via localStorage; the reopen control is always reachable, never a one-time dismiss."
    rationale: "design-discussion.md §1.4's resolution of research-brief.md's open question 3 -- the more conservative, more recoverable reading of 'collapse it after the first time,' consistent with this session's established 'never make information un-reachable' bias from the ui-redesign epic."
  - decision: "Fails open (defaults to expanded) if the collapse script errors or localStorage is unavailable."
    rationale: "Matches the ui-redesign epic's own hard cross-cutting rule (horizontal-plan.md) that no panel/content's basic visibility may depend on JavaScript running -- this banner is the FIRST thing an operator sees and is exactly the wrong place to silently fail invisible."

