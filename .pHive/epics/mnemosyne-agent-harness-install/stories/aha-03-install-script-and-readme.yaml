      as a live site with no separate publish workflow anywhere in the repo),
      README.md's real current Quickstart, and bin/mnemosyne's real dispatch
      pattern before writing any code.
    - Manually ran `bash docs/install.sh` end to end against an isolated temp
      target (MNEMOSYNE_INSTALL_DIR/MNEMOSYNE_BIN_DIR under this session's
      scratchpad, MNEMOSYNE_REPO_URL=file://<this worktree>) TWICE before
      writing the automated test, by hand, reading every line of output --
      first run: real clone + real npm install + real symlink + the exact
      printed next-step text; second run: "existing clone found ...
      updating" + "Already up to date." + re-linked, zero duplication. Ran
      the resulting `<bindir>/mnemosyne agent status` directly (hit the
      HERE-resolution bug on the FIRST attempt, fixed it, re-ran
      successfully) and confirmed exit 0 with real per-harness output both
      after run 1 and run 2 (still "NOT registered" both times -- proves no
      auto-registration).
    - Manually ran `bash scripts/install.sh` (the symlink path) end to end
      against a separate isolated target -- identical successful behavior.
    - `node test/install-script.mjs` standalone: all checks pass (see test
      file's own header comment for the full AC-to-check mapping).
    - `node test/agent-cli.mjs` standalone (unrelated to this ticket's own
      new file, but exercises bin/mnemosyne's dispatch path this ticket's
      HERE-resolution fix touches): still 100% pass after the fix.
    - `npm install` (node_modules absent in this fresh worktree) then
      `npm test`: the chain (`&&`-joined) stops at test/http-api.mjs's 3
      already-documented pre-existing POST /remember failures (ok:true,
      layer:file default, provenance -- unrelated to this diff: confirmed by
      `git diff --stat 6679665` showing this ticket's full diff touches only
      README.md, bin/mnemosyne, docs/install.sh, package.json,
      scripts/install.sh -- none of which test/http-api.mjs or its
      dependencies (src/server.mjs, lib/mnemosyne/*) reference at all, so no
      separate stash/re-run comparison was needed beyond aha-01/aha-02's own
