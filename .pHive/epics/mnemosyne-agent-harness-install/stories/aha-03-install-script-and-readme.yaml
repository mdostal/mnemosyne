id: aha-03-install-script-and-readme
epic: mnemosyne-agent-harness-install
title: "docs/install.sh (git-clone-based) + README top-line curl command"
status: complete
complexity: low
methodology: classic
depends_on: [aha-01-agent-init-status-claude]

note_on_completion: >
  docs/install.sh implements design-discussion.md §1.2: a real,
  git-clone-based install script (repo is "private": true -- no
  package-registry install exists). Idempotent re-run: if
  MNEMOSYNE_INSTALL_DIR/.git already exists, `git -C <dir> pull --ff-only`
  instead of re-cloning; if it exists but is NOT a git dir, the script
  refuses to overwrite it and exits 1 with a clear message (never silently
  clobbers unrelated real content) rather than cloning fresh. `npm install`
  runs in the clone every time (npm's own idempotency covers the "nothing
  changed" case). Links `bin/mnemosyne` onto PATH at
  MNEMOSYNE_BIN_DIR/mnemosyne (default ~/.local/bin/mnemosyne, matching this
  operator's own real machine convention -- confirmed by hand:
  ~/.local/bin/{codex,graphify,swarm-memory,node,...} are all real symlinks
  into their real install locations before writing any code). The link step
  itself is idempotent/safe: `ln -sf` re-points an existing symlink in
  place, but if MNEMOSYNE_BIN_DIR/mnemosyne already exists as something OTHER
  than a symlink, the script leaves it untouched and prints instructions
  instead of overwriting a real, unrelated file. Prints, but never runs,
  `mnemosyne agent init` as the explicit next step, plus one line naming
  exactly what it does (registers the MCP server, installs skills for Claude
  Code) -- per design-discussion.md §1.2's "two separate, operator-confirmed
  actions" requirement. MNEMOSYNE_REPO_URL/MNEMOSYNE_INSTALL_DIR/
  MNEMOSYNE_BIN_DIR overrides added cleanly for isolated testing (the script
  had no such override before this ticket; real installs never need to set
  them). scripts/install.sh is a REAL symlink (`ln -sf ../docs/install.sh`,
  git mode 120000) to docs/install.sh, not a wrapper -- verified
  byte-identical by construction and by an explicit content-equality
  assertion in the new test. README.md's Quickstart gained the curl line as
  its literal first line; the existing gh-repo-clone/npm-install/npm-test
  block is preserved, unmodified, directly underneath as the manual/dev-clone
  alternative (verified: nothing removed, curl line strictly precedes it).

  Real default-location collision found and avoided BEFORE picking a
  default, not after: this operator's own real machine already has
  ~/.local/share/mnemosyne/ in live use as the running Mnemosyne service's
  OWN data directory (a real mnemosyne.log with live "GET /health -> 200"
  entries, and a real notes/ tree with 70+ real persona-draft/smoke-test
  files) -- confirmed by hand (`ls -la ~/.local/share/mnemosyne/`,
  `head -c 300 mnemosyne.log`) before choosing a default clone location.
  Defaulting the install script's clone target directly to that path would
  have collided with real, in-use, non-git content on first run (the
  refuse-to-overwrite guard would have caught it safely rather than
  corrupting anything, but the operator's first real run would have hit a
  confusing "already exists and is not a git clone" error against their OWN
  real, unrelated directory). Fixed by nesting the default one level deeper,
  at ~/.local/share/mnemosyne/repo/ (a fresh subdirectory, never colliding
  with mnemosyne.log or notes/) -- documented inline in docs/install.sh's own
  header comment so a future editor doesn't "simplify" it back to the
  colliding path. ~/.mnemosyne/ (a different, also real, also
  already-in-use directory -- level0-rules.md) was checked too and is
  unrelated to this script's default (never used by it).

  Real, independently-verified bug caught and fixed during this ticket's own
  testing (not self-reported, actually hit): bin/mnemosyne's HERE resolution
  used `HERE="$(cd "$(dirname "$0")/.." && pwd)"` -- correct only when the
  script is invoked by its real path. Once this ticket's install script
  started symlinking bin/mnemosyne onto PATH (exactly what design-discussion
  §1.2 specifies, and exactly this operator's own real
  ~/.local/bin/{codex,graphify,...} convention), invoking the symlinked
  `mnemosyne agent status` failed hard with `Error: Cannot find module
  '<bin-dir>/mnemosyne-agent.mjs'` (MODULE_NOT_FOUND) -- `dirname "$0"`
  resolved to the SYMLINK's own directory (MNEMOSYNE_BIN_DIR), not the real
  script's directory, silently pointing every subcommand at the wrong repo
  root. This was caught by actually running the freshly-installed,
  freshly-symlinked `mnemosyne` command end to end during this ticket's own
  testing, not assumed. Fixed with a portable manual symlink-resolution loop
  (BASH_SOURCE + a `[ -h "$SOURCE" ]` while-loop resolving one hop at a time,
  re-basing relative link targets against the symlink's own directory) --
  deliberately NOT `readlink -f` (GNU-only, not guaranteed portable across
  every platform this dispatcher might run on, even though it happened to
  work on this machine's macOS). Re-ran test/agent-cli.mjs (unrelated to this
  fix's trigger path, invokes bin/mnemosyne directly, never through a
  symlink) after the fix -- still 100% pass, confirming the fix is additive
  and doesn't change the non-symlinked invocation path aha-01/aha-02's own
  tests already cover.

  New test/install-script.mjs: real subprocess-level test, run TWICE against
  the SAME isolated MNEMOSYNE_INSTALL_DIR/MNEMOSYNE_BIN_DIR (fresh mkdtemp()
  dirs, never this operator's real ~/.local/share/mnemosyne or
  ~/.local/bin), with MNEMOSYNE_REPO_URL pointed at a `file://` URL for THIS
  repo's own working tree root (fast, deterministic, no network flakiness,
  and -- critically -- clones a commit that actually HAS
  bin/mnemosyne-agent.mjs, unlike the real https://github.com/mdostal/mnemosyne
  main today, which does not yet have aha-01/aha-02 merged, so a real-URL
  clone right now could install+link successfully but `mnemosyne agent
  status` would 404 on a subcommand that doesn't exist there yet -- this
  would be a false-positive "it works" if not accounted for). First run:
  proves a real clone (.git present), a real `npm install` (node_modules
  present), a real bin symlink pointing at the clone's own bin/mnemosyne, and
  -- independently, via PATH (bare `mnemosyne` command name, not an
  absolute-path workaround, to literally satisfy "reachable on PATH") --
  that `mnemosyne agent status` genuinely runs end to end (exit 0, real
  per-harness output), using an isolated HOME/CODEX_HOME for that
  verification call too (belt-and-suspenders on top of the call being
  read-only by the CLI's own design). Second run against the SAME target:
  proves idempotency -- "existing clone found ... updating" (not a fresh
  "cloning ... into"), the symlink still resolves to the same real path
  (never duplicated), and `agent status` still reports "NOT registered",
  independently proving the install script's own two runs never triggered
  `agent init` as a side effect (not just that the script's stdout claims
  not to have). Separately proves scripts/install.sh (byte-identical
  content, asserted directly) also runs a full clone+install+link end to end
  against a THIRD isolated target. Confirms README's Quickstart structure
  (curl line first, gh-repo-clone block preserved directly below, unmodified).
  A final SAFETY block snapshots this operator's REAL
  ~/.local/bin/mnemosyne (lstat + readlink if present) both before ANY test
  code runs and after the entire test (including its own cleanup) completes,
  and asserts the two snapshots are identical -- on this machine, both
  snapshots report "does not exist" (confirmed by hand before writing this
  ticket's code: this operator has never installed Mnemosyne via this
  script), so the assertion is currently "absent stays absent"; the same
  check would catch a real symlink's target changing if one existed. Wired
  into package.json's `test` chain (after test/agent-cli.mjs, matching this
  epic's own convention) and given its own `test:install-script` script.

  Verification performed independently this session (this ticket's install
  script clones+npm-installs+symlinks on a real machine -- held to the same
  scrutiny as aha-01/aha-02's own harness-config-mutating work):
    - Read the full aha-03 ticket YAML, design-discussion.md §1.2/§1.3 (and
      §0/§2/§3 for context), research-brief.md §2 (confirmed still holds by
