      chain's own remainder run by hand past that point (matching
      aha-01/aha-02's own documented convention): `node
      test/single-layer-config.mjs`, `node test/git-hooks.mjs`, `node
      test/install-git-hooks.mjs`, `node test/lifecycle-compliance-audit.mjs`,
      `node test/persona-cli.mjs`, `node test/agent-cli.mjs`, `node
      test/install-script.mjs` -- all pass. `npx vitest run lib/mnemosyne
      lib/minerva benchmarks src/planning src/config src/runners`: 54 test
      files / 727 tests, all pass. `npx tsc --noEmit`: clean, zero output.
    - Ran test/ui-shell.mjs as extra diligence (not part of npm test's
      chain, matching this epic's own established convention): 22 failures,
      identical count to aha-01/aha-02's own documented pre-existing
      baseline -- this ticket touches no ui/ file at all.
  No new failures anywhere beyond the two already-documented pre-existing
  gaps (http-api.mjs's 3 POST /remember failures, ui-shell.mjs's 22
