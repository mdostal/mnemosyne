  and confirmed accurate. Read the real bin/mnemosyne-agent.mjs diff
  directly: confirmed the targeted `codex mcp get` check (never `list`) is
  real and commented, confirmed the check-before-write guard is genuinely
  load-bearing for idempotency (not just error-avoidance, since `codex mcp
