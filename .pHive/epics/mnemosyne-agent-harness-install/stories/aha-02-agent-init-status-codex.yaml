  second `init` run is the check-before-write guard's own doing, not
  something the underlying Codex CLI provides for free. Ran the full
  suite: tsc clean, 54/54 vitest files, 727/727 tests, .mjs suite clean
  except the 3 pre-existing POST /remember failures.

  CRITICAL safety check, done directly against this operator's REAL
  machine both before dispatch and again after this ticket's full test
