note_on_completion: >
  Extended bin/mnemosyne-agent.mjs (aha-01's real, shipped file -- not a new
  file) with a parallel Codex CLI harness: codexMcpRegistered()/
  registerMcpCodex()/initCodex()/statusCodex()/printCodexStatus(), wired into
  the same runInit()/runStatus()/--harness dispatch aha-01 built. No skill
  install for Codex (confirmed, research-brief.md §4: no analogous
  skill-file mechanism) -- MCP registration only.

  Unlike aha-01's own planning-time uncertainty about Codex, this ticket's
  orchestrating session had ALREADY directly, hand-verified the real,
  installed Codex CLI (codex-cli 0.143.0, already on PATH) before dispatch,
  and this session independently re-verified that command surface by hand
  before writing any code (`codex mcp --help`, `codex mcp add --help`,
  `codex mcp get --help`, `codex mcp list --help`, and real calls against an
  isolated $CODEX_HOME):
    - `codex mcp add <NAME> -- <COMMAND>...` is real and registers a stdio
      MCP server, same `--` separator shape as `claude mcp add`. One real,
      material difference from Claude found by hand: unlike `claude mcp add`
      (which errors non-zero on an already-registered name), `codex mcp add`
      does NOT error on a second call for the same name -- it silently
      OVERWRITES the existing entry's command/args. Confirmed by calling it
      twice with different fake command paths and reading back `codex mcp
      get` in between. This is not a "command shape mismatch" (the command
      itself behaves exactly as documented) but it does change WHY the
      check-before-write guard matters for Codex: not to avoid an error (as
      for Claude) but to avoid a real, silent, redundant re-write on every
      `init` run. Documented in bin/mnemosyne-agent.mjs's own header comment
      and registerMcpCodex()'s doc comment so a future editor doesn't miss
      it.
    - `codex mcp get <NAME>` is the real, single-server targeted lookup
      (exit 0 + prints command/args/scope when found; exit 1 + "No MCP
      server named '<NAME>' found." when not) -- used as the ONLY
      registration check, exactly per this ticket's acceptance criteria.
      `codex mcp list` exists and works (confirmed) but is never invoked for
      the check -- test/agent-cli.mjs's AC-codex-targeted block
      independently re-verifies this by grepping codexMcpRegistered()'s own
      function body in the real source (isolated by function-boundary
      slicing, not just a whole-file regex) for `["mcp","get",` and asserts
      `["mcp","list"` never appears anywhere in the file.
    - $CODEX_HOME resolution confirmed by hand: `codex --help`'s own text
      ("Layer $CODEX_HOME/<name>.config.toml on top of the base user
      config") plus a real, direct test -- pointing $CODEX_HOME at a fresh
      empty mkdtemp() directory produces a brand-new config.toml there
      (`[mcp_servers.<name>]\ncommand = "..."\nargs = [...]`) with zero
      interaction with the real ~/.codex/. Also confirmed, unlike Claude
      Code's real project-scoped-.mcp.json/CWD bug (the exact bug aha-01's
      own HARNESS_EXEC_CWD fix addresses): Codex's `mcp get`/`mcp add` do
      NOT resolve anything from CWD -- ran `codex mcp get` from both a
      throwaway tmp dir and this repo's own root against the same
      $CODEX_HOME and got byte-identical output both times. HARNESS_EXEC_CWD
      is still applied to Codex's execs for consistency with the Claude
      side, not because Codex needs the fix.

  No command-shape mismatch was found anywhere -- everything the epic's
  design-discussion.md §2 flagged as "unverified, real risk" turned out to
  match on direct, hand-run verification. The "loud failure, never silent"
  requirement is still implemented as defensive code, not just documentation:
  registerMcpCodex() wraps its `codex mcp add` call in try/catch and, on any
  failure OTHER than what codexMcpRegistered()'s own prior check already
  ruled out (i.e. any failure once the caller believes registration is
  needed), rethrows a new Error naming the exact command
  (`codex mcp add <name> -- node <path>`) and the real subprocess stderr, so
  a future genuine command-shape divergence would surface as a specific,
  non-zero-exit failure via main()'s own top-level catch -- never swallowed
  into a generic "codex not available" skip. A harness genuinely ABSENT from
  PATH (the normal, expected case, not a mismatch) is handled separately and
  is never fatal, symmetric with aha-01's own Claude-side absent-binary
  handling -- verified for real in this session (see below) via a real PATH
  override excluding both `claude` and `codex`.

  Extended test/agent-cli.mjs (not a new file) with real subprocess-level
  Codex coverage, matching its own established pattern and $HOME-isolation
  discipline but for Codex/$CODEX_HOME: AC-codex-targeted (source-level,
  function-scoped `mcp get` vs `mcp list` proof), AC-codex-register
  (first-run `agent init --harness codex` registers via the real installed
  codex CLI, independently re-verified via a SEPARATE, direct `codex mcp
  get` call reporting the real absolute bin/mnemosyne-mcp.mjs path),
  AC-codex-idempotent (second run reports "already registered", makes zero
  redundant writes -- $CODEX_HOME/config.toml byte-for-byte unchanged --
  notable because this genuinely tests OUR check-before-write guard rather
  than leaning on `codex mcp add`'s own idempotency, since it has none),
  AC-codex-status (status before/after `agent init --harness codex`
  genuinely differs, and a `status` call itself makes zero writes to
  $CODEX_HOME -- config.toml snapshot identical before/after, plus an
  independent re-check via a direct `codex mcp get` call), `--harness codex`
  narrowing scope (both directions -- `--harness claude` mentions no codex
  text, `--harness codex` mentions no claude harness-report line), and the
  targeted-get-never-list requirement (grepped against codexMcpRegistered()'s
  own isolated function body, not just the whole file, so a future codex
  function that legitimately needs `mcp list` for an unrelated purpose
  wouldn't false-fail this check). Also added AC-both-absent-ok: with a real
  PATH override to an empty directory (confirmed containing neither `claude`
  nor `codex` -- and confirmed FIRST, via a real sanity check, that this
  machine's actual codex CLI genuinely resolves normally without the
  override, so the "absent" branch is exercised via a deliberate override,
  not because codex happens to be missing here), both `agent init` and
  `agent status` (no --harness) exit 0 and print clear, honest per-harness
  "binary not found on PATH" messages -- never a hard failure just because
  both harnesses are absent.

  CRITICAL, session-wide isolation fix made while writing these tests: once
  Codex became a REAL (not placeholder) harness, aha-01's own existing
  Claude-focused test blocks -- which call `agent init`/`agent status` with
  no --harness flag -- now genuinely sweep Codex too. Before this ticket,
  those blocks only ever set $HOME; if left unchanged, the default sweep
  would have run the real `codex` CLI against whatever $CODEX_HOME the test
  process inherited, i.e. THIS OPERATOR'S REAL ~/.codex/config.toml, on
  every single existing Claude-focused test run -- a genuine, session-wide
  regression risk this ticket introduced and then fixed. Fixed by changing
  test/agent-cli.mjs's shared runCli() helper so $CODEX_HOME is now ALWAYS
  set on every invocation -- explicitly, when a test block passes one, or
  via an automatic fresh mkdtemp() fallback otherwise -- making it
  structurally impossible for ANY test block (old or new) to fall through to
  the real ~/.codex/. Verified directly, not just trusted: `codex mcp list`
  and `codex mcp get mnemosyne`, run for real against this operator's actual
  environment after the FULL test suite (including every pre-existing
  Claude-focused block) had completed, show only the two real, pre-existing
  servers (portunus, posthog) and report "No MCP server named 'mnemosyne'
  found." -- zero leakage. Also re-confirmed `~/.claude/skills/` (Claude
  side, aha-01's own concern, re-checked here since this ticket re-ran that
  full suite too) has no mnemosyne-standalone/mnemosyne-persona-interview
  entries, and `claude mcp get mnemosyne` from a neutral cwd (/tmp, not this
  repo) reports no such server among this operator's real configured
  servers.

  Verification performed independently this session (this ticket touches
  real machine state on TWO harnesses, held to the same highest scrutiny as
  aha-01):
    - Read the full aha-02 ticket YAML, aha-01's own completion note (for
      expected depth), bin/mnemosyne-agent.mjs end to end (HARNESS_EXEC_CWD
      comment, mcpRegistered()/registerMcp() for Claude, --harness flag
      handling), and design-discussion.md/research-brief.md's Codex-specific
      sections before writing any code.
    - Hand-verified the real installed codex CLI's actual command surface
      (`codex --help`, `codex mcp --help`, `codex mcp add/get/list --help`)
      and its real, live behavior against a series of isolated
      mkdtemp()-based $CODEX_HOME directories (add, get, get on a
      nonexistent name, double-add overwrite behavior, CWD-independence,
      detectBinary's ENOENT-vs-found distinction via a genuinely nonexistent
      command) -- BEFORE implementing, per this ticket's own "research"
      step, not after.
    - Manually smoke-tested initCodex()/statusCodex() directly (via
      `node -e` with process.env.HOME/CODEX_HOME pinned to fresh temp dirs)
      before writing the full test file: first registration, independent
      `codex mcp get` re-verification reporting the real absolute path, and
      idempotent second run (config.toml mtime unchanged).
    - `node test/agent-cli.mjs` run standalone: all checks pass (both
      Claude and Codex sections).
    - `npm install` (node_modules absent in this fresh worktree) then
      `npm test`: the chain (`&&`-joined) stops at test/http-api.mjs's 3
      already-documented pre-existing POST /remember failures before
      reaching test/persona-cli.mjs, test/agent-cli.mjs, or the vitest
      suite -- confirmed pre-existing and unrelated to this diff by
      `git stash`-ing this ticket's changes and re-running
      test/http-api.mjs directly against the unmodified base commit
      (39245c1, aha-01's own merge commit): identical 3 failures, identical
      assertions. With the stash restored, ran the remainder of npm test's
      own chain directly: `node test/persona-cli.mjs` (all pass),
      `node test/agent-cli.mjs` (all pass), and
      `npx vitest run lib/mnemosyne lib/minerva benchmarks src/planning src/config src/runners`
      (54 test files / 727 tests, all pass). Also ran test/ui-shell.mjs as
      extra diligence (not part of npm test's chain, per this session's own
      established convention): 22 failures, identical count to aha-01's own
      documented pre-existing baseline, and this ticket touches no ui/ file
      at all.
    - `npx tsc --noEmit`: clean, zero output.
  No new failures anywhere beyond the two already-documented pre-existing
  gaps. Committed and pushed to a new branch (this worktree's original base
  commit -- 39245c1 -- was aha-01's own real merge tip; see this ticket's own
  worktree-provenance note below for why a fresh branch was created off it
  rather than reusing feat/mnemosyne-agent-harness-install directly).

  Worktree/branch provenance note (environment-integrity finding, reported
  for traceability): this ticket's dispatched worktree
  (.claude/worktrees/wf_31251815-194-1) was, at task start, actually checked
  out on branch `worktree-wf_31251815-194-1` at commit f73f542 (a `dev`-tip
  commit, NOT 39245c1/aha-01 as the dispatch instructions stated) --
  `.pHive/epics/mnemosyne-agent-harness-install/` and bin/mnemosyne-agent.mjs
  did not exist there. The real feat/mnemosyne-agent-harness-install branch
  at 39245c1 was confirmed to exist (both locally, checked out in this
  repo's own primary working directory, and on origin) with the expected
  aha-01 content. Rather than proceeding against the wrong base or touching
  the primary working directory's already-checked-out branch, created a new
  branch `aha-02-agent-init-status-codex` off the real 39245c1 tip, inside
  this same dispatched worktree, and did all work there.

  Final CRITICAL safety check, done directly against this operator's REAL
  machine (not just trusting the tests' own isolation claims), after the
  full test run above:
    - `codex mcp list` (real, default $CODEX_HOME) -> shows exactly this
      operator's 2 real, pre-existing servers (portunus, posthog) -- no
      "mnemosyne" entry.
    - `codex mcp get mnemosyne` (real, default $CODEX_HOME) -> "Error: No
      MCP server named 'mnemosyne' found." (exit 1) -- confirms the targeted
      check itself, run for real outside any test, finds nothing leaked.
    - `ls ~/.claude/skills/` -> no mnemosyne-standalone or
      mnemosyne-persona-interview entries (only this operator's real,
      unrelated pre-existing skills).
    - `claude mcp get mnemosyne` (run from /tmp, a neutral cwd, not this
      repo) -> "No MCP server named \"mnemosyne\"" among this operator's
      real configured servers.
  This operator's real Claude Code AND Codex CLI environments are genuinely
  untouched.

  Independent verification (orchestrating session, before merge): the
  orchestrating session had already directly verified the real, installed
  codex CLI's command surface on this machine before dispatch (codex-cli
  0.143.0, `codex mcp add/get/list --help`) and handed the builder that
