design_decisions:
  - decision: "Bundle a real Node runtime binary rather than compiling a Node SEA binary."
    rationale: "Re-derived in grill-record.md finding 5.2 from the real, hand-traced dependency graph (zero npm packages, so the usual native-addon-compatibility risk and the usual SEA node_modules-avoidance size benefit both fail to apply here) — not a rubber-stamp of the task's original framing."
  - decision: "The sidecar-spawn Command explicitly sets PATH (or SWARM_MEMORY_BIN) rather than relying on inherited environment."
    rationale: "grill-record.md finding 2.1 — a Tauri sidecar bypasses bin/mnemosyne's own bash wrapper entirely, which is the ONLY place in this codebase today that fixes this exact PATH-inheritance gap for GUI-launched processes."
  - decision: "Zero application code under src/, bin/, or ui/ is modified by this story."
    rationale: "grill-record.md finding 4.1 — proves the sidecar is a packaging layer around the existing, unmodified service boundary, never a second, parallel memory-access mechanism."

cross_cutting:
  - concern: loud-failure
    action: "If the sidecar fails to reach swarm-memory (PATH misconfiguration or otherwise), the existing /health degradation reporting surfaces this unchanged — this story adds no new silent-failure path around sidecar startup itself (a spawn failure is surfaced, not swallowed)."
  - concern: existing-infrastructure
    action: "Zero changes to src/server.mjs, src/engine.mjs, or any file under src/layers/ — verified by an explicit diff-against-dev acceptance criterion, not just a policy statement."

risks:
  - severity: critical
    description: "The PATH-inheritance gap (grill-record.md finding 2.1) is real and was previously invisible to any test run only from an interactive terminal — the single highest-blast-radius risk in this story, and arguably this whole epic, since a silent failure here would surface only after the operator has already dogfooded a build that appeared to work in dev mode."
    mitigation: "Acceptance criterion 4 explicitly requires a Finder/Dock launch, never a terminal-only test; the test-spec step's own subprocess environment is deliberately stripped to a minimal PATH to force this bug to surface in CI/pre-merge rather than in the operator's own hands."
  - severity: medium
    description: "Vendoring the wrong node binary (wrong architecture, or a binary that doesn't match package.json's engines.node >=22 constraint) would produce a sidecar that fails to start silently or loudly depending on how it fails."
    mitigation: "Research step confirms the real target triple and the real vendored binary's own reported version before implementation proceeds."

