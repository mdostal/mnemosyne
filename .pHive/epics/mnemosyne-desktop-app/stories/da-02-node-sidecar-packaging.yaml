files_to_modify:
  - file: src-tauri/tauri.conf.json
    change: "Add bundle.externalBin and bundle.resources entries for the sidecar binary and the app's own .mjs/ui files."
  - file: src-tauri/binaries/mnemosyne-node-<TARGET_TRIPLE>
    change: "New file: a real, unmodified platform node executable, renamed per Tauri's externalBin convention."
  - file: src-tauri/src/lib.rs
