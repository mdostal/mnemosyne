id: da-02-node-sidecar-packaging
epic: mnemosyne-desktop-app
title: Node-runtime sidecar packaging — the epic's single highest-risk story
status: pending
complexity: high
methodology: tdd
depends_on: [da-01-tauri-project-scaffolding]

description: |
  The one genuinely new, highest-blast-radius decision in this epic,
  deliberately isolated into its own story with its own explicit proof —
  mirroring `ro-06`'s own precedent of isolating this repo's single
  riskiest action into a dedicated story with its own safety proof.

  Real decision (docs/design-discussion.md §1, re-derived in grill-record.md
  finding 5.2 from the real dependency graph, not the task's original
  assumed one): bundle a real, unmodified platform `node` executable as a
  Tauri `externalBin` sidecar (renamed per Tauri's own `-$TARGET_TRIPLE`
  convention), and ship `src/server.mjs`'s own already-shipped `.mjs`
  files plus `ui/*` as Tauri `resources` — never a Node
  Single-Executable-Application (SEA) compile. Confirmed directly
  (research-brief.md §2.2): `src/server.mjs`'s entire transitive import
  graph (`engine.mjs`, `flight-status.mjs`, `status-filter.mjs`,
  `graphify-bridge.mjs`, `layers/{meta,enterprise,project,code-graph}.mjs`,
  `merge.mjs`) has ZERO npm-package dependencies — only Node builtins and
  local relative imports — so this story ships zero `node_modules`, and
  needs zero native-addon compatibility handling.

  Two real, previously-invisible gaps this story's own acceptance
  criteria close explicitly, not silently:

  1. **The PATH gap (docs/design-discussion.md §1.2, grill-record.md
     finding 2.1):** `src/engine.mjs` resolves `swarm-memory` via `$PATH`
     (`execFileP(process.env.SWARM_MEMORY_BIN || "swarm-memory", ...)`).
     Confirmed directly on this machine: `swarm-memory` resolves to
     `~/.local/bin/swarm-memory`, exactly the directory `bin/mnemosyne`'s
     own bash wrapper explicitly prepends to `$PATH`
     (`export PATH="/opt/homebrew/bin:$HOME/.local/bin:$PATH"`) —
     precisely because a GUI-launched process (which is exactly how a
     packaged Tauri app's own sidecar is launched, bypassing that bash
     wrapper entirely) does not inherit that PATH augmentation by
     default. This story's sidecar-spawn code must set the equivalent
     PATH (or an explicit `SWARM_MEMORY_BIN` absolute path) on the
     sidecar `Command`'s own environment.
  2. **The readiness gap (docs/design-discussion.md §3.2, grill-record.md
     finding 2.2):** this story's own acceptance criteria require a real,
     working `GET /healthz` response from the spawned sidecar before
     `da-03`'s window-wiring story can build on it — this story owns
     proving the sidecar reaches a servable state at all, `da-03` owns
     the poll-before-navigate UI behavior built on top of it.

  Explicitly, this story modifies zero lines of `src/`, `bin/`, or `ui/`
  — it spawns the exact, already-shipped `src/server.mjs` unchanged
  (docs/design-discussion.md §3.4, grill-record.md finding 4.1).

acceptance_criteria:
  - "Given `rustc --print host-tuple`'s real output (confirmed by da-01's own research step, e.g. `aarch64-apple-darwin`), when the sidecar binary is named, then it exactly matches Tauri's own `-$TARGET_TRIPLE` externalBin naming convention — never a guessed or hard-coded triple"
  - "Given `src-tauri/binaries/mnemosyne-node-<TARGET_TRIPLE>` is a real, unmodified platform `node` executable satisfying `package.json`'s `engines.node: \">=22\"`, when `tauri.conf.json`'s `bundle.externalBin` and `bundle.resources` are configured, then a debug `cargo tauri build` (per da-01's own smoke check) produces a bundle containing both the renamed node binary AND `src/*.mjs`/`bin/graphify-bridge.mjs`/`ui/*` under the bundle's real resource directory"
  - "Given the sidecar is spawned via `app.shell().sidecar(\"mnemosyne-node\")` with args pointing at the bundled `src/server.mjs`'s real resolved resource path, when the packaged app is launched, then `GET http://127.0.0.1:8477/healthz` returns 200 within a bounded real wait (the readiness gap, closed for real, not merely documented as a future concern)"
  - "Given this story's sidecar-spawn `Command` sets an explicit PATH (or `SWARM_MEMORY_BIN`) environment value reproducing `bin/mnemosyne`'s own `/opt/homebrew/bin:$HOME/.local/bin` augmentation, when the packaged app is launched from Finder or the Dock (NEVER only from an interactive terminal/`cargo tauri dev`, which would silently inherit a login shell's own PATH and hide this exact bug), then `GET http://127.0.0.1:8477/health` reports `swarm-memory` reachable (not an `ENOENT`/subprocess-not-found degradation) — this is the story's own single most load-bearing acceptance criterion, given grill-record.md finding 2.1's own explicit warning that a terminal-only test would hide this bug"
  - "Given the bundled `.mjs` files are shipped as Tauri resources rather than modified in place, when a reviewer diffs `src/server.mjs`, `src/engine.mjs`, and every file under `src/layers/`, `bin/graphify-bridge.mjs`, and `ui/` against `dev`'s own tip, then the diff is empty — zero application-code changes, proving the 'compose, don't fork' discipline (grill-record.md finding 4.1) held in the real implementation, not merely in the design doc"

steps:
  - id: research
    description: >
      Confirm the real target triple from da-01's own recorded research
      output. Confirm the exact real byte size and SHA of the platform
      `node` binary this story vendors (from the operator's own installed
      Node v24.18.1, or an official nodejs.org download for the confirmed
      target triple — decide and document which, don't leave it
      ambiguous). Re-confirm, by direct shell command on the real machine,
      that `swarm-memory` still resolves via `~/.local/bin/swarm-memory`
      (research-brief.md §2.4) before hard-coding that path into any
      sidecar environment setup — a stale assumption here would silently
      reintroduce the exact bug this story exists to close.
    agent: researcher
  - id: test-spec
    description: >
      Write a real (not mocked) integration check: spawn the sidecar
      exactly as the Rust `Command` setup will (same args, same
      explicit-PATH environment), from a subprocess whose OWN inherited
      environment has been deliberately stripped down to a minimal
      Finder/Dock-equivalent PATH (never the full interactive-shell PATH)
      — the only way to genuinely exercise acceptance criterion 4 rather
      than accidentally pass it by inheriting a rich terminal PATH.
    agent: tester
    depends_on: [research]
  - id: implement
    description: >
      Configure `tauri.conf.json`'s `bundle.externalBin`/`bundle.resources`,
      vendor the real node binary under `src-tauri/binaries/`, write the
      Rust sidecar-spawn code (`app.shell().sidecar(...).env("PATH", ...)
      .args([...]).spawn()`) with the PATH fix and PORT env var wired,
      and confirm zero changes to any file under `src/`, `bin/`, or
      `ui/`.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: >
      Independently re-verify acceptance criterion 4 for real — actually
      launch the packaged `.app` from Finder (double-click, not a
      terminal), never trusting the implementer's own self-report that
      "it works," mirroring `ro-06`'s own independent-reviewer discipline.
      Confirm the `src/`/`bin/`/`ui/` diff-against-`dev` is genuinely
      empty.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feat/mnemosyne-desktop-app.
    agent: developer
    depends_on: [review]

