design_decisions:
  - decision: "Poll GET /healthz with a bounded backoff before creating/navigating the dashboard window, rather than navigating immediately and letting the webview show its own connection-refused error."
    rationale: "grill-record.md finding 2.2 — a real, previously-unnamed startup race condition between sidecar-listener-readiness and window navigation; the existing /healthz route (liveness-only, always 200 once the process is up) is the cheapest correct signal for this, distinct from the heavier /health self-test."
  - decision: "Launch-at-login defaults to visible-and-toggleable in the tray menu, never a silent forced-on background service."
    rationale: "The operator's own words ask for 'run long term,' not 'run invisibly with no way to turn it off' — a real, user-facing toggle keeps this an honest, inspectable default rather than an unaccountable background process."

cross_cutting:
  - concern: existing-infrastructure
    action: "Zero changes to ui/index.html, ui/app.js, or ui/style.css — the dashboard displayed is byte-for-byte the same file src/server.mjs already serves today, verified by an explicit diff-against-dev acceptance criterion."
  - concern: documentation
    action: "README.md/SERVICE.md gain a short note describing the tray-icon/window-shell behavior once implemented, expanded fully in da-05's dogfood documentation."

risks:
  - severity: medium
    description: "A cold-launch race condition (window navigates before the sidecar's HTTP listener is ready) would present as an intermittent, hard-to-reproduce blank-window bug if the healthz-poll design isn't implemented correctly."
    mitigation: "Acceptance criterion 1 requires the poll-then-navigate sequence explicitly; the review step re-verifies by observing a real cold launch, not by reading the poll code and assuming it's correct."
  - severity: low
    description: "tauri-plugin-autostart's own API surface could have drifted between this planning pass's research-brief.md snapshot and this story's future execution."
    mitigation: "Research step re-fetches the plugin's live docs rather than trusting the snapshot as still exactly current."

