id: da-05-local-dogfood-build-and-run
epic: mnemosyne-desktop-app
title: Local dogfood build + run — the operator's own "release to dogfood" ask, made real and verifiable
status: pending
complexity: medium
methodology: tdd
depends_on: [da-02-node-sidecar-packaging, da-03-tray-shell-and-dashboard-window, da-04-auto-updater-wiring]

description: |
  The operator's own explicit words, made real as their own distinct,
  concrete, independently-verifiable story rather than folded silently
  into "the build works" claims from earlier stories: "we need to have it
  release to dogfood." This story is the first point in this epic where
  every earlier piece (sidecar, tray/window, updater wiring) is built
  together into one real artifact and actually run the way the operator
  will really run it — launched from Finder/the Dock, not from an
  interactive dev shell.

  Real, named, operator-owned prerequisite this story works around, not
  waits on (docs/design-discussion.md §2.3, grill-record.md finding 5.1):
  the built `.app` is unsigned/unnotarized (macOS notarization requires a
  paid Apple Developer Program membership this agent cannot obtain). This
  story applies the real, Apple-documented local Gatekeeper override
  (System Settings → Privacy & Security → "Open Anyway," quoted directly
  from `support.apple.com` in research-brief.md §3.8) — a real, one-time-
  per-build, operator's-own-machine-only workaround, never a claim that
  this makes the build broadly distributable.

  Real, named, genuinely open empirical question this story is the first
  chance to observe (docs/design-discussion.md §2.2, grill-record.md
  finding 3.2): whether an auto-installed update (once a second real
  release exists, out of this story's own scope) would re-trigger
  Gatekeeper's quarantine flow on the replacement bundle. This story's own
  acceptance criteria do NOT require exercising a live update cycle — that
  needs a second published release, genuinely out of scope for a FIRST
  dogfood build — but it does require this open question to be restated
  explicitly in this story's own completion report, never silently
  dropped now that a working build exists.

acceptance_criteria:
  - "Given `da-02`, `da-03`, and `da-04` are all complete, when a real (debug or ad-hoc-signed, `codesign --sign -`) release build is produced via `cargo tauri build` on this operator's own machine, then a real `.app` bundle exists under `src-tauri/target/release/bundle/macos/` (or the real path this machine's build actually produces — confirmed directly, not assumed from a generic Tauri doc example)"
  - "Given the built `.app` is unsigned/unnotarized, when it is first launched (double-clicked from Finder, or opened from the Dock after being placed in `/Applications`), then macOS blocks it with the real, documented Gatekeeper warning, and applying the real, Apple-documented override (System Settings → Privacy & Security → 'Open Anyway' → confirm password) allows it to launch — this exact sequence is performed for real on this machine, not merely described"
  - "Given the app has launched successfully once, when the operator clicks the tray/menu-bar icon, then the real dashboard (`ui/index.html`'s own 10 panels, unchanged) loads and is visibly interactive within the bounded startup delay `da-03`'s own healthz-poll allows for — the operator can see real liveliness/settings/lanes/search/graph/operations/personas/memory-levels panel content, not a blank or error page"
  - "Given the app is quit and relaunched a second time (from Finder/the Dock again, not a terminal), when it starts, then it no longer shows the first-launch Gatekeeper warning (per Apple's own docs: 'you can open it in the future by double-clicking it, just as you can for any authorized app') — confirming the override was real and persistent for this specific build, not a one-shot fluke"
  - "Given no live update cycle is exercised by this story (no second release exists yet), when this story's own completion report is written, then it explicitly restates grill-record.md finding 3.2's own open question (does an auto-installed update re-trigger Gatekeeper quarantine on the replacement bundle) as still genuinely open — never silently dropped now that a first working build exists, and never claimed resolved by this story's own real, but narrower, first-launch observation"

steps:
  - id: research
    description: >
      Confirm the real, current `cargo tauri build` invocation for a
      release (vs. debug) build, and the real, current recommended
      ad-hoc-signing step for a local-only unsigned/unnotarized build
      (`codesign --sign -`, per research-brief.md §4's own Node SEA
      section citing the same command for a different artifact type —
      confirm it applies identically to a Tauri `.app` bundle via Tauri's
      own docs, don't assume by analogy alone).
    agent: researcher
  - id: test-spec
    description: >
      Define this story's own completion checklist as a literal, ordered,
      re-runnable script the operator (or a future re-execution of this
      story) can follow exactly: build → move to /Applications (or launch
      in place) → first launch → Gatekeeper block observed → System
      Settings override applied → dashboard visibly loads → quit → second
      launch → no Gatekeeper block on the second launch. Each step names
      its own real, observable pass/fail signal.
    agent: tester
    depends_on: [research]
  - id: implement
    description: >
      Run the real release build, perform the real ad-hoc signing step,
      and produce the real, distributable-to-this-operator-only `.app`
      artifact — no application code changes (this story builds and runs
      what `da-01`-`da-04` already produced).
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: >
      Independently re-run the full checklist from `test-spec` end to
      end, on the real operator's own machine, narrating each real,
      observed outcome (including the Gatekeeper block, the override, and
      the dashboard load) — this is the epic's own final, real,
      human-observable proof that "release to dogfood" genuinely
      happened, not a simulated or assumed pass.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: >
      Commit and push to feat/mnemosyne-desktop-app, including this
      story's own completion report (the real, observed outcomes from the
      review step, and the restated-open Gatekeeper/auto-update question
      per acceptance criterion 5).
    agent: developer
    depends_on: [review]

