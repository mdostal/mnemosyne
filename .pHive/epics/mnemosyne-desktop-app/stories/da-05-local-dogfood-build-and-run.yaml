design_decisions:
  - decision: "This story's own acceptance criteria stop at a real, successful FIRST launch plus a real, successful SECOND launch (no Gatekeeper re-block) — they deliberately do NOT require exercising a live auto-update cycle."
    rationale: "A live update cycle requires a second, later, real published release — genuinely out of scope for a first dogfood build's own completion bar; forcing it here would either be faked (a rubber-stamped pass) or would block this story indefinitely on work that belongs to a future release cycle. Named explicitly as a deliberate scope boundary (acceptance criterion 5), not a silently dropped requirement."
  - decision: "The dogfood build uses ad-hoc signing (codesign --sign -), never a real Developer ID Application signature."
    rationale: "grill-record.md finding 5.1 — a real Developer ID Application certificate requires the operator's own paid Apple Developer Program membership, a real, unresolved, operator-owned prerequisite this story does not wait on; ad-hoc signing is the real, available, local-only substitute that lets Gatekeeper's own override flow work at all."

cross_cutting:
  - concern: documentation
    action: "README.md/SERVICE.md gain the epic's own final, real 'how to build and dogfood the desktop app locally' section, written from this story's own actually-observed steps, not a generic Tauri tutorial's own generic steps."
  - concern: loud-failure
    action: "If the dashboard fails to load within da-03's own bounded healthz-poll window, this story's review step reports that as a real failure, not a 'probably just slow' assumption — ties back to the existing /health degradation contract, unchanged."

risks:
  - severity: high
    description: "The Gatekeeper/auto-update interaction (grill-record.md finding 3.2) remains genuinely untested by this story, since no second release exists yet to exercise a real update cycle against."
    mitigation: "Acceptance criterion 5 requires this open question to be restated explicitly in this story's own completion report — never silently dropped once a first working build exists. A future release-cycle story (out of this epic's own scope) is the real place this gets resolved empirically."
  - severity: medium
    description: "A first-launch Gatekeeper block could be mistaken for a real app crash/bug by a future reader of this story's own completion report if the sequence isn't narrated clearly."
    mitigation: "The test-spec step's own literal, ordered checklist names the Gatekeeper block as an EXPECTED, real step in the sequence, not a failure signal — reviewed and confirmed against Apple's own documented behavior, not treated as a bug to chase."

