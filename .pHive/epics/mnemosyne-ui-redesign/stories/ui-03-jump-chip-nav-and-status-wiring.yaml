id: ui-03-jump-chip-nav-and-status-wiring
epic: mnemosyne-ui-redesign
title: "Sticky jump-chip navigation bar with live per-panel status rings"
status: complete
complexity: medium
methodology: classic
depends_on: [ui-01-accent-token-reconciliation]

note_on_completion: >
  Worktree note: the main repo checkout already had feat/mnemosyne-ui-redesign
  (tip b377f48, ui-01 + ui-02 merged) checked out, so this dispatch's own
  worktree branched its own local branch, feat/ui-03-jump-chip-nav-and-status-
  wiring, directly off that same b377f48 tip, and pushed that instead --
  same base commit either way, just a different branch name to avoid the
  two-worktrees-one-branch conflict.

  Added <nav id="jump-chips"> to ui/index.html directly under <header>, with
  exactly 8 real <a href="#id"> anchors (liveliness/settings/lanes/search/
  graph/operations/personas/memory-levels, real document order). Added
  CHIP_STATUS_SOURCE + syncJumpChips() to ui/app.js, called once from
  refreshAll()'s completion path (after its Promise.all(...) of every
  load*() resolves) -- verified in a real running browser (Playwright) that
  it fires exactly then, not before: chips stayed classless while any
  load*() was still in flight, then all six ring-eligible chips populated
  correctly the instant the full Promise.all settled.

  never-fabricate rule, verified against the REAL current app.js/index.html
  (not assumed uniform, not copied from the static mockup) -- rings ended up
  on 6 of 8 chips, not the 6 the ticket's own citation predicted:
    - RING: Liveliness, Settings, Lanes, Personas, Memory Levels -- each has
      a real .panel-status directly under its <h2> that its own load*()
      unconditionally sets to pass/fail every refreshAll() call.
    - RING: Graph -- also included, and this is the one deliberate deviation
      from this ticket's own text. The ticket (quoting a claimed research-
      brief.md line) says Graph "carries no .panel-status line," but
      research-brief.md never actually says that anywhere (grepped the full
      481-line doc -- zero hits on graph-status or any Graph/status
      sentence); that claim is true only of the round-2 design MOCKUP's
      Graph section (verified by inspection: no .panel-status anywhere in
      it) and got mis-cited onto the real repo. This repo's real
      ui/index.html has had a genuine #graph-status <p class="panel-status">
      immediately under <h2>Graph</h2> since s-04 (graph-view), and
      loadGraph() sets it to pass/fail unconditionally on every refreshAll()
      -- structurally identical to Liveliness/Settings/Lanes. Suppressing
      that real, already-rendered status to match a stale/incorrect doc
      citation would itself have been a fabrication in the other direction,
      so Graph's chip is wired honestly from its own real element, and the
      divergence is documented in both ui/app.js's CHIP_STATUS_SOURCE
      comment and the committed test.
    - NO RING: Search -- #search-status exists but is only ever set inside
      the search-form's own submit handler (a user action); refreshAll()
      never calls it, so at refresh-completion time it's genuinely empty
      with no pass/fail class. NO RING: Operations -- has no top-level
      .panel-status at all; #reindex-status/#refresh-cache-status are two
      separate sub-form statuses, each set only by its own submit/click
      handler, never by refreshAll(). Both proven in the committed test by
      populating their real elements with a fail/pass class and confirming
      their chips still get neither class, because neither id is in
      CHIP_STATUS_SOURCE.

  IntersectionObserver scroll-spy: `if (!("IntersectionObserver" in
  window)) return;` is the literal first statement of the guarded IIFE
  (asserted verbatim in the test), and it never calls syncJumpChips() --
  core status wiring has zero dependency on scroll-spy support.

  No-JS-dependency, tested literally two ways: (1) the committed test
  strips the served <script src="/ui/app.js"> tag out of the fetched HTML
  and confirms all 8 <section class="panel..."> and all 8 plain #anchor
  chips are still present with no onclick handlers and no display:none/
  visibility:hidden rule on .panel anywhere in ui/style.css; (2) a real
  Playwright browser, live, with the app.js request genuinely routed to
  route.abort() (confirmed via `typeof window.refreshAll === "undefined"`
  that the script never ran at all) -- all 8 sections and all 8 chips
  rendered, and clicking the Memory Levels chip performed a real
  #anchor scroll-jump (scrollY 0 -> 2370, landing on "Memory Levels
  (0-4)") with zero JS executing anywhere on the page.

  Styles use only ui-01's existing --accent/--pass/--fail/--border/
  --panel-bg/--muted/--text tokens; the two ring box-shadow colors are the
  same literal rgb() decomposition of --pass/--fail already used by
  .status-pill.live/.status-pill.degraded (style.css lines 121, 133) with
  alpha added, not a new uncoordinated color (box-shadow can't take a bare
  CSS var plus a separate alpha channel).

  Tests: new test/jump-chip-nav-status-wiring.mjs (55 checks, all passing)
  -- static-assertion structure checks against a spawned src/server.mjs
  (matching test/personas-panel-shell.mjs's established no-jsdom
  convention), plus real-execution behavioral checks that extract the real
  setStatus()/syncJumpChips()/CHIP_STATUS_SOURCE source out of the on-disk
  ui/app.js via regex and run them with `new Function(...)` against a small
  fake DOM (test/persona-write-form.mjs's established technique) --
  proving initial-state correctness, live status-change propagation (pass
  -> fail and fail -> pass on the same chip), and the never-fabricate rule
  under direct pressure (populating search-status/reindex-status and
  confirming their chips still get neither class). Also re-ran
  test/personas-panel-shell.mjs, test/persona-write-form.mjs, and
  test/persona-layer-stack.mjs -- all still pass unmodified.

  npm install run (worktree's node_modules was absent). Full npm test:
  identical 3 pre-existing POST /remember failures and nothing else,
  verified genuinely pre-existing via git stash + reproduce against this
  story's own unmodified b377f48 base commit (same 3 failures, byte-for-
  byte identical assertions). npm test's own compound `&&` chain stops at
  http-api.mjs on those 3 failures before reaching
  single-layer-config.mjs/git-hooks.mjs/install-git-hooks.mjs/
  lifecycle-compliance-audit.mjs/persona-cli.mjs/vitest -- ran each of
  those six remaining pieces individually to confirm they still exit 0
  (vitest: 727/727 passing across 54 files). tsc --noEmit: clean, no
  output, exit 0. Also ran test/ui-shell.mjs manually (not part of npm
  test's script chain) and it failed with 22 checks -- confirmed this is an
  environment artifact (that test expects an already-running, fully-
  configured server on MNEMOSYNE_URL/8477 with a real swarm-memory binary
  on PATH; a bare `node src/server.mjs` without that setup 500s on
  /config and 404s on /ui independent of anything in this diff), not a
  regression -- left untouched, out of this story's contract, same
  documented judgment call ui-01's own completion note made about this
  exact test file.

description: |
  Implements horizontal-plan.md's H2 (nav portion) + H3. This is the core
  deliverable of the epic -- the real answer to "the ungodly long list."
  A sticky <nav id="jump-chips"> with one anchor per real panel (8 total:
  Liveliness, Settings, Lanes, Search, Graph, Operations, Personas, Memory
  Levels), each carrying a live status ring sourced from that panel's own
  real status text after refreshAll() completes -- never fabricated.
  Depends on ui-01 because the chip-ring colors are defined by that
  story's token work.

acceptance_criteria:
  - "Given the real standalone UI loaded in a browser, when the page finishes its initial refreshAll(), then #jump-chips contains exactly 8 real anchor links, one per panel, each scrolling to that panel's real section id on click"
  - "Given a panel that has a real .panel-status line (e.g. Liveliness, Memory Levels), when its status is pass or fail, then its corresponding chip carries a chip-pass or chip-fail class matching that real status -- verified by reading the actual rendered status text, not assumed"
  - "Given a panel with NO .panel-status line at all (Search, Graph, Operations, per research-brief.md's real current markup), when the chips render, then that panel's chip carries NEITHER chip-pass nor chip-fail -- no fabricated status, matching round-2's own verified rule for the reference mockup"
  - "Given JavaScript disabled or a script error, when the page loads, then every panel remains fully visible and every chip remains a working plain #anchor link -- no panel visibility may depend on JS (horizontal-plan.md's cross-cutting constraint)"
  - "Given the IntersectionObserver scroll-spy enhancement, when the browser doesn't support it, then the guard (if (!('IntersectionObserver' in window)) return;) prevents any error and the chip bar still functions for click-to-jump"

steps:
  - id: research
    description: >
      Read ui/app.js's real refreshAll() and setStatus() (the one already-
      proven shared primitive, ~70 call sites per research-brief.md §1).
      Read the confirmed reference mockup's nav#jump-chips markup and its
      status-propagation logic for the real pattern to translate into
      production code.
    agent: researcher
  - id: implement
    description: >
      Add the nav#jump-chips markup to ui/index.html (8 real anchors).
      Add status-propagation logic to ui/app.js's refreshAll() completion
      path: after each panel's load*() sets its real status via
      setStatus(), mirror that pass/fail state onto the matching chip.
      Add the optional, correctly-guarded IntersectionObserver scroll-spy.
      Add nav/chip styles to ui/style.css using ui-01's new tokens.
    agent: developer
    depends_on: [research]
  - id: test
    description: >
      Real subprocess/browser test proving: all 8 chips exist and link
      correctly; a panel's real status change (e.g. simulate a fail)
      propagates to its chip; a panel with no status line never gets a
      fabricated ring; disabling JS (or stripping the script tag) leaves
      every panel visible and every chip a working anchor.
    agent: tester
    depends_on: [implement]
  - id: review
    description: >
      Confirm no panel visibility is JS-load-bearing (the hard,
      cross-cutting constraint from horizontal-plan.md). Confirm chip
      status is never fabricated for panels without real status text.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

