  persona-write-form.mjs, personas-panel-shell.mjs, persona-layer-stack.mjs,
  persona-layer-stack-shell-integration.mjs): all pass, unmodified. tsc
  --noEmit: clean, zero output. Verified the 3 POST /remember failures are
  genuinely pre-existing via real stash-and-reproduce (not assumption):
  `git stash` (reverting to the unmodified ui-04 tip), re-ran
