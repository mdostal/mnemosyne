  src/planning src/config src/runners` -- 54/54 files, 727/727 tests,
  matching ui-03's and ui-04's own documented baseline exactly. Ran
  test/jump-chip-nav-status-wiring.mjs directly (the story's own primary
  regression surface): all 51 checks pass, UNMODIFIED, zero selector
