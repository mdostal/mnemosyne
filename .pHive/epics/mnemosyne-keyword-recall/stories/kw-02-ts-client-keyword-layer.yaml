id: kw-02-ts-client-keyword-layer
epic: mnemosyne-keyword-recall
title: TS client — new KeywordLayerAdapter + always-parallel cascade wiring
status: complete
note: "Built lib/mnemosyne/layers/KeywordLayerAdapter.ts mirroring VectorLayerAdapter.ts's exact execFile/SWARM_MEMORY_BIN/loud-failure pattern, calling `swarm-memory grep <query> --json` instead of `recall` -- discovered live that grep's JSON envelope is a top-level ARRAY of {scope,collection,hits}, structurally different from recall's {query,total_hits,scopes} object, so a new SwarmMemoryGrepOutput parser was required (can't reuse VectorLayerAdapter's parsing). Registered as 'keyword' in registry.ts; NOT added to DEFAULT_LAYER_STACK_CONFIG. Added 'keyword' to interfaces.ts's Layer union and a new optional Hit.also_matched field (dedupe provenance) and to server.ts's LAYERS set (per cr-04's precedent that this set must track the full Layer union). Wired client.ts's recall() cascade to collapse a configured vector+keyword pair into one 'parallel-pair' cascade step (Promise.all, positioned at whichever of the two appears first in the resolved stack, the other's slot dropped) -- a stack not configuring both produces byte-identical single-step nodes to the pre-kw-02 cascade, so non-opted consumers are provably unaffected (dedicated pluggability test asserts the keyword registry factory is never even invoked). Dedupe key mirrors kw-01's shipped hitIdentity() (src/engine.mjs, read after it landed mid-story): source+chunk_span.index, falling back to hit content when no index is reported, so two different hits merely sharing a source are never wrongly collapsed -- verified with a dedicated regression test. 24 new tests (KeywordLayerAdapter.test.ts, registry.test.ts additions, client-keyword-cascade.test.ts) all real-subprocess-against-a-fixture rigor matching VectorLayerAdapter.test.ts, plus one end-to-end test using the real adapter classes against a fake swarm-memory binary. Full suite: 431 passing, zero regressions; pre-existing unrelated better-sqlite3/CodeGraphLayerAdapter worker crash confirmed pre-existing (crashes in isolation too) and unworsened. Live-verified against the real production corpus: vector-only recall('PAN-8968') returns 4 wrong near-identical-ID hits (PAN-8609/7903/7768/7162) and misses the real PAN-8968 note entirely; vector+keyword parallel recall returns those same 4 plus the correct PAN-8968 hit via the keyword layer, both queried concurrently (~2.75s total vs ~4.2s sequential sum)."
complexity: medium
methodology: tdd
depends_on: []

description: |
  TS-side parity for kw-01's fix. Read `lib/mnemosyne/layers/VectorLayerAdapter.ts` in full
  first: it already shells out to `swarm-memory recall <query> --json` via `execFile` (a
  well-established, already-proven pattern in this codebase). Build a new
  `KeywordLayerAdapter.ts` mirroring that EXACT pattern (same command resolution via
  `SWARM_MEMORY_BIN`/`swarm-memory` default, same error-handling shape, same loud-failure
  conventions) but calling `swarm-memory grep <query> --json` instead of `recall`.

  Do NOT confuse this with `FileLayerAdapter.ts` -- that is LOCAL-filesystem-only grep (reads
  files under a configured root directory on disk), a genuinely different, much narrower
  mechanism than `swarm-memory grep`, which searches the full remote Qdrant-indexed corpus the
  same way `VectorLayerAdapter` does. `KeywordLayerAdapter` is a new, third thing -- not a
  variant of either existing adapter.

  Register the new adapter in `lib/mnemosyne/layers/registry.ts` under the name `"keyword"`.

  Cascade wiring in `lib/mnemosyne/client.ts`: per kw-01's design (read that story's shipped
  implementation once available for the exact merge/dedupe approach, keep both implementations
  behaviorally consistent) -- run `keyword` ALONGSIDE `vector` for every `recall()` call (not as
  a zero-hit escalation), merge results, dedupe exact source+chunk matches found both ways, keep
  the DEFAULT_LAYER_STACK_CONFIG resolution and existing single-layer-config pluggability
  completely intact: a consumer who does NOT include `"keyword"` in their `MNEMOSYNE_LAYERS`
  config must be entirely unaffected (this epic does not add `keyword` to the default stack --
  that is an explicit, separate future decision once this ships and gets real dogfooding
  evidence, matching how `graphify` itself was proven via A/B benchmark before being promoted to
  default in a later cycle this session, not the same cycle it was built in).

  CRITICAL CONSTRAINT (carried through every story this session): Mnemosyne stays a customizable
  layer tool. This story adds an available, opt-in layer -- it must not change behavior for any
  consumer not explicitly configuring `"keyword"`.

acceptance_criteria:
  - "Given MNEMOSYNE_LAYERS includes both 'vector' and 'keyword', when recall() is called with a real ticket-ID-shaped query, then the correct exact-match hit is present in the merged result even if vector alone would miss it -- verified against real swarm-memory grep output, not mocked"
  - "Given MNEMOSYNE_LAYERS does NOT include 'keyword', when recall() is called, then the keyword layer is never constructed or queried at all -- zero effect, matching this epic's pluggability constraint"
  - "Given the exact same source+chunk is found by both vector and keyword, when results are merged, then it appears once, not duplicated"
  - "Given swarm-memory is not on PATH, when a consumer explicitly configures 'keyword', then KeywordLayerAdapter fails loudly and actionably at the appropriate point, matching VectorLayerAdapter's existing loud-failure conventions -- never a silent empty result"

steps:
  - id: research
    description: Read VectorLayerAdapter.ts and FileLayerAdapter.ts in full, and client.ts's current cascade logic, before writing anything. Also check kw-01's shipped merge/dedupe approach (if landed by the time this story starts) to keep both implementations consistent.
    agent: researcher
  - id: test-spec
    description: Write failing tests for KeywordLayerAdapter (mirroring VectorLayerAdapter.test.ts's real-subprocess-against-swarm-memory rigor) and for the always-parallel cascade merge/dedupe in client.ts, plus a pluggability test confirming zero effect when 'keyword' is not configured.
    agent: tester
    depends_on: [research]
  - id: implement
    description: Implement lib/mnemosyne/layers/KeywordLayerAdapter.ts, register it in registry.ts, wire the always-parallel merge into client.ts's cascade.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Confirm the real ticket-ID case resolves correctly, confirm zero effect on unconfigured/non-keyword consumers, confirm loud failure on a missing swarm-memory binary.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feat/mnemosyne-keyword-recall (based on dev).
    agent: developer
    depends_on: [review]

