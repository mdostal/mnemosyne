    - path: lib/mnemosyne/layers/FileLayerAdapter.ts
      purpose: "NOT the pattern to follow -- local-filesystem-only, a different mechanism, do not confuse the two"
    - path: lib/mnemosyne/client.ts
      purpose: "Where the always-parallel cascade merge gets wired in"
    - path: docs/qdrant-hybrid-retrieval-experiment.md
      purpose: "The real experiment + recommendation this story implements"

files_to_modify:
  - file: lib/mnemosyne/layers/KeywordLayerAdapter.ts
    change: "New: shells out to swarm-memory grep --json, mirrors VectorLayerAdapter's pattern"
  - file: lib/mnemosyne/layers/registry.ts
    change: "Register 'keyword' as a new builtin layer name"
  - file: lib/mnemosyne/client.ts
    change: "Always-parallel keyword+vector cascade with merge/dedupe, only when both are configured"

risks:
  - severity: low
    description: "Diverging from kw-01's JS-side merge/dedupe semantics would leave the two implementations behaviorally inconsistent, undermining the 'two parallel implementations, kept in sync' convention this repo already documents"
    mitigation: "Explicitly read kw-01's shipped code before finalizing this story's merge logic, even though the two are dispatched to run concurrently -- reconcile any drift during this story's own review step, not left for a later story"
