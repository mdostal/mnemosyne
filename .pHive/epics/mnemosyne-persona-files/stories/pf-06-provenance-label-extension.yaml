note_on_completion: >
  Merged 2026-08-17 (commit 52eecf5). Independently verified: read the full
  ui/app.js diff -- confirmed isAgentProposedDraft() itself is untouched,
  the new draftProvenanceLabel() sibling function layers proposedBy on top
  of its existing "real sourceSummary" signal, and the third state's DOM
  branch is a genuinely additive else-if, never modifying the original
  if (agentProposed) branch body. Reran test/persona-draft-review-approve-
  ui.mjs myself in both the builder's worktree and the merged integration
  worktree (75/75 both times), specifically confirming the literal-string
  checks for the two pre-existing states ("Manually created" ternary
  branch, "Why the agent proposed this" heading) still appear exactly once,
  unmodified. Investigated a transient ECONNREFUSED failure the builder
  flagged in persona-write-form.mjs (port 31417) -- reran it myself twice,
  both times 100% clean with zero failures, confirming it was flake/timing
  noise, not a real issue (consistent with other transient port-contention
  flakes already documented earlier this session). tsc --noEmit clean both
  times. All acceptance criteria met.

description: |
  Resolves design-discussion.md OQ3: once pf-05 ships, a human-typed draft
  can carry a real sourceSummary for the first time (from attached files),
  which isAgentProposedDraft()'s current binary check (sourceSummary present
  => label "agent-proposed") would mislabel -- a human who attached files is
  not an agent. This story adds a third, honest label state without
  weakening the existing two.

acceptance_criteria:
  - "Given a draft with NO sourceSummary, when rendered, then it shows 'Manually created' -- unchanged from pu-12's existing behavior"
  - "Given a draft with a real sourceSummary AND proposedBy === 'agent', when rendered, then it shows 'Agent-proposed' -- unchanged from pu-12's existing behavior"
  - "Given a draft with a real sourceSummary but proposedBy is absent or not 'agent' (a human attached files via pf-05), when rendered, then it shows a distinct label -- 'Includes attached source material' -- never mislabeled as agent-proposed, never silently falling back to the no-sourceSummary label either"
  - "Given the existing persona-draft-review-approve-ui.mjs test file's own isAgentProposedDraft()-related assertions, when this story ships, then they still pass unmodified for the two pre-existing cases -- this is a genuinely additive third branch, not a rewrite of the existing two"

