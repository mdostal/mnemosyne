description: |
  Closes vertical-plan.md Slice 2 with a real, continuous end-to-end proof:
  a real HTTP POST simulating pf-05's UI file-attachment path (real
  subprocess-spawned server, real request body carrying capped file content)
  -> GET /persona/draft shows the draft labeled per pf-06's third state ->
  approve -> real filesystem commit proof. No mocked transport boundary.

acceptance_criteria:
  - "Given a real HTTP POST to POST /persona/draft/:tier/:scopeId carrying a sourceSummary shaped like pf-05's file-attachment path would produce (real capped content, no proposedBy: 'agent'), when GET /persona/draft/:tier/:scopeId is checked, then the draft's shape is exactly what pf-06's third label state keys on"
  - "Given that draft, when approved via the real approve route, then a direct filesystem read confirms the real persona store has the committed content matching the attached-file-derived sourceSummary's real text"
  - "Given the full test suite for this slice (pf-04's parity test, pf-05's UI tests, pf-06's label tests, this story's own e2e test) run together with the epic's full suite from Slice 1 and the inherited mnemosyne-persona-ux suite, then all pass -- zero regressions"

