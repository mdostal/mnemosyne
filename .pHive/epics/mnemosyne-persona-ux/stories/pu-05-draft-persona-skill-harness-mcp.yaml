design_decisions:
  - decision: "skill-harness subprocess-execs the CLI; MCP imports the skill-harness action function directly -- strictly sequential, mirroring the wizard epic's H4 chain exactly, not a parallel 3-transport build."
    rationale: "vertical-plan.md Decision 3, reproduced identically here: the same real import-graph constraint that made the wizard epic's write primitive CLI-first applies again -- there is no code path by which the MCP draft tool could exist before the skill-harness draft action exists, which cannot exist before pu-04's CLI verb exists."

