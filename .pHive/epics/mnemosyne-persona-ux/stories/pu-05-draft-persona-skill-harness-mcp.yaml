    description: "Low novelty, low complexity -- the main risk is mechanical drift from the established pattern (e.g. forgetting the SKILL.md table update, which is easy to skip since it's documentation, not code)."
    mitigation: "The SKILL.md table update is a named acceptance criterion, not left implicit -- matches this repo's own established discipline of keeping the action table and the code in lockstep."

