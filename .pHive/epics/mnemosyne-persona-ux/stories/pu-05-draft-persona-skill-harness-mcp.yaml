id: pu-05-draft-persona-skill-harness-mcp
epic: mnemosyne-persona-ux
title: Draft persona skill-harness action + MCP tool wraps
status: planned
complexity: low
methodology: tdd
depends_on: [pu-04-draft-persona-cli]

description: |
  Implements horizontal-plan.md H4's remaining two transport components,
  mirroring the wizard epic's own strictly-sequential CLI -> skill-harness ->
  MCP chain exactly (vertical-plan.md Decision 3): skill-harness subprocess-
  execs pu-04's CLI (no new logic), MCP imports the skill-harness action
  function directly (no new logic). Closes out transport parity for the
  draft mechanism, matching the real write primitive's own 3-transport-plus-
  HTTP parity bar the wizard epic already established.

acceptance_criteria:
  - "Given bin/mnemosyne-skill-helper.mjs, when personaDraftProposeAction/personaDraftShowAction/personaDraftApproveAction/personaDraftDiscardAction are called, then each subprocess-shells to pu-04's `mnemosyne persona draft <verb>` CLI via the existing personaCliRun() helper -- no independent import of persona-draft-store.ts or the real write functions"
  - "Given bin/mnemosyne-mcp.mjs, when persona_draft_propose/persona_draft_show/persona_draft_approve/persona_draft_discard tools are invoked, then each imports and wraps the corresponding skill-harness action function directly via wrapAction(), the same registration shape the existing persona_create tool already uses"
  - "Given a rejected draft-approve (invalid candidate) at either transport, when the action/tool is invoked, then it surfaces a clear non-zero-exit (skill-harness) or isError:true (MCP) result -- never a silent no-op, matching the exact bar horizontal-plan.md H4 already states for the real write primitive"
  - "Given skills/mnemosyne-standalone/SKILL.md's existing action table, when this ticket ships, then it gains new rows for persona-draft-propose/show/approve/discard, following the exact same table shape every other row already uses"

steps:
  - id: research
    description: >
      Read bin/mnemosyne-skill-helper.mjs's existing personaSyncAction/
      personaSeedAction/personaShowAction/personaCreateAction (and
      personaCliRun()) in full, and bin/mnemosyne-mcp.mjs's existing
      persona_sync/persona_seed/persona_show/persona_create tool
      registrations (wrapAction(), server.registerTool()) in full, as the
      exact shape this ticket's 4 new action/tool pairs reproduce.
    agent: researcher
  - id: test-spec
    description: >
      Extend test/mcp-server-persona.mjs's existing real-StdioClientTransport,
      real-spawned-subprocess convention with the 4 new MCP tools. New
      subprocess test for the skill-harness actions (no existing coverage --
      test/skill-harness.mjs explicitly excludes persona actions today, same
      gap the wizard epic's H5 already documented for the real create verb),
      following persona-cli.mjs/mcp-server-persona.mjs's real-subprocess,
      fake-$HOME convention.
    agent: tester
    depends_on: [research]
  - id: implement
    description: >
      Add personaDraftProposeAction/personaDraftShowAction/
      personaDraftApproveAction/personaDraftDiscardAction to
      bin/mnemosyne-skill-helper.mjs's SIMPLE_ACTIONS, each subprocess-
      shelling to pu-04's CLI via personaCliRun(). Add
      persona_draft_propose/show/approve/discard tools to bin/
      mnemosyne-mcp.mjs, each wrapping the corresponding skill-harness
      action via wrapAction(). Add the 4 new rows to skills/
      mnemosyne-standalone/SKILL.md's action table.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: >
      Confirm zero new logic in either file beyond dispatch/wrapping -- grep
      for any import of persona-draft-store.ts or lib/mnemosyne/layer1/
      persona-store-*.ts in either bin/mnemosyne-skill-helper.mjs or
      bin/mnemosyne-mcp.mjs; there should be none (both stay pure
      pass-throughs, per the wizard epic's own H4 chain).
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

