note_on_completion: >
  Merged 2026-08-16 (commit 0fe3a67). Independently verified: read
  selection.md and synthesized/option-2.md in full, cross-checked the
  shipped shell's structure against it (single grouped/filterable list, no
  tabs; group-by radiogroup reusing the .mode-toggle idiom; native <select>
  status filter; Repo-grouping keeps the 3 global tiers as labeled
  sub-groups per the "deciding factor" fix named in selection.md; glossary
  <details> block; parentRefs upgraded to an interactive-but-still-
  pointer-only focus jump with filter self-heal + aria-live announcement).
  Confirmed the deliberate scope boundary (no draft-review accordion/
  approve/discard/batch-approve here) is legitimate, not a shortfall --
  cross-checked directly against this ticket's own acceptance criteria
  (view-layer only, GET /persona/draft explicitly out of scope) and
  horizontal-plan.md H7's component split, which assigns that surface to
  pu-12. Read the full ui/app.js diff -- confirmed loadPersonas()'s fetch
  logic is byte-for-byte unchanged (same fetch calls, same
  personaServiceOrigin() pattern), only its final render loop was replaced
  with a call to the new renderPersonas(), which itself makes zero fetch
  calls. Confirmed the one modified pre-existing test assertion
  (persona-write-form.mjs) is an honest, well-justified update, not a
  weakened guard. Confirmed via merge-base check this worktree's base was
  STALE (missing pu-09's merge) -- resolved by merging via commit hash into
  the up-to-date integration worktree, not a branch-name merge. Reran the
  full UI test suite myself in both the builder's worktree and the merged
  integration worktree (personas-panel-shell.mjs: 47/47, persona-write-
  form.mjs, persona-layer-stack.mjs, ui-shell.mjs: all passing), tsc
  --noEmit (clean both times), and vitest lib/mnemosyne/layer1 (246/246) in
  the merged tree as a broader regression check. Did not independently
  reproduce the builder's own Playwright keyboard-walk, but the static
  assertion suite's non-disabled/real-button/no-href=#/tabindex checks
  substantiate the same keyboard-reachability claims from a different
  angle. All acceptance criteria met.

description: |
  Implements horizontal-plan.md H7's shell component: the actual "heavy
  UI/UX lift" the operator asked for -- replaces the current single flat
  table + single flat 7-field form (research-brief.md §1) with the new
  structural shell described in whichever of pu-01's 3 synthesized options
  was selected (.pHive/design/mnemosyne-persona-ux/synthesized/, selection.md).
  This ticket is a pure view-layer rebuild: it still reads the same, unchanged
  GET /persona / GET /persona/:tier/:scopeId routes underneath -- no data-
  model or backend change happens in this ticket.

acceptance_criteria:
  - "Given pu-01's selection.md names one of the 3 synthesized options as chosen, when this ticket's implementation is reviewed, then its layout, navigation, and structural decisions match that option's documented brief -- not a different option, not an ad-hoc reinterpretation"
  - "Given the new shell, when the Personas panel loads, then it still calls loadPersonas() (pw-03's existing function, reused not rebuilt) against the same GET /persona routes -- confirmed by grep that no new persona-fetching function duplicates its role"
  - "Given the new shell, when it is wired into refreshAll(), then it participates in the existing manual-refresh-only convention (no auto-polling introduced) exactly as every other panel already does"
  - "Given the redesigned shell, when compared against the existing 6 other panels (Liveliness, Settings, Lanes, Search, Graph, Operations), then it uses the same underlying CSS custom-property/table/monospace conventions (ui/style.css) -- consistent with lens 6 (existing-shell design-language consistency) from pu-01's review panel, not a visually foreign island"
  - "Given a screen reader or keyboard-only navigation path through the new shell, when exercised, then every interactive element (any new navigation/filter/grouping control this ticket introduces) is reachable and operable without a mouse -- lens 3 (accessibility) from pu-01's review panel, checked directly, not assumed from the design brief alone"

steps:
  - id: research
    description: >
      Read pu-01's chosen synthesized option in full
      (.pHive/design/mnemosyne-persona-ux/synthesized/option-N.md per
      selection.md) plus its own citations back to the 7 lens critiques.
      Read ui/index.html's current Personas panel markup and ui/app.js's
      loadPersonas()/personaCell/parentRefsText in full as the exact
      current-state code this ticket rebuilds the VIEW layer of, while
      reusing its data-fetching logic unchanged. Read ui/style.css for the
      existing CSS custom-property/table conventions every other panel uses.
    agent: researcher
  - id: test-spec
    description: >
      Write failing tests (DOM-structure assertions, following whatever test
      convention this repo already uses for ui/app.js's existing functions --
      confirm and reuse that convention rather than inventing a new UI test
      harness) for: the new shell renders correctly against a populated
      GET /persona response and an empty one; loadPersonas() is called, not
      duplicated; the shell is wired into refreshAll(); new interactive
      elements are keyboard-reachable.
    agent: tester
    depends_on: [research]
  - id: implement
    description: >
      Rebuild ui/index.html's #personas section markup and the corresponding
      rendering logic in ui/app.js per pu-01's chosen option -- reusing
      loadPersonas()'s existing fetch/data logic, changing only how the
      result is rendered/organized (e.g. new navigation, filtering, grouping,
      or list+detail structure, per whatever the chosen option specifies).
      Reuse ui/style.css's existing custom properties; extend, don't replace,
      unless the chosen option explicitly calls for new tokens.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: >
      Confirm, side-by-side, that the shipped shell matches pu-01's chosen
      option's documented layout/interaction decisions -- not a superficial
      resemblance. Confirm loadPersonas() is reused, not duplicated. Confirm
      no new fetch call was introduced that bypasses the existing
      personaServiceOrigin()/CORS-aware pattern ui/app.js already establishes.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

