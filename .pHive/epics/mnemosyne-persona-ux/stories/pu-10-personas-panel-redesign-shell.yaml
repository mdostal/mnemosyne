design_decisions:
  - decision: "This ticket's structural/layout decisions are dictated by pu-01's selection.md, not re-derived or reinterpreted during implementation."
    rationale: "design-discussion.md §5 risk table: 'The multi-swarm design pass (pu-01) is treated as decorative and the UI tickets get built against ad-hoc judgment instead of its actual synthesized output' is an explicitly named risk this ticket's own acceptance criteria directly guards against."
  - decision: "loadPersonas() and the existing GET /persona routes are reused completely unchanged -- this ticket is view-layer only."
    rationale: "horizontal-plan.md H7 component 1: 'still reading the same GET /persona/... routes underneath (no data-model change at this layer, pure view rebuild)' -- keeps this large, high-complexity ticket scoped to what it actually needs to touch, not entangled with pu-02 through pu-06's backend work."

cross_cutting: []

risks:
  - severity: medium
    description: "This is the epic's single highest-complexity UI story -- real risk of scope creep beyond what pu-01's chosen option actually specifies, especially given how much surrounding context (draft review, layer-stack, 7 lens critiques) is available to second-guess the chosen design against."
    mitigation: "Acceptance criteria explicitly require matching the CHOSEN option's documented brief, not synthesizing a fourth option during implementation -- the review step is a named, explicit side-by-side comparison gate, not a general code-quality pass."
  - severity: low
    description: "A rebuilt shell could accidentally regress the existing pointer-only parentRefs rendering guarantee (never fetching/inlining a parent's real content) if the new rendering logic isn't carefully ported from the existing parentRefsText() function."
    mitigation: "parentRefsText()'s existing pointer-only logic (ui/app.js) is explicitly named in the research step as code to port forward, not rewrite from scratch."

