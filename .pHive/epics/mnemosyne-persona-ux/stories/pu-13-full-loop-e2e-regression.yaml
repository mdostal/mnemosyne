design_decisions:
  - decision: "This ticket proves the operator-resolved remember()-timing decision (fires on approval, never on draft creation) end-to-end, rather than deciding it -- the decision itself is now settled at the planning level (design-discussion.md §9 judgment call #9), wired into pu-03/pu-04."
    rationale: >
      Originally OQ3, deferred through planning for lack of visibility into
      the right call; resolved directly by the operator before execution
      began. This ticket's remaining job is the same 'prove it holds
      end-to-end, not just in isolated unit tests' bar every other assertion
      here already holds to.

