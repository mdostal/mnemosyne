    description: "This ticket has 3 upstream dependencies spanning both of the epic's two independent tracks (backend/skill: pu-06, pu-09; UI: pu-12) -- it cannot start until both tracks converge, making it a real scheduling bottleneck if either track slips."
    mitigation: "Named explicitly in horizontal-plan.md's Capability Dependencies diagram as the epic's true convergence point -- an execution pass should plan staffing with this bottleneck in mind, not discover it mid-epic."

