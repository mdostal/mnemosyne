design_decisions:
  - decision: "This ticket depends only on pu-12 (the last UI story), not on pu-13 (the e2e functional proof) -- the two checks are independent axes and can run in parallel."
    rationale: "horizontal-plan.md H8: 'functional correctness (5a) and design fidelity (this) are independent axes -- this only needs Slice 4's build-out to exist, not Slice 5a's own proof, so it can run in parallel rather than being needlessly serialized behind it.'"

cross_cutting: []

risks:
  - severity: low
    description: "A design-fidelity review this late in the epic could surface a deviation serious enough to need real rework, arriving after most of the epic's budget is already spent."
    mitigation: "Explicitly out of scope to prevent by moving this ticket earlier -- the wizard epic's own precedent (and every prior epic in this line of work) closes with a verification pass AFTER the build, not before; a deviation found here is real signal, not a planning failure, and the FLAGGED disposition exists specifically to carry it forward as a concrete follow-up rather than silently absorbing it."

