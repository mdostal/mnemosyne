title: Draft cross-transport round-trip + concurrency + leak-proof tests
status: complete
complexity: medium
methodology: tdd
depends_on: [pu-03-draft-persona-routes, pu-05-draft-persona-skill-harness-mcp]

note_on_completion: >
  Merged 2026-08-16 (commit 16e4a92). Independently verified: grepped the
  new test file for jest.mock/vi.mock/sinon/stub( and for any import of
  writeDraftPersona/writeGlobalPersona/writeRepoLocalPersona/
  disposeDraftPersona/readDraftPersona -- none found; the only production
  import is getPersonaContent (a pure read, used once for the leak-proof
  test's third read path), exactly as specified. Reran the full new test
  file myself (npx tsx test/persona-draft-cross-transport.mjs) in both the
  builder's worktree and the merged integration worktree -- 66/66 passing
  both times, including the (propose-transport x approve-transport) parity
  matrix, both concurrency scenarios (external-lock-block and organic
  Promise.all race, confirmed genuinely concurrent via real timing/output
  evidence in the run, not just claimed), and both leak-proof cases
  (discard -> not reachable via any of 3 real-store read paths; approve ->
  reachable via all 3, with no cross-contamination between a discarded and
  a later-approved draft sharing the same identity). tsc --noEmit clean
  both times. Confirmed via merge-base check the builder's worktree base
  was STALE (missing pu-09/pu-10) -- resolved by merging via commit hash
  into the up-to-date integration worktree. Note: the builder's first
  dispatch stalled with zero committed progress (misread a backgrounded
  test run as an external wait condition) and needed a resume nudge before
  completing the real work documented above -- a dispatch-pattern issue,
  not a defect in the delivered work itself. All acceptance criteria met.

description: |
  Implements horizontal-plan.md H5: the genuinely new proof none of pu-02
  through pu-05's own per-component tests individually provide -- that every
  transport (CLI, skill-harness, MCP, HTTP) funnels through the SAME
  underlying persona-draft-store.ts / writeGlobalPersona / writeRepoLocalPersona
  functions (the epic's own explicit "no second write path" risk), that
  concurrent drafts don't race unsafely, and that a discarded/never-approved
  draft never becomes reachable through any real-store read path -- the
  concrete verification of this epic's core leak-prevention guarantee.

acceptance_criteria:
  - "Given every meaningful (propose-transport, approve-transport) pair among {CLI, skill-harness, MCP, HTTP}, when a draft is proposed via transport A and approved via transport B, then the committed file is byte-for-byte identical (modulo timestamps) regardless of which pair was used"
  - "Given two different transports racing a propose against the SAME {tier, scopeId} draft identity, when both complete, then exactly one active draft exists afterward (the last writer wins cleanly, per withLock's existing file-scoped advisory semantics) -- never a corrupted/partially-written file, never two active drafts for one identity"
  - "Given a draft that is discarded (never approved), when GET /persona (real store list), `mnemosyne persona show` (real store CLI), and getPersonaContent (in-process, via a direct unit call) are each checked, then all three report the discarded draft's {tier, scopeId} as NOT present -- proving the structural leak-prevention guarantee, not just asserting it"
  - "Given a draft that IS approved, when the same three read paths above are checked immediately afterward, then all three now correctly report the newly-committed persona as present -- proving the approve path's commit is genuinely visible through the real store's existing read surfaces, not just returned in the approve response"

steps:
  - id: research
    description: >
      Read the wizard epic's test/persona-cross-transport.mjs in full as the
      exact real-subprocess, fake-$HOME, multi-transport-pairing convention
      this ticket extends for the draft mechanism. Read test/http-api.mjs's
      existing subprocess-spawn convention for the HTTP leg. Confirm
      getPersonaContent's exact fallback/read behavior (persona.ts) as the
      precise thing the leak-proof test's third read path checks.
    agent: researcher
  - id: test-spec
    description: >
      Enumerate every meaningful (propose-transport, approve-transport) pair
      (CLI/skill-harness/MCP/HTTP x CLI/skill-harness/MCP/HTTP, deduplicated
      where symmetric) as explicit test cases. Write the concurrency test
      (two transports racing a propose for the same identity, via real
      concurrent subprocess spawns, not simulated). Write the leak-proof test
      (discard, then check all 3 real-store read paths; approve, then check
      the same 3 paths report success).
    agent: tester
    depends_on: [research]
  - id: implement
    description: >
      Write test/persona-draft-cross-transport.mjs implementing all of the
      above against real subprocess-spawned servers/CLI invocations -- no
      mocked transport boundary anywhere in this file, matching the rigor
      test/persona-cross-transport.mjs already established for the real
      write primitive.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: >
      Confirm every test case in this file exercises a REAL subprocess or
      real HTTP call (grep for any stub/mock of persona-draft-store.ts or the
      real write functions -- there should be none). Confirm the concurrency
      test is a genuine race (both writers dispatched before either
      completes), not an accidentally-sequential pair of awaits that never
      actually contends.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: >
      Commit and push to feature branch. Run the full extended test suite
      (persona-draft-store.test.ts, http-api.mjs, persona-cli.mjs,
      mcp-server-persona.mjs, skill-harness-persona-draft.mjs, and this
      file) together and confirm no regressions against the wizard/
      foundation epics' own already-passing suites.
    agent: developer
    depends_on: [review]

