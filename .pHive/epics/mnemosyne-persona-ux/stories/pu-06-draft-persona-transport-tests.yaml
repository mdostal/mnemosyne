    change: "New file. Cross-transport round-trip matrix, concurrency test, and leak-proof test for the draft mechanism."

design_decisions:
  - decision: "The leak-proof test checks all 3 real-store read paths (GET /persona, `persona show` CLI, and a direct in-process getPersonaContent call), not just one."
    rationale: "design-discussion.md's risk table names this as a genuinely load-bearing risk ('a draft leaks into a live-render path... because the draft store lives too close to the real one') -- a single read-path check would leave the other two silently unverified, exactly the kind of gap this epic's own rigor bar (matching the wizard epic's own H5) exists to close."

cross_cutting: []

risks:
  - severity: medium
    description: "A full (propose-transport x approve-transport) matrix across 4 transports is a real combinatorial test-writing and -running cost -- risk of the suite becoming slow or brittle if not scoped carefully."
    mitigation: "Deduplicate symmetric pairs where the underlying code path is provably identical (e.g. CLI-propose-then-CLI-approve is the same code path regardless of which specific {tier, scopeId} is used) rather than testing every possible combination exhaustively -- acceptance criteria require 'every meaningful pair,' not literally every permutation."

