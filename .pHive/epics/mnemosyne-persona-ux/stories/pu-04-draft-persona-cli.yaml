files_to_modify:
  - file: bin/mnemosyne-persona.mjs
    change: "New `draft propose|show|approve|discard` subcommands added to the existing run() dispatcher."
  - file: test/persona-cli.mjs
    change: "New AC-draft-* assertions extending the existing real-subprocess-spawn convention."

design_decisions:
  - decision: "`draft propose` (not `draft create`) as the verb naming, distinct from the real store's `create` verb."
    rationale: "vertical-plan.md's Resolved Ambiguities #1: makes the semantic difference between 'write a real persona' and 'suggest one for review' unambiguous at every transport, consistent across CLI/skill-harness/MCP/HTTP."
  - decision: "`draft show`'s output is explicitly, visibly labeled as a draft, never rendered in a form indistinguishable from the real `persona show`."
    rationale: "design-discussion.md §4 lens 4 (agent-provenance/trust-calibration): a human (or another agent) inspecting CLI output must never mistake in-review content for committed, governing persona content, at any transport, not just in the browser UI."

cross_cutting: []

risks:
  - severity: medium
    description: "`draft approve`'s CLI implementation and pu-03's HTTP approve route could quietly diverge over time (e.g. one strips draft-only metadata slightly differently than the other) since they are two independent call sites into the same underlying functions."
    mitigation: "pu-06's cross-transport tests explicitly prove CLI-approve and HTTP-approve produce byte-for-byte identical committed output for the same input draft -- this ticket's own review step is a first check, pu-06 is the real, independent proof."

