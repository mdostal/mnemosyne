id: pu-04-draft-persona-cli
epic: mnemosyne-persona-ux
title: "CLI: mnemosyne persona draft propose|show|approve|discard"
status: planned
complexity: medium
methodology: tdd
depends_on: [pu-02-draft-persona-store]

description: |
  Implements horizontal-plan.md H4's CLI component: the canonical
  implementation layer for the draft mechanism, mirroring the wizard epic's
  own Decision 2 (CLI-first, nothing downstream can be built before it).
  This is the concrete surface the agent-assisted interview flow (pu-08)
  proposes drafts through -- the same reasoning the interview skill's
  SKILL.md already documents for why the CLI is its default write surface (a
  live agent session always has shell-out, may not have an open MCP
  connection) applies identically here.

acceptance_criteria:
  - "Given a persona-shaped YAML file, when `mnemosyne persona draft propose --file <path> [--repo <repo>]` is run, then pu-02's writeDraftPersona is called and the CLI prints the written draft's path on stdout, in a format a caller can parse (mirroring `create`'s own `created ... -> <path>` convention)"
  - "Given an active draft exists at {tier, scopeId}, when `mnemosyne persona draft show <tier> <scope-id> [--repo <repo>]` is run, then it prints that draft's content, including its sourceSummary/proposedBy/proposedAt metadata if present, distinctly labeled as a DRAFT (never rendered indistinguishably from `persona show`'s real-store output)"
  - "Given an active draft, when `mnemosyne persona draft approve <tier> <scope-id> [--repo <repo>]` is run, then it produces the same outcome pu-03's POST .../approve route produces (real commit via the unchanged write primitive, draft archived) -- verified by a direct filesystem read of both the committed file and the archived draft location, not just exit code 0"
  - "Given an active draft, when `mnemosyne persona draft discard <tier> <scope-id> [--repo <repo>]` is run, then the draft is archived to the discarded/ subtree (never deleted) and `persona draft show` for the same identity afterward reports no active draft"
  - "Given a candidate that fails structural sanity (bad tier) at propose time, or fails assertValidPersona at approve time, when the relevant subcommand is run, then it exits non-zero with a clear stderr message -- never a silent no-op or exit 0"
  - "Given an active draft with a real sourceSummary, when `mnemosyne persona draft approve` succeeds, then it fires the identical remember() call pu-03's HTTP approve route fires for the same input (same resolveRememberScope() scope/tag, same source text) -- proven by pu-06's cross-transport parity tests, not just asserted here. Given a draft with no sourceSummary, no remember() call fires (operator-resolved, design-discussion.md §9 judgment call #9)."

steps:
  - id: research
    description: >
      Read bin/mnemosyne-persona.mjs in full: the existing run() dispatcher
      shape, how `create`/`sync`/`seed`/`show`/`resolve-remember-scope`
      subcommands parse args and import lib/mnemosyne/layer1/*.ts directly
      (tsx-launched, per that file's own doc comment on why a plain-node
      process couldn't do this). This ticket's new `draft` subcommand group
      follows the identical import/dispatch shape, not a new one.
    agent: researcher
  - id: test-spec
    description: >
      Extend test/persona-cli.mjs's existing AC-tagged, real-subprocess-spawn
      convention with a new AC-draft-propose/AC-draft-show/AC-draft-approve/
      AC-draft-discard set: successful propose+show round-trip (global and
      repo-local); approve producing the identical committed file `create`
      would have produced for the same candidate (fs read, not exit-code-only);
      approve-failure-leaves-draft-active; discard-then-show-reports-none;
      non-zero exit + stderr message on structural/validation rejection.
    agent: tester
    depends_on: [research]
  - id: implement
    description: >
      Add `draft propose|show|approve|discard` subcommands to
      bin/mnemosyne-persona.mjs's run() dispatcher, importing pu-02's
      persona-draft-store.ts directly for propose/show/discard, and (for
      approve) importing writeGlobalPersona/writeRepoLocalPersona directly --
      the same functions `create` already imports, never a re-derived write
      path.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: >
      Confirm `draft approve`'s implementation is not a second copy of
      pu-03's route logic with independent drift risk -- both call the exact
      same lib/mnemosyne/layer1 functions (persona-draft-store.ts's
      disposeDraftPersona, and writeGlobalPersona/writeRepoLocalPersona), just
      from two different transport entry points. Confirm every subcommand's
      output is clearly labeled DRAFT where relevant, distinguishable from
      the real `persona show`'s output at a glance.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

