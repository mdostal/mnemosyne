    - path: lib/mnemosyne/layer1/persona-draft-store.ts
      purpose: "pu-02's store functions this ticket's routes wrap directly -- writeDraftPersona/readDraftPersona/listDraftPersonas/disposeDraftPersona."
    - path: lib/mnemosyne/layer1/persona-store-global.ts
      purpose: "writeGlobalPersona -- the real, unchanged write function the approve route calls for global tiers, exactly as POST /persona/:tier/:scopeId already does."
    - path: lib/mnemosyne/layer1/persona-store-repo-local.ts
      purpose: "writeRepoLocalPersona -- the real, unchanged write function the approve route calls for code-architect, exactly as POST /persona/:tier/:scopeId already does."

files_to_modify:
  - file: lib/mnemosyne/server.ts
    change: "New route branches: GET /persona/draft, GET /persona/draft/:tier/:scopeId, POST /persona/draft/:tier/:scopeId, POST /persona/draft/:tier/:scopeId/approve, DELETE /persona/draft/:tier/:scopeId -- checked before the existing generic /persona/:tier/:scopeId handlers."
  - file: test/http-api.mjs
    change: "New AC-tagged assertions for every new route, extending the existing real-subprocess-spawn convention."

design_decisions:
  - decision: "New draft-route branches are checked BEFORE the existing generic GET/POST /persona/:tier/:scopeId handlers in source order, not relied on to be harmlessly rejected by those handlers' own segment-count guard."
    rationale: "design-discussion.md §9 judgment call #7: a 3-segment /persona/draft/:tier/:scopeId path happens to fail the existing handlers' segments.length !== 2 check today, but that is an implicit side effect, not a real guarantee -- explicit dispatch ordering is the actual guarantee this ticket relies on."
  - decision: "Approve strips draft-only metadata (proposedBy/proposedAt/sourceSummary) and calls writeGlobalPersona/writeRepoLocalPersona completely unchanged -- no re-implemented validation at the route layer."
    rationale: "The epic's own explicit 'no second write path' guardrail (design-discussion.md §5 risk table, horizontal-plan.md Cross-Cutting Concerns) -- assertValidPersona must remain the single real enforcement point, exercised for the first time only at this moment, never re-derived."
  - decision: "CORS reuses applyPersonaCors and the existing OPTIONS handler completely unchanged -- confirmed structurally sufficient, not re-implemented."
    rationale: "research-brief.md §4 and horizontal-plan.md Cross-Cutting Concerns: the wizard epic already paid the real cost of discovering and fixing a genuine preflight gap (pw-17's note-on-completion) -- this epic must not reopen or duplicate that already-solved problem."

cross_cutting: []

risks:
  - severity: high
    description: "A future, unrelated change to the existing generic /persona/:tier/:scopeId handlers' segment-count guard (e.g. relaxing it to accept 3 segments for some other reason) could silently make /persona/draft/* requests fall into the WRONG handler instead of 404ing harmlessly, since today's protection is incidental, not structural."
    mitigation: "This ticket's own acceptance criteria require explicit branch ordering (draft routes checked first), not reliance on the generic handlers' guard -- the review step traces this by hand as an explicit gate, and the test suite exercises the draft routes directly rather than only asserting 'the generic handler doesn't also match.'"
  - severity: low
    description: "The approve route is the one genuinely more consequential action this ticket adds (it commits real, governing persona content)."
    mitigation: "Operator-confirmed (design-discussion.md §9 judgment call #8, formerly OQ2): same no-auth, localhost-only posture as every other route in this file -- explicitly confirmed, not assumed. Revisit only if/when real multi-user/remote access becomes an actual requirement."
  - severity: medium
    description: "remember() firing on the approve path (new acceptance criteria above) could accidentally fire twice (once via a naive port of the interview skill's old unconditional-fire logic, once via this route's own new call) if the interview skill's draft-first rewrite (pu-08) isn't coordinated with this route's own firing."
    mitigation: "pu-08 explicitly removes the interview skill's own unconditional remember() call for the draft-first default path (design-discussion.md §9 judgment call #9) -- this route becomes the ONE place remember() fires for an agent-proposed draft's approval, not a second, redundant caller. pu-13's full-loop regression asserts exactly one remember() call per approval, not zero and not two."

