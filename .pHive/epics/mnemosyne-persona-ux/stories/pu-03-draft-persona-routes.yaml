id: pu-03-draft-persona-routes
epic: mnemosyne-persona-ux
title: "Draft /persona/draft/* HTTP routes on lib/mnemosyne/server.ts (list/read/propose/approve/discard)"
status: planned
complexity: medium
methodology: tdd
depends_on: [pu-02-draft-persona-store]

description: |
  Implements horizontal-plan.md H3: GET /persona/draft (list), GET
  /persona/draft/:tier/:scopeId (read one), POST /persona/draft/:tier/:scopeId
  (propose/overwrite), POST /persona/draft/:tier/:scopeId/approve (commit via
  the real write primitive, unchanged), DELETE /persona/draft/:tier/:scopeId
  (discard) on lib/mnemosyne/server.ts. This is the browser's entry point into
  the human-review half of ask 2's crawl->propose->review->approve loop --
  pu-02's store has no HTTP surface without this ticket.

acceptance_criteria:
  - "Given no active draft exists, when GET /persona/draft is called (global, default) or with ?repo=<path> (repo-local), then it returns every active draft pu-02's listDraftPersonas can see, in the same {tier, scopeId} shape GET /persona already uses"
  - "Given a real subprocess-spawned lib/mnemosyne/server.ts, when POST /persona/draft/:tier/:scopeId is called with a persona-shaped body, then a direct filesystem read confirms pu-02's writeDraftPersona was actually called (the draft file exists at the correct home-rooted path) -- not just a 200/201 HTTP response"
  - "Given an active draft that passes assertValidPersona, when POST /persona/draft/:tier/:scopeId/approve is called, then writeGlobalPersona/writeRepoLocalPersona is called with the draft-only metadata (proposedBy/proposedAt/sourceSummary) stripped, the resulting committed file is byte-for-byte what POST /persona/:tier/:scopeId would have produced for the same candidate, and the draft is archived (not deleted) via pu-02's disposeDraftPersona('approved')"
  - "Given an active draft that does NOT pass assertValidPersona (e.g. missing displayName), when POST /persona/draft/:tier/:scopeId/approve is called, then it returns a 400 via the existing badRequest convention, nothing is written to the real store, and the draft remains active (not archived) so a human can go fix it"
  - "Given an active draft, when DELETE /persona/draft/:tier/:scopeId is called, then it is archived via disposeDraftPersona('discarded') (never a bare filesystem delete) and no longer appears in GET /persona/draft's active listing"
  - "Given a request to any /persona/draft/* route from one of UI_ORIGINS, when the response is inspected, then it carries the exact same Access-Control-Allow-Origin header applyPersonaCors already produces for /persona/* -- no second CORS implementation, and a request from an origin NOT in UI_ORIGINS gets no CORS header at all"
  - "Given an active draft that carries a real sourceSummary (agent-proposed, via pu-07's bounded crawl), when POST /persona/draft/:tier/:scopeId/approve succeeds, then a real remember() call fires AFTER the write succeeds -- scoped via resolveRememberScope() (persona.ts), text built from the draft's sourceSummary -- and its landing is independently verifiable (a real note file exists on disk), matching the wizard epic's own rememberInterviewSource() rigor, not a stubbed call"
  - "Given an active draft with NO sourceSummary (a human typed it directly into the form, never touched the bounded crawl), when POST /persona/draft/:tier/:scopeId/approve succeeds, then NO remember() call fires -- there is no real source material to index, and this route must not invent placeholder text just to have something to remember()"
  - "Given an active, unapproved draft, when a recall() query is run against its content during the pending-review window (propose called, approve NOT yet called), then it returns nothing -- proving remember() has genuinely not fired yet, not merely that this route doesn't claim to have fired it"

steps:
  - id: research
    description: >
      Read lib/mnemosyne/server.ts in full, specifically: the existing GET/POST
      /persona/:tier/:scopeId dispatch (their url.pathname.startsWith('/persona/')
      + segments.length !== 2 guards, lines 268-387), the OPTIONS /persona/*
      preflight handler (lines 200-220) and confirm directly that its own
      prefix check already structurally covers /persona/draft/* with zero
      changes needed, and applyPersonaCors's exact implementation (lines
      108-124) to be reused unchanged.
    agent: researcher
  - id: test-spec
    description: >
      Extend test/http-api.mjs's existing subprocess-spawn convention with:
      list/read/propose round-trips against a real spawned server; approve
      success producing the identical committed file (direct fs read, not
      response-only); approve failure on an invalid draft (draft stays
      active, real store untouched); discard archiving the draft; CORS header
      presence for an allowed origin and absence for a disallowed one, for
      every new route.
    agent: tester
    depends_on: [research]
  - id: implement
    description: >
      Add the 5 new route branches to server.ts, checked BEFORE the existing
      generic GET/POST /persona/:tier/:scopeId handlers in source order
      (design-discussion.md §9 judgment call #7 -- not relied on as an
      implicit side effect of the existing segments.length !== 2 guard).
      Import pu-02's persona-draft-store.ts functions directly. The approve
      route strips draft-only metadata fields before calling
      writeGlobalPersona/writeRepoLocalPersona unchanged -- no re-implemented
      validation. Reuse applyPersonaCors on every new route; confirm (do not
      re-implement) that the existing OPTIONS handler already covers them.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: >
      Confirm route-ordering: manually trace a request to
      POST /persona/draft/top-orchestrator/acme/approve through server.ts's
      actual branch order and confirm it is intercepted by the new draft
      branch, never falls through to the generic /persona/:tier/:scopeId
      handler. Confirm the approve path calls the real write functions with
      zero re-implemented validation logic (grep for a second
      assertValidPersona-shaped check -- there should be none in this
      ticket's new code).
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

