id: pu-11-layer-stack-integration-redesign
epic: mnemosyne-persona-ux
title: Layer-stack visibility section re-integrated into the new shell
status: planned
complexity: low
methodology: tdd
depends_on: [pu-10-personas-panel-redesign-shell]

description: |
  Implements horizontal-plan.md H7's layer-stack component: carries pw-04's
  existing #persona-layer-stack section (view-only layer stack + Level 0
  pointer, via the already-shipped GET /layers) into pu-10's new shell, with
  copy/labeling written defensively against today's real GET /layers
  response shape rather than the sibling mnemosyne-memory-levels epic's
  documented-but-not-yet-shipped 0-4 level numbering (design-discussion.md
  OQ1). No new backend route -- this is a pure re-integration + labeling
  ticket.

acceptance_criteria:
  - "Given pu-10's new shell, when this ticket ships, then the layer-stack section (currently pw-04's #persona-layer-stack) is re-integrated into it, remaining a clearly-labeled, visually distinct section from the persona list -- never merged into one list, per research-brief.md §6's already-established boundary"
  - "Given the section's copy/labeling, when read for any 'level' or 'layer' terminology, then it renders exactly what GET /layers actually returns today (layer names in cascade order, a writable boolean) and does NOT hard-code, assume, or silently imply the sibling epic's corrected 0-4 numbering anywhere in code or copy -- an explicit acceptance gate, not an incidental property"
  - "Given loadPersonaLayerStack() (pw-04's existing function), when this ticket ships, then it is reused, not rebuilt, for the data-fetching half -- only its rendering target changes to fit the new shell's structure"
  - "Given Level 0's pointer display, when this ticket ships, then it remains view-only with zero edit affordance, exactly as Epic 1's original recommendation and every prior epic since have held -- not relitigated by this ticket"

steps:
  - id: research
    description: >
      Read ui/index.html's #persona-layer-stack section (lines 276-307) and
      ui/app.js's loadPersonaLayerStack() (pw-04) in full. Read
      lib/mnemosyne/server.ts's GET /layers route (lines 228-247) and
      client.getConfiguredLayers()'s actual return shape to confirm exactly
      what data is available to render TODAY, as the concrete boundary this
      ticket's copy must stay within. Read design-discussion.md §6/OQ1 for
      the exact defensive-posture requirement.
    agent: researcher
  - id: test-spec
    description: >
      Write failing tests confirming: the layer-stack section renders inside
      pu-10's new shell structure; loadPersonaLayerStack() is called, not
      duplicated; a search of the new copy/labels for any hard-coded
      '0'/'1'/'2'/'3'/'4' level-number reference tied to specific layer
      semantics fails the test (i.e., a structural check that this ticket
      did not encode the sibling epic's unshipped numbering).
    agent: tester
    depends_on: [research]
  - id: implement
    description: >
      Move/restyle the #persona-layer-stack section markup into pu-10's new
      shell structure per pu-01's chosen option (if it addresses this
      section at all -- if not, keep the section's existing visual treatment
      largely as-is, re-homed structurally). Update loadPersonaLayerStack()'s
      DOM target references only; its fetch logic (GET /layers,
      mnemosyneClientApiBase()) stays unchanged.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: >
      Confirm no copy/label anywhere in this ticket's changes references the
      sibling epic's 0-4 numbering as though it were already live. Confirm
      loadPersonaLayerStack() and the GET /layers route are both reused
      unchanged, not modified or duplicated.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/mdostal/Documents/work/pantheon/mnemosyne
  key_files:
    - path: ui/index.html
      purpose: "#persona-layer-stack's existing markup (lines 276-307, pw-04) -- what this ticket re-homes into the new shell."
    - path: ui/app.js
      purpose: "loadPersonaLayerStack() (pw-04) -- reused unchanged for data-fetching; only its DOM-target wiring changes."
    - path: lib/mnemosyne/server.ts
      purpose: "GET /layers (lines 228-247) -- confirms exactly what data shape is real and available today, the boundary this ticket's copy must not exceed."

files_to_modify:
  - file: ui/index.html
    change: "#persona-layer-stack section re-homed into pu-10's new shell structure; copy reviewed for level-numbering assumptions."
  - file: ui/app.js
    change: "loadPersonaLayerStack()'s DOM-target references updated to match the new shell; fetch logic unchanged."

design_decisions:
  - decision: "Copy/labeling renders whatever GET /layers actually returns today (names, cascade order, writable flag) -- never the sibling epic's not-yet-shipped 0-4 numbering."
    rationale: "design-discussion.md OQ1: this session has zero visibility into mnemosyne-memory-levels' actual shipped shape. Hard-coding an assumption about it would either be wrong or need to be reverted the moment that epic ships -- the safer, explicitly-chosen posture is defensive rendering against today's real data."
  - decision: "Level 0 stays view-only with zero edit affordance -- not relitigated."
    rationale: "Carried forward unchanged from Epic 1's original recommendation, reaffirmed by the wizard epic's own §3d/§6 OQ4 -- nothing in this epic's research surfaces a reason to revisit it."

cross_cutting: []

risks:
  - severity: low
    description: "Once the sibling mnemosyne-memory-levels epic ships, this section will likely need a follow-up ticket to actually surface the corrected 0-4 numbering structurally, not just in defensively-neutral prose."
    mitigation: "Named explicitly as an accepted, out-of-scope follow-up in design-discussion.md OQ1 and horizontal-plan.md's Cross-Cutting Concerns -- not silently forgotten, just not this epic's job to build."

