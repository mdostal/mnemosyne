      purpose: "withLock -- the same file-scoped advisory locking primitive this new store reuses unchanged, no new locking design."

files_to_modify:
  - file: lib/mnemosyne/layer1/persona-draft-store.ts
    change: "New file. writeDraftPersona/readDraftPersona/listDraftPersonas/disposeDraftPersona."
  - file: lib/mnemosyne/layer1/__tests__/persona-draft-store.test.ts
    change: "New file. Full round-trip, overwrite, archive-by-move, negative-tree-write, and structural-validation-rejection coverage."

design_decisions:
  - decision: "One module (persona-draft-store.ts) dispatching internally by PERSONA_STORE_BY_TIER, not two separate files mirroring persona-store-global.ts/persona-store-repo-local.ts's own split."
    rationale: "design-discussion.md §9 judgment call #2 (vertical-plan.md's own Resolved Ambiguities #2): unlike the real store, where the split predates any shared abstraction, this store is new from scratch and the two locations' read/write/list/dispose shape is otherwise identical -- one module with an internal path-resolution branch avoids duplicating the same logic twice."
  - decision: "Disposal moves the file to a timestamped path under approved/ or discarded/, never fs.unlink."
    rationale: "design-discussion.md §9 judgment call #5: mirrors this codebase's own already-shipped flight-status philosophy (provisional/confirmed/superseded, never deleted -- docs/layer-architecture-v2-plan.md) rather than inventing a different retention posture for this one new store."
  - decision: "Repo-local drafts are keyed by a sanitized absolute-path slug under a home-rooted repo-local/ subtree, never written inside the target repo's own tree."
    rationale: "design-discussion.md §9 judgment call #6 and §3b: persona-store-repo-local.ts's own doc comment confirms the real store is deliberately not gitignored -- an in-tree draft location would either force Mnemosyne to mutate every consuming repo's .gitignore (a burden it takes on nowhere else) or risk an in-progress/rejected draft landing in that repo's git history by accident."
  - decision: "Full assertValidPersona-strength schema validation is deliberately NOT applied at this layer -- only structural sanity (valid tier, non-empty scopeId)."
    rationale: "vertical-plan.md's Resolved Ambiguities #3: a draft is explicitly allowed to be incomplete while a human is still reviewing/editing it (design-discussion.md §3b); assertValidPersona remains the single real enforcement point, exercised unchanged only at approval (pu-03)."

cross_cutting: []

risks:
  - severity: high
    description: "If this module's paths ever drift close enough to the real store's paths (e.g. a typo'd root, or a future refactor that accidentally shares a path-building helper with persona-store-global.ts), an in-review draft could become reachable by getPersonaContent/sync.ts and leak into a live CLAUDE.md/AGENTS.md sync before being approved."
    mitigation: "Structural separation is proven, not just asserted: the negative-existence test (no file under repoRoot/.mnemosyne/ for a repo-local draft) is a hard acceptance criterion, and the review step explicitly confirms zero import from persona-store-global.ts/persona-store-repo-local.ts in this new module."
  - severity: low
    description: "Archive-by-move disposal lets ~/.mnemosyne/persona-drafts/{approved,discarded}/ grow unbounded over the life of a Mnemosyne install."
    mitigation: "Explicitly accepted per design-discussion.md's risk table -- matches this codebase's existing 'never delete, mark disposition' posture for flight-status memory. A future retention/cleanup ticket is out of this epic's scope, not silently deferred without acknowledgment."

references:
  - path: .pHive/epics/mnemosyne-persona-ux/docs/design-discussion.md
    relevant_excerpt: |
      §3b: "A new, structurally separate draft persona store, home-rooted
      (never inside a consuming repo's git-tracked tree), addressed by the
      same {tier, scopeId} identity the real store already uses, with
      disposition tracked by file location rather than a status field, and
      approval performed by calling the EXISTING real write primitive
      unchanged -- never a second write path."
  - path: .pHive/epics/mnemosyne-persona-ux/docs/horizontal-plan.md
    relevant_excerpt: |
      H2 acceptance criteria: "disposal MOVES the file (never unlink's it)...
      a repo-local draft is never written anywhere inside the target repo's
      own working tree (verified by asserting no file exists under
      <repoRoot>/.mnemosyne/ after a repo-local draft write)."
