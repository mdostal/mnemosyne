id: pu-12-draft-review-approve-ui
epic: mnemosyne-persona-ux
title: Draft review/approve UI (unifies agent-proposed and human-authored drafts)
status: complete
complexity: high
methodology: tdd
depends_on: [pu-01-multi-swarm-design-exploration, pu-03-draft-persona-routes, pu-10-personas-panel-redesign-shell]

note_on_completion: >
  Merged 2026-08-16 (commit 9ffb33a). Given this ticket's own named risk
  (retargeting pw-17's already-shipped form is a real behavior change to
  existing working code), verified with extra rigor beyond the standard
  pass: independently grepped ui/app.js myself (via `grep -a`, needed
  because the file's UTF-8 em-dash content trips default binary detection)
  and confirmed no fetch() anywhere posts to the real, direct-write
  /persona/:tier/:scopeId route -- personaForm's submit handler now targets
  /persona/draft/:tier/:scopeId exclusively and calls loadDrafts() (never
  loadPersonas()) on success. Read approveDraft()/discardDraft() in full --
  confirmed both make real fetch() calls to pu-03's actual routes (never a
  client-side simulation), both require window.confirm() with specific,
  non-generic copy before firing, and approveDraft()'s success path calls
  Promise.all([loadDrafts(), loadPersonas()]) reusing the real,
  unchanged loadPersonas(). Read isAgentProposedDraft() -- confirmed it
  checks for a real non-empty sourceSummary string (mirroring server.ts's
  own approve-route condition), not mere key presence, so a human-typed
  draft can never show a fabricated agent-proposed label. Reran the new
  persona-draft-review-approve-ui.mjs (58/58, including an explicit
  never-uses-`disabled`-attribute accessibility gate check) plus all other
  UI test files and persona-write-form.mjs's own new "no remaining
  direct-write fetch" regression assertion, myself, in both the builder's
  worktree and the merged integration worktree -- all passing both times.
  tsc --noEmit clean both times. vitest lib/mnemosyne/layer1 (246/246) as a
  broader regression check in both worktrees. Base was current (not stale)
  at merge time. All acceptance criteria met.

description: |
  Implements horizontal-plan.md H7's draft-review component: the concrete
  UI expression of ask 2's "a human to approve it, rather than expecting a
  full drill down in one text body." Lists active drafts (both agent-
  proposed and human-typed), shows a draft's proposed content plus its
  sourceSummary when present (the direct UI expression of lens 4,
  agent-provenance/trust-calibration), supports inline edits, and
  Approve/Discard actions wired to pu-03's HTTP routes. Per
  design-discussion.md §9 judgment call #4, pw-17's existing create/edit
  form is retargeted to propose a draft (POST /persona/draft/:tier/:scopeId)
  instead of writing directly -- ONE review/approve surface for both
  authoring paths, not two.

acceptance_criteria:
  - "Given pw-17's existing #persona-form, when this ticket ships, then its submit handler POSTs to pu-03's POST /persona/draft/:tier/:scopeId (never the real POST /persona/:tier/:scopeId) -- a human typing a persona by hand now produces an active draft, not an immediate commit"
  - "Given the new shell (pu-10), when this ticket ships, then it gains a drafts list (fetched via pu-03's GET /persona/draft), rendering EVERY active draft regardless of whether it was agent-proposed or human-typed, in one unified list -- not two separate lists"
  - "Given an agent-proposed draft (has sourceSummary/proposedBy: 'agent' metadata), when it is shown in the drafts list or detail view, then its sourceSummary is rendered and visibly labeled as agent-proposed -- the concrete UI expression of lens 4 (agent-provenance/trust-calibration): a human must always be able to see WHAT the agent looked at before proposing this content"
  - "Given a human-typed draft (no sourceSummary), when it is shown, then it renders without a sourceSummary section and without an incorrect 'agent-proposed' label -- the UI must not fabricate provenance that doesn't exist"
  - "Given an active draft's detail view, when the operator edits its fields and re-submits, then it re-POSTs to the SAME draft identity (overwrite-in-place, matching pu-02's one-active-draft-per-identity design) via setStatus() pass/fail, matching every existing form's convention"
  - "Given an active draft's detail view, when the operator clicks Approve, then it POSTs to pu-03's approve route, and on success the panel reflects both the draft's removal from the active list AND the newly-committed persona's appearance in the real persona list (loadPersonas(), pw-03's existing function) -- without a manual page reload"
  - "Given an active draft's detail view, when the operator clicks Discard, then it DELETEs via pu-03's discard route, and on success the draft is removed from the active list immediately, with a clear confirmation step before the action fires (a meaningfully consequential action, even though non-destructive at the storage layer per pu-02's archive-by-move design)"
  - "Given the drafts list/detail/approve/discard UI, when exercised via keyboard only, then every action is reachable and operable without a mouse -- lens 3 (accessibility)"

steps:
  - id: research
    description: >
      Read pu-01's chosen synthesized option's documentation of the
      crawl->propose->approve interaction flow in full
      (.pHive/design/mnemosyne-persona-ux/synthesized/, selection.md). Read
      ui/index.html's existing #persona-form (pw-17, lines 227-265) and
      ui/app.js's personaForm submit handler (lines 1297-1344) in full --
      the exact code this ticket retargets. Read pu-03's draft route
      response shapes exactly (GET /persona/draft, GET
      /persona/draft/:tier/:scopeId, POST .../approve, DELETE ...).
    agent: researcher
  - id: test-spec
    description: >
      Write failing tests for: the retargeted form POSTs to the draft route,
      not the real route; the drafts list renders both agent-proposed
      (with sourceSummary) and human-typed (without) drafts correctly and
      distinguishably; approve success updates both the drafts list and the
      real persona list without a reload; discard requires confirmation and
      removes the draft from the active list on success; keyboard operability
      of every new interactive element.
    agent: tester
    depends_on: [research]
  - id: implement
    description: >
      Retarget #persona-form's submit handler to POST
      /persona/draft/:tier/:scopeId. Add a drafts list section to the new
      shell (pu-10), a loadDrafts() function following loadPersonas()'s
      existing conventions (fetch, setStatus, render), a draft detail/edit
      view, and Approve/Discard handlers calling pu-03's routes -- on
      approve success, call BOTH a drafts-refresh AND loadPersonas() (never
      duplicating loadPersonas()'s own logic, per pw-03's precedent).
      Implement per pu-01's chosen option's documented interaction flow for
      the review/edit/approve/discard experience specifically.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: >
      Confirm the old #persona-form's direct-write behavior is genuinely
      gone (grep confirms no remaining POST to /persona/:tier/:scopeId
      anywhere in ui/app.js's form-submit code paths). Confirm
      sourceSummary rendering never appears for a draft that has none
      (no fabricated provenance). Confirm approve/discard both call pu-03's
      real routes, not a client-side simulation. Confirm loadPersonas() is
      reused on approve success, not reimplemented.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

