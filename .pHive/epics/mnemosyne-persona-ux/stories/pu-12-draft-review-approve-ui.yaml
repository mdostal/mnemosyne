design_decisions:
  - decision: "pw-17's existing create/edit form is retargeted into the draft-propose flow rather than building a second, parallel human-authoring path alongside a separate agent-draft-review path."
    rationale: "design-discussion.md §9 judgment call #4: both a human typing a persona by hand and an agent proposing one via the bounded crawl (pu-07) produce the same shape of thing (an active draft at {tier, scopeId}) and should be reviewed/approved through the same UI, not two UIs a future maintainer has to keep in sync."
  - decision: "sourceSummary is rendered and labeled ONLY when present -- never fabricated or implied for a human-typed draft."
    rationale: "Lens 4 (agent-provenance/trust-calibration, design-discussion.md §4): the whole point of surfacing sourceSummary is honest provenance -- a UI that shows a generic 'agent-proposed' label regardless of actual origin would defeat the purpose of the lens it exists to satisfy."
  - decision: "Discard requires an explicit confirmation step in the UI, even though the underlying storage action is non-destructive (archive-by-move, pu-02)."
    rationale: "The UI-level consequence (a draft disappearing from the active list, requiring a filesystem-level lookup to recover) is real even if the storage-level action is reversible -- matching this UI's own existing precedent (the Operations panel's reindex action already requires an explicit window.confirm() for a real-but-non-catastrophic action)."

cross_cutting: []

risks:
  - severity: high
    description: "This ticket, alongside pu-10, is the epic's other highest-complexity UI story, and is the most structurally dependent ticket in the epic (3 upstream dependencies: pu-01, pu-03, pu-10) -- real risk of being blocked or delayed by any one of those three slipping."
    mitigation: "The dependency graph (epic.yaml) makes this explicit rather than hidden -- an execution pass should treat this as the epic's real critical-path convergence point and staff accordingly, not discover the bottleneck mid-execution."
  - severity: medium
    description: "Retargeting pw-17's already-shipped, already-tested form is a real behavior change to existing, working code -- a mistake here doesn't just fail to add a feature, it could regress the wizard epic's own already-verified write path if the retargeting is done carelessly (e.g. accidentally leaving BOTH the old direct-write POST and the new draft POST wired to the same submit event)."
    mitigation: "The review step's explicit grep-for-the-old-POST-call acceptance criterion exists specifically to catch this class of mistake -- not left as an implicit assumption that 'retargeting' was done cleanly."

