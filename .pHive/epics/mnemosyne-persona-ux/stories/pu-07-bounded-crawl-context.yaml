design_decisions:
  - decision: "The crawl is a fixed, small, NAMED source list with an explicit cap, not an open-ended 'read whatever seems relevant' instruction."
    rationale: "design-discussion.md §3c, direct operator quote: 'a way to crawl and help build a short, reasonable context on there without overdoing it.' A named list + a real, enforced cap is the only way to make 'without overdoing it' testable rather than a matter of an individual agent's judgment on any given run."
  - decision: "The parent persona's own content is read at summary/pointer level only, reusing persona.ts's existing buildParentContextSections boundary, never a second, independent copy-down path."
    rationale: "The already-shipped, already-tested 'query up, never copy down' guarantee (pf-12) is explicitly out of scope to relitigate (design-discussion.md §0/§1) -- this ticket's crawl step must extend, not weaken, that guarantee."

cross_cutting: []

risks:
  - severity: medium
    description: "A poorly-chosen cap could either be too tight (sourceSummary too thin to be useful, defeating the point of crawling at all) or too loose (defeats 'without overdoing it')."
    mitigation: "The cap is documented explicitly in SKILL.md as a named, reviewable value, not buried in code -- a future ticket can retune it with a clear single point of change, rather than it being an emergent property of prompt behavior."
  - severity: low
    description: "A future edit to SKILL.md's crawl-step prose could drift from the actual implemented source list in crawl-context.mjs without either side erroring."
    mitigation: "The review step explicitly checks documentation/code parity as a named gate, matching the same discipline pu-05 applies to its SKILL.md action-table update."

