id: pu-07-bounded-crawl-context
epic: mnemosyne-persona-ux
title: "Interview skill: bounded, capped crawl -> sourceSummary"
status: planned
complexity: medium
methodology: tdd
depends_on: []

description: |
  Implements horizontal-plan.md H6's crawl component: replaces
  skills/mnemosyne-persona-interview's opportunistic step 2 ("load whatever
  context is already in the conversation") with an explicit, named, CAPPED
  source list and a resulting sourceSummary string. Direct operator mandate,
  quoted verbatim in design-discussion.md §0 ask 2: "give it a way to crawl
  and help build a short, reasonable context on there without overdoing it."
  The cap is the concrete mechanism that makes "without overdoing it" a real,
  testable constraint rather than a vibe.

acceptance_criteria:
  - "Given a repo path and (for global tiers) a company/project scope, when the bounded crawl runs, then it reads AT MOST the named source list -- repo README, package/project manifest, existing CLAUDE.md/AGENTS.md if present, the applicable parent persona's own summary via query-up (never its full sections content, preserving persona.ts's buildParentContextSections copy-down guarantee) -- and never reads anything outside that list"
  - "Given the crawl completes, when its output is inspected, then it produces a single sourceSummary string bounded by an explicit, documented cap (e.g. a fixed max character/line count), never an unbounded dump of file contents"
  - "Given a repo with none of the named sources present (no README, no manifest, no CLAUDE.md/AGENTS.md, no parent persona), when the crawl runs, then it still produces a valid (if minimal) sourceSummary and does not error -- matching this skill's existing non-blocking hard-fail philosophy (pw-10/12), extended to the crawl step"
  - "Given a parent persona exists and is queried, when the crawl's sourceSummary is inspected, then it contains only the parent's own high-level summary/pointer, never the parent's full sections content verbatim -- the crawl step must not become a new, second copy-down path alongside the one persona.ts's buildParentContextSections already guards against"

steps:
  - id: research
    description: >
      Read skills/mnemosyne-persona-interview/SKILL.md step 2 in full (the
      existing, unbounded 'load whatever's already known' behavior this
      ticket replaces) and interview-engine.mjs's existing structure
      (CORE_QUESTIONS/OPTIONAL_QUESTIONS/resolveAnswer/runPersonaInterview) as
      the pure-function style this ticket's new crawl helper must match.
      Read persona.ts's buildParentContextSections to confirm exactly what
      "pointer-only, never copy-down" means for parent content, so the
      crawl's own parent-summary read respects the identical boundary.
    agent: researcher
  - id: test-spec
    description: >
      Write failing tests for: the named source list is read exhaustively but
      never exceeded (a fixture repo with extra, irrelevant files confirms
      those are never touched); the cap is enforced (a fixture with an
      oversized README produces a truncated, capped sourceSummary, not a full
      dump); the no-sources-present case still produces a valid, non-empty
      sourceSummary; a parent-persona fixture's full sections content never
      appears verbatim in the resulting sourceSummary (only a summary/pointer
      does).
    agent: tester
    depends_on: [research]
  - id: implement
    description: >
      Add a new, documented crawl step to SKILL.md (replacing the prose-only
      step 2), plus a pure, testable helper (alongside interview-engine.mjs,
      e.g. a new crawl-context.mjs) implementing the named source list, the
      cap, and the parent-summary-only rule. Deliberately zero import from
      persona-store-global.ts/persona-store-repo-local.ts for reading a
      parent's FULL content -- only whatever summary-level data
      getPersonaContent's own pointer-only rendering already exposes.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: >
      Confirm the named source list in SKILL.md's prose matches the actual
      implemented list in code exactly (no drift between documentation and
      behavior). Confirm the cap is a real, enforced value (not just
      documented intent) by re-running the oversized-README test case
      directly.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

