description: |
  Implements horizontal-plan.md H6's write-target component: rewrites
  skills/mnemosyne-persona-interview's step 7 to call pu-04's `mnemosyne
  persona draft propose` by default instead of `mnemosyne persona create`,
  attaching pu-07's sourceSummary to the proposed draft's metadata. A new
  `--commit-directly` invocation flag reproduces the OLD (pre-epic) immediate-
  commit behavior exactly, for backward compatibility. This is the concrete
  mechanism making the operator's ask 2 real: "we need an interaction to
  build that and then a human to approve it, rather than expecting a full
  drill down in one text body" -- the skill now PROPOSES by default; it no
  longer commits on completion.

acceptance_criteria:
  - "Given a completed interview run with no --commit-directly flag, when step 7 executes, then it calls pu-04's `mnemosyne persona draft propose` (never `persona create`) with the assembled candidate PLUS proposedBy: 'agent', proposedAt: <timestamp>, and pu-07's sourceSummary attached as draft-only metadata -- verified by a direct filesystem read confirming an ACTIVE DRAFT exists, and that the real persona store (writeGlobalPersona/writeRepoLocalPersona's on-disk targets) was NOT touched"
  - "Given the exact same completed interview run WITH --commit-directly, when step 7 executes, then it calls `mnemosyne persona create` exactly as the pre-epic skill did, producing a committed persona byte-for-byte identical (modulo timestamps) to what the wizard epic's already-shipped persona-interview-output.test.ts already proves for that exact input"
  - "Given step 8 (remember() crawl-and-feed), when the default (draft-first) path is used, then step 8 does NOT fire yet -- remember()-ing source material for a persona that hasn't been human-approved would prematurely index unreviewed content; step 8 is deferred until after approval (see design_decisions below for where this moves)"
  - "Given --commit-directly is used, when step 8 executes, then it fires exactly as the pre-epic skill already does (unconditionally, immediately after the commit) -- unchanged behavior for the escape-hatch path"

steps:
  - id: research
    description: >
      Read skills/mnemosyne-persona-interview/SKILL.md step 7 (the current
      immediate-write behavior via persona-writer.mjs's writePersonaViaCli)
      and step 8 (persona-remember.mjs's rememberInterviewSource, fired
      unconditionally right after) in full. Read
      lib/mnemosyne/layer1/__tests__/persona-interview-output.test.ts and
      persona-interview-crawl-and-feed.test.ts in full to know exactly what
      behavior --commit-directly must reproduce byte-for-byte.
    agent: researcher
  - id: test-spec
    description: >
      Write failing tests for: default path proposes a draft and does NOT
      call persona create or remember() at all; --commit-directly reproduces
      the exact pre-epic committed-file output AND fires remember()
      unconditionally, matching the existing test files' own assertions
      applied against the flagged path; the proposed draft's metadata
      includes proposedBy/proposedAt/sourceSummary correctly.
    agent: tester
    depends_on: [research]
  - id: implement
    description: >
      Rewrite SKILL.md step 7 to branch on the new --commit-directly flag:
      default calls pu-04's `draft propose` (via a new
      persona-draft-writer.mjs sibling to persona-writer.mjs, reusing its
      exact real-subprocess-spawn shape but targeting the draft CLI verb);
      --commit-directly calls the existing, UNCHANGED
      writePersonaViaCli()/persona-writer.mjs path. Move step 8's remember()
      call to fire ONLY on the --commit-directly path in this ticket (the
      default path's remember() timing is explicitly deferred to fire at
      APPROVAL time instead, which is out of this ticket's scope --
      see design_decisions and the OQ this surfaces).
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: >
      Confirm --commit-directly's code path is LITERALLY the pre-epic code,
      unchanged (persona-writer.mjs/persona-remember.mjs untouched, only
      SKILL.md's prose and the new branch condition change) -- not a
      reimplementation that happens to produce similar output. Confirm the
      default path's persona-draft-writer.mjs never imports
      writeGlobalPersona/writeRepoLocalPersona directly (only pu-04's CLI, a
      real subprocess, same non-negotiable rule persona-writer.mjs itself
      already follows).
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

