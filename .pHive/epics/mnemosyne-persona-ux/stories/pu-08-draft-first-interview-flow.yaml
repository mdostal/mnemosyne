design_decisions:
  - decision: "The default write target becomes `draft propose`; `--commit-directly` reproduces the exact old behavior, rather than the old behavior being removed outright."
    rationale: "design-discussion.md §9 judgment call #3: this is the concrete mechanism by which ask 2's 'a human to approve it, rather than expecting a full drill down in one text body' takes effect, while keeping the wizard epic's own already-shipped tests meaningful (they now exercise the flag explicitly) rather than silently deleting the behavior those tests exist to protect."
  - decision: "remember()'s firing moves from 'unconditional, immediately after every commit' to 'only on the --commit-directly escape-hatch path' in THIS ticket -- the default (draft-first) path's remember() timing fires at approval instead, wired in pu-03/pu-04 (operator-resolved, design-discussion.md §9 judgment call #9), not this ticket."
    rationale: "Firing a real remember() call (indexing source material into searchable memory) for a persona that hasn't been human-approved yet would prematurely commit unreviewed content into the memory system the operator explicitly wants a human gate in front of. Operator confirmed: fire on approval, never on draft creation. The firing logic itself lives in pu-03's approve route/pu-04's approve CLI verb (once a human has confirmed the content is good), not here -- this ticket's own job stays scoped to the interview skill's write-target change."

