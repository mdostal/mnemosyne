  writeGlobalPersona/writeRepoLocalPersona/writePersonaViaCli/
  rememberInterviewSource directly (grep for `^import` confirms only
  node:child_process/node:fs/node:os/node:path/node:url/node:util/yaml --
  the only disk-touching path is spawning the real `mnemosyne persona draft
