    mitigation: "Operator-resolved (design-discussion.md §9 judgment call #9): fires on approval, never on draft creation. Wired directly into pu-03's/pu-04's approve paths (their own acceptance criteria), proven end-to-end by pu-13's full-loop regression (both the not-yet-fired-during-review and fired-and-landed-after-approval assertions) -- no longer an open gap in this epic's 14-story breakdown."
  - severity: medium
    description: "--commit-directly's code path could accidentally diverge from truly-unchanged pre-epic behavior if a future edit touches persona-writer.mjs/persona-remember.mjs for the default path's sake and inadvertently affects the shared files."
    mitigation: "The new default-path writer is a SEPARATE file (persona-draft-writer.mjs), not a parameterized version of persona-writer.mjs -- --commit-directly's code path literally does not change, by construction, not by convention alone."

