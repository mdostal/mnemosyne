design_decisions:
  - decision: "3 initial directions, not more or fewer."
    rationale: "design-discussion.md §9 judgment call #1: the operator said 'come up with options' (plural, uncounted) for generation but explicitly counted 3 for synthesis -- 3 initial directions gives the 7-lens panel real variety without tripling an already-large review burden, and keeps the initial count from outnumbering the 3 final options the operator explicitly asked for."
  - decision: "Selection among the 3 synthesized options happens inside this ticket via a documented, reasoned pick, not a blocking interactive touchpoint."
    rationale: "design-discussion.md §9 judgment call #2: /design's own wireframe-protocol AskUserQuestion touchpoints assume an interactive operator; this epic is explicitly planned/executed without one available. The rationale is written to selection.md specifically so it is reviewable and reversible by a human at execution time, not silently baked in."
  - decision: "7 lenses are named concretely for THIS surface (design-discussion.md §4), not reused from any generic example list verbatim."
    rationale: "The operator explicitly instructed against verbatim reuse of any example lens list ('pick 7 that make sense for THIS specific UI, don't just reuse this example list verbatim without thinking about it'). Each of the 7 lenses chosen here is grounded in a specific, cited research finding (jargon density confirmed in ui/index.html's own panel-hint copy; no brand-system.yaml present; the new agent-authored-content-approval interaction unique to this epic)."

cross_cutting: []

risks:
  - severity: medium
    description: "7 independent review-lens dispatches + 3-direction option generation + synthesis is a genuinely large number of agent calls for one ticket -- real risk of runaway cost/time or of the panel/synthesis steps degrading into shallow, interchangeable output if not scoped tightly."
    mitigation: "Acceptance criteria cap scope explicitly at the operator's own stated numbers (3/7/3) -- not expanded during execution. The review step explicitly checks that synthesized options are genuinely new syntheses, not renamed originals, as a concrete quality gate."
  - severity: low
    description: "The synthesized options could describe UI/interaction decisions that are technically infeasible against this repo's real constraints (zero-dep vanilla JS, no third-party UI framework, cross-origin persona service on a different port)."
    mitigation: "The research step briefs every dispatch against the real current ui/index.html + ui/app.js + server.ts CORS conventions before any option is generated, the same 'ground in real source, not assumption' discipline every prior epic in this line of work has held to."

