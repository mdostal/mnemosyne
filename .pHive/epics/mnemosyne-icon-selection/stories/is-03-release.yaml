id: is-03-release
epic: mnemosyne-icon-selection
title: Full-suite regression pass + version bump + release note
status: planned
complexity: low
methodology: classic
depends_on: [is-02-operator-pick-and-assets]

description: |
  Closes the mnemosyne-icon-selection epic (is-01 through is-03), mirroring
  pu-15/pf-08's own closing-ticket convention but proportionate to this
  epic's own small, fast-release intent (design-discussion.md §1 Ticket 3):
  a real full-suite regression pass, a version bump, and a release note. Does
  NOT repeat pf-08's own full fresh-worktree stash-and-reproduce
  investigation -- that rigor matched an 8-ticket epic; a straightforward
  in-tree regression pass is proportionate for a 3-ticket, single-asset
  release.

acceptance_criteria:
  - "Given the full npm test script (vitest suite + the .mjs subprocess suite) plus tsc --noEmit, when run on this epic's final state, then it completes with only the already-documented, pre-existing failures (the 3 generic POST /remember default-layer assertions, first flagged in ml-04's completion note) -- no NEW failures anywhere"
  - "Given any NEW failure found, then it is fixed before this ticket completes -- a regression-fixing step, not deferred"
  - "Given package.json's version field, when this ticket completes, then it reflects a real version bump from the version at epic start"
  - "Given this ticket's completion note, when read, then it includes the actual full test-run output summary (real pass/fail counts)"

steps:
  - id: implement
    description: >
      Run the full npm test + tsc --noEmit against this epic's final state;
      fix any new failure found. Bump package.json/package-lock.json's
      version (patch or minor, whichever matches this epic's actual scope --
      a single new UI element + a static asset addition reads as patch-scale
      unless the implementer finds a reason otherwise). Write a release note
      in CHANGELOG.md covering the real deliverable: the operator-chosen
      icon now shipping as the standalone UI's favicon.
    agent: developer
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [implement]

context:
  codebase: /Users/mdostal/Documents/work/pantheon/mnemosyne
  key_files:
    - path: .pHive/epics/mnemosyne-persona-files/stories/pf-08-full-suite-regression-release.yaml
      purpose: "Direct template for the closing-ticket convention (version bump + CHANGELOG entry), scaled down per this epic's own proportionality decision (design-discussion.md §1 Ticket 3)."

files_to_modify:
  - file: package.json
    change: "Version bump."
  - file: package-lock.json
    change: "Version bump, matching package.json."
  - file: CHANGELOG.md
    change: "New entry covering the shipped favicon."

cross_cutting: []
