name: mnemosyne-conversation-memory
title: Conversation memory — discovery, triage, clustering, and distillation of real chat history
target_codebase: /Users/mdostal/Documents/work/pantheon/mnemosyne
methodology: tdd
version_bump: minor
sidecar_retention: committed

git_flow:
  base_branch: dev
  branch_strategy: per-epic

planning_team:
  matched_tags: [privacy-safety, multi-system-integration, data-pipeline, real-scale-personal-data]
  roster: [researcher, technical-writer, tpm]
  per_tag_reasoning:
    privacy-safety: "New, first-class privacy/safety risk category (secret scanning before persist, human-gated triage, no-auto-delete) — the highest-blast-radius concern this repo has planned to date, held to ro-06/ro-11's own rigor bar."
    multi-system-integration: "New parsing layer (2 source-specific parsers) + triage + clustering + distillation, composing but genuinely extending 4 already-shipped subsystems (ingestDocument, remember() cascade, memory-levels taxonomy, org-tree/scope model)."
    data-pipeline: "A 7-phase sequential pipeline (discover -> parse -> triage -> cluster -> distill -> pilot -> deep-dive validation), each phase's output the next phase's real input."
    real-scale-personal-data: "234+ real Claude Code session transcripts (up to ~50MB+ each, 4.0GB total incl. scratch) plus a real 258-conversation/47.9MB ChatGPT export — real, confirmed volume, not assumed."
  confidence: high
  gate_decisions:
    scale: large
    h_v_required: true
    structured_outline_required: true

description: |
  Operator's own words (verbatim, full context in docs/design-discussion.md
  §1): "at some point we need a way to filter through ALL of the things
  discussed, get it into memories, and figure out usefulness and trash and
  stuff... ideally then we are able to correctly cluster items and index
  and deal with it to break out and clean up the conversations and context
  as well -- i have chatted across 30 plus sessions and different things
  and different overall mixes of which ones are helping with what... so,
  ideally we can solidify and fix that into mnemosyne memory at some point
  as well -- and that will need a DEEP DIVE test"

  Real data reconnaissance (docs/research-brief.md §1) confirms: 234 real
  (non-scratch) Claude Code project directories under
  `~/.claude/projects/` out of 1404 total, individual session transcripts
  ranging from ~6MB to 50MB+ (this session's own transcript: 53,166,373
  bytes), plus a real, confirmed 258-conversation/47,884,497-byte ChatGPT
  export (`~/Downloads/ChatGPT Data Export Feb 5 2026/conversations.json`).
  A real Gemini export was searched for; round 1's "confirmed ABSENT"
  conclusion was CORRECTED 2026-08-25 (docs/design-discussion.md §9,
  operator-flagged): Gemini API access is real and reachable via
  Portunus (`{{secret:personalsites-487021-dostal-shared-gemini}}`, same
  shared-swarm provenance as the already-proven-working
  `dostal-shared-qdrant` key), and its real role is powering `cm-05`/
  `cm-07`'s LLM-shaped steps, not retrieving chat history (a Gemini API
  key cannot do that — §9.2). A real, single Gemini conversation export
  (Share-link capture) was also found on this machine once the search
  was widened, proving the export capability itself is real even though
  no full-account Takeout export exists yet — `cm-10` makes this a real,
  gated (not absent) part of this epic's own plan.

  Round-3 amendment (2026-08-25, docs/design-discussion.md §10): a real
  (if small, 2-conversation) Google Takeout Gemini export has since been
  staged at `~/Downloads/Google Takeout Aug 26 2026.zip`, meeting `cm-10`'s
  gating precondition for the Takeout path specifically — `cm-02`'s
  manifest entry corrected from `gemini: not_staged` to `gemini: staged`.
  A real, existing `swarm-memory` scope (`arizona`, backing a real project
  at `~/Documents/work/personal/arizona-compound`) surfaced a real gap —
  `cm-06`/`cm-07` gain a read-only, human-confirmed scope-routing design
  so a cluster whose project-slug signal matches an existing named client
  scope can route there instead of always landing in this epic's own
  `meta` collection. Two new stories, `cm-11`/`cm-12`, generalize this
  epic's own pipeline into a repeatable component any operator could run
  against their own machine, following `mnemosyne-repo-onboarding`'s own
  `onboardRepo()`/`mnemosyne onboard` precedent — proven via synthetic/
  structural tests only, gated on `cm-09`'s own real-data validation.

  Round-4 amendment (2026-08-26, docs/design-discussion.md §11): the
  operator's own explicit framing this pass — "it should have an intake
  and then a way to get into the others as we distribute... so meta is
  separate from intake" — splits the write path into three real pieces.
  `cm-07` is SIMPLIFIED: it now writes UNCONDITIONALLY to a new,
  temporary `intake` landing scope (never `meta`, never a confirmed real
  scope directly) — the confirmed-vs-unconfirmed scope-selection logic it
  previously owned (round 3, §10.2) moves in full to new story `cm-13-
  intake-distribution`, which reads intake entries (via a new, read-only
  `scroll_points()` extension of `HttpQdrantClient`), resolves each
  entry's real destination (a confirmed real scope, or `meta` as the
  unconditional safe default), writes there via the same unchanged
  `remember()` primitive, and marks the original intake entry as
  distributed by writing a NEW, additive `distribution_marker` entry
  (never an in-place mutation — no update-by-id primitive exists anywhere
  in this epic's real dependency surface, confirmed by this round's own
  re-read of `remember()`/`VectorLayerAdapter.ts`, §11.1) — audit trail
  preserved, per the operator's own words. New story `cm-14-intake-
  decommission` is the epic's FIRST, and by design its ONLY, delete-
  capable operation: removes an already-distributed intake entry from the
  `intake` collection ONLY, after independently re-verifying (never
  trusting a stale flag) both the distribution marker's existence and the
  destination copy's real presence, with an optional real NDJSON backup
  step (default-on, mirroring this session's own established Qdrant-
  backup precedent) before any delete. Named explicitly, in its own
  dedicated risk section, as the epic's one deliberate, narrowly-scoped
  exception to `ro-06`'s/`ways_of_working.md`'s own "no delete path
  exists" discipline — never merged into `HttpQdrantClient` itself (that
  class's own no-delete-method contract stays true for every other
  caller), single-entry-only, never wired into `cm-11`/`cm-12`'s own
  automatic pipeline flow. `cm-14` does NOT get built or run as part of
  this planning pass or `cm-08`'s pilot — gated behind its own future,
  separate operator go-ahead. 14 stories total (`cm-01`..`cm-14`).

  Built by composing the already-shipped `ingestDocument()`/`remember()`
  cascade (ro-10/ro-13, unchanged) with genuinely new pieces: a
  standalone secret/credential scanner (checked twice — parse-time and
  persist-time, no bypass, mirroring ro-11's SSRF-guard posture exactly),
  real-source discovery, source-specific transcript parsers (Claude Code,
  ChatGPT, and a gated Gemini parser, `cm-10`) into a shared normalized
  shape, heuristic+Gemini-LLM usefulness/trash triage with a mandatory
  human-review gate (never automated deletion), embedding-based
  cross-session clustering faceted by real project-slug metadata (the
  existing production embedder, no new LLM/API surface), and a bounded
  Gemini-LLM-backed distillation mechanism that turns a raw 50MB+
  transcript into a small number of high-signal memory entries. Gemini
  API access (Portunus, `dostal-shared-gemini`) is the concrete LLM
  provider for the triage and distillation steps — see §9 for the
  correction and rationale.

  Explicitly, non-silently SUPERSEDES `mnemosyne-foundation`'s open
  `m-09-external-chat-ingestion` story (docs/design-discussion.md §7 has
  the full AC-by-AC disposition table) — m-09's exact deliverable (chat
  parsers + content-hash dedup + an ingestion pipeline for
  Gemini/Claude-Workbench exports) is fully re-covered by this epic's
  `cm-03`/`cm-04` against the two REAL confirmed sources, with m-09's own
  good design decisions (dedup by content hash, source-metadata
  completeness) explicitly carried forward, not reinvented. `m-09`'s own
  `note:` field is updated (docs-only) to point here; its `status:` field
  is left unchanged (this repo's story-status enum has no `superseded`
  convention to reuse) — the operator owns the final call on formally
  closing it in `mnemosyne-foundation`'s own tracking.

  Deliberately, explicitly contains NO full-234-session-corpus-ingestion
  story (`ways_of_working.md`'s "don't build ahead of an explicit CBA"
  rule, and this planning pass's own explicit instruction) — the epic
  ends at a small, real, operator-selected PILOT (`cm-08`) and the
  operator's own explicitly-requested DEEP DIVE validation test (`cm-09`),
  producing a real, human-inspectable report the operator reviews before
  any full-corpus decision is made, itself a genuinely separate, future,
  not-yet-planned decision.

notes: |
  Planned 2026-08-25. Full research -> design-discussion -> grill (5
  findings, all 5 resolved in round 1, unresolved_count: 0) -> H/V ->
  structured-outline (large scope, confirmed against real code/data
  reading, not assumed from the operator's own hint alone) pass. See
  docs/ for the full trail.

  Real research highlights (docs/research-brief.md has full citations):
  - 1404 total ~/.claude/projects/ dirs, 234 real (non-scratch) after the
    established `-private-tmp|-private-var-folders|scratchpad` filter.
  - This session's own transcript: 53,166,373 bytes (~50.7MB) -- confirms
    the operator's own "52MB" estimate.
  - Real ChatGPT export: 258 conversations, 47,884,497-byte
    conversations.json, a tree-DAG (`mapping` keyed by node id, walked
    from `current_node` via `parent` pointers) -- structurally distinct
    from Claude Code's linear, role-tagged JSONL.
  - Round 1: no real Gemini export found anywhere on this machine (real
    search performed, not assumed) -- m-09's "Gemini" framing considered
    stale. CORRECTED 2026-08-25 (docs/design-discussion.md §9,
    operator-flagged): Gemini API access is real/reachable via Portunus
    (dostal-shared-gemini, same shared-swarm provenance/access pattern as
    the already-proven-working dostal-shared-qdrant key; billing
    confirmed enabled on personalsites-487021), and its real role is
    powering cm-05/cm-07 as the LLM, not chat-history retrieval (a
    Gemini API key structurally cannot do that). A real, single Gemini
    conversation export (Share-link capture, not Takeout) was also found
    at ~/Documents/work/moving-chaos/source_index/ once the search was
    widened past round 1's own maxdepth-3 limit -- proof the export
    capability is real, though no full-account Takeout export exists yet
    (re-confirmed, wider search). New story cm-10 makes Gemini
    conversation ingestion a real, gated, reachable part of this epic's
    plan rather than a dropped/absent one.

  Explicit, operator-facing relationship/decision notes (not silently
  resolved):
  - `meta` scope (already in the type system, thinly implemented) is
    given its first real, concrete meaning by this epic -- not a new
    Level 5 (docs/design-discussion.md §2.2/§2.3).
  - A real, named, unresolved tension is surfaced (not silently ignored):
    this epic's own `meta`-scope collection is scoped operator-personal-
    only, but the deeper guarantee that a FUTURE third-party product
    embedding Mnemosyne (Mode B, this repo's own "Roll Your Own RAG"
    north star) never surfaces this content is explicitly out of scope
    here (docs/design-discussion.md `[grill 3.1]`, open question #1).
  - 5 open questions genuinely need the operator's explicit answer before
    execution -- see docs/design-discussion.md §5 and
    docs/structured-outline.md §6. Open question 5 (Gemini parser) is
    RESOLVED as of the §9 correction; the other 4 stand unchanged.

  Round-2 amendment (2026-08-25, docs/design-discussion.md §9, grill
  round 2 in docs/grill-record.md -- 5 findings, all resolved): corrected
  round 1's "Gemini confirmed absent" conclusion. cm-05/cm-07 revised to
  name Gemini (Portunus dostal-shared-gemini) as their concrete LLM
  provider via a new shared lib/mnemosyne/conversation-memory/
  geminiClient.ts primitive; cm-02's gemini: not_found manifest entry
  corrected to gemini: not_staged; new story cm-10-gemini-conversation-
  ingestion added, gated on the operator staging a real export (a real
  Share-link capture already exists on this machine as proof-of-
  mechanism, at ~/Documents/work/moving-chaos/source_index/, not pulled
  into this epic without separate explicit opt-in); m-09's own note:
  field corrected to match.

  Round-3 amendment (2026-08-25, docs/design-discussion.md §10, grill
  round 3 in docs/grill-record.md -- 5 findings, all resolved). Three
  new, real, confirmed-this-pass facts folded in:
  (1) A real Google Takeout Gemini export now exists at
  ~/Downloads/Google Takeout Aug 26 2026.zip (2,964 bytes; 2 real
  conversations under "Gemini in Workspace", 4,300 + 1,083 bytes; the
  plain "Gemini" category itself empty) -- confirmed via file-listing-only
  inspection (unzip -l), no content read. cm-10's gating precondition is
  now MET for the Takeout path specifically (the separate Share-link path
  remains unstaged, unchanged); cm-02's gemini: not_staged manifest entry
  corrected to gemini: staged (takeout, 2 conversations).
  (2) A real, existing swarm-memory scope (arizona ->
  clients_arizona_compound_memory, ~/.config/swarm-memory/config.toml,
  backing a real project at ~/Documents/work/personal/arizona-compound)
  surfaced a real design gap: cm-06/cm-07 only ever targeted this epic's
  own meta collection. cm-06 gains a read-only scope-resolution sub-step
  (checks swarm-memory's [scopes] table via the same shell-out
  VectorLayerAdapter.remember() already performs, and ~/.mnemosyne/
  org-tree.yaml if present -- confirmed absent on this machine today);
  cm-07 only ever routes to a non-meta scope for a cluster the operator
  has explicitly confirmed in the same human-review queue cm-01/cm-05
  already produce, tagged distinctly (review_reason:
  'scope_route_candidate') -- every unconfirmed cluster still writes
  scope: 'meta', unchanged, no exceptions.
  (3) Two new stories, cm-11-generalized-pipeline-orchestrator and
  cm-12-harvest-cli-verb, package this epic's own discovery->scan->
  triage->cluster->distill pipeline into a parameterized, repeatable
  component + a new `mnemosyne harvest` CLI verb, mirroring
  mnemosyne-repo-onboarding's own onboardRepo()/`mnemosyne onboard`
  precedent exactly. Proven via synthetic/structural correctness tests
  only -- no real second operator's data exists or is available to this
  repo; cm-08's pilot and cm-09's deep-dive test remain the epic's only
  real-data proof. cm-11 depends_on cm-09 explicitly (not built as
  "ready to use" until the operator's own deep-dive has validated the
  real pipeline).

  Round-4 amendment (2026-08-26, docs/design-discussion.md §11, grill
  round 4 in docs/grill-record.md -- 5 findings plus a dedicated
  leak/safety check, all resolved). Operator's own framing, verbatim:
  "it should have an intake and then a way to get into the others as we
  distribute... so meta is separate from intake" -- "mark and distribute
  -- keep an audit trail, then allow for a way to decommission it and
  optionally back it up or just full wipe." Split into three real pieces:
  cm-07 revised (simplified) to write UNCONDITIONALLY to a new `intake`
  landing scope only, never `meta`, never a confirmed scope directly --
  the confirmed-vs-unconfirmed scope-selection logic it owned through
  round 3 moves in full to new story cm-13-intake-distribution, which
  reads intake (a new read-only scroll_points() extension of
  HttpQdrantClient, since no full-enumeration primitive existed before
  this round), resolves the real destination (confirmed scope or meta
  default, identical safe-default discipline), writes via the same
  unchanged remember(), and marks the original intake entry distributed
  via a NEW, additive distribution_marker entry (never an in-place
  mutation -- confirmed this pass that no update-by-id primitive exists
  anywhere in remember()/VectorLayerAdapter.ts). New story cm-14-intake-
  decommission is the epic's first, and by design only, delete-capable
  operation -- removes an already-distributed intake entry from intake
  ONLY, after live-re-verifying (never trusting a stale flag) both the
  marker and the destination copy's real presence, with a default-on
  optional NDJSON backup step mirroring this session's own established
  Qdrant-backup precedent (~/Documents/work/personal/qdrant-backup-
  2026-08-15/). Named explicitly as the epic's one deliberate exception to
  ro-06's/ways_of_working.md's "no delete path exists" discipline --
  never merged into HttpQdrantClient itself, single-entry-only, never
  wired into cm-11/cm-12's automatic pipeline flow. cm-14 does NOT get
  built or run this pass or as part of cm-08's pilot -- gated behind its
  own future, separate operator go-ahead. Story count: 14 (cm-01..cm-14).

  Round-5 amendment (2026-08-27, docs/design-discussion.md §12, grill
  round 5 in docs/grill-record.md -- 5 findings plus the task's own three
  named leak/safety questions, all resolved). Operator's own dogfooding
  framing this pass, verbatim: "we need a ui button that allows us to
  crawl and index the new incoming data and conversations and then a way
  to help us see and parse it apart to the areas, so we should build
  that, then dogfood it." Two new stories add a real UI trigger and a
  real UI review surface to the existing dashboard (ui/index.html/
  ui/app.js, served from src/server.mjs, port 8477 by default -- this
  pass corrected a stale "port 8578" assumption via direct read of both
  servers' own route tables). cm-15-discovery-and-pilot-trigger-ui adds a
  "crawl" (re-run cm-02's discovery scan) button, real operator-marked
  checkboxes over the resulting manifest, and a "run pilot" trigger that
  invokes cm-08's bounded pilot orchestrator over exactly the marked
  subset -- resolved explicitly against cm-08's own no-implicit-selection
  design (its own AC5): the UI flow is a real, HTTP-delivered instance of
  cm-08's own already-named "CLI confirm step" mechanic, never its
  "edited manifest file" mechanic, enforced by three independent layers
  (client-side inline refusal, a real server-side 400 on an empty
  selection, and cm-08's own unchanged CLI-level refusal), never a single
  "crawl everything" button with no per-item confirmation. cm-16-triage-
  review-and-confirm-ui adds a panel reading the real, current triage
  queue (quarantine hits, visibility only, no action -- cm-01's own
  quarantine-retention-policy question, open question #4, is explicitly
  left open, not silently resolved) and the real intake collection's own
  scope-route candidates/distribution markers (via cm-13's own
  scroll_points() primitive, reused not reimplemented), plus a new,
  append-only confirm action writing cm-13's own exact, already-real
  ScopeRouteConfirmationEntry shape via a single fs.appendFileSync call --
  the SAME append-only convention cm-01/cm-05/cm-07/cm-13 already use,
  never a delete/edit of an existing queue line. Both stories avoid
  changing how src/server.mjs itself is launched (confirmed it currently
  cannot import .ts modules directly, per bin/mnemosyne's own plain-node
  launch line and bin/graphify-bridge.mjs's own doc comment naming the
  identical constraint) by following bin/mnemosyne-onboard.mjs's own
  established "small, tsx-launched CLI wrapper, shelled out to via
  execFile()" precedent instead -- the SAME "thin HTTP wrapper shells out
  to a CLI" architecture engine.mjs already uses for every existing route
  in this file. Story count: 16 (cm-01..cm-16).

stories:
  - id: cm-01-secret-credential-scanner
    title: Standalone secret/credential scanning primitive
    complexity: high
    depends_on: []
  - id: cm-02-conversation-source-discovery
    title: Real-source discovery — Claude Code sessions + confirmed exports
    complexity: medium
    depends_on: []
  - id: cm-03-claude-code-session-parser
    title: Claude Code JSONL transcript parser and normalizer
    complexity: high
    depends_on: [cm-01-secret-credential-scanner, cm-02-conversation-source-discovery]
  - id: cm-04-chatgpt-export-parser
    title: ChatGPT export (tree-DAG conversations.json) parser and normalizer
    complexity: high
    depends_on: [cm-01-secret-credential-scanner, cm-02-conversation-source-discovery]
  - id: cm-05-usefulness-trash-triage
    title: Heuristic + LLM usefulness/trash triage with mandatory human review gate
    complexity: high
    depends_on: [cm-03-claude-code-session-parser, cm-04-chatgpt-export-parser]
  - id: cm-06-cross-session-clustering
    title: Embedding-based cross-session clustering faceted by project slug
    complexity: medium
    depends_on: [cm-05-usefulness-trash-triage]
  - id: cm-07-distillation-and-persist
    title: Bounded distillation into memory entries, persisted UNCONDITIONALLY to a new 'intake' landing scope via the shipped remember() cascade
    complexity: high
    depends_on: [cm-06-cross-session-clustering, cm-05-usefulness-trash-triage]
  - id: cm-08-bounded-operator-pilot
    title: Bounded, operator-reviewed pilot over a small real sample
    complexity: medium
    depends_on: [cm-07-distillation-and-persist]
  - id: cm-09-deep-dive-validation-test
    title: Deep-dive validation test — the operator's own named requirement
    complexity: high
    depends_on: [cm-08-bounded-operator-pilot]
  - id: cm-10-gemini-conversation-ingestion
    title: Gemini conversation export (Share-link/Takeout) parser and normalizer — gated on operator staging a real export
    complexity: high
    depends_on: [cm-01-secret-credential-scanner, cm-02-conversation-source-discovery]
  - id: cm-11-generalized-pipeline-orchestrator
    title: Generalized, parameterized pipeline orchestrator — any operator, any machine
    complexity: high
    depends_on: [cm-02-conversation-source-discovery, cm-03-claude-code-session-parser, cm-04-chatgpt-export-parser, cm-05-usefulness-trash-triage, cm-06-cross-session-clustering, cm-07-distillation-and-persist, cm-09-deep-dive-validation-test]
  - id: cm-12-harvest-cli-verb
    title: "mnemosyne harvest CLI verb — generalized pipeline entry point"
    complexity: medium
    depends_on: [cm-11-generalized-pipeline-orchestrator]
  - id: cm-13-intake-distribution
    title: Intake distribution — resolve the real destination (meta or a confirmed scope), write there, mark the original intake entry as distributed
    complexity: high
    depends_on: [cm-07-distillation-and-persist]
  - id: cm-14-intake-decommission
    title: Intake decommission — the epic's ONE deliberate, narrowly-scoped exception to "no delete path exists," removing an already-distributed intake entry only
    complexity: high
    depends_on: [cm-13-intake-distribution]
  - id: cm-15-discovery-and-pilot-trigger-ui
    title: Discovery + pilot trigger UI — crawl for new sources, operator-marked selection, pipeline invocation
    complexity: high
    depends_on: [cm-08-bounded-operator-pilot, cm-02-conversation-source-discovery]
  - id: cm-16-triage-review-and-confirm-ui
    title: Triage review + scope-route confirmation UI — see queue/intake state, confirm a candidate into its real area
    complexity: high
