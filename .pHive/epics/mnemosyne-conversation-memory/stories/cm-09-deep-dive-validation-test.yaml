files_to_modify:
  - file: lib/mnemosyne/conversation-memory/generateDeepDiveReport.ts
    change: "New file: reads cm-08's real pilot artifacts, produces the operator-facing validation report per the acceptance criteria."
  - file: lib/mnemosyne/conversation-memory/generateDeepDiveReport.test.ts
    change: "New file: tests against synthetic pilot-output fixtures, including redaction and completeness assertions."

design_decisions:
  - decision: "This is its own story, never a step folded into cm-08's own test phase."
    rationale: "The operator's own explicit, separately-named requirement ('that will need a DEEP DIVE test') — folding it into cm-08's generic test step would silently demote a requirement the operator stated as its own distinct thing, exactly the failure mode this task's own instructions warned against."
  - decision: "The report covers the FULL pilot sample (100% of triage verdicts), never a representative subset."
    rationale: "A sampled report would undermine the report's own purpose — the operator needs to see everything the pilot actually did before trusting the system with the rest of their real history, not a curated highlight reel."
  - decision: "The report itself is treated as sensitive/local-only, never assumed safe to share by virtue of redaction alone."
    rationale: "`[grill 5.1]` — redacted-but-contextual output (e.g. a redacted AWS_SECRET_ACCESS_KEY=*** line) can still reveal a credential's existence/naming convention; named as a real, accepted residual risk rather than claimed fully solved."

cross_cutting:
  - concern: conversation-privacy-safety
    action: "The report's own redaction guarantee and local-only-sensitivity treatment are this concern's final checkpoint in the epic — the human-facing artifact that makes every upstream safety mechanism's real behavior visible and auditable."
  - concern: documentation
    action: "The report format itself, once generated once for real, should get a short discoverable doc note (what it covers, where it's written, that it's local-only) for future re-runs."
  - concern: loud-failure
    action: "If any of cm-08's expected output artifacts are missing/malformed, the report generator fails loudly naming which artifact — never silently generates a report with gaps presented as complete."

risks:
  - severity: medium
    description: "A report that LOOKS thorough (covers every named section) but whose recall() spot-checks are too narrow/easy could give false confidence about real retrieval quality."
    mitigation: "Research step explicitly designs spot-check queries against the pilot's own real, known topic content (not generic/trivial queries likely to succeed regardless of real quality) — a genuine, not rubber-stamp, check."
  - severity: low
    description: "Report-generation itself could inadvertently become a second place secret-adjacent content gets written (beyond the quarantine queue cm-01/cm-05 already produce)."
    mitigation: "Explicit acceptance criterion + independent reviewer re-verification that no raw secret value appears anywhere in a generated report, tested against real fixture-shaped secrets."

references:
