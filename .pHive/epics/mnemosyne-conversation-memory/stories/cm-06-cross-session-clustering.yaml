id: cm-06-cross-session-clustering
epic: mnemosyne-conversation-memory
title: Embedding-based cross-session clustering faceted by project slug
status: pending
complexity: medium
methodology: tdd
depends_on: [cm-05-usefulness-trash-triage]

description: |
  How related content across DIFFERENT sessions gets correctly grouped by
  topic/theme (docs/design-discussion.md §2.6, required-coverage area
  #3) — the operator's own words, "different overall mixes of which ones
  are helping with what."

  **Real design decision, resolved explicitly (`[grill 2.1]`, docs/
  design-discussion.md §2.6):** clusters `keep` AND `uncertain`
  `cm-05`-verdict sessions — `trash`-verdict sessions never reach this
  story's input at all, not merely excluded from its output.

  **Mechanism:** embedding-based similarity over each session's `cm-05`
  summary (small, bounded text — never the raw transcript, never the
  full normalized-turn list), via the SAME embedder Mnemosyne's vector
  layer already uses in production (no new embedding infrastructure).
  Project-slug (already captured by `cm-02`'s discovery manifest and
  carried through `cm-03`'s `ConversationTurn.projectSlug`) is a
  first-class metadata FACET on top of similarity clustering, never a
  replacement for it — the operator's own quote implies mixing happens
  BOTH within and across project slugs, so slug-only grouping would be
  too coarse.

  **Round-3 addition (2026-08-25, docs/design-discussion.md §10.2) —
  read-only scope-resolution candidate, computed here, acted on nowhere
  in this story. "Scope" disambiguated once, up front, so this sub-step's
  own name never collides with `cm-07`'s existing `scope: 'meta'` field:
  Mnemosyne's own `Scope` TYPE (`interfaces.ts`, `'project'|'enterprise'|
  'meta'`) is the caller-facing enum `remember()` accepts; `swarm-memory`'s
  own `[scopes]` REGISTRY (`config.toml`, real keys like `arizona`) is the
  underlying table that TYPE's values resolve against at runtime — this
  sub-step reads the SECOND one, to propose a candidate value for the
  FIRST one's own parameter. Full three-way detail in §10.2.** a real, confirmed-this-pass fact — `swarm-memory`'s
  own config (`~/.config/swarm-memory/config.toml`, the SAME file
  `VectorLayerAdapter.remember()` already reads via its `swarm-memory
  config` shell-out, `VectorLayerAdapter.ts:213-226`) has a real,
  existing `[scopes]` entry, `arizona = "clients_arizona_compound_
  memory"`, backing a real project at `~/Documents/work/personal/
  arizona-compound` — surfaced a real gap: no design existed for a
  cluster whose project-slug facet clearly matches an EXISTING, already-
  registered scope (this epic's own writes, §2.3, always targeted `meta`
  only). This story now ALSO computes, per cluster, a
  `resolved_scope_candidate` (nullable): a conservative, exact/near
  string match of the cluster's UNAMBIGUOUS project-slug facet (all/
  overwhelming-majority member agreement — a mixed-slug cluster produces
  no candidate) against REAL, ALREADY-EXISTING scope keys read from (a)
  `swarm-memory`'s own `[scopes]` table, via the exact same `swarm-memory
  config` shell-out `VectorLayerAdapter.remember()` already performs
  (never a second, independently-implemented TOML/JSON parse — `[grill
  4.1]`'s "one primitive, reused, never reimplemented" convention,
  applied to an already-shipped OTHER story's own shell-out this time),
  and (b) `~/.mnemosyne/org-tree.yaml`, read defensively if present
  (confirmed THIS pass: it does not exist on this machine today — only
  `~/.mnemosyne/level0-rules.md` is — `ro-04`'s own "missing file is not
  an error" contract applies). **This sub-step is strictly READ-ONLY and
  has ZERO side effects — it never creates a scope, a collection, or an
  org-tree entry, mirroring `ro-06`'s own "Additive-only, by design: no
  delete/drop code path exists anywhere in this module" discipline
  (`mnemosyne/onboarding.py`), extended here to "no CREATE path exists
  either."** A candidate is never acted on by this story — it is
  attached as cluster metadata and surfaced into the SAME human-review
  queue `cm-01`/`cm-05` already produce, tagged `review_reason:
  'scope_route_candidate'` (mirrors `cm-01`'s own `quarantine_reason`
  tagging convention exactly). `cm-07` is the only story that ever acts
  on a CONFIRMED candidate (see `cm-07`'s own YAML) — this story
  proposes, it never decides or writes.

acceptance_criteria:
  - "Given a set of triage-queue entries with keep or uncertain verdicts, when clusterConversations() runs, then every one of them receives a cluster assignment — verified none are silently dropped from clustering"
  - "Given a set of triage-queue entries including trash-verdict sessions, when clusterConversations() runs, then trash-verdict sessions are excluded from the function's INPUT set entirely (never passed in, not merely filtered from output) — verified by a test asserting the embedding call is never made for a trash-verdict session's summary"
  - "Given two sessions with genuinely similar summaries (real semantic overlap) but DIFFERENT project slugs, when clusterConversations() runs, then they CAN be assigned to the same cluster — verified the clustering mechanism is not slug-partitioned by default (a real test proving cross-slug clustering works, not merely asserted)"
  - "Given a cluster assignment, when inspected, then it carries both a cluster_id and the real project-slug facet(s) of its member sessions — the facet is available as a queryable/filterable dimension alongside the similarity-based grouping, never discarded after clustering runs"
  - "Given the SAME input set run twice, when clusterConversations() runs, then cluster assignments are stable/reproducible (verified directly — not merely a hope) for a deterministic clustering algorithm choice, OR any non-determinism in the chosen approach is named explicitly as an accepted characteristic in this story's own design_decisions, never silently assumed away"
  - "Given a cluster whose member sessions UNAMBIGUOUSLY share a project-slug facet that exactly/near-matches a REAL, already-existing key in swarm-memory's own [scopes] table (read via the same swarm-memory config shell-out VectorLayerAdapter.remember() already performs — never a second, independent config-file parser), when clusterConversations() runs, then that cluster's metadata carries a resolved_scope_candidate naming the matched scope key and its real collection name — verified against a stubbed [scopes] table in the test, never a live read of this operator's own real config.toml in the automated suite"
  - "Given a cluster whose member sessions span genuinely MIXED, non-dominant project slugs (no single slug held by all/an overwhelming majority of members), when clusterConversations() runs, then resolved_scope_candidate is null for that cluster — never a best-guess match on an ambiguous case"
  - "Given a cluster with a resolved_scope_candidate, when clusterConversations() runs, then NO write, create, or mutation of any kind occurs against the scope registry (swarm-memory's config.toml, org-tree.yaml, or any Qdrant collection) — verified by a test asserting zero write/create calls are made anywhere in this function, matching ro-06's own additive-only, never-auto-create-speculatively discipline extended to 'read-only, full stop' for this story"
  - "Given ~/.mnemosyne/org-tree.yaml does not exist (the real, confirmed-this-pass state on this machine), when clusterConversations() runs, then it completes normally with no error and no candidate contributed from that source — mirrors ro-04's own established 'missing file is not an error, returns empty' contract, never assumed to require the file's existence"

steps:
  - id: research
    description: |
      Confirm the real embedder Mnemosyne's vector layer uses in
      production (read the live VectorLayerAdapter/client.ts embedding
      call, not assumed). Decide the real clustering algorithm (a simple
      similarity-threshold/agglomerative approach vs. a library
      dependency) — if a new dependency is introduced, validate it via
      context7/web research at this step per this repo's own always-on
      validation discipline (not assumed safe because it's a common
      library). Confirm the exact real shell-out VectorLayerAdapter.ts
      makes to read swarm-memory's [scopes] table (`swarm-memory config`,
      VectorLayerAdapter.ts:213-226) so this story's own scope-resolution
      sub-step reuses that exact call rather than re-implementing a
      TOML/JSON parse of config.toml directly (docs/design-discussion.md
      §10.2). Confirm ~/.mnemosyne/org-tree.yaml's real current schema
      (ro-04's orgTree.ts) for the fallback lookup, even though it does
      not exist on this machine today.
    agent: researcher
  - id: test-spec
    description: |
      Write failing tests against a stubbed embedder (never a live
      embedding call in the automated suite) and synthetic triage-queue
      fixtures covering every acceptance criterion, including the
      cross-slug clustering case and the trash-exclusion case.
    agent: tester
    depends_on: [research]
  - id: implement
    description: |
      Implement lib/mnemosyne/conversation-memory/clusterConversations.ts:
      keep/uncertain filtering, embedding calls over summaries,
      similarity-based grouping, project-slug facet attachment.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: |
      Independently re-verify trash-verdict sessions never reach the
      embedding call (read the diff), confirm cross-slug clustering is
      real (not accidentally slug-partitioned by an implementation
      shortcut).
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feat/mnemosyne-conversation-memory.
    agent: developer
    depends_on: [review]

