design_decisions:
  - decision: "Clustering input is cm-05's own SUMMARIES, never raw transcripts or the full normalized-turn list."
    rationale: "Keeps embedding-call volume/cost bounded (one small summary per session, not per-turn or per-chunk), and mirrors this epic's own consistent 'distilled text, not raw content' discipline (design-discussion §2.1, §2.7)."
  - decision: "Project-slug is a facet alongside similarity, never a partition boundary."
    rationale: "The operator's own quote ('different overall mixes of which ones are helping with what') implies real cross-project topical overlap that a slug-only grouping would miss."
  - decision: "Scope-resolution is a PROPOSAL this story computes, never a DECISION it acts on — the actual scope value used at persist time is chosen exclusively by cm-07, gated on explicit operator confirmation."
    rationale: "docs/design-discussion.md §10.2 — a wrong-scope route (personal content landing in a client-facing collection) is the single highest-severity failure mode this design point could introduce; keeping the read-only PROPOSE step (here) structurally separate from the WRITE step (cm-07, gated on confirmation) means no code path in this story can ever cause that outcome by construction, not merely by discipline."
  - decision: "Scope match requires unambiguous cluster-level project-slug agreement — a mixed-slug cluster never produces a candidate."
    rationale: "A confident-looking but wrong match on an ambiguous cluster would be worse than no match at all, given the residual-risk severity named in §10.2; erring toward null is the safe default."

cross_cutting:
  - concern: conversation-privacy-safety
    action: "The scope-resolution sub-step (round 3, §10.2) is read-only against real, already-existing scope registries only, never creates a scope/collection, and never itself routes a write — it only ever proposes a candidate into the same human-review queue cm-01/cm-05 already produce, tagged review_reason: 'scope_route_candidate', requiring cm-07's own separate, explicit-confirmation gate before any non-meta write ever happens."
  - concern: existing-infrastructure
    action: "Reuses the vector layer's existing embedder — no new embedding infrastructure, no new external API credential surface beyond what remember()'s vector layer already requires in production. Round 3: reuses VectorLayerAdapter's own existing 'swarm-memory config' shell-out for scope-table reads, and ro-04's orgTree.ts read path for org-tree.yaml — no new config-reading mechanism introduced."
  - concern: provenance-completeness
    action: "Every cluster assignment carries the real project-slug facet(s) of its members, traceable back to cm-02's discovery manifest, plus (round 3) the resolved_scope_candidate (nullable) and which registry it matched against."

risks:
  - severity: low
    description: "Embedding-based clustering could produce clusters that don't map to anything the operator recognizes (R10, docs/design-discussion.md §4 risk registry)."
    mitigation: "Project-slug facet anchors clusters to a real, recognizable signal alongside pure similarity; cm-09's deep-dive report explicitly surfaces cluster assignments for the pilot sample so the operator can judge real cluster quality before any scale-out."
  - severity: high
    description: "A project-slug match against a real, already-existing scope key (e.g. arizona) is a HEURISTIC, not a guarantee — a coincidental slug collision or a tangential mention could produce a resolved_scope_candidate for a cluster that doesn't actually belong to that scope (docs/design-discussion.md §10.2's own named residual risk)."
    mitigation: "This story never acts on a candidate — it only proposes one into the human-review queue, requiring cm-07's own separate, explicit per-cluster operator confirmation before any non-meta write occurs (§10.2); the unambiguous-agreement requirement above (mixed-slug clusters produce no candidate) further narrows when a candidate is even proposed."

