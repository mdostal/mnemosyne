    relevant_excerpt: "§2.6 and `[grill 2.1]` — the full clustering design and the resolved keep/uncertain-only input-set decision."
  - path: .pHive/epics/mnemosyne-conversation-memory/docs/structured-outline.md
    relevant_excerpt: "§4 risk registry R10 — clusters not mapping to operator-recognizable groupings, and its named mitigation."

