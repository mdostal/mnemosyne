design_decisions:
  - decision: "Genuinely gated on a real, named precondition (a staged export in cm-02's discovery list) — never built against invented sample data, and the research step's first job is re-confirming the precondition is still unmet before any further work."
    rationale: "docs/design-discussion.md §5 open question 5's original recommendation (round 1) — 'building a parser against invented sample data violates this session's own real-data-not-assumed discipline' — still holds; round 2's correction (§9) fixes the FRAMING (reachable, not absent) without abandoning that discipline. The real moving-chaos Share-link artifact proves the mechanism, not a ready-made fixture corpus for this epic."
  - decision: "The moving-chaos Share-link export is NOT pulled into this epic's fixtures or pilot sample automatically."
    rationale: "It belongs to an unrelated personal project (relocation planning) the operator saved for that project's own purposes — using it here without the operator's separate, explicit opt-in would be exactly the kind of silent scope-widening this epic's own privacy-safety posture (§2.8) exists to prevent."
  - decision: "Two possible real export shapes (Share-link HTML, Takeout bulk export) are both named, with implementation scoped to whichever the operator actually stages first — not both built speculatively."
    rationale: "The two are structurally different (single-conversation client-rendered SPA capture vs. a bulk, Google-defined Takeout schema) and only one is proven to exist as a real, producible artifact on this machine today (Share-link, §9.3); building a Takeout parser against no real sample would repeat exactly the mistake round 1's own recommendation warned against for Gemini generally."

cross_cutting:
  - concern: conversation-privacy-safety
    action: "cm-01's scanner runs over every extracted turn — identical parse-time checkpoint to cm-03/cm-04. The gating precondition itself is a privacy-safety control: no real personal Gemini content is processed by this story until the operator explicitly stages it for this purpose."
  - concern: provenance-completeness
    action: "Every ConversationTurn carries sessionId (derived from the Share-link id or Takeout entry id), timestamp, and a projectSlug of null (mirrors cm-04's own 'explicit empty over omission' convention for a source with no repo/project association)."
  - concern: existing-infrastructure
    action: "Zero new persistence mechanism — output feeds cm-05/cm-06/cm-07 exactly like cm-03/cm-04's output does, through the same shared ConversationTurn contract, once this story is actually built."

risks:
  - severity: low
    description: "This story may never actually start if the operator never stages a real Gemini export — a real, accepted possibility, not a defect in this story's own design."
    mitigation: "Named explicitly as an accepted, gated outcome (design-discussion §9.8) — the story exists so Gemini is a real, reachable, trackable part of this epic's own plan, not so it is guaranteed to build regardless of real preconditions."
  - severity: medium
    description: "A Share-link HTML capture's AF_initDataCallback blob format is Google-internal and undocumented publicly — it could change or vary across capture dates without warning, unlike ChatGPT's own more stable conversations.json export format."
    mitigation: "Research step re-confirms the real, current shape directly against whatever export is actually staged at build time (never trusting this planning pass's own §9.3 findings as still-accurate without re-verification) — mirrors cm-04's own 're-confirm the real shape directly... do not build from citations alone' discipline."

