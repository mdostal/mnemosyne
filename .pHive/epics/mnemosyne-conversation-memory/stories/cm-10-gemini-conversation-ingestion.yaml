id: cm-10-gemini-conversation-ingestion
epic: mnemosyne-conversation-memory
title: Gemini conversation export (Share-link/Takeout) parser and normalizer — gated on operator staging a real export
status: pending
complexity: high
methodology: tdd
depends_on: [cm-01-secret-credential-scanner, cm-02-conversation-source-discovery]
parallel_allowed: false
parallel_rationale: "Genuinely blocked on a real precondition (below), unlike cm-03/cm-04's parallel_allowed: true — this story cannot start real (non-speculative) implementation until the precondition is met, so it is not offered as a parallel-eligible slice of this epic's own build sequence."

description: |
  A real, reachable (not absent) third sibling of `cm-03`/`cm-04` — same
  normalized `ConversationTurn[]` output contract (docs/design-
  discussion.md §2.1), different input parser — added by the round-2
  correction documented in docs/design-discussion.md §9 after the
  operator flagged round 1's "Gemini confirmed absent" conclusion as
  wrong.

  **Gated, not speculative — the real, named precondition, stated
  explicitly so this story is never started against invented sample
  data (this epic's own "real data, not assumed" discipline, §5 open
  question 5 as originally stated):** `cm-02`'s discovery manifest must
  contain at least one Gemini export the operator has explicitly staged
  into its fixed, named export-file list (the same convention the
  ChatGPT export already follows) — either (a) one or more Gemini
  "Share" public-link captures (`gemini.google.com/share/<id>`, saved as
  raw HTML the way a real example already exists on this machine at
  `~/Documents/work/moving-chaos/source_index/gemini_share_raw.html` —
  proof-of-mechanism only, NOT pulled into this epic's own fixtures or
  pilot sample without the operator's separate, explicit opt-in, since it
  belongs to an unrelated personal project, design-discussion §9.8), or
  (b) a future Google Takeout "Gemini Apps Activity" bulk export (design-
  discussion §9.4 confirms none exists on this machine today). Until
  that precondition is met, this story's `research` step's own first
  task is confirming it is STILL unmet (not assumed stale) before any
  further work proceeds — mirroring `ro-11`'s own "re-checked before
  every operation, never checked once and trusted" discipline, applied
  here to a planning-time precondition instead of a runtime guard.

  Two real, structurally distinct input shapes this story's research step
  must pin down BEFORE implementation (never assumed identical to
  `cm-04`'s ChatGPT tree-DAG shape just because both are AI-chat
  exports):
  - **Share-link HTML capture:** a saved `gemini.google.com/share/<id>`
    page. Real, confirmed this pass (design-discussion §9.3): the page is
    a client-rendered SPA whose real conversation data is embedded in
    inline `AF_initDataCallback` JS data-hydration blobs (Google's
    standard SPA-state pattern — structurally the same FAMILY of
    mechanism as ChatGPT's own `__NEXT_DATA__` blob, per `cm-04`'s own
    research, but a different, Google-specific JSON shape that has never
    been parsed by any story in this epic and must be re-confirmed
    directly against a real staged export, not assumed from this
    story's own description).
  - **Takeout "Gemini Apps Activity" export:** format not yet confirmed
    on this machine (none exists, §9.4) — this story's research step
    must obtain Google's own current, real Takeout schema documentation
    (or a real sample, if the operator produces one) before designing a
    parser, never inventing a schema from assumption.

  Runs `cm-01`'s `scanForSecrets()` over every extracted turn, identical
  discipline to `cm-03`/`cm-04` (docs/design-discussion.md §2.8).

acceptance_criteria:
  - "Given cm-02's real, current discovery manifest, when this story's research step runs, then it explicitly confirms whether a real Gemini export is staged — if none is staged, the story halts at research with a loudly-stated 'precondition not met' finding, never proceeding to test-spec/implement against invented sample data"
  - "Given a real, operator-staged Share-link HTML capture, when parseGeminiShareExport() runs, then it extracts the AF_initDataCallback data-hydration blob(s), parses the real (research-confirmed, not assumed) turn structure, and produces one ConversationTurn per real message, in chronological order, with role values normalized to the same 'system'|'user'|'assistant' set cm-03/cm-04 already use"
  - "Given a real, operator-staged Takeout Gemini Apps Activity export, when parseGeminiTakeoutExport() runs, then it produces the same normalized ConversationTurn[] shape, against the real, current Takeout schema confirmed by this story's own research step (never an assumed/invented schema)"
  - "Given extracted text containing a fixture secret (cm-01's own test corpus), when either parser runs, then the corresponding ConversationTurn is flagged as quarantined, identical behavior to cm-03/cm-04's own quarantine acceptance criterion"
  - "Given this story's own fixtures, when reviewed, then they are synthetic, schema-accurate constructions — never the operator's real moving-chaos Share-link content, and never any other real personal conversation content, mirroring cm-04's own 'never the operator's actual export content in the automated suite' rule"

steps:
  - id: research
    description: |
      FIRST task, before anything else: re-confirm cm-02's discovery
      manifest for a real staged Gemini export. If none exists, stop
      here and report the precondition as still unmet — do not proceed
      to test-spec/implement. If one exists, re-read it directly (not
      from this story's own description alone) to confirm the real
      AF_initDataCallback blob shape (Share-link case) or the real
      Takeout schema (bulk-export case), specifically hunting for a
      multi-turn, real example the way cm-04's own research step hunted
      for a real multi-branch ChatGPT conversation.
    agent: researcher
  - id: test-spec
    description: |
      Write failing tests against real-shaped FIXTURE data (synthetic
      content mirroring the real, research-confirmed schema exactly,
      never the operator's actual staged export content in the automated
      suite) covering every acceptance criterion.
    agent: tester
    depends_on: [research]
  - id: implement
    description: |
      Implement lib/mnemosyne/conversation-memory/parseGeminiShareExport.ts
      and/or lib/mnemosyne/conversation-memory/parseGeminiTakeoutExport.ts
      (whichever real export type(s) are actually staged, per the research
      step's own finding): data-blob/schema parsing, role/content
      extraction into cm-03's shared ConversationTurn shape, cm-01 scan
      integration.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: |
      Independently re-verify the parser's correctness against the real
      staged export's actual shape (not just the synthetic fixtures);
      confirm cm-01's scanner is genuinely called; confirm no real
      personal conversation content leaked into the committed fixture
      corpus.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feat/mnemosyne-conversation-memory.
    agent: developer
    depends_on: [review]

