id: cm-10-gemini-conversation-ingestion
epic: mnemosyne-conversation-memory
title: Gemini conversation export (Share-link/Takeout) parser and normalizer — gated on operator staging a real export
status: pending
complexity: high
methodology: tdd
depends_on: [cm-01-secret-credential-scanner, cm-02-conversation-source-discovery]
parallel_allowed: true
parallel_rationale: "REVISED (round 3, docs/design-discussion.md §10.1): the precondition below is now MET for the Takeout export shape specifically — a real, small (2-conversation) Gemini Takeout export is staged in cm-02's fixed, named export-file list (~/Downloads/Google Takeout Aug 26 2026.zip). This story is no longer purely speculative for that shape, so it is now offered as a parallel-eligible slice like cm-03/cm-04, scoped to the Takeout parser specifically. The Share-link parser half remains genuinely gated — the moving-chaos artifact stays proven-as-mechanism-only, not opted into this epic (§9.8, unchanged) — so an implementer picking up this story should expect to build parseGeminiTakeoutExport.ts first/only, unless the operator separately opts the Share-link artifact in. **Precisely scoped, not overclaimed (docs/grill-record.md round 3 finding 5):** 'parallel-eligible' here means the research/schema-confirmation and implementation steps can now genuinely START against real data — it does NOT mean the parser is proven trivial or low-risk to build. The staged sample is real but tiny (2 conversations), its real schema is still wholly unconfirmed by this planning pass (content-level research is this story's own build-time job, never performed here — §10.1), and the 'Gemini in Workspace' vs. standalone-consumer-app schema question remains genuinely open. Treat this flip as 'no longer blocked from starting,' not as 'de-risked.'"

description: |
  A real, reachable (not absent) third sibling of `cm-03`/`cm-04` — same
  normalized `ConversationTurn[]` output contract (docs/design-
  discussion.md §2.1), different input parser — added by the round-2
  correction documented in docs/design-discussion.md §9 after the
  operator flagged round 1's "Gemini confirmed absent" conclusion as
  wrong.

  **Gated, not speculative — the real, named precondition, stated
  explicitly so this story is never started against invented sample
  data (this epic's own "real data, not assumed" discipline, §5 open
  question 5 as originally stated):** `cm-02`'s discovery manifest must
  contain at least one Gemini export the operator has explicitly staged
  into its fixed, named export-file list (the same convention the
  ChatGPT export already follows) — either (a) one or more Gemini
  "Share" public-link captures (`gemini.google.com/share/<id>`, saved as
  raw HTML the way a real example already exists on this machine at
  `~/Documents/work/moving-chaos/source_index/gemini_share_raw.html` —
  proof-of-mechanism only, NOT pulled into this epic's own fixtures or
  pilot sample without the operator's separate, explicit opt-in, since it
  belongs to an unrelated personal project, design-discussion §9.8), or
  (b) a future Google Takeout "Gemini Apps Activity" bulk export (design-
  discussion §9.4 confirms none exists on this machine today). Until
  that precondition is met, this story's `research` step's own first
  task is confirming it is STILL unmet (not assumed stale) before any
  further work proceeds — mirroring `ro-11`'s own "re-checked before
  every operation, never checked once and trusted" discipline, applied
  here to a planning-time precondition instead of a runtime guard.

  **Round-3 update (2026-08-25, docs/design-discussion.md §10.1) — the
  gating precondition above is now MET for the Takeout shape
  specifically.** A real Google Takeout export now exists at
  `~/Downloads/Google Takeout Aug 26 2026.zip` (2,964 bytes), staged into
  `cm-02`'s fixed, named export-file list. Confirmed this pass via a
  file-listing-only inspection (`unzip -l` — no content extracted or
  read, per this pass's own hard privacy constraint): 2 real conversation
  files under `Takeout/Gemini in Workspace/Conversation History/`
  (4,300 and 1,083 bytes), plus an empty plain-`Gemini`-category pair of
  files (11 bytes each — no scheduled-actions/gems data). This is real
  but SMALL — 2 conversations, not a comprehensive account-wide history —
  and it surfaces a genuinely new, previously-unconsidered nuance: the
  content lives under Google's **`Gemini in Workspace`** Takeout category
  specifically, a real, distinct product surface (the Workspace side-panel
  assistant in Gmail/Docs/Sheets) this story's own research step must
  confirm is schema-equivalent to (or distinct from) the standalone
  consumer `gemini.google.com` app's own Takeout export — never assumed
  identical to the Share-link shape below just because both say "Gemini."
  The Share-link path's own precondition (below) remains SEPARATELY
  unmet — this correction does not change that.

  Two real, structurally distinct input shapes this story's research step
  must pin down BEFORE implementation (never assumed identical to
  `cm-04`'s ChatGPT tree-DAG shape just because both are AI-chat
  exports):
  - **Share-link HTML capture:** a saved `gemini.google.com/share/<id>`
    page. Real, confirmed this pass (design-discussion §9.3): the page is
    a client-rendered SPA whose real conversation data is embedded in
    inline `AF_initDataCallback` JS data-hydration blobs (Google's
    standard SPA-state pattern — structurally the same FAMILY of
    mechanism as ChatGPT's own `__NEXT_DATA__` blob, per `cm-04`'s own
    research, but a different, Google-specific JSON shape that has never
    been parsed by any story in this epic and must be re-confirmed
    directly against a real staged export, not assumed from this
    story's own description).
  - **Takeout "Gemini Apps Activity" / "Gemini in Workspace" export:**
    a real, staged sample now exists as of round 3
    (`~/Downloads/Google Takeout Aug 26 2026.zip`, §10.1) — 2 real
    conversation files under `Gemini in Workspace/Conversation History/`.
    This planning pass performed NO content-level inspection of that
    file (file-listing-only, per its own hard privacy constraint) — this
    story's own research step, at build time, must open and confirm the
    real schema directly against that staged file (legitimate, real
    build-time research, distinct from this planning pass's own
    constraint), never inventing a schema from Google's general
    documentation alone, and must explicitly confirm whether `Gemini in
    Workspace`'s export schema matches the standalone consumer
    `gemini.google.com` app's own Takeout category (the plain `Gemini`
    category in this same export was itself empty, so that comparison
    remains genuinely unconfirmed) before designing the parser.

  Runs `cm-01`'s `scanForSecrets()` over every extracted turn, identical
  discipline to `cm-03`/`cm-04` (docs/design-discussion.md §2.8).

acceptance_criteria:
  - "Given cm-02's real, current discovery manifest, when this story's research step runs, then it explicitly confirms whether a real Gemini export is staged — if none is staged, the story halts at research with a loudly-stated 'precondition not met' finding, never proceeding to test-spec/implement against invented sample data"
  - "Given this round-3 amendment's own re-confirmation (docs/design-discussion.md §10.1), the Takeout precondition is now MET — a real, staged Gemini Takeout export (2 conversations, under 'Gemini in Workspace') sits in cm-02's fixed, named export-file list; this story's own research step, when it actually runs at build time, must re-confirm this directly against the live manifest rather than trusting this planning pass's own finding as still-current (mirrors this story's own already-established 're-checked before every operation, never checked once and trusted' discipline, applied here to its own precondition-status finding, not just the original unmet-state check)"
  - "Given a real, operator-staged Share-link HTML capture, when parseGeminiShareExport() runs, then it extracts the AF_initDataCallback data-hydration blob(s), parses the real (research-confirmed, not assumed) turn structure, and produces one ConversationTurn per real message, in chronological order, with role values normalized to the same 'system'|'user'|'assistant' set cm-03/cm-04 already use"
  - "Given a real, operator-staged Takeout export, when parseGeminiTakeoutExport() runs, then it produces the same normalized ConversationTurn[] shape, against the real, current Takeout schema confirmed directly against the actually-staged file by this story's own research step (never an assumed/invented schema, and never assumed identical to the Share-link shape or a generic 'Gemini Takeout' shape merely because both share the word 'Gemini')"
  - "Given extracted text containing a fixture secret (cm-01's own test corpus), when either parser runs, then the corresponding ConversationTurn is flagged as quarantined, identical behavior to cm-03/cm-04's own quarantine acceptance criterion"
  - "Given this story's own fixtures, when reviewed, then they are synthetic, schema-accurate constructions — never the operator's real moving-chaos Share-link content, never the operator's real staged Takeout content either, and never any other real personal conversation content, mirroring cm-04's own 'never the operator's actual export content in the automated suite' rule"

steps:
  - id: research
    description: |
      FIRST task, before anything else: re-confirm cm-02's discovery
      manifest for a real staged Gemini export. As of round 3 (design-
      discussion.md §10.1), the Takeout shape's own precondition is MET —
      re-confirm this directly at build time (never trust this planning
      pass's own finding as still-current); if the manifest no longer
      shows it staged, stop and report the precondition as unmet again,
      do not assume it's still true. The Share-link shape remains
      separately unmet — confirm this too, independently. If a real
      export is confirmed staged, re-read it directly (not from this
      story's own description alone) to confirm the real
      AF_initDataCallback blob shape (Share-link case) or the real
      Takeout schema (bulk-export case, including whether `Gemini in
      Workspace` matches the standalone consumer app's own category),
      specifically hunting for a multi-turn, real example the way
      `cm-04`'s own research step hunted for a real multi-branch ChatGPT
      conversation. This content-level inspection is a legitimate
      build-time research activity — distinct from, and not performed by,
      this planning-only amendment pass, which read the export's file
      listing only.
    agent: researcher
  - id: test-spec
    description: |
      Write failing tests against real-shaped FIXTURE data (synthetic
      content mirroring the real, research-confirmed schema exactly,
      never the operator's actual staged export content in the automated
      suite) covering every acceptance criterion.
    agent: tester
    depends_on: [research]
  - id: implement
    description: |
      Implement lib/mnemosyne/conversation-memory/parseGeminiShareExport.ts
      and/or lib/mnemosyne/conversation-memory/parseGeminiTakeoutExport.ts
      (whichever real export type(s) are actually staged, per the research
      step's own finding): data-blob/schema parsing, role/content
      extraction into cm-03's shared ConversationTurn shape, cm-01 scan
      integration.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: |
      Independently re-verify the parser's correctness against the real
      staged export's actual shape (not just the synthetic fixtures);
      confirm cm-01's scanner is genuinely called; confirm no real
      personal conversation content leaked into the committed fixture
      corpus.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feat/mnemosyne-conversation-memory.
    agent: developer
    depends_on: [review]

