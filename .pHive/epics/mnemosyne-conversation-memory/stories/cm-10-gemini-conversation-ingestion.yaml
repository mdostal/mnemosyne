design_decisions:
  - decision: "Genuinely gated on a real, named precondition (a staged export in cm-02's discovery list) — never built against invented sample data, and the research step's first job is re-confirming the precondition's real, current status before any further work."
    rationale: "docs/design-discussion.md §5 open question 5's original recommendation (round 1) — 'building a parser against invented sample data violates this session's own real-data-not-assumed discipline' — still holds; round 2's correction (§9) fixed the FRAMING (reachable, not absent) without abandoning that discipline. Round 3 (§10.1) goes further: the Takeout precondition is now genuinely MET, not merely reframed — a real, small, 2-conversation export is staged, so this story is no longer purely speculative for that shape. The Share-link shape's precondition remains separately unmet, unchanged by this correction."
  - decision: "The moving-chaos Share-link export is NOT pulled into this epic's fixtures or pilot sample automatically."
    rationale: "It belongs to an unrelated personal project (relocation planning) the operator saved for that project's own purposes — using it here without the operator's separate, explicit opt-in would be exactly the kind of silent scope-widening this epic's own privacy-safety posture (§2.8) exists to prevent. Unchanged by round 3 — the newly-staged Takeout export is a DIFFERENT, separately-confirmed real fact, not a reason to relax this decision for the Share-link artifact."
  - decision: "Two possible real export shapes (Share-link HTML, Takeout bulk export) are both named, with implementation scoped to whichever the operator has actually staged — not both built speculatively."
    rationale: "The two are structurally different (single-conversation client-rendered SPA capture vs. a bulk, Google-defined Takeout schema). As of round 3 (§10.1), the Takeout shape has moved from 'proven-as-mechanism-only' to 'genuinely staged, real, small sample available' — the Share-link shape has not made that same transition (still proven-as-mechanism-only via the unrelated moving-chaos artifact, not opted in). Implementation should therefore target the Takeout parser first/only unless the operator separately stages a Share-link export too — never build the Share-link parser against invented data just because the Takeout parser is now real."

cross_cutting:
  - concern: conversation-privacy-safety
    action: "cm-01's scanner runs over every extracted turn — identical parse-time checkpoint to cm-03/cm-04. The gating precondition itself is a privacy-safety control: no real personal Gemini content is processed by this story until the operator explicitly stages it for this purpose."
  - concern: provenance-completeness
    action: "Every ConversationTurn carries sessionId (derived from the Share-link id or Takeout entry id), timestamp, and a projectSlug of null (mirrors cm-04's own 'explicit empty over omission' convention for a source with no repo/project association)."
  - concern: existing-infrastructure
    action: "Zero new persistence mechanism — output feeds cm-05/cm-06/cm-07 exactly like cm-03/cm-04's output does, through the same shared ConversationTurn contract, once this story is actually built."

risks:
  - severity: low
    description: "This story's Share-link half may never actually start if the operator never separately opts the moving-chaos artifact in (or produces a new Share-link capture) — a real, accepted possibility, not a defect in this story's own design. The Takeout half's own blocking precondition is now resolved (round 3, §10.1), so that half is realistically buildable as soon as this planning pass's own no-build-out restriction lifts."
    mitigation: "Named explicitly as an accepted, gated outcome for the Share-link half (design-discussion §9.8, unchanged) — the story exists so Gemini is a real, reachable, trackable part of this epic's own plan, not so both shapes are guaranteed to build regardless of real preconditions. The Takeout half's real availability (§10.1) is itself the concrete proof this gating discipline works as designed: it stayed unbuilt exactly until a real precondition was met, never built speculatively in the interim."
  - severity: medium
    description: "A Share-link HTML capture's AF_initDataCallback blob format is Google-internal and undocumented publicly — it could change or vary across capture dates without warning, unlike ChatGPT's own more stable conversations.json export format."
    mitigation: "Research step re-confirms the real, current shape directly against whatever export is actually staged at build time (never trusting this planning pass's own §9.3 findings as still-accurate without re-verification) — mirrors cm-04's own 're-confirm the real shape directly... do not build from citations alone' discipline."
  - severity: medium
    description: "The real staged Takeout export's small size (2 conversations) may not exercise every real structural variation the Takeout schema allows (e.g. multi-turn branching if Gemini supports it, attachments, tool-use turns) — a parser built and tested against only 2 real conversations could pass its own tests while still missing a real edge case a larger, more varied corpus would surface."
    mitigation: "Named explicitly, not claimed solved by the precondition merely being met — cm-09's own deep-dive report (if this story's output is ever included in a future pilot iteration, §10.4) is where real coverage gaps would actually surface; this story's own acceptance criteria are honest about testing against what's actually staged, not a claim of exhaustive real-world coverage."

