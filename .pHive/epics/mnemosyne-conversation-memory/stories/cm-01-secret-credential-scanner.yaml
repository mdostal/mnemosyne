id: cm-01-secret-credential-scanner
epic: mnemosyne-conversation-memory
title: Standalone secret/credential scanning primitive
status: pending
complexity: high
methodology: tdd
depends_on: []
parallel_allowed: true
parallel_rationale: bounded-slice

description: |
  The single highest-blast-radius piece of this epic (docs/design-
  discussion.md §2.8, §3), held to `ro-11`'s SSRF-guard rigor exactly:
  a firm, default-on, no-bypass-anywhere detector for API-key-shaped
  tokens, bearer tokens, PEM private-key blocks, and connection strings
  with embedded credentials, run over conversation content BEFORE it is
  ever handed to an LLM classification call (`cm-05`) or a `remember()`
  persist call (`cm-07`).

  This is a PURE module — no I/O, no network, no persistence, no
  dependency on any other story in this epic. Every other new module in
  this epic (`cm-03`, `cm-04`, `cm-07`) imports and calls this ONE
  exported function; no story reimplements its own copy (design-
  discussion.md `[grill 4.1]` — this was a real grill finding: the
  original draft risked three independent, drifting copies of secret-
  detection logic, one per call site).

  Real precedent, not a novel pattern: mirrors `crawlAndIngest.ts`'s SSRF
  guard's own documented posture almost verbatim — "FIRM and default-on.
  No flag, option, or environment variable exists anywhere in this
  module to bypass it, for any target, under any circumstance — this is
  intentional and load-bearing, not an oversight to 'fix' later." Applied
  here to detected-secret content instead of a resolved IP address.

  Explicit non-goals (never hand-waved):
  - Not a general-purpose static-analysis/SAST secret scanner (no
    integration with an external tool like gitleaks/trufflehog in this
    story's first cut — a pure, dependency-free, in-process detector).
  - Not guaranteed to catch every possible secret shape — real detection
    coverage is a measured, reported number from this story's own test
    corpus (false-negative/false-positive rates), never claimed as
    "100% safe."
  - Does not decide RETENTION policy for quarantined content (open
    question #4, docs/design-discussion.md §5) — this story detects and
    reports; the retention/access-policy decision is a separate,
    explicit operator answer this story's implementation step must
    surface as a question, not silently resolve.

acceptance_criteria:
  - "Given a text string containing a recognizable API-key-shaped token (e.g. an `sk-`-prefixed string, an `AKIA`-prefixed AWS access key ID, a `ghp_`-prefixed GitHub token, an `xox[bp]-`-prefixed Slack token), when scanForSecrets(text) runs, then it returns a match with a category naming the recognized pattern and a redacted preview (never the raw matched value) in its output"
  - "Given a text string containing a PEM private-key block (`-----BEGIN ... PRIVATE KEY-----` ... `-----END ... PRIVATE KEY-----`), when scanForSecrets(text) runs, then it returns a match categorized distinctly from API-key-shaped tokens"
  - "Given a text string containing a connection string with embedded credentials (e.g. `postgres://user:password@host:5432/db`), when scanForSecrets(text) runs, then it returns a match categorized distinctly, with the credential portion redacted in the preview"
  - "Given a text string with NO recognizable secret shape, when scanForSecrets(text) runs, then it returns zero matches — verified against a real, checked-in false-positive corpus (UUIDs, git commit hashes, long non-secret identifiers) to bound the false-positive rate as a real, measured number reported in the test output, not assumed zero"
  - "Given the module's full public API, when reviewed, then no flag, option, parameter, or environment variable exists anywhere that suppresses or bypasses detection for any category, for any input — mirrors crawlAndIngest.ts's SSRF guard's own 'no escape hatch' posture, independently re-verified by the review step reading the diff, not trusting the description"
  - "Given a redacted preview in any match result, when inspected, then it contains enough context to identify the CATEGORY and rough LOCATION of the finding but never the full raw secret value — verified by a test asserting the raw fixture secret value never appears verbatim in scanForSecrets()'s own output"
  - "Given this module is imported by cm-03/cm-04 (parse-time) and cm-07 (persist-time), when either call site is reviewed, then exactly one shared function is called — no duplicate/parallel detection logic exists in any of those three modules' own source"

steps:
  - id: research
    description: |
      Survey real, common secret shapes to build the detection pattern
      list (API-key prefixes used by major providers, PEM block markers,
      connection-string credential syntax). Build two real, checked-in
      fixture corpora: (1) known-shaped-but-fake secrets (never real
      operator credentials) covering each category, (2) a false-positive
      corpus of legitimate non-secret strings that could plausibly
      trigger a naive detector (UUIDs, hashes, long tokens). Confirm no
      existing secret-scanning dependency exists in package.json (this is
      genuinely new code, not a reuse — matches ro-11's own "no existing
      precedent, confirmed via repo-wide grep" discipline for its SSRF
      guard).
    agent: researcher
  - id: test-spec
    description: |
      Write failing tests against both fixture corpora covering every
      acceptance criterion above, including the "no bypass exists"
      static-review-style check (grep the module's own exported surface
      for any flag/option name) and the "raw secret never appears in
      output" assertion.
    agent: tester
    depends_on: [research]
  - id: implement
    description: |
      Implement lib/mnemosyne/conversation-memory/scanForSecrets.ts: one
      exported pure function, category-tagged pattern matching, redacted-
      preview construction. Zero I/O, zero network, zero dependency on
      any other file in this epic.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: |
      Independently re-verify (mirrors ro-06/ro-11's own independent-
      reviewer-re-runs-it precedent): no bypass flag exists anywhere in
      the module (read the diff, not the description); redacted previews
      never leak the raw value; false-positive/false-negative rates from
      the test corpus are reported, not silently absorbed into a single
      pass/fail.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feat/mnemosyne-conversation-memory.
    agent: developer
    depends_on: [review]

