design_decisions:
  - decision: "Pure, dependency-free, in-process detector — no external SAST tool integration in this story's first cut."
    rationale: "Keeps the module trivially testable and reviewable (a real reviewer can read the entire detection surface in one file); an external-tool integration is a genuinely separate, later decision if this story's own measured false-negative rate proves insufficient."
  - decision: "Run twice — parse-time (cm-03/cm-04) and persist-time (cm-07) — never once-and-trusted-forever."
    rationale: "Mirrors crawlAndIngest.ts's own 're-check before every individual fetch, never once per whole crawl' discipline; secrets should never reach an LLM classification call either, not just never reach storage."
  - decision: "Redacted previews report category + rough location, never the raw value."
    rationale: "The deep-dive report (cm-09) and the human-review queue (cm-05) both need to show the operator WHAT was caught without reproducing the sensitive value itself in yet another place."

cross_cutting:
  - concern: conversation-privacy-safety
    action: "NEW, named concern for this epic (not in the generic five-concern list, mirroring ro-11's own external-fetch-safety precedent) — this story IS that concern's foundational primitive; its own acceptance criteria above are this concern's implementation checklist for cm-01 specifically."
  - concern: loud-failure
    action: "A detected secret never silently passes through — every match is reported in the function's return value, never swallowed."
  - concern: documentation
    action: "The module's own doc comment states its non-goals (not a SAST tool, not 100% coverage) explicitly, plus a discoverable doc entry once cm-07's persist-time usage exists."

risks:
  - severity: high
    description: "False negatives — a real secret shape not covered by this story's pattern list slips through undetected."
    mitigation: "Measured, reported false-negative rate from the test corpus (never claimed zero); the two-checkpoint design (parse-time + persist-time) and the pilot-before-full-corpus sequencing (cm-08) bound the real-world blast radius of any gap to a small, operator-reviewed sample before scale."
  - severity: medium
    description: "False positives — legitimate non-secret content (a real UUID, a hash, a long identifier from a real conversation) gets quarantined unnecessarily, adding noise to the human-review queue."
    mitigation: "Real false-positive corpus in the test suite bounds and reports this rate; quarantine is never silent deletion, so a false positive costs review time, not lost content."

