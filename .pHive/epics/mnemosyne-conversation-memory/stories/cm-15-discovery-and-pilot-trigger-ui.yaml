id: cm-15-discovery-and-pilot-trigger-ui
epic: mnemosyne-conversation-memory
title: Discovery + pilot trigger UI — crawl for new sources, operator-marked selection, pipeline invocation
status: pending
complexity: high
methodology: tdd
depends_on: [cm-08-bounded-operator-pilot, cm-02-conversation-source-discovery]

description: |
  New story (round 5, 2026-08-27, docs/design-discussion.md §12.2), the
  first of two real pieces the operator's own dogfooding framing this pass
  asked for — "a ui button that allows us to crawl and index the new
  incoming data and conversations." Adds a new panel to the existing UI
  shell (`ui/index.html`/`ui/app.js`, served from `src/server.mjs`, port
  8477 by default — confirmed by direct read this round, correcting a
  stale "port 8578" assumption, §12.1) that lets the operator (1) re-run
  `cm-02`'s discovery scan on demand (the "crawl" button), (2) mark a
  subset of the resulting manifest's real entries via checkboxes, and (3)
  trigger `cm-08`'s bounded, operator-reviewed pilot orchestrator over
  exactly that marked subset, with the real per-stage results rendered
  back once the run completes.

  **The central question, resolved explicitly, not hand-waved: does a UI
  trigger button conflict with `cm-08`'s own explicit-confirmation-gate
  design ("no auto-select," its own AC5)?** No — `cm-08`'s own story text
  already names two valid selection mechanics, "a CLI confirm step OR an
  edited manifest file." This story's UI flow is a real, HTTP-delivered
  instance of the FIRST mechanic — a one-shot, explicit, non-persisted
  confirmation of a specific subset — never the second: the operator's
  checked boxes are never written back into `cm-02`'s own manifest file
  (`~/.mnemosyne/conversation-sources.yaml`), which would silently
  conflict with `cm-02`'s own AC7 idempotent-recompute-from-scratch
  guarantee (a later re-scan would erase persisted marks). Three
  independent, real layers enforce "no implicit selection," none trusted
  alone: (1) client-side, the submit button is always reachable (no
  `disabled` attribute — mirrors the Personas panel's own established
  no-`disabled`-attribute convention) but refuses inline on an empty
  checked set, mirroring `#reindex-paths`'s own empty-input refusal; (2)
  server-side, the real enforcement point, `POST /conversation-memory/
  pilot/run` rejects (400) any body whose combined marked-entry arrays are
  empty; (3) CLI-level, `cm-08`'s own unchanged no-implicit-selection
  refusal logic is reached via an explicit argument, the SAME code path
  whether a human types the flag or the server passes it after an HTTP
  request.

  **A real, additive requirement this places on `cm-08`'s own future
  implementation, named as a coordination point, NOT a change this story
  makes to `cm-08`'s own already-reviewed YAML (which this story leaves
  byte-for-byte unchanged):** `bin/mnemosyne-conversation-pilot.mjs`
  should expose a machine-readable invocation mode (e.g.
  `--sessions <path,path,...> --exports <key,key,...> --json`) alongside
  whatever interactive/manifest-edit mechanic it implements — the SAME
  confirmation-gate logic, a second real entry point, never a fork.

  **Cross-language bridging, resolved by direct research, not invented
  fresh:** `src/server.mjs` is launched as plain `exec node
  "$HERE/src/server.mjs"` by `bin/mnemosyne` (no `tsx`) and cannot import
  `cm-02`'s `discoverSources.ts` or `cm-08`'s orchestrator directly
  (confirmed both by `bin/mnemosyne`'s own launch line and by
  `bin/graphify-bridge.mjs`'s own doc comment naming the identical
  constraint for its sibling zero-dep bin). Rather than relaunching the
  whole HTTP service under `tsx`, this story follows
  `bin/mnemosyne-onboard.mjs`'s own established precedent: a new, small,
  `tsx`-launched CLI entry point
  (`bin/mnemosyne-conversation-discover.mjs`, wrapping `discoverSources()`
  with a `--json` flag), added to `bin/mnemosyne`'s own dispatcher with
  the SAME three-line `tsx`-launch pattern already used for
  `mnemosyne-persona.mjs`/`mnemosyne-agent.mjs`/`mnemosyne-onboard.mjs`.
  `src/server.mjs`'s two new routes `execFile()` this CLI (and, once
  built, `cm-08`'s own CLI in its new `--json` mode) and shape the JSON
  stdout into the HTTP response — the SAME "thin HTTP wrapper shells out
  to a CLI" architecture `engine.mjs` already uses for every existing
  route in this file, extended to two new CLIs rather than a new
  architectural pattern. No change to how `src/server.mjs` itself is
  started.

  **Progress-reporting mechanism, resolved by direct research (grep
  confirms zero polling/SSE/streaming precedent anywhere in `ui/app.js`),
  not invented fresh:** a plain synchronous `POST`, gated by the SAME
  `window.confirm()` pattern `#reindex-form` already uses (naming that
  this shells out against live Gemini + live Qdrant Cloud and can take
  real time), a single loading-status message while in flight, and the
  full per-stage result array (`cm-08`'s own AC6) rendered as a table from
  the response body once it resolves — matching the one real precedent
  this codebase has for a comparable long-running, live-write UI action
  (`POST /index` via `#reindex-form`), not inventing new infrastructure.

  **UI shell, matching the existing panel convention exactly (`ui/index.html`'s
  Personas panel, ~line 268, read directly as the concrete precedent per
  the task's own instruction):** a new `<section id="discovery-pilot"
  class="panel panel-wide">`, its own `<h2>`, `panel-status` element(s), a
  `panel-hint` naming real behavior/boundaries, a matching jump-chip near
  the top of the file, and a per-panel `aria-live="polite"` region for
  announcing scan/run outcomes — no new visual idiom invented.

acceptance_criteria:
  - "Given the operator has never run a scan this session, when the Discovery & Pilot panel loads, then it shows a real, empty-shaped status (never a fabricated manifest) and a 'Scan for new sources' control — no automatic background scan fires on page load"
  - "Given the operator clicks 'Scan for new sources', when POST /conversation-memory/sources/scan completes, then the manifest's real sessions[]/excluded[]/exports are rendered as checkbox rows (one per session path, one per staged export key) — never a stale cached manifest, verified by confirming the route calls discoverSources({ write: true }) fresh on every call, matching cm-02's own AC7"
  - "Given the operator clicks 'Run pilot on selected' with zero checkboxes marked, when the click handler runs, then no fetch() request fires and an inline status names the refusal reason — verified by a test asserting fetch is never called for this case"
  - "Given the operator has marked at least one real entry and clicks 'Run pilot on selected', when the confirm dialog is accepted, then POST /conversation-memory/pilot/run is called with EXACTLY the marked subset (never a superset, never 'everything currently in the manifest') as its body"
  - "Given POST /conversation-memory/pilot/run receives a body with empty combined sessionPaths/exportKeys arrays (bypassing the client, e.g. a direct API call), when the route handler runs, then it refuses with HTTP 400 and never invokes cm-08's orchestrator — the real, server-side enforcement point, never trusting client-side validation alone"
  - "Given a non-empty marked subset, when POST /conversation-memory/pilot/run invokes cm-08's orchestrator, then it passes exactly that subset as an explicit argument — never omitting it, never falling back to any default/auto-selected set — verified by inspecting the real invocation arguments"
  - "Given the pilot run completes (success or a per-stage failure), when the response is rendered, then every stage cm-08's orchestrator reports (discover/parse/triage/cluster/distill) appears in the UI with its own real ok/summary — never a single opaque pass/fail for the whole run"
  - "Given a marked subset exceeding cm-08's own small-sample cap (its own AC1), when the pilot run executes, then cm-08's own orchestrator refusal is surfaced verbatim in the UI as a real per-stage failure — this story's own route never re-implements or re-enforces that cap client-side or server-side"

steps:
  - id: research
    description: |
      Confirm the real, current shape of cm-02's ConversationSourceManifest
      (sessions[]/excluded[]/exports, DiscoveredSession.path as the real
      per-session identifier) and cm-08's own not-yet-built orchestrator
      contract (its own YAML's files_to_modify/acceptance_criteria) this
      story's routes must invoke against. Confirm the real, current
      bin/mnemosyne dispatcher pattern for adding a new tsx-launched CLI
      entry point (mnemosyne-persona.mjs/mnemosyne-onboard.mjs's own
      three-line precedent) and design bin/mnemosyne-conversation-
      discover.mjs's own --json output contract concretely. Confirm
      whether cm-08's own future implementation (once it lands) has
      already added a --json/--sessions/--exports mode per this story's
      own named coordination point, or whether this story's own
      implementation step needs to propose that addition to cm-08's
      implementer directly.
    agent: researcher
  - id: test-spec
    description: |
      Write failing tests for: (1) the two new server.mjs routes against
      a stubbed execFile()/CLI-output boundary (never a real subprocess in
      the automated suite); (2) the empty-selection 400 refusal; (3) the
      client-side empty-checkbox refusal (no fetch call); (4) the UI
      renders exactly the marked subset in the request body, never a
      superset. Never live Qdrant, never live Gemini, never real personal
      content in the automated suite.
    agent: tester
    depends_on: [research]
  - id: implement
    description: |
      Implement bin/mnemosyne-conversation-discover.mjs (tsx-launched,
      wraps discoverSources() with --json), the corresponding
      bin/mnemosyne dispatcher entry, src/server.mjs's POST
      /conversation-memory/sources/scan and POST /conversation-memory/
      pilot/run routes (execFile-based, per-stage result shaping,
      empty-selection 400 refusal), and the new ui/index.html panel +
      ui/app.js wiring (scan button, checkbox rendering, marked-subset
      submit with window.confirm gate and inline empty-selection
      refusal).
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: |
      Independently re-verify: no code path invokes cm-08's orchestrator
      without an explicit, non-empty, request-scoped selection (read every
      call site); the server-side 400 refusal is real, not a no-op; the
      UI never persists marks into cm-02's own manifest file; the
      progress-reporting design matches the reindex precedent rather than
      inventing new infrastructure.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feat/mnemosyne-conversation-memory.
    agent: developer
    depends_on: [review]

