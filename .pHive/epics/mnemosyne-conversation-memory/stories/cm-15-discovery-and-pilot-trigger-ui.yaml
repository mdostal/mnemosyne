design_decisions:
  - decision: "The UI's checkbox-and-submit flow is cm-08's own 'CLI confirm step' selection mechanic, delivered over HTTP — never its 'edited manifest file' mechanic. The operator's marks are never persisted into cm-02's own manifest file."
    rationale: "docs/design-discussion.md §12.2 — persisting marks into ~/.mnemosyne/conversation-sources.yaml would silently conflict with cm-02's own AC7 idempotent-recompute-from-scratch guarantee (a later re-scan would erase them). A one-shot, request-scoped confirmation avoids this entirely and is honestly one of cm-08's own two already-named valid mechanics, not a third, ungated one."
  - decision: "No-implicit-selection is enforced by three independent layers (client-side inline refusal, server-side 400, cm-08's own unchanged CLI-level refusal) — none trusted alone."
    rationale: "docs/design-discussion.md §12.2/round-5-grill-finding-5.3 — mirrors this epic's own repeated 'structural, not merely conventional' discipline (cm-14's own five-guarantee precedent, §11.4(d)); a client-side-only gate could be bypassed by a direct API call, so the server-side 400 is the real enforcement point, with cm-08's own CLI-level refusal as a third, independent backstop."
  - decision: "Cross-language bridging via a new, small, tsx-launched CLI entry point + execFile() from src/server.mjs — never relaunching src/server.mjs itself under tsx, never reimplementing discoverSources()'s own scratch-filter/slug-decode logic in plain JS."
    rationale: "docs/design-discussion.md §12.1/§12.2 — src/server.mjs is launched as plain node (confirmed via bin/mnemosyne's own launch line and bin/graphify-bridge.mjs's own doc comment naming the identical constraint for a sibling bin); relaunching the whole HTTP service under tsx is a broader, riskier surface change than this feature needs. Reimplementing discoverSources()'s own heuristic-laden decode/filter logic a second time in plain JS risks real drift from the already-tuned, already-tested original. bin/mnemosyne-onboard.mjs's own precedent (a small, tsx-launched CLI wrapper around otherwise-TS-only logic) is the concrete, lower-risk pattern this story follows instead."
  - decision: "Progress reporting is a plain synchronous POST with a full per-stage result table rendered after the fact — no polling, no SSE."
    rationale: "docs/design-discussion.md §12.1 — a direct grep of ui/app.js confirms zero polling/SSE/streaming precedent exists anywhere in this codebase; the one real precedent for a comparable long-running, live-write UI action (#reindex-form -> POST /index) is a plain synchronous fetch with a window.confirm gate and a single loading-status message. Matching this precedent avoids inventing new infrastructure with zero prior art in this repo."
  - decision: "cm-08's own small-sample cap (its own AC1) is never re-implemented or re-capped by this story's own routes, client-side or server-side."
    rationale: "This epic's own repeated 'one shared primitive, reused, never reimplemented' convention ([grill 4.4], round 4) — duplicating the cap risks the two copies drifting apart; a selection exceeding it is a real, loud, per-stage failure cm-08's own orchestrator reports, surfaced verbatim rather than silently truncated by this story."

cross_cutting:
  - concern: conversation-privacy-safety
    action: "This story introduces zero new persistence/parsing/classification logic of its own — it triggers cm-02's already-reviewed discovery (metadata-only, never content) and cm-08's already-designed pilot orchestrator (which itself re-uses cm-01's persist-time scan checkpoint, unchanged). No response this story's routes return ever includes raw session/export content — only manifest metadata (paths/sizes/mtimes) and cm-08's own per-stage summary results."
  - concern: existing-infrastructure
    action: "Reuses discoverSources()/cm-08's orchestrator unchanged via a thin CLI-wrapper + execFile() bridge, the SAME architectural pattern engine.mjs already establishes for every existing route in src/server.mjs — no new persistence primitive, no new HTTP client, no new selection-gating mechanism beyond what cm-08 already designed."
  - concern: loud-failure
    action: "Any stage failure during a real pilot run (cm-01's scan, cm-05's triage, cm-06's clustering, cm-07's distillation) is reported per-stage in the response body, never collapsed into a generic all-or-nothing failure — mirrors cm-08's own AC6/cross_cutting loud-failure commitment exactly, now also true of this story's own HTTP surface."
  - concern: documentation
    action: "SERVICE.md's own route-table documentation and src/server.mjs's own GET / endpoints doc block both need a real entry for the two new routes once this story ships, mirroring how every prior route addition to this file has kept that block current."

risks:
  - severity: high
    description: "A defect in the server-side 400 refusal (POST /conversation-memory/pilot/run) would be the first UI-reachable path capable of invoking real, live-Qdrant-writing, real-content-touching pipeline stages against an operator-unmarked or empty selection — the exact no-implicit-selection failure mode cm-08's own design exists to prevent, now reachable from a browser instead of only a terminal."
    mitigation: "Three independent layers (client-side, server-side, CLI-level), none trusted alone — the server-side 400 is the real enforcement point and is covered by its own dedicated acceptance criterion and test, independent of whether the client-side check is ever bypassed."
  - severity: medium
    description: "The pilot-run HTTP connection stays open for the full run's real wall-clock duration (potentially minutes against a real 5+5-session sample, live Gemini + live Qdrant Cloud) — a real, accepted UX tradeoff of the synchronous-request design."
    mitigation: "Bounded by cm-08's own small-sample cap (never re-implemented here, see design_decisions above); named explicitly in docs/design-discussion.md §12.5 as a residual, honestly-unsolved item rather than claimed fixed by this story."
  - severity: medium
    description: "cm-08's own orchestrator does not exist yet (status: pending) — this story's own routes are designed against cm-08's already-written story contract, not against running code, and cm-08's own future implementation may resolve its --json/--sessions/--exports invocation mode differently than this story's own research step anticipates."
    mitigation: "Named as a real, additive coordination point on cm-08's own future implementation (docs/design-discussion.md §12.2), not a change this story makes to cm-08's own YAML; this story's own research step re-confirms the real, as-built contract before implementation if cm-08 has landed differently by then."

