id: cm-05-usefulness-trash-triage
epic: mnemosyne-conversation-memory
title: Heuristic + LLM usefulness/trash triage with mandatory human review gate
status: pending
complexity: high
methodology: tdd
depends_on: [cm-03-claude-code-session-parser, cm-04-chatgpt-export-parser]

description: |
  Real, concrete design for classifying a session as worth keeping vs.
  discardable noise (docs/design-discussion.md §2.5, required-coverage
  area #2) — named explicitly as a HYBRID heuristic-prefilter +
  bounded-LLM-classification pipeline, never LLM-only from turn 1 (real
  cost/scale reasoning: 234+ real sessions, several 50MB+, makes
  full-transcript LLM classification both expensive and low-signal, most
  bytes being tool-call/thinking noise `cm-03` already strips).

  Two stages:
  1. A pure, deterministic heuristic prefilter over `ConversationTurn[]`'s
     own structural signals (turn count, real elapsed wall-clock span
     from first to last timestamp, ratio of tool-activity turns to text
     turns, presence/absence of an `attributionSkill`-equivalent signal)
     — produces a priority score, NEVER a keep/trash decision by itself.
  2. ONE bounded LLM call per session (input capped to a named max
     character count, fed the heuristic stage's own extracted, already-
     noise-stripped text) returns `{ verdict, summary, rationale }`,
     where `verdict` is `keep` | `trash` | `uncertain` — a real THIRD
     bucket, not a forced binary choice when the classifier itself isn't
     confident.

  **Provider, named explicitly (docs/design-discussion.md §9, correcting
  round 1's own gap — the LLM provider was never named at all):** Gemini,
  via Portunus's `{{secret:personalsites-487021-dostal-shared-gemini}}`
  reference, resolved at call time only, never inlined/hardcoded/logged —
  the SAME shared-swarm credential family, same access pattern
  (`gcloud secrets versions access latest --secret=dostal-shared-gemini
  --project=personalsites-487021`), as the already-proven-working
  `dostal-shared-qdrant` key `mnemosyne-repo-onboarding` already resolves
  successfully. This story introduces the shared low-level primitive
  `lib/mnemosyne/conversation-memory/geminiClient.ts` (Portunus resolution,
  bounded-input enforcement, structured-JSON-response parsing, rate-
  limit-aware retry/backoff) that `cm-07` also imports unchanged for its
  own, separate bounded call (mirrors `cm-04` importing `cm-03`'s
  `types.ts` unchanged, design-discussion §2.1 — one shared module, never
  reimplemented, per `[grill 4.1]`'s already-established convention).
  `GOOGLE_GENERATIVE_AI_API_KEY` (a distinct, unrelated production secret
  with its own rotation policy — design-discussion §9.1) is explicitly
  NOT used here.

  **The human review/confirm gate is structural, not a policy note:**
  every `trash` AND `uncertain` verdict is written to a real, on-disk,
  operator-reviewable queue file. Nothing is ever deleted — not the
  source transcript (read-only input, permanently, per `cm-02`'s own
  contract) and not any already-persisted memory (no delete path exists
  anywhere in this story's code, mirroring `ro-11`'s "no delete path
  exists in the module at all" additive-only discipline). A `trash`
  verdict controls whether a session is EVER PROPOSED for `cm-07`'s
  distillation step, never whether existing memory gets pruned.

acceptance_criteria:
  - "Given a session's ConversationTurn[], when the heuristic prefilter runs, then it produces a real, deterministic priority score from structural signals alone (turn count, elapsed span, tool-to-text ratio) — verified by asserting the SAME input always produces the SAME score (no non-determinism, no hidden randomness)"
  - "Given the heuristic prefilter's own output, when the LLM classification call is made, then its input text is capped at a named maximum character count — verified by a test asserting the call is never made with input exceeding that constant, regardless of the source session's real size"
  - "Given an LLM classification response, when parsed, then the resulting verdict is exactly one of keep/trash/uncertain — never a fourth value, never left unset"
  - "Given a trash or uncertain verdict, when triageSession() completes, then that session's verdict+summary+rationale is appended to a real, on-disk review queue file — verified by reading the file back and confirming the entry is present"
  - "Given a keep verdict, when triageSession() completes, then that session's verdict+summary+rationale is ALSO recorded (not just trash/uncertain) — the queue is a complete triage record, not merely an exception list, so cm-06/cm-07's later consumption has a real, complete input to filter by verdict"
  - "Given this story's full module, when reviewed, then no code path exists anywhere that deletes, truncates, or modifies a source session file, nor any code path that deletes already-persisted Mnemosyne memory based on a verdict — verified by an independent reviewer reading the diff, not trusting the description"
  - "Given a quarantined ConversationTurn (from cm-03/cm-04's parse-time cm-01 scan), when triageSession() runs, then that turn's raw text is never included in the bounded LLM call's input — quarantined content is excluded from the classification prompt entirely, not merely redacted within it"
  - "Given geminiClient.ts's own implementation, when reviewed, then the Portunus-resolved API key is used only as an in-memory outbound-call credential — never logged, never written to the on-disk review queue file, never included in any error message's own text — verified by an independent reviewer reading the diff for every call site and every catch/log statement, not trusting the description"
  - "Given the live Gemini API returns a rate-limit (429-class) error, when geminiClient.ts's call runs, then it retries with backoff up to a named bounded attempt count, then fails loudly (never silently returns a guessed/default verdict) — verified by a test against a stubbed client that returns 429 on the first N calls"

steps:
  - id: research
    description: |
      Design the heuristic prefilter's exact scoring formula and the
      LLM call's exact prompt shape + input character cap. Confirm which
      real, already-present JSONL fields (research-brief §1.1's
      `attributionSkill`, `gitBranch`, real timestamp deltas) are
      reliable-enough signals versus noisy ones — a real design decision,
      not assumed. Decide the on-disk queue file's schema and location
      (mirrors org-tree.yaml's convention, per cm-02's own precedent).
      Confirm `dostal-shared-gemini`'s real, current rate limits and
      model catalog directly against the live Gemini API (design-
      discussion §9.7) before picking a specific model id — this repo's
      billed GCP project (`personalsites-487021`, `billingEnabled: true`,
      confirmed this pass) puts the key on the paid tier, not the more
      restrictive free tier, but the exact quota is read live, never
      hard-pinned from a planning-time guess.
    agent: researcher
  - id: test-spec
    description: |
      Write failing tests for the heuristic prefilter (deterministic,
      pure-function tests) and the LLM-call integration (against a
      stubbed/fake LLM client, never a live model call in the automated
      suite — mirrors ingestDocument.ts's own IngestClient structural-
      interface-for-testing convention) covering every acceptance
      criterion, including the quarantine-exclusion and no-delete-path
      checks.
    agent: tester
    depends_on: [research]
  - id: implement
    description: |
      Implement lib/mnemosyne/conversation-memory/triageSession.ts:
      heuristic scoring, bounded LLM call construction/parsing, queue-
      file append (never overwrite-in-place of prior entries — additive,
      matching the epic's own no-silent-loss discipline).
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: |
      Independently re-verify: no delete path anywhere in the diff;
      quarantined content genuinely excluded from the LLM prompt (not
      merely redacted within it, which would still consume the same
      surrounding context); the queue file records EVERY verdict
      (keep included), not only trash/uncertain.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feat/mnemosyne-conversation-memory.
    agent: developer
    depends_on: [review]

