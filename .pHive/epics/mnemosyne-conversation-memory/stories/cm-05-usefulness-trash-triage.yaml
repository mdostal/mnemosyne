design_decisions:
  - decision: "Three-way verdict (keep/trash/uncertain), never a forced binary."
    rationale: "Operator's own quote asks to 'figure out usefulness and trash' — a classifier forced into a binary choice on genuinely ambiguous content would either over-trash (real loss risk) or over-keep (defeats the triage's purpose); uncertain is a real, honest third state."
  - decision: "Heuristic prefilter runs first and ALWAYS, bounding every LLM call's input regardless of source session size."
    rationale: "234+ sessions x up to 50MB+ each makes unbounded LLM input a real cost risk (design-discussion §3); this is the concrete mechanism that keeps `cm-08`'s pilot cost measurable and bounded before any full-corpus decision."
  - decision: "The queue file records every verdict (not just trash/uncertain), append-only."
    rationale: "cm-06's clustering (`[grill 2.1]`, design-discussion §2.6) needs a complete keep+uncertain input set, not merely an exception list; append-only matches this epic's own no-silent-loss discipline for its own generated artifacts, not just source transcripts."
  - decision: "Gemini (dostal-shared-gemini, via Portunus) is the concrete LLM provider, introduced here as a shared geminiClient.ts primitive cm-07 also reuses, rather than left unnamed or reimplemented per-caller."
    rationale: "Round 1 designed 'a bounded LLM call' without naming a provider at all (design-discussion §9 amendment) — a real, load-bearing gap since cm-08's pilot cannot make a real LLM call against an unnamed provider. dostal-shared-gemini is the same shared-swarm credential family, same access pattern, as the already-proven-working dostal-shared-qdrant key; GOOGLE_GENERATIVE_AI_API_KEY (a distinct, unrelated production secret) is explicitly not used. One shared client module, not reimplemented in cm-07, mirrors this epic's own established cm-01 convention (`[grill 4.1]`)."

cross_cutting:
  - concern: conversation-privacy-safety
    action: "Quarantined (cm-01-flagged) content is structurally excluded from the LLM prompt, never merely redacted within it — this story's own acceptance criteria enforce that a secret never reaches a model call. The Gemini API key itself is resolved via Portunus at call time only, never logged/persisted (design-discussion §9.1)."
  - concern: loud-failure
    action: "An LLM call returning a malformed/unparseable response (not exactly one of keep/trash/uncertain) fails loudly, naming the actual response received, never silently defaulted to a guessed verdict. A rate-limited (429) call retries with bounded backoff, then fails loudly rather than silently degrading."
  - concern: provenance-completeness
    action: "Every queue entry carries the session's real id/path/size (from cm-02's manifest) alongside the verdict/summary/rationale, so a human reviewer can trace a verdict back to its real source."
  - concern: existing-infrastructure
    action: "geminiClient.ts is one shared module cm-07 reuses unchanged (design-discussion §9.6) — never a second, independently-implemented Gemini call path."

risks:
  - severity: high
    description: "LLM classification cost at real scale (234+ sessions) could be higher than expected even with the heuristic prefilter and input cap, if the bounded input is itself still large or the per-call cost assumption is wrong."
    mitigation: "Real cost is measured on cm-08's small, bounded pilot BEFORE any full-corpus commitment — this story's own acceptance criteria bound input size, making the real per-call cost knowable and extrapolatable from a small, cheap sample."
  - severity: medium
    description: "A `trash` verdict on a session the operator actually valued is a real, if non-destructive, mistake — the operator may not think to go back and re-review a `trash`-queued session that never gets surfaced again."
    mitigation: "Structural non-destructiveness (source untouched, nothing deleted) means the mistake is always recoverable; cm-09's deep-dive report explicitly surfaces every verdict + rationale for the pilot sample so the operator can catch a wrong verdict early, before scale."
  - severity: low
    description: "dostal-shared-gemini's real, current rate limits/model catalog are not known at planning time — a wrong assumption here could either under-throttle (real 429s at cm-08 pilot scale) or over-throttle (unnecessarily slow pilot)."
    mitigation: "Billing is confirmed enabled on personalsites-487021 (design-discussion §9.7), ruling out the more restrictive unbilled free tier; the research step's own new sub-task confirms real limits live against the current API before implementation, never hard-pinned from this planning pass's own guess."

