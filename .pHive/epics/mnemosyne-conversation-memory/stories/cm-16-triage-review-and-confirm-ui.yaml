design_decisions:
  - decision: "The confirm route's ONLY filesystem operation, anywhere in this story's route surface, is a single fs.appendFileSync call — never a read-modify-rewrite, never a delete/edit of an existing line."
    rationale: "docs/design-discussion.md §12.3 — matches cm-01/cm-05/cm-07/cm-13's own identical append-only discipline exactly, per the task's own explicit instruction. Verified structurally (an fs-write-function spy test), not merely by convention."
  - decision: "The confirm route reuses cm-13's own (now-exported) isScopeRouteConfirmationEntry() for its own pre-write shape validation, plus an additional defense-in-depth pre-check that the named (cluster_id, scope_key) pair matches a currently-known candidate_unconfirmed row."
    rationale: "docs/grill-record.md round 5 finding 5.4 — avoids a second, independently-maintained shape-validation copy drifting from cm-13's own read-side trust; the extra candidate-match pre-check mirrors resolveDestinationScope()'s own 'right cluster, wrong scope key is also never trusted' discipline, applied one step earlier at write time, layered on top of (never replacing) cm-13's own independent re-validation at distribution time."
  - decision: "A duplicate confirm of an already-confirmed (cluster_id, scope_key) pair succeeds (a harmless second line), never refused as an error."
    rationale: "distributeIntakeEntries.ts's own explicitly-accepted 'tolerates a duplicate write (it is never destructive)' posture, verbatim — readScopeRouteConfirmations()'s own Set-based read naturally deduplicates, so refusing a duplicate would add complexity with no real safety benefit."
  - decision: "Quarantine entries are rendered for visibility only — no confirm/dismiss/delete/re-triage control anywhere in this story's own UI, and cm-01's own quarantine-retention-policy open question is explicitly left open, not silently resolved."
    rationale: "docs/design-discussion.md §12.3/task's own explicit instruction — the retention-policy question (open question #4, §5) is a genuinely separate, future design decision this story does not make as a side effect of adding visibility."
  - decision: "The new Qdrant-intake-scroll capability is added as a new, read-only CLI verb on mnemosyne/inventory/qdrant_inventory.py, reusing cm-13's own scroll_points() directly, rather than a new production Qdrant HTTP client written in this Node service."
    rationale: "docs/design-discussion.md §12.3 — reuses the harder-to-get-right piece (a real, already-live-confirmed HTTP client with real pagination/auth handling) rather than the easier piece (the small, stable comment-marker parsing, reimplemented safely in ~10 lines), the lower-risk direction of the two real options considered. Mirrors bin/graphify-bridge.mjs's own already-accepted small-separate-implementation precedent for the low-risk half."

cross_cutting:
  - concern: conversation-privacy-safety
    action: "Quarantine entries render only cm-01's own already-redaction-safe SecretMatch fields, re-verified end-to-end through JSON serialization this round (docs/design-discussion.md §12.1) — no route in this story ever returns raw secret values, raw transcript content, or anything beyond already-distilled memory text (the same content already sitting in Qdrant meta/intake, already passed cm-01's persist-time gate) and cm-01's own redaction-safe match metadata."
  - concern: existing-infrastructure
    action: "Reuses cm-13's own scroll_points()/partitionPoints()-shaped logic and the shared triage-queue file/append convention unchanged — no new persistence primitive, no new Qdrant client duplicated on the write side, no parallel confirmation-record schema."
  - concern: loud-failure
    action: "A malformed or mismatched confirm request is refused with a real, explicit HTTP 400 naming the reason (no matching candidate_unconfirmed row) — never silently dropped, never silently downgraded to a no-op success."
  - concern: documentation
    action: "SERVICE.md's own route-table documentation and src/server.mjs's own GET / endpoints doc block both need a real entry for the three new routes once this story ships."

risks:
  - severity: critical
    description: "A defect in the confirm route's own defense-in-depth pre-check (or its reuse of isScopeRouteConfirmationEntry()) could allow a malformed or mismatched confirmation record onto the shared queue file — one cm-13's own distribution logic would then read and, in the worst case, act on incorrectly (routing personal content to the wrong client scope)."
    mitigation: "cm-13's own distribution-time re-validation (resolveDestinationScope()'s exact-cluster_id-AND-exact-scope_key match) is completely independent and unchanged by this story — even a defect in this story's own pre-check could not, by itself, cause a wrong-scope write, since cm-13 re-derives the decision from the same on-disk record independently at distribution time. This story's own pre-check is a real, additional safety layer, not the only one."
  - severity: medium
    description: "The new Python CLI verb re-implements the provenance-header comment-marker extraction independently from distillAndRemember.ts's own parseProvenanceHeader() (a real, accepted, second implementation of the same small, stable format)."
    mitigation: "Named explicitly as a deliberate, low-risk duplication (docs/design-discussion.md §12.3), mirroring bin/graphify-bridge.mjs's own already-accepted precedent for exactly this kind of small-shape duplication; the format itself (a JSON blob inside a fixed HTML-comment marker) is simple and unlikely to change without a corresponding, visible change to distillAndRemember.ts's own PROVENANCE_HEADER_MARKER constant, which this story's own tests should assert stays byte-for-byte identical."
  - severity: low
    description: "The intake-candidates route's own real Qdrant scroll-endpoint request/response shape and the new CLI verb's own JSON stdout contract are not pinned to an exact wire format by this planning pass."
    mitigation: "Named explicitly as this story's own first research-step task — confirm the real, current shape directly, mirroring this epic's own consistent 'confirm against the live system, not assumed' discipline."

