id: cm-16-triage-review-and-confirm-ui
epic: mnemosyne-conversation-memory
title: Triage review + scope-route confirmation UI — see queue/intake state, confirm a candidate into its real area
status: pending
complexity: high
methodology: tdd
depends_on: [cm-06-cross-session-clustering, cm-13-intake-distribution]

description: |
  New story (round 5, 2026-08-27, docs/design-discussion.md §12.3), the
  second of two real pieces the operator's own dogfooding framing this
  pass asked for — "a way to help us see and parse it apart to the
  areas." Adds a new panel to the existing UI shell (`ui/index.html`/
  `ui/app.js`, served from `src/server.mjs`, port 8477) that reads and
  displays the real, current human-review queue AND real intake-collection
  state, and lets the operator take the ONE real write action `cm-13`'s
  own already-shipped read side already expects to exist — confirming a
  scope-route candidate into its real destination area (`meta` by default,
  or a confirmed client scope).

  **Two real, distinct data sources, named explicitly rather than
  conflated (a real finding of this pass's own research):** scope-route
  CANDIDATES (`cm-06`'s own `ResolvedScopeCandidate`) are NOT written to
  the on-disk triage queue anywhere in this epic's real, shipped code —
  `clusterConversations.ts`'s own module doc comment states this
  plainly. They ride forward embedded in each intake entry's own persisted
  provenance header, read back out via `cm-13`'s own imported
  `parseProvenanceHeader()`. This story therefore reads BOTH real sources:
  the shared triage-queue JSONL (`DEFAULT_TRIAGE_QUEUE_PATH`) for
  quarantine hits and existing scope-route confirmation records, AND the
  real `intake` Qdrant collection itself (`conversation_memory_intake`,
  via `cm-13`'s own read-only `scroll_points()` primitive) for candidates
  and existing distribution markers.

  **The confirm action — append-only, the SAME real, exact schema `cm-13`'s
  own read side already validates, read directly rather than invented
  fresh:**
  ```
  export interface ScopeRouteConfirmationEntry {
    recordedAt: string;
    confirmation_reason: 'scope_route_confirmed';
    cluster_id: string;
    scope_key: string;
  }
  ```
  Written via a single `fs.appendFileSync()` call to the SAME shared queue
  file — the ONLY filesystem write this story's entire route surface
  performs, anywhere. Never a delete or edit of an existing line: two of
  this story's three routes are pure reads with no `fs` write call in
  either handler; the third performs exactly one append and nothing else.
  A real, defense-in-depth pre-check (layered on top of, never a
  replacement for, `cm-13`'s own independent re-validation at distribution
  time) refuses (400) unless the named `(cluster_id, scope_key)` pair
  matches a currently-known, currently-unconfirmed real candidate.

  **`distributeIntakeEntries.ts`'s currently-private
  `isScopeRouteConfirmationEntry()` should be exported** (small, additive,
  no behavior change) so this story's own write-side pre-validation reuses
  the SAME shape check `cm-13`'s own read side already trusts, rather than
  risking two independently-maintained copies drifting apart — the exact
  shape of gap `[grill 4.4]` (round 4) already named this epic's own
  convention against.

  **Quarantine entries — visibility only, no action, named explicitly
  rather than silently decided:** this panel renders quarantine hits
  (`IntakeQuarantineQueueEntry`) for the operator to SEE — its own real
  `secretMatches: SecretMatch[]` field confirmed redaction-safe end-to-end
  through JSON serialization this round (§12.1) — and offers no action of
  any kind against them: no confirm, no dismiss, no delete, no re-triage
  trigger. `cm-01`'s own quarantine-retention-policy question remains open
  question #4 (docs/design-discussion.md §5) — this story does not
  silently resolve it as a side effect of making quarantine entries
  visible.

  **`cm-05`'s own keep/trash/uncertain triage verdicts are explicitly OUT
  of this panel's scope**, named so the boundary isn't discovered by
  surprise — a real, different record kind in the SAME queue file, but
  reviewing/acting on THEM is a genuinely separate future scope this story
  does not expand into.

  **Cross-language bridging, resolved by direct research, not invented
  fresh — the harder-to-get-right half is reused, not duplicated:** rather
  than writing a brand-new, untested, production Qdrant-scroll HTTP client
  directly in this Node service (explicitly out of `cm-13`'s own scope,
  required-but-uninstantiated by design), this story adds a new, small,
  read-only CLI verb to `mnemosyne/inventory/qdrant_inventory.py`
  (additive to its own existing `argparse` surface) that calls `cm-13`'s
  own already-live-confirmed `scroll_points('conversation_memory_intake')`
  directly and re-implements only the small, stable, well-documented
  provenance-header comment-marker JSON extraction locally (~10 lines, low
  risk, mirrors `bin/graphify-bridge.mjs`'s own already-accepted "small,
  deliberately separate implementation of the same shape" precedent).
  `src/server.mjs`'s new intake-read route `execFile()`s this verb — the
  SAME "thin HTTP wrapper shells out to a CLI" pattern `cm-15` uses and
  `engine.mjs` already establishes throughout this file. `HttpQdrantClient`'s
  own "no delete/drop method exists anywhere in this module" contract
  (§11.1/§11.4) is untouched — a second READ-only method, the same risk
  category as `scroll_points()` itself, never `create_collection()`'s one
  write exception.

acceptance_criteria:
  - "Given the real, current triage queue file (or its real absence), when GET /conversation-memory/triage-queue runs, then it returns quarantine hits and existing scope-route confirmation records, correctly classified by their own real discriminator field (quarantine_reason / confirmation_reason) — a missing file returns empty arrays with HTTP 200, never 404/500"
  - "Given the real, current intake collection, when GET /conversation-memory/intake-candidates runs, then every real candidate is returned tagged with exactly one computed status (no_candidate / candidate_unconfirmed / candidate_confirmed_pending_distribution / distributed), using the SAME scroll_points()-based enumeration and partitioning cm-13's own distributeIntakeEntries() already performs — never a re-derived, independently-implemented enumeration"
  - "Given the operator confirms a real candidate currently in candidate_unconfirmed status, when POST /conversation-memory/scope-route/confirm is called with that exact {cluster_id, scope_key}, then exactly one new JSON line matching ScopeRouteConfirmationEntry's real shape is appended to DEFAULT_TRIAGE_QUEUE_PATH via fs.appendFileSync — verified by inspecting the real file write call, asserting it is an append (not a read-modify-rewrite) and that no other entry in the file is touched"
  - "Given a {cluster_id, scope_key} pair that does NOT match any currently-known candidate_unconfirmed row (a stale, mismatched, or fabricated pair), when POST /conversation-memory/scope-route/confirm is called, then it refuses with HTTP 400 and appends nothing — verified by asserting zero appendFileSync calls occur for this case"
  - "Given a {cluster_id, scope_key} pair that has already been confirmed (a duplicate confirm), when POST /conversation-memory/scope-route/confirm is called again, then it succeeds (appends a second, harmless line) rather than refusing — mirrors distributeIntakeEntries.ts's own explicitly-accepted 'tolerates a duplicate write, never destructive' posture, verified by a test asserting no error is thrown and readScopeRouteConfirmations()'s own Set-based dedup still resolves correctly afterward"
  - "Given a quarantine entry rendered in the panel, when the UI is inspected, then no confirm/dismiss/delete/re-triage control is rendered anywhere for it — visibility only, verified by a test asserting the rendered row contains no actionable control element"
  - "Given this story's own three routes, when reviewed, then exactly one (POST /conversation-memory/scope-route/confirm) ever calls fs.appendFileSync, and zero routes ever call an fs write function in any other mode (write/truncate/unlink) or a Qdrant delete/update HTTP verb — verified by a test spying on node:fs's write-capable functions and asserting only the one expected append call occurs across all three routes"
  - "Given the confirm route's own pre-write validation, when reviewed, then it imports and reuses distributeIntakeEntries.ts's own (now-exported) isScopeRouteConfirmationEntry() rather than a locally re-implemented shape check — verified by confirming the import is the real, shared function"

steps:
  - id: research
    description: |
      Confirm the real, current Qdrant scroll-endpoint request/response
      shape for the new Python CLI verb (reusing cm-13's own
      scroll_points() directly — its own real shape already confirmed by
      cm-13's own research step; re-verify it still holds live). Design
      the new CLI verb's own concrete JSON stdout contract (field names,
      error reporting on a scroll failure). Confirm the real, exact
      provenance-header comment-marker format
      (mnemosyne-intake-provenance) to re-implement in the small Python
      extraction helper, cross-checked against distillAndRemember.ts's own
      buildProvenanceHeader()/PROVENANCE_HEADER_MARKER. Confirm the real
      classification/discriminator-field approach for the mixed-kind
      triage-queue JSONL (verdict / quarantine_reason /
      confirmation_reason).
    agent: researcher
  - id: test-spec
    description: |
      Write failing tests for: (1) triage-queue read + classification
      against a fixture JSONL file (missing-file empty-array case
      included); (2) intake-candidates read against a stubbed CLI-output
      boundary (never a real subprocess/live Qdrant in the automated
      suite); (3) the confirm route's append-only write, its
      defense-in-depth pre-check refusal, and its duplicate-confirm
      tolerance; (4) an fs-write-function spy asserting only the one
      expected appendFileSync call occurs across all three routes; (5) the
      UI renders no action control for a quarantine row.
    agent: tester
    depends_on: [research]
  - id: implement
    description: |
      Export isScopeRouteConfirmationEntry from distributeIntakeEntries.ts
      (additive, no behavior change). Add the new read-only CLI verb to
      mnemosyne/inventory/qdrant_inventory.py (scroll_points() +
      comment-marker extraction, JSON stdout). Implement src/server.mjs's
      three new routes (GET /conversation-memory/triage-queue, GET
      /conversation-memory/intake-candidates, POST /conversation-memory/
      scope-route/confirm) and the new ui/index.html panel + ui/app.js
      wiring (queue/candidate table rendering, status badges, confirm
      button only for candidate_unconfirmed rows, quarantine rows
      rendered read-only).
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: |
      Independently re-verify: the confirm route performs exactly one
      appendFileSync call and no other filesystem write anywhere in this
      story's own route surface; the pre-write validation genuinely
      reuses cm-13's own exported isScopeRouteConfirmationEntry(), never a
      local re-implementation; no quarantine-entry action control exists
      anywhere in the rendered UI; HttpQdrantClient's own
      no-delete/drop-method contract is genuinely untouched by the new CLI
      verb's addition.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feat/mnemosyne-conversation-memory.
    agent: developer
    depends_on: [review]

