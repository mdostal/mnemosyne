design_decisions:
  - decision: "Bounded entry count per session (a named maximum), never one entry per raw 4KB chunk."
    rationale: "ingestDocument()'s own CHUNK_SIZE_BYTES=4000 would produce ~12,500 chunks for a 50MB session if fed raw content — explicitly rejected (design-discussion §2.7); the fix is distillation producing genuinely small, high-signal output, not raising ingestDocument()'s own caps."
  - decision: "Persist-time secret scan runs immediately before EACH remember() call, never once per whole session."
    rationale: "Mirrors crawlAndIngest.ts's own SSRF-guard discipline exactly — re-checked before every individual operation, never cached/trusted from an earlier check."
  - decision: "scope='meta', metadata.source='external_conversation' — carrying forward, not reinventing, m-09's own chat_source/provenance design."
    rationale: "docs/design-discussion.md §7's explicit AC-by-AC supersession table for m-09 — its good design decisions are preserved, its unconfirmed assumptions (Gemini/Workbench format) are corrected."
  - decision: "Decision/fact and open-question entries are produced by ONE bounded call to cm-05's shared geminiClient.ts, kept SEPARATE from cm-05's own triage call rather than merged into it."
    rationale: "docs/design-discussion.md §9.6 — round 1 never named a mechanism for this at all (a real, pre-existing gap this correction resolves, not an implementation-time guess it overrides). Separate calls keep each call's cost scoped to exactly the sessions that need it: cm-05's call runs on every discovered session (including trash-bound ones), this story's call only on the strict subset that already passed triage and clustering — merging them would make every session pay this story's own extraction cost even when immediately discarded."
  - decision: "A non-meta scope is used ONLY for a cluster with an explicit, on-disk, per-cluster_id operator confirmation record — every other case (no candidate, unconfirmed candidate, mismatched confirmation) defaults to 'meta', unconditionally."
    rationale: "docs/design-discussion.md §10.2's own named residual risk: a wrong-scope route would put the operator's own personal content into a client-facing collection, the single highest-severity failure mode this design point could introduce. Absence of an explicit confirmation is never treated as an implicit yes — mirrors cm-08's own 'no implicit/default sample selection exists anywhere in this story's code' discipline (`[grill 3.2]`), applied to scope selection instead of pilot-sample selection."
  - concern: conversation-privacy-safety
    action: "The persist-time checkpoint of the epic's two-checkpoint secret-scan design — this story's single highest-scrutiny cross-cutting requirement, held to ro-06/ro-11's own independent-reviewer-re-verification bar."
  - concern: provenance-completeness
    action: "Full metadata contract (source/chat_source/session_id/project_slug/cluster_id) on every persisted entry — explicit acceptance criterion, not left to implementation-time judgment."
  - concern: existing-infrastructure
    action: "ingestDocument()/remember() called unchanged — no forked copy, no parallel persistence mechanism."
  - concern: loud-failure
    action: "A persist-time scan match quarantines that specific entry and continues with the rest (partial-failure reporting), never a silent skip and never a full-run abort that hides which entries actually landed. geminiClient.ts's own loud-failure-on-malformed-response/exhausted-retry behavior (cm-05's own acceptance criteria) applies identically here — never a silently-guessed decision/open-question entry."
  - concern: existing-infrastructure
    action: "geminiClient.ts imported unchanged from cm-05 — never a second, independently-implemented Gemini call path (docs/design-discussion.md §9.6)."
  - concern: conversation-privacy-safety
    action: "Round 3 (§10.2): the confirmed-scope-candidate consumption path defaults to 'meta' for every cluster except one with an explicit, on-disk, per-cluster_id operator confirmation — verified by an independent reviewer re-reading every code path that could set a non-'meta' scope value, the same highest-scrutiny bar this story's existing persist-time scan checkpoint is already held to."

risks:
  - severity: critical
    description: "This is the ONLY story in the epic that actually writes real content to a persisted, searchable store — any gap in the persist-time scan checkpoint, or any bounded-entry-count violation letting near-raw content through, has this epic's single highest real blast radius. Round 3 (§10.2) adds a second, distinct way this same 'only story that writes' status could go wrong: a scope-routing defect (an unconfirmed or mismatched candidate somehow used anyway) would put the operator's own personal content into a client-facing collection — categorically worse than any failure mode this story's pre-round-3 design could produce, since 'meta' at least keeps content under the operator's own sole control."
    mitigation: "Two independent scan checkpoints (parse-time in cm-03/cm-04, persist-time here) rather than relying on either alone; independent reviewer re-verification of call order (not the description); the pilot-before-full-corpus sequencing (cm-08) means this story's real-world exposure is deliberately small and operator-reviewed before any scale-out. Round 3: the scope-routing default (unconditionally 'meta' absent an explicit, on-disk, per-cluster_id confirmation) is itself the mitigation — no code path exists that could set a non-'meta' scope without that confirmation, verified by the same independent-reviewer re-verification bar as the scan checkpoint, not a separate, lesser standard."
  - severity: medium
    description: "meta scope's thin current implementation (design-discussion §3) could require unplanned wiring work discovered only during this story's own research/implementation steps."
    mitigation: "Named explicitly as a risk, not assumed solved; the research step's own first task is confirming meta scope's real, live behavior before implementation proceeds, surfacing any gap as an early, visible finding rather than a late implementation surprise."

