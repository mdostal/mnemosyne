design_decisions:
  - decision: "Bounded entry count per session (a named maximum), never one entry per raw 4KB chunk."
    rationale: "ingestDocument()'s own CHUNK_SIZE_BYTES=4000 would produce ~12,500 chunks for a 50MB session if fed raw content — explicitly rejected (design-discussion §2.7); the fix is distillation producing genuinely small, high-signal output, not raising ingestDocument()'s own caps."
  - decision: "Persist-time secret scan runs immediately before EACH remember() call, never once per whole session."
    rationale: "Mirrors crawlAndIngest.ts's own SSRF-guard discipline exactly — re-checked before every individual operation, never cached/trusted from an earlier check."
  - decision: "scope='intake' (round 4, was 'meta' through round 3), metadata.source='external_conversation' — carrying forward, not reinventing, m-09's own chat_source/provenance design."
    rationale: "docs/design-discussion.md §7's explicit AC-by-AC supersession table for m-09 — its good design decisions are preserved, its unconfirmed assumptions (Gemini/Workbench format) are corrected. Round 4 (§11.2): the operator's own explicit words this pass, 'so meta is separate from intake' — this story is the landing zone only, never the final destination for any entry, so it writes to a physically separate collection, never 'meta' directly."
  - decision: "Decision/fact and open-question entries are produced by ONE bounded call to cm-05's shared geminiClient.ts, kept SEPARATE from cm-05's own triage call rather than merged into it."
    rationale: "docs/design-discussion.md §9.6 — round 1 never named a mechanism for this at all (a real, pre-existing gap this correction resolves, not an implementation-time guess it overrides). Separate calls keep each call's cost scoped to exactly the sessions that need it: cm-05's call runs on every discovered session (including trash-bound ones), this story's call only on the strict subset that already passed triage and clustering — merging them would make every session pay this story's own extraction cost even when immediately discarded."
  - decision: "This story writes to scope: 'intake' UNCONDITIONALLY — no code path anywhere in this story is capable of writing to 'meta' or any confirmed real scope directly, ever. The confirmed-vs-unconfirmed resolved_scope_candidate consumption logic (round 3's own design) has moved in full to cm-13-intake-distribution, not deleted."
    rationale: "Round 4, docs/design-discussion.md §11.2 — the operator's own explicit framing this pass: 'cm-07 always writes there first; a later distribution step reads intake, resolves the real destination... writes there, then intake shuts down for that entry.' Simplifying this story to a single, fixed destination removes its own highest-severity round-3 risk (a wrong-scope route landing personal content in a client-facing collection) from this story's own surface entirely — that risk now belongs exclusively to cm-13, the only story with a destination-selection responsibility at all."
  - concern: conversation-privacy-safety
    action: "The persist-time checkpoint of the epic's two-checkpoint secret-scan design — this story's single highest-scrutiny cross-cutting requirement, held to ro-06/ro-11's own independent-reviewer-re-verification bar."
  - concern: provenance-completeness
    action: "Full metadata contract (source/chat_source/session_id/project_slug/cluster_id/entry_id) on every persisted entry — explicit acceptance criterion, not left to implementation-time judgment."
  - concern: existing-infrastructure
    action: "ingestDocument()/remember() called unchanged — no forked copy, no parallel persistence mechanism."
  - concern: loud-failure
    action: "A persist-time scan match quarantines that specific entry and continues with the rest (partial-failure reporting), never a silent skip and never a full-run abort that hides which entries actually landed. geminiClient.ts's own loud-failure-on-malformed-response/exhausted-retry behavior (cm-05's own acceptance criteria) applies identically here — never a silently-guessed decision/open-question entry."
  - concern: existing-infrastructure
    action: "geminiClient.ts imported unchanged from cm-05 — never a second, independently-implemented Gemini call path (docs/design-discussion.md §9.6)."

risks:
  - severity: critical
    description: "This is the ONLY story in the epic that actually writes real content to a persisted, searchable store — any gap in the persist-time scan checkpoint, or any bounded-entry-count violation letting near-raw content through, has this epic's single highest real blast radius."
    mitigation: "Two independent scan checkpoints (parse-time in cm-03/cm-04, persist-time here) rather than relying on either alone; independent reviewer re-verification of call order (not the description); the pilot-before-full-corpus sequencing (cm-08) means this story's real-world exposure is deliberately small and operator-reviewed before any scale-out. Round 4: this story's own scope-routing risk (a wrong-scope write landing personal content in a client-facing collection) has been REMOVED from this story's surface by the intake/distribution split (§11.2) — this story can only ever write to 'intake', structurally; the residual scope-routing risk now belongs entirely to cm-13 (see that story's own risk register)."
  - severity: medium
    description: "intake scope's brand-new, not-yet-live implementation (no 'intake' key exists in swarm-memory's real [scopes] table as of this planning pass, confirmed §11.1) could require unplanned wiring work discovered only during this story's own research/implementation steps — the same shape of risk 'meta' itself carried through round 1."
    mitigation: "Named explicitly as a risk, not assumed solved; the research step's own first task is confirming intake scope's real, live behavior and applying the real collection-naming recommendation (§11.2) before implementation proceeds, surfacing any gap as an early, visible finding rather than a late implementation surprise."

