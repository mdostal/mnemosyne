id: cm-07-distillation-and-persist
epic: mnemosyne-conversation-memory
title: Bounded distillation into memory entries, persisted via the shipped remember() cascade
status: pending
complexity: high
methodology: tdd
depends_on: [cm-06-cross-session-clustering, cm-05-usefulness-trash-triage]

description: |
  What "clean up the conversations and context" concretely produces
  (docs/design-discussion.md §2.7, required-coverage area #4) — the real
  transformation, named explicitly, never left abstract: a raw session
  (up to 50MB+) becomes a BOUNDED, small number of high-signal memory
  entries per session, never a 1:1 chunk-per-4KB re-embedding of the raw
  transcript (which would produce an absurd ~12,500 chunks for a 50MB
  session under `ingestDocument()`'s own `CHUNK_SIZE_BYTES = 4_000` —
  explicitly rejected, docs/design-discussion.md §2.7).

  Per session, produces: (a) a small number of decision/fact entries
  (concrete, durable claims the session established), (b) a small number
  of open-question entries (unresolved threads, explicitly tagged as
  such — never presented as settled fact), and (c) exactly ONE
  session-summary entry (carrying `cm-05`'s own summary forward, tagged
  with full source-session provenance).

  **Mechanism for (a)/(b), named explicitly (docs/design-discussion.md
  §9 amendment — round 1 never specified this at all):** ONE bounded
  Gemini call per distilled session, via `cm-05`'s own shared
  `geminiClient.ts` primitive (imported unchanged, never reimplemented —
  mirrors `cm-04` importing `cm-03`'s `types.ts`, §2.1), input capped to
  a named max character count identically to `cm-05`'s own discipline,
  returning `{ decisions: string[], openQuestions: string[] }` (each
  bounded to a named max count). Deliberately a SEPARATE call from
  `cm-05`'s own triage call, not merged into one: this call only ever
  runs for the strict subset of sessions that already passed triage as
  `keep`/`uncertain` AND were selected/clustered (`[grill 2.1]`), while
  `cm-05`'s own call runs for every discovered session including ones
  that end up `trash`. Merging them would make every session pay this
  call's cost even when immediately discarded — the opposite of the
  heuristic-prefilter's own cost-bounding purpose (§2.5); kept separate,
  this call's real volume is already bounded to a strict subset of
  `cm-05`'s, for free, by the pipeline's own existing shape.

  This is the ONLY story in this epic that calls `ingestDocument()`/
  `remember()` — every other story (`cm-01`...`cm-06`) produces
  intermediate, in-memory or locally-cached artifacts, never touching
  Qdrant. Runs `cm-01`'s `scanForSecrets()` ONE FINAL TIME, immediately
  before each `remember()` call, over the final distilled text — the
  persist-time checkpoint of the epic's two-checkpoint design (docs/
  design-discussion.md §2.8), mirroring `crawlAndIngest.ts`'s own
  "re-checked immediately before every individual fetch, never checked
  once and trusted" discipline exactly.

  Writes with `scope: 'meta'` (docs/design-discussion.md §2.3's first
  real consumer of `meta` scope) and
  `metadata.source: 'external_conversation'`,
  `metadata.chat_source: 'claude-code' | 'chatgpt'`, `metadata.
  session_id`, `metadata.project_slug`, `metadata.cluster_id` — carrying
  forward `m-09`'s own good provenance-completeness design decision
  (`chat_source`/timestamp/participants) while extending it with fields
  m-09 never anticipated (docs/design-discussion.md §7).

  **Round-3 addition (2026-08-25, docs/design-discussion.md §10.2) —
  scope-routing, gated exclusively on explicit operator confirmation.
  "Scope" disambiguated once, up front (docs/grill-record.md round 3
  finding 1): every `scope: 'meta'` reference elsewhere in this story is
  Mnemosyne's own `Scope` TYPE (`interfaces.ts`); every `resolved_scope_
  candidate`/"confirmed candidate" reference below is a real key from
  `swarm-memory`'s own `[scopes]` REGISTRY (`config.toml`) that gets
  PASSED AS that same TYPE's value once confirmed — one mechanism, two
  names for its two halves, never two competing concepts. Full detail in
  §10.2.**
  `cm-06` now computes a per-cluster, read-only
  `resolved_scope_candidate` (a real, already-existing `swarm-memory`
  scope key, e.g. `arizona`, matched against the cluster's unambiguous
  project-slug facet — §10.2 has the full mechanism). This story is the
  ONLY place that candidate can ever be ACTED ON: for a given
  `cluster_id`, `distillAndRemember()` writes with the CONFIRMED real
  scope value ONLY IF the operator has explicitly confirmed that exact
  `cluster_id`'s candidate in the same human-review queue `cm-01`/`cm-05`
  already produce (tagged `review_reason: 'scope_route_candidate'`,
  `cm-06`'s own addition). **For every other cluster — no candidate, an
  unconfirmed candidate, or a cluster `cm-06` never proposed one for at
  all — this story's existing, unchanged behavior applies: `scope:
  'meta'`, no exceptions, ever.** This is the safe default, not an
  opt-out — absence of an explicit, on-disk confirmation record is never
  treated as an implicit yes. Named explicitly as the highest-severity
  addition to this story's own already-highest-blast-radius risk
  surface (below) — a wrong-scope route would put the operator's own
  personal content into a client-facing collection, categorically worse
  than this epic's existing worst case (personal content landing in the
  operator's OWN `meta` collection). A real, small, cross-epic
  coordination point is also named here, not silently assumed
  frictionless: `remember()`'s own `RememberOptions.scope` is
  TypeScript-typed as the literal union `'project'|'enterprise'|'meta'`
  (`interfaces.ts`, owned by the already-shipped `mnemosyne-foundation`
  epic) — `interfaces.ts`'s own doc comment already anticipates
  additional scope values ("at minimum... additional scope values may be
  added by later stories without breaking this contract"), but passing a
  real registry key like `'arizona'` through it is not yet type-safe
  without this story's own research step choosing a concrete, safe
  implementation approach (a local widening mechanism, or a coordinated,
  additive `interfaces.ts` change) before implementation proceeds.

  **A real sequencing consequence, named explicitly (docs/grill-record.md
  round 3 finding 3), not left for an implementer to discover by
  surprise:** `cm-08`'s own pilot runs `cm-02` through `cm-07` end-to-end
  in ONE synchronous pass (its own YAML, unchanged by this correction).
  Any `resolved_scope_candidate` `cm-06` computes DURING that same pass
  cannot possibly already have a pre-existing operator confirmation
  record — nothing has reviewed it yet. Consequence: every cluster in a
  `cm-08` pilot run's own real output will, in practice, land in `scope:
  'meta'` — exactly the existing, safe default — and genuine scope-
  routing (a confirmed candidate actually changing where an entry lands)
  can only ever be exercised in a SECOND, later run against a candidate a
  human reviewed after a FIRST run surfaced it. This is expected,
  intended behavior given the confirms-before-write discipline above, not
  a defect — named here so a reader of `cm-08`'s own pilot results never
  mistakes "every entry landed in meta" for "scope-routing didn't work."

acceptance_criteria:
  - "Given a triaged, clustered session, when distillAndRemember() runs, then it produces a BOUNDED number of memory entries (a named maximum constant, e.g. no more than N decision/fact entries plus exactly 1 summary entry) — never one entry per raw chunk of the original transcript"
  - "Given the final distilled text for any entry, when distillAndRemember() runs, then cm-01's scanForSecrets() is called on it IMMEDIATELY BEFORE the corresponding remember() call — verified by call-order instrumentation in the test, not merely asserted present somewhere in the function"
  - "Given a scan match on distilled text immediately before persist, when distillAndRemember() runs, then that specific entry's remember() call is NEVER made — the match is quarantined into the same human-review structure cm-01/cm-05 already establish, and the run continues with the remaining entries rather than aborting entirely (mirrors ingestDocument()'s own partial-failure reporting discipline)"
  - "Given a successful distillation, when the resulting remember() calls are inspected, then every one uses scope='meta' and carries metadata.source='external_conversation', chat_source, session_id, project_slug, and cluster_id (cluster_id explicitly null for a session cm-06 did not cluster, never omitted) — the full provenance-completeness contract, never a partial subset"
  - "Given this story's own call to ingestDocument(), when reviewed, then it is called UNCHANGED (same public signature, no forked/modified copy) — verified by confirming the import is the real ro-10/ro-13 module, not a local reimplementation"
  - "Given an open-question entry, when persisted, then its metadata/text explicitly marks it as an unresolved/open item (a distinct tag, e.g. metadata.entry_type='open_question') — never indistinguishable from a decision/fact entry at recall() time"
  - "Given a triaged keep/uncertain session, when distillAndRemember() runs, then the decision/fact and open-question entries are produced by exactly ONE bounded call to the shared geminiClient.ts primitive (imported from cm-05, never a reimplemented copy) — verified by confirming the import is the real shared module, and that its input is capped to the same named max character count discipline as cm-05's own call"
  - "Given a trash-verdict session, when distillAndRemember() runs, then it is never invoked at all for that session — this story's own extraction call only ever runs on the strict subset of sessions that reached cm-06's clustering input, verified by a test asserting geminiClient.ts is never called for a trash-verdict fixture"
  - "Given a cluster with a resolved_scope_candidate that the operator has NOT explicitly confirmed (absent from the review queue's own confirmation record, or present but not yet acted on), when distillAndRemember() runs, then every entry from that cluster is written with scope: 'meta' — the unconfirmed candidate is never used, verified by a test asserting the remember() call's scope argument is exactly 'meta' for this case, never the candidate value"
  - "Given a cluster whose resolved_scope_candidate the operator HAS explicitly confirmed (a real, on-disk confirmation record keyed to that exact cluster_id, fixture-simulated in the test), when distillAndRemember() runs, then every entry from that cluster is written with the CONFIRMED real scope value instead of 'meta' — full existing provenance-metadata contract (chat_source/session_id/project_slug/cluster_id) otherwise unchanged, verified by inspecting the actual remember() call's arguments"
  - "Given a confirmation record naming a cluster_id that does NOT match any cluster resolved_scope_candidate this story is actually processing (a stale or mismatched confirmation, fixture-simulated), when distillAndRemember() runs, then it is IGNORED — that cluster's entries fall back to scope: 'meta' — never applied to a different cluster by accident, never causing an error that silently skips the whole run either"

steps:
  - id: research
    description: |
      Confirm meta scope's real, live behavior end-to-end (docs/design-
      discussion.md §3's named risk: "meta scope is thinly implemented
      today") — does a remember() call with scope='meta' against the
      live, configured layer stack actually route to a real collection
      today, or does it require additional wiring this story must add?
      Confirm directly against the live code (client.ts, layers/
      registry.ts), not assumed from the type system alone. Decide the
      real collection-naming convention for this epic's own meta
      collection (open question #1, docs/design-discussion.md §5),
      surfacing the operator's answer as a prerequisite before
      implementation proceeds. Confirm dostal-shared-gemini's real,
      current rate limits/model catalog directly against the live API
      (design-discussion §9.7), same sub-task as cm-05's own research
      step, independently re-confirmed here rather than assumed carried
      over unchanged. Confirm the real, concrete shape of the operator's
      own scope-route confirmation record (where it lives, how a specific
      cluster_id's confirmation is represented — this story's own
      implementation step decides the concrete mechanic, mirroring
      cm-08's own "a CLI confirm step or an edited manifest file"
      precedent) before implementing the confirmed-candidate consumption
      logic (design-discussion §10.2). Confirm the real, safe
      implementation approach for passing a non-'project'|'enterprise'|
      'meta' scope string through remember()'s own RememberOptions.scope
      parameter (a local widening mechanism vs. a coordinated, additive
      interfaces.ts change) — a real, small, cross-epic coordination
      point named in §10.2, not assumed frictionless.
    agent: researcher
  - id: test-spec
    description: |
      Write failing tests against a fake IngestClient (mirrors
      ingestDocument.ts's own testing convention, never live Qdrant)
      covering every acceptance criterion, including the persist-time
      scan-then-quarantine-then-continue behavior and the full
      provenance-metadata contract.
    agent: tester
    depends_on: [research]
  - id: implement
    description: |
      Implement lib/mnemosyne/conversation-memory/distillAndRemember.ts:
      bounded entry production (decision/fact/open-question/summary),
      persist-time cm-01 scan, ingestDocument() calls with full
      provenance metadata, partial-failure/quarantine reporting.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: |
      Independently re-verify (highest scrutiny in this epic, mirrors
      ro-06's own precedent for its own highest-blast-radius story): the
      persist-time scan genuinely runs before every remember() call
      (read the diff, confirm call order); entry counts are genuinely
      bounded; ingestDocument() is genuinely unmodified/unforked; no
      code path bypasses the scan for any entry type.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feat/mnemosyne-conversation-memory.
    agent: developer
    depends_on: [review]

