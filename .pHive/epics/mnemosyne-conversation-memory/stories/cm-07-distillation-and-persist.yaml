id: cm-07-distillation-and-persist
epic: mnemosyne-conversation-memory
title: Bounded distillation into memory entries, persisted UNCONDITIONALLY to a new 'intake' landing scope via the shipped remember() cascade
status: pending
complexity: high
methodology: tdd
depends_on: [cm-06-cross-session-clustering, cm-05-usefulness-trash-triage]

description: |
  What "clean up the conversations and context" concretely produces
  (docs/design-discussion.md §2.7, required-coverage area #4) — the real
  transformation, named explicitly, never left abstract: a raw session
  (up to 50MB+) becomes a BOUNDED, small number of high-signal memory
  entries per session, never a 1:1 chunk-per-4KB re-embedding of the raw
  transcript (which would produce an absurd ~12,500 chunks for a 50MB
  session under `ingestDocument()`'s own `CHUNK_SIZE_BYTES = 4_000` —
  explicitly rejected, docs/design-discussion.md §2.7).

  Per session, produces: (a) a small number of decision/fact entries
  (concrete, durable claims the session established), (b) a small number
  of open-question entries (unresolved threads, explicitly tagged as
  such — never presented as settled fact), and (c) exactly ONE
  session-summary entry (carrying `cm-05`'s own summary forward, tagged
  with full source-session provenance).

  **Mechanism for (a)/(b), named explicitly (docs/design-discussion.md
  §9 amendment — round 1 never specified this at all):** ONE bounded
  Gemini call per distilled session, via `cm-05`'s own shared
  `geminiClient.ts` primitive (imported unchanged, never reimplemented —
  mirrors `cm-04` importing `cm-03`'s `types.ts`, §2.1), input capped to
  a named max character count identically to `cm-05`'s own discipline,
  returning `{ decisions: string[], openQuestions: string[] }` (each
  bounded to a named max count). Deliberately a SEPARATE call from
  `cm-05`'s own triage call, not merged into one: this call only ever
  runs for the strict subset of sessions that already passed triage as
  `keep`/`uncertain` AND were selected/clustered (`[grill 2.1]`), while
  `cm-05`'s own call runs for every discovered session including ones
  that end up `trash`. Merging them would make every session pay this
  call's cost even when immediately discarded — the opposite of the
  heuristic-prefilter's own cost-bounding purpose (§2.5); kept separate,
  this call's real volume is already bounded to a strict subset of
  `cm-05`'s, for free, by the pipeline's own existing shape.

  This is the ONLY story in this epic that calls `ingestDocument()`/
  `remember()` — every other story (`cm-01`...`cm-06`) produces
  intermediate, in-memory or locally-cached artifacts, never touching
  Qdrant. Runs `cm-01`'s `scanForSecrets()` ONE FINAL TIME, immediately
  before each `remember()` call, over the final distilled text — the
  persist-time checkpoint of the epic's two-checkpoint design (docs/
  design-discussion.md §2.8), mirroring `crawlAndIngest.ts`'s own
  "re-checked immediately before every individual fetch, never checked
  once and trusted" discipline exactly.

  **Round-4 revision (2026-08-26, docs/design-discussion.md §11.2) —
  SIMPLIFIED, single-destination write, superseding round 3's own
  scope-routing design in this story specifically (moved, not deleted —
  see below).** Every successful distillation writes with
  `scope: 'intake'` — a NEW `Scope`-type value (additive to `interfaces.
  ts`'s `'project'|'enterprise'|'meta'` union, the same additive-widening
  mechanism §10.2 already used for `'arizona'`), resolved via the
  IDENTICAL `cfg.scopes?.[scope]` mechanism `'meta'`/`'arizona'` already
  resolve through (`VectorLayerAdapter.ts:213-226`) — never a parallel
  write path. This story NEVER writes `scope: 'meta'` directly and NEVER
  writes a confirmed non-meta scope directly, in any code path — that
  entire confirmed-vs-unconfirmed scope-selection mechanism (round 3's
  own design, docs/design-discussion.md §10.2 steps 2-3) has MOVED,
  verbatim in substance, to the new `cm-13-intake-distribution` story —
  this story is SIMPLER as a direct, deliberate consequence: one fixed
  destination, always, no branching on `resolved_scope_candidate`
  anywhere in this story's own code. Carries `metadata.source:
  'external_conversation'`, `metadata.chat_source: 'claude-code' |
  'chatgpt'`, `metadata.session_id`, `metadata.project_slug`,
  `metadata.cluster_id` — carrying forward `m-09`'s own good
  provenance-completeness design decision while extending it with fields
  m-09 never anticipated (docs/design-discussion.md §7) — UNCHANGED by
  this revision.

  **`resolved_scope_candidate` is still carried, but now strictly
  PASS-THROUGH, unacted-on by this story itself:** `cm-06` still computes
  this (real, shipped code, `clusterConversations.ts`) — this story
  continues to accept it as nullable metadata on every persisted intake
  entry, but neither reads nor branches on it anywhere in its own logic.
  It exists on each intake entry purely so `cm-13` (the new story that
  now owns the confirmed-candidate-consumption logic) has what it needs
  without re-deriving it from `cm-06`'s output a second time. This
  story's own round-3 "highest-severity addition to this story's own risk
  surface" (a wrong-scope route landing personal content in a
  client-facing collection) NO LONGER APPLIES to this story at all — this
  story cannot route anywhere but `intake`, structurally, so that failure
  mode is entirely `cm-13`'s own risk surface now (see `cm-13`'s own
  YAML).

  **A new, real, stable per-entry identifier:** every persisted intake
  entry now also carries `metadata.entry_id` (a UUID generated at persist
  time, distinct from `content_hash`) — a genuinely new requirement,
  named explicitly (docs/design-discussion.md §11.2): nothing before this
  round needed to reference a specific intake entry from a LATER,
  SEPARATE story's own write; `cm-13`'s marking mechanism is the first
  thing in this epic that does.

  **The `intake` collection-naming decision, real and concrete (docs/
  design-discussion.md §11.2, §11.1's own live `config.toml` re-read this
  pass confirms neither `meta` nor `intake` exists as a `[scopes]` key
  today):** recommend `intake = "conversation_memory_intake"`, following
  the same `<domain>_<memory-type>` naming convention already real and
  live in `config.toml` (`clients_arizona_compound_memory`,
  `personal_memory`). This story's own research step applies this for
  real at build time — same "recommend now, apply for real at build
  time" posture §2.3 open question #1 already established for `meta`.

acceptance_criteria:
  - "Given a triaged, clustered session, when distillAndRemember() runs, then it produces a BOUNDED number of memory entries (a named maximum constant, e.g. no more than N decision/fact entries plus exactly 1 summary entry) — never one entry per raw chunk of the original transcript"
  - "Given the final distilled text for any entry, when distillAndRemember() runs, then cm-01's scanForSecrets() is called on it IMMEDIATELY BEFORE the corresponding remember() call — verified by call-order instrumentation in the test, not merely asserted present somewhere in the function"
  - "Given a scan match on distilled text immediately before persist, when distillAndRemember() runs, then that specific entry's remember() call is NEVER made — the match is quarantined into the same human-review structure cm-01/cm-05 already establish, and the run continues with the remaining entries rather than aborting entirely (mirrors ingestDocument()'s own partial-failure reporting discipline)"
  - "Given a successful distillation, when the resulting remember() calls are inspected, then every one uses scope='intake' (round 4, docs/design-discussion.md §11.2 — never 'meta' directly, superseding this AC's own round-3 wording) and carries metadata.source='external_conversation', chat_source, session_id, project_slug, and cluster_id (cluster_id explicitly null for a session cm-06 did not cluster, never omitted) — the full provenance-completeness contract, never a partial subset"
  - "Given this story's own call to ingestDocument(), when reviewed, then it is called UNCHANGED (same public signature, no forked/modified copy) — verified by confirming the import is the real ro-10/ro-13 module, not a local reimplementation"
  - "Given an open-question entry, when persisted, then its metadata/text explicitly marks it as an unresolved/open item (a distinct tag, e.g. metadata.entry_type='open_question') — never indistinguishable from a decision/fact entry at recall() time"
  - "Given a triaged keep/uncertain session, when distillAndRemember() runs, then the decision/fact and open-question entries are produced by exactly ONE bounded call to the shared geminiClient.ts primitive (imported from cm-05, never a reimplemented copy) — verified by confirming the import is the real shared module, and that its input is capped to the same named max character count discipline as cm-05's own call"
  - "Given a trash-verdict session, when distillAndRemember() runs, then it is never invoked at all for that session — this story's own extraction call only ever runs on the strict subset of sessions that reached cm-06's clustering input, verified by a test asserting geminiClient.ts is never called for a trash-verdict fixture"
  - "Given ANY successfully distilled entry (decision/fact/open-question/summary, any cluster, any resolved_scope_candidate value including null), when distillAndRemember() runs, then it is written with scope: 'intake' — verified by a test asserting the remember() call's scope argument is exactly 'intake' for every fixture case, with no code path anywhere in this story capable of producing a different scope value (round 4, docs/design-discussion.md §11.2 — supersedes this story's own round-3 confirmed/unconfirmed-candidate acceptance criteria, which move verbatim to cm-13-intake-distribution)"
  - "Given a persisted intake entry, when inspected, then it carries metadata.entry_id (a UUID, distinct from content_hash) in addition to the existing chat_source/session_id/project_slug/cluster_id/resolved_scope_candidate fields — verified present on every entry, never omitted, so cm-13 can later reference this exact entry (round 4, §11.2)"
  - "Given resolved_scope_candidate on a cluster's entries (cm-06's own output, non-null or null), when distillAndRemember() runs, then this story's own code never reads or branches on that field's value anywhere — verified by a test asserting identical remember() call behavior (same scope: 'intake', same metadata shape otherwise) regardless of whether resolved_scope_candidate is null or a real matched key — proving it is genuinely inert pass-through here, not silently still influencing the write (round 4, §11.2)"

steps:
  - id: research
    description: |
      Confirm intake scope's real, live behavior end-to-end (does a
      remember() call with scope='intake' against the live, configured
      layer stack actually route to a real collection, or does it
      require additional wiring this story must add? — confirm directly
      against the live code, client.ts/layers/registry.ts, not assumed
      from the type system alone). Decide the real collection-naming
      convention for this epic's own intake collection (round 4,
      docs/design-discussion.md §11.2's own recommendation,
      `intake = "conversation_memory_intake"`, against the live
      swarm-memory config.toml — confirmed absent as of this planning
      pass, §11.1), surfacing the operator's answer as a prerequisite
      before implementation proceeds. Confirm the real, safe
      implementation approach for adding a new 'intake' literal to
      remember()'s own RememberOptions.scope/interfaces.ts Scope type (a
      local widening mechanism vs. a coordinated, additive interfaces.ts
      change) — the same real, small, cross-epic coordination point named
      in §10.2 for 'arizona', now also needed for 'intake'. Confirm
      dostal-shared-gemini's real, current rate limits/model catalog
      directly against the live API (design-discussion §9.7), same
      sub-task as cm-05's own research step, independently re-confirmed
      here rather than assumed carried over unchanged.
    agent: researcher
  - id: test-spec
    description: |
      Write failing tests against a fake IngestClient (mirrors
      ingestDocument.ts's own testing convention, never live Qdrant)
      covering every acceptance criterion, including the persist-time
      scan-then-quarantine-then-continue behavior and the full
      provenance-metadata contract.
    agent: tester
    depends_on: [research]
  - id: implement
    description: |
      Implement lib/mnemosyne/conversation-memory/distillAndRemember.ts:
      bounded entry production (decision/fact/open-question/summary),
      persist-time cm-01 scan, ingestDocument() calls with full
      provenance metadata, partial-failure/quarantine reporting.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: |
      Independently re-verify (highest scrutiny in this epic, mirrors
      ro-06's own precedent for its own highest-blast-radius story): the
      persist-time scan genuinely runs before every remember() call
      (read the diff, confirm call order); entry counts are genuinely
      bounded; ingestDocument() is genuinely unmodified/unforked; no
      code path bypasses the scan for any entry type.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feat/mnemosyne-conversation-memory.
    agent: developer
    depends_on: [review]

