files_to_modify:
  - file: bin/mnemosyne-conversation-pilot.mjs
    change: "New file: CLI orchestrator — manifest-driven sample selection, explicit confirmation gate, cm-02..cm-07 stage sequencing, real result reporting."
  - file: bin/mnemosyne-conversation-pilot.test.mjs
    change: "New file: tests against stubbed stage implementations, covering the confirmation gate and sequencing."

design_decisions:
  - decision: "Sample selection is entirely operator-driven via cm-02's own manifest — the orchestrator has no auto-select code path at all."
    rationale: "`[grill 3.2]` — an earlier draft left this implicit ('a handful of sessions'); a genuinely operator-reviewed pilot requires the operator to be the one who chooses which real content is touched, not an agent guessing on their behalf."
  - decision: "This story's own real execution (against real content) is explicitly deferred to build/execute time, never performed during planning."
    rationale: "This planning pass's own explicit instruction: plan the mechanism, never ingest/embed/persist real personal content as part of planning."

cross_cutting:
  - concern: conversation-privacy-safety
    action: "The first real end-to-end exercise of both cm-01 scan checkpoints against genuinely real content — this story's own acceptance criteria require independently confirming the scan actually ran (not assumed skipped-because-clean)."
  - concern: existing-infrastructure
    action: "Orchestrates already-built stories (cm-02 through cm-07) — introduces zero new persistence/parsing/classification logic itself, purely sequencing + the confirmation gate."
  - concern: loud-failure
    action: "Refuses to run without explicit sample confirmation; any stage failure during the real pilot run is reported per-stage, never a generic all-or-nothing pipeline failure."

risks:
  - severity: high
    description: "This is the first point real personal conversation content is actually persisted — any latent defect in any upstream story (cm-01 through cm-07) has its real-world blast radius realized here for the first time."
    mitigation: "Deliberately small, operator-selected sample (named small maximum in acceptance criteria) bounds the real blast radius; every upstream story was independently reviewed and tested against fixtures first; the operator's own explicit confirmation gate is the final human checkpoint before any real content moves."
  - severity: medium
    description: "A pilot sample too small or too narrow (e.g. all from one project slug, despite the acceptance criterion) could fail to genuinely exercise cross-session clustering, giving false confidence."
    mitigation: "Explicit acceptance criterion requiring 2+ distinct real project slugs in the sample — not left to chance or operator oversight."

references:
