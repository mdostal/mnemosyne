design_decisions:
  - decision: "This story's own delete primitive is a NEW, freestanding module — deliberately never added to HttpQdrantClient."
    rationale: "docs/design-discussion.md §11.4(d)/§11.1 — HttpQdrantClient's own 'no delete/drop method exists anywhere in this module' contract (its own docstring, and ro-06's own risk mitigation citing it) is real, load-bearing precedent OTHER stories/callers rely on; adding a delete method there would weaken that guarantee for every other caller of that shared class, not just enable this story. A separate, freestanding module preserves that guarantee for everyone else while still providing this story's own real, needed capability."
  - decision: "Single-entry-only invocation, structurally — no batch/wildcard capability anywhere in this story's own design."
    rationale: "docs/design-discussion.md §11.4(a) — the operator's own explicit 'never automatic' requirement; a batch-capable delete primitive, however well-gated by confirmation prompts, is a categorically larger blast-radius risk than a single-entry-only one, and this epic's own privacy-safety posture (§2.8) consistently prefers the narrower, safer shape."
  - decision: "Both the marker's existence AND the destination copy's real presence are independently re-verified LIVE, immediately before every delete call — never trusted from an earlier report."
    rationale: "docs/design-discussion.md §11.4(b), mirroring cm-01's/crawlAndIngest.ts's own 're-checked before every operation, never checked once and trusted' discipline. A stale or wrong distribution_marker (e.g. from a partial-write failure mode named in cm-13's own risk register) must never be sufficient on its own to justify a delete — independently confirming the destination copy's real presence is what actually makes 'the content still exists elsewhere' a verified fact rather than an assumed one."
  - decision: "Backup defaults ON; skipping it ('full wipe') requires an explicit, named opt-out flag."
    rationale: "docs/design-discussion.md §11.4(c) — mirrors this epic's own consistent 'safe default, not an opt-out' posture (§10.2, [grill 3.2]). The operator's own words name both options as real and available, but the safer of the two is the one a bare invocation produces."
  - concern: conversation-privacy-safety
    action: "This story's own dedicated, highest-scrutiny risk entry (below) names precisely why it is safe to hold a delete capability at all, and the five structural guarantees that keep it narrowly scoped — held to a higher bar than any other cross-cutting concern entry in this epic, per the task's own explicit instruction for this story."
  - concern: loud-failure
    action: "Both live precondition checks (marker existence, destination presence) fail LOUD and REFUSE — never a silent skip, never a silent proceed-anyway. A backup-write failure (e.g. disk full, permissions) must also fail loud and abort BEFORE the delete call, never silently proceed to delete without the backup that was supposed to precede it."
  - concern: existing-infrastructure
    action: "Reuses cm-13's own scroll_points() read primitive for the live marker re-check rather than a second, independently-implemented intake-read mechanism — the fourth application of this epic's own 'one primitive, reused, never reimplemented' convention ([grill 4.1])."

risks:
  - severity: critical
    description: "DEDICATED risk entry, per the task's own explicit instruction — this is the epic's ONE deliberate exception to 'no delete path exists,' named here precisely, not casually. `ways_of_working.md`'s hard rule ('never wipe Qdrant collections... additive/upsert only, everywhere, no exceptions') and ro-06's own 'no delete/drop code path exists anywhere in this module' discipline both hold as structural guarantees elsewhere in this codebase — this story deliberately breaks that pattern once, on purpose, here. WHY this case is safe, stated precisely rather than asserted: removing the epic's OWN already-redundant intake copy, after this story has ITSELF independently re-verified (not merely trusted) that the same content is confirmed to exist at its real, permanent destination, is categorically different from deleting a source transcript (irreplaceable, the operator's own only copy of raw history) or deleting an only-copy of persisted memory (the exact failure mode the 'never wipe Qdrant' rule exists to prevent). `intake` is, by this round's own design, never the durable home of any entry — it is explicitly a 'separate, temporary landing collection' (the operator's own words) whose entries are meant to eventually not need to exist there once distributed. Removing a temporary, already-superseded, independently-re-confirmed copy is a different KIND of operation from removing the only copy of something, not a looser reading of the same rule."
    mitigation: "Five concrete, structural guarantees prevent this exception from ever being reachable for anything else: (1) a new, freestanding module never imported by cm-01 through cm-13's own code — no code path FROM the rest of this epic INTO this capability exists at all, only an explicit, separate, operator-invoked entry point; (2) hardcoded/pinned to the intake collection's own resolved name only — never accepts a caller-supplied arbitrary collection or scope parameter, so it cannot be redirected against meta or any confirmed real scope's own collection, structurally, not merely by convention; (3) never merged into HttpQdrantClient — that class's own 'no delete/drop method exists anywhere in this module' contract remains true for every OTHER caller, forever, verified by a diff showing that file completely unmodified; (4) single-entry-only, no batch capability, ever — structural, not a default some future caller could override with a flag; (5) never wired into cm-11's orchestrator or cm-12's CLI verb's default/automatic flow — a future operator running `mnemosyne harvest` never triggers a delete as a side effect of the generalized pipeline running. Layered on top of all five: this story re-verifies the distributed flag AND the destination copy's real existence itself, live, immediately before any delete call — even a caller that somehow reached this primitive with a wrong entry_id would be refused unless that exact entry independently re-checks out as both marked AND confirmed present at its real destination."
  - severity: high
    description: "The live destination-presence check (§11.4(b)/AC #2) is itself a real-world query (recall()/grep against the destination scope) that could, in principle, produce a false negative (content genuinely present but not found by the check's own matching logic) — refusing a legitimate decommission is a safe failure mode, but a false POSITIVE (reporting content present when it genuinely is not) would be the dangerous direction."
    mitigation: "The check is designed to fail closed — any inconclusive or ambiguous result refuses the delete rather than proceeding (AC #2's own explicit wording: 'if this destination check fails or is inconclusive, it REFUSES'). The matching key (entry_id/content_hash in metadata, cm-13's own provenance contract) is exact-match, never fuzzy/semantic, minimizing the false-positive surface a similarity-based check could introduce."
  - severity: medium
    description: "This story's own gating gap — it must never be built/run automatically as part of this epic's own execution flow, relying on human process (a separate operator go-ahead) rather than a purely structural/code-level gate for WHEN it gets built and first used."
    mitigation: "Named explicitly, not assumed enforced by code alone — `parallel_allowed: false` and this story's own explicit `parallel_rationale` state the human-process gate directly; `cm-11`/`cm-12`'s own `depends_on` lists (unchanged by this round) never include this story, so no automated orchestration path reaches it even after it is eventually built."

