design_decisions:
  - decision: "Line-by-line streaming, never a full-file in-memory load."
    rationale: "Real sessions run 6MB to 53MB+ (confirmed this planning pass); a full-file load for every one of 234+ real sessions is an avoidable memory/latency cost this story's own design should not incur."
  - decision: "Tool-call blocks reduced to a bounded excerpt, never dropped or kept in full."
    rationale: "Tool activity is real signal (what was actually built/changed), but raw tool payloads (a full Bash command string, a full file-read result) are exactly the kind of noise design-discussion §2.7 identifies as the reason raw transcripts can't feed ingestDocument() directly."
  - decision: "This story's output is normalized turns, never a direct remember()/ingestDocument() call."
    rationale: "Persistence is cm-07's job alone (design-discussion §2.1) — keeps this story's own blast radius bounded to parsing correctness, testable with zero live Qdrant dependency."

cross_cutting:
  - concern: conversation-privacy-safety
    action: "cm-01's scanner runs over every extracted turn before this story returns — the parse-time checkpoint of the epic's two-checkpoint secret-scan design."
  - concern: provenance-completeness
    action: "Every ConversationTurn carries sessionId/timestamp/projectSlug/turnIndex — the provenance fields cm-07's eventual persisted entries trace back to a real position in the source session, never an anonymous blob."
  - concern: existing-infrastructure
    action: "Zero new persistence mechanism — this story's output is consumed by cm-05/cm-06/cm-07, which alone compose the existing remember() cascade."

risks:
  - severity: medium
    description: "The real JSONL schema could vary across Claude Code CLI versions (this session's own transcript records `version: 2.1.229` on every line) — a schema assumption confirmed against one version's output might not hold for an older or newer session file among the real 234+."
    mitigation: "Research step samples multiple real, current sessions; unparseable/unexpected block types fail loudly (named acceptance criterion) rather than being silently skipped, surfacing version-drift issues instead of hiding them."
  - severity: low
    description: "Tool-excerpt bounding could discard genuinely important signal (a critical command whose truncated summary loses the part that mattered)."
    mitigation: "Named, accepted limitation — the full raw session file remains the read-only source of truth on disk, permanently, so nothing is unrecoverably lost; a future refinement of the excerpt strategy is a separate, later decision."

references:
  - path: .pHive/epics/mnemosyne-conversation-memory/docs/research-brief.md
    relevant_excerpt: "§1.1 — the full, real, confirmed JSONL schema (envelope fields, content block types, the thinking-signature noise finding) this parser is built against."
