design_decisions:
  - decision: "Proven via synthetic/structural correctness tests only, never a real second operator's real conversation history."
    rationale: "docs/design-discussion.md §10.3 — no real second operator's data is available to this repo, and using anyone else's real conversation content without their own explicit involvement would violate this epic's own conversation-privacy-safety posture (§2.8). The ONLY real-data proof this epic ever produces remains cm-08's pilot and cm-09's deep-dive test, both scoped to THIS operator's own data as already planned — this story does not add, extend, widen, or substitute for that real-data proof in any way. A genuinely different second operator's own first real run against their own machine remains the actual validation event for cross-operator correctness, explicitly named as unverified BY THIS EPIC, not overclaimed as solved by a synthetic fixture suite alone."
  - decision: "depends_on includes cm-09-deep-dive-validation-test specifically (not merely cm-07, which the module-composition rationale below would justify on its own) as a real-data VALIDATION gate, a categorically different kind of dependency than the module-import dependencies on cm-02 through cm-07 — cm-08 itself is deliberately NOT listed (its own real execution against real content happens at build time, already transitively required via cm-09's own chain)."
    rationale: "The generalized component is not packaged as 'ready to use' until the operator's own deep-dive test has actually validated the real pipeline against real data (the operator's own explicit instruction, docs/design-discussion.md §10.3). Generalizing an as-yet-unvalidated pipeline would risk packaging a mechanism whose real-world correctness is still only fixture-proven at the moment of packaging — cm-09 is the readiness gate; cm-02 through cm-07 (listed separately below) are the module-import dependencies. Both kinds of dependency are real and distinct, so both are graph-enforced rather than collapsing to whichever happens to transitively cover the other."
  - decision: "Multi-operator LLM/credential provisioning is explicitly OUT of scope for this story."
    rationale: "cm-05/cm-07's own geminiClient.ts resolves ONE specific Portunus reference (dostal-shared-gemini) — a different operator would need their own credential, a genuinely separate, unplanned concern. This story only generalizes INPUT-PATH parameterization, named explicitly so a future reader never assumes 'generalized' also means 'credential-portable.'"
  - decision: "cm-02's own fixed, named export-file list discipline (never a generic directory scan) is preserved as a caller-supplied fixed list, never loosened into a caller-supplied scan pattern."
    rationale: "Parameterizing WHO supplies the list is orthogonal to WHETHER the list stays fixed and named — the whole point of the fixed-list discipline (avoiding false-positive matches on unrelated export bundles, cm-02's own design_decisions) applies with equal force to a second operator's own Downloads directory, which this story has no way to know is free of similar false-positive candidates."
  - decision: "depends_on explicitly enumerates every story whose real runtime module this orchestrator composes (cm-02 through cm-07, plus cm-09) — cm-10 is deliberately NOT listed, composed conditionally only when the caller's supplied source list actually contains a staged Gemini export."
    rationale: "docs/grill-record.md round 3 finding 4 — `[grill 4.1]`'s own established convention ('a shared module's consumers should have the dependency ENFORCED BY THE GRAPH, not merely true by transitive accident') applies here: an earlier draft listed only cm-09, relying on cm-02 through cm-07 being transitively required through cm-09's own dependency chain — real, but accidental, not graph-enforced. cm-10 is excluded from depends_on on purpose, not by oversight: unlike cm-02 through cm-07 (an unconditional, always-composed core sequence this story's own orchestrator cannot run without), cm-10 may never be built at all (its own gating precondition, cm-10's own YAML) — a hard depends_on on a story that might permanently stay unbuilt would incorrectly block this story's own dependency graph from ever being satisfiable. The orchestrator's own implementation composes cm-10's parser ONLY IF it exists and the supplied source list contains a Gemini export; this asymmetry (cm-02-07 unconditional core vs. cm-10 conditional/optional) is named explicitly here so a future implementer never assumes cm-10 is required, or conversely, mistakenly demotes cm-03/cm-04 to optional-feeling status by analogy."

cross_cutting:
  - concern: conversation-privacy-safety
    action: "Test suite constraint: synthetic, structural fixtures only, never this operator's own real content and never a real second operator's data (none available). Every already-shipped safety mechanism (cm-01's scan, the human-review gate, cm-06/cm-07's scope-routing confirms-before-write discipline) carries over unchanged — this story adds zero new privacy/safety logic of its own."
  - concern: existing-infrastructure
    action: "Composes cm-02 through cm-07/cm-10 unchanged — mirrors onboardRepo()'s own 'compose, never reimplement' discipline exactly. Zero new persistence, parsing, classification, or clustering logic; purely parameterization + sequencing, identical in kind to cm-08's own orchestrator."
  - concern: documentation
    action: "harvestConversationHistory()'s own parameter contract (sessionsRoot, export-list shape, confirmation-gate contract) needs a discoverable doc entry once this story ships, mirroring onboardRepo()'s own documented mode-parameterization."

risks:
  - severity: medium
    description: "A second operator's real conversation history could have structurally different shapes (different Claude Code session directory conventions, different export formats/versions) this story's synthetic fixtures cannot fully anticipate."
    mitigation: "Fixtures are schema-accurate per cm-02/cm-03/cm-04/cm-10's own already-research-confirmed real schemas; a genuinely different second operator's first real run remains the actual validation event, explicitly named as unverified by this story alone (mirrors this story's own design_decisions above) — never overclaimed as solved by fixture coverage."
  - severity: low
    description: "Generalization could quietly loosen a safety discipline (e.g. the fixed-list export discipline drifting into a generic scan) when parameterized for flexibility."
    mitigation: "Acceptance criteria explicitly require the fixed-list discipline survive parameterization; the reviewer step independently re-verifies no generic-scan code path was introduced, not merely that the description claims otherwise."

