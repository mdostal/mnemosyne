id: cm-11-generalized-pipeline-orchestrator
epic: mnemosyne-conversation-memory
title: Generalized, parameterized pipeline orchestrator — any operator, any machine
status: pending
complexity: high
methodology: tdd
depends_on: [cm-02-conversation-source-discovery, cm-03-claude-code-session-parser, cm-04-chatgpt-export-parser, cm-05-usefulness-trash-triage, cm-06-cross-session-clustering, cm-07-distillation-and-persist, cm-09-deep-dive-validation-test]

description: |
  Added by the round-3 amendment (2026-08-25, docs/design-discussion.md
  §10.3) at the operator's own explicit request — added to THIS epic, not
  deferred to a separate future one. Packages this epic's own real
  pipeline (discovery -> parse -> triage -> cluster -> distill, `cm-02`
  through `cm-07`/`cm-10`) into a genuinely repeatable component any
  operator could run against their OWN local conversation history on
  their OWN machine, following `.pHive/epics/mnemosyne-repo-onboarding/`'s
  own already-shipped precedent (merged to `main`, v0.15.0) exactly:
  `onboardRepo()` (`lib/mnemosyne/onboarding/onboardRepo.ts`, `ro-02`) is
  the one shared orchestrator both its deployment modes compose; this
  story is the same kind of piece for THIS epic's own pipeline.

  As currently designed, every stage of this pipeline is hardcoded to
  THIS operator's own specific paths: `cm-02`'s discovery step walks
  `~/.claude/projects/` and a fixed, named list containing THIS
  operator's own specific ChatGPT export path and (as of `cm-02`'s own
  round-3 update) THIS operator's own specific Gemini Takeout path.
  `cm-08`'s own `bin/mnemosyne-conversation-pilot.mjs` already sequences
  `cm-02` -> `cm-03`/`cm-04` -> `cm-05` -> `cm-06` -> `cm-07`
  end-to-end, but only ever against THIS operator's own manifest.

  This story implements `harvestConversationHistory()`
  (`lib/mnemosyne/conversation-memory/harvestConversationHistory.ts`), a
  new, genuinely parameterized composition function that:

  - Parameterizes `cm-02`'s discovery inputs — a `sessionsRoot` directory
    (default `~/.claude/projects/`, override-able) and a caller-supplied
    list of named export-file entries (`{ type, path }`) — instead of
    `cm-02`'s own literal hardcoded constants. `cm-02`'s own "fixed,
    named list, never a generic directory scan" discipline (§2.4) is
    explicitly PRESERVED, not loosened: parameterizing WHO supplies the
    list is not the same as making the list itself a generic scan
    pattern — a caller-supplied fixed list stays a fixed list.
  - Sequences `cm-02` -> `cm-03`/`cm-04`/`cm-10` (whichever parser types
    the supplied source list actually contains) -> `cm-05` -> `cm-06` ->
    `cm-07`, identical stage order to `cm-08`'s own already-proven
    sequencing, against the parameterized inputs instead of this
    operator's own hardcoded manifest.
  - Reuses `cm-08`'s own confirmation-gate discipline unchanged (no
    implicit/default sample or source selection, ever) — this story adds
    zero new privacy/safety logic of its own; every already-shipped
    safety mechanism (`cm-01`'s two-checkpoint scan, the human-review
    gate, `meta`-scope persist, `cm-06`/`cm-07`'s own round-3 scope-
    routing confirms-before-write discipline) carries over UNCHANGED.

  **Explicitly out of scope, named rather than silently assumed
  covered:** multi-operator LLM/credential provisioning. `cm-05`/`cm-07`'s
  own `geminiClient.ts` resolves ONE specific Portunus reference
  (`dostal-shared-gemini`) — a different operator running this
  generalized component on their own machine would need their OWN LLM
  credential, a genuinely separate, unplanned concern this story does
  not solve. This story parameterizes INPUT PATHS only, never the LLM
  provider.

acceptance_criteria:
  - "Given a supplied sessionsRoot directory different from ~/.claude/projects/ (a synthetic fixture tree), when harvestConversationHistory()'s discovery phase runs, then it enumerates sessions from the SUPPLIED root, never falling back to or hardcoding this operator's own ~/.claude/projects/ path"
  - "Given a supplied, operator-provided list of named export files (synthetic fixture paths, never this operator's own real ChatGPT/Gemini export paths), when discovery runs, then only those supplied entries appear in the manifest — the fixed-list discipline (never a generic directory scan) is preserved with a caller-supplied list, not cm-02's own literal hardcoded constant"
  - "Given harvestConversationHistory() is invoked WITHOUT an explicit operator confirmation for the sample/source selection (mirroring cm-08's own no-implicit-default-selection contract), then it refuses to run — identical discipline to cm-08's own CLI orchestrator, not a looser one for this generalized entry point"
  - "Given a synthetic multi-source fixture set (a fixture Claude Code session tree AND a fixture export file), when harvestConversationHistory() runs end-to-end with cm-05/cm-06/cm-07's own real Gemini/embedder calls stubbed (mirroring cm-08's own test discipline), then it produces the same stage-by-stage result shape cm-08's pilot produces — proving the generalization is structurally faithful to the already-proven pipeline, not a divergent reimplementation"
  - "Given this story's own test suite, when reviewed, then every test runs against synthetic, structural fixtures only — never a live second operator's real conversation history (none exists or is available to this repo) and never this operator's own real ~/.claude/projects/ tree or real export content either, verified by an independent reviewer reading every fixture path in the diff"

steps:
  - id: research
    description: |
      Read onboardRepo.ts's exact parameterization pattern (mode-typed
      options object, each already-shipped primitive composed, never
      reimplemented) as the structural precedent to follow. Re-read
      cm-02's own real, current hardcoded constants (the literal
      ~/.claude/projects/ path and the literal export-file list) directly
      from its own source before generalizing them — never guessing at
      what's hardcoded from this story's own description alone. Re-read
      cm-08's own bin/mnemosyne-conversation-pilot.mjs sequencing and
      confirmation-gate implementation as the second structural precedent
      this story's own orchestrator must match.
    agent: researcher
  - id: test-spec
    description: |
      Write failing tests against synthetic, structural fixtures only
      (a fixture sessions-root directory tree mirroring the real Claude
      Code naming convention, fixture export files mirroring cm-03/cm-04/
      cm-10's own already-research-confirmed real schemas) covering every
      acceptance criterion, with cm-05/cm-06/cm-07's own external calls
      stubbed — never a live second operator's real data, and never this
      operator's own real conversation history either, in the automated
      suite.
    agent: tester
    depends_on: [research]
  - id: implement
    description: |
      Implement lib/mnemosyne/conversation-memory/
      harvestConversationHistory.ts: parameterized sessionsRoot/
      export-list inputs, cm-02..cm-07/cm-10 stage sequencing (composed,
      never reimplemented), cm-08's own confirmation-gate discipline
      reused unchanged.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: |
      Independently re-verify: no hardcoded path from cm-02's own
      original constants survives in this story's new orchestrator (read
      the diff); the fixed-list discipline was not accidentally loosened
      into a generic scan; no test fixture is this operator's own real
      content; the confirmation-gate discipline matches cm-08's own
      exactly, not a weaker variant.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feat/mnemosyne-conversation-memory.
    agent: developer
    depends_on: [review]

