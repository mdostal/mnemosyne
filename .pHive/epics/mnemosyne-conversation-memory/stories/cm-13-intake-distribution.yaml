id: cm-13-intake-distribution
epic: mnemosyne-conversation-memory
title: Intake distribution — resolve the real destination (meta or a confirmed scope), write there, mark the original intake entry as distributed
status: pending
complexity: high
methodology: tdd
depends_on: [cm-07-distillation-and-persist]

description: |
  New story (round 4, 2026-08-26, docs/design-discussion.md §11.3), the
  second of three real pieces the operator's own framing this pass split
  out — "a way to get into the others as we distribute" — the piece that
  actually reads `cm-07`'s `intake` landing entries, resolves each one's
  real destination, writes there, and marks the original as handled.

  **"Scope" disambiguation, stated once, up front, mirroring `[grill
  2.1.1]`/round-3-finding-3.1's own established convention for this exact
  kind of vocabulary collision:** every `scope: 'meta'`/`scope: 'intake'`
  reference below is Mnemosyne's own `Scope` TYPE (`interfaces.ts`); every
  `resolved_scope_candidate`/"confirmed candidate" reference is a real key
  from `swarm-memory`'s own `[scopes]` REGISTRY (`config.toml`, e.g.
  `arizona`) that gets PASSED AS that same TYPE's value once confirmed.
  Full three-way detail in docs/design-discussion.md §10.2, carried
  forward unchanged this round.

  **Reads `cm-07`'s `intake` entries — mechanism, named concretely (docs/
  design-discussion.md §11.3):** neither `recall()` (semantic, top-K,
  query-required) nor `swarm-memory grep` (keyword-scroll, still
  query-shaped, confirmed via `swarm-memory --help` this pass) is a full
  collection-enumeration primitive. This story introduces a new,
  READ-ONLY `scroll_points(name, payload_filter=None)` extension of
  `HttpQdrantClient` (`mnemosyne/inventory/qdrant_inventory.py`), wrapping
  Qdrant's own native `POST /collections/{name}/points/scroll` endpoint —
  the same LOW-risk category as that class's own already-existing
  `list_collections()`/`collection_info()` read methods (pure reads),
  never the same category as `create_collection()`'s one deliberate write
  exception. Used to enumerate every point in the `intake` collection ONLY
  (never any other collection), partitioned into candidates
  (`metadata.entry_type != 'distribution_marker'`) and existing markers
  (`metadata.entry_type == 'distribution_marker'`, read to compute which
  `entry_id`s to skip as already-handled).

  **Resolves the real destination — the confirmed-candidate-consumption
  logic `cm-07` originally owned through round 3 (docs/design-
  discussion.md §10.2 steps 2-3), moved here VERBATIM in substance, not
  reinvented:** for a given intake entry's carried-forward
  `resolved_scope_candidate` (nullable, computed read-only by `cm-06`,
  carried through `cm-07` inert): if the operator has explicitly
  confirmed that exact `cluster_id`'s candidate in the same human-review
  queue `cm-01`/`cm-05`/`cm-06` already produce (`review_reason:
  'scope_route_candidate'`), this story writes that entry's content to
  the CONFIRMED real scope. **For every other entry — no candidate, an
  unconfirmed candidate, or a confirmation record naming a `cluster_id`
  this entry doesn't belong to — this story writes to `scope: 'meta'`,
  unconditionally, no exceptions.** This is the exact same safe default
  §10.2 already established, now living in the story that actually
  performs the destination write (`cm-07` no longer does, docs/
  design-discussion.md §11.2).

  **Writes via the SAME `ingestDocument()`/`remember()` primitive,
  unchanged** — identical discipline to `cm-07`'s own "one persist
  primitive, reused, never reimplemented" convention (`[grill 4.1]`) —
  this story is the second, not a competing, caller of that primitive.

  **Marks the original intake entry as distributed — the real, concrete
  mechanism, grounded in this round's own re-read of `remember()`/
  `VectorLayerAdapter.remember()` (docs/design-discussion.md §11.1): no
  in-place update-by-id primitive exists anywhere in this epic's real
  dependency surface — every `remember()` call writes a brand-new
  timestamped file and a brand-new indexed point, never an in-place
  mutation.** "Marking" is therefore implemented as calling `remember()`
  AGAIN — the same, unchanged, remember()-adjacent primitive, never a
  bespoke new write path — writing a NEW, small entry into the SAME
  `intake` collection: `metadata.entry_type: 'distribution_marker'`,
  `metadata.marks_entry_id: <the original entry's entry_id>`,
  `metadata.distributed_to_scope: <'meta' or the confirmed real scope>`,
  `metadata.distributed_at: <ISO timestamp>`. **This is deliberately
  ADDITIVE, not a mutation — the original intake entry's own point is
  never touched, only a new, linked marker point is written alongside
  it.** This satisfies `ways_of_working.md`'s own hard "never wipe
  Qdrant... additive/upsert only, everywhere, no exceptions" rule
  identically to every other write this epic performs, and satisfies the
  operator's own words — "mark and distribute -- keep an audit trail" —
  more literally than an in-place mutation ever could: the original
  entry's own content stays byte-for-byte inspectable after marking.

  **Idempotency, named explicitly:** an intake entry whose `entry_id`
  already has a matching `distribution_marker` (from a prior run of this
  story) is skipped — never re-resolved, never re-written to a
  destination, never given a second marker. Re-running this story any
  number of times over the same intake state produces no duplicate
  destination writes and no duplicate markers.

  **A real sequencing note, mirroring `[grill 3.3]`'s own precedent
  (docs/design-discussion.md §10.4/round-3-finding-3.3), carried to its
  new home rather than silently dropped when the confirmed-candidate
  logic moved:** this story runs as its OWN, separate, later pass — never
  inline inside `cm-07`'s own synchronous distillation run, structurally
  enforced by this story's own `depends_on: [cm-07]` rather than `cm-07`
  composing it directly. A confirmed-candidate route can only ever be
  exercised in a run of THIS story that happens AFTER a human has
  reviewed and confirmed a candidate an earlier `cm-06`/`cm-07` pass
  surfaced — genuine scope-routing never happens on the same pass that
  first proposed the candidate.

acceptance_criteria:
  - "Given a real intake entry (metadata.entry_type != 'distribution_marker') with no distribution_marker entry referencing its entry_id anywhere in the intake collection, when distributeIntakeEntries() runs, then its destination is resolved (confirmed candidate or meta default, per the two criteria below) and its content is written to that destination via remember(), unchanged provenance metadata otherwise (chat_source/session_id/project_slug/cluster_id/entry_id all present)"
  - "Given an intake entry whose resolved_scope_candidate has NOT been explicitly confirmed on-disk for that exact cluster_id (absent from the review queue's own confirmation record, or present but not yet acted on), when distributeIntakeEntries() runs, then it is written to scope: 'meta' — the unconfirmed candidate is never used, verified by a test asserting the destination remember() call's scope argument is exactly 'meta' for this case"
  - "Given an intake entry whose resolved_scope_candidate the operator HAS explicitly confirmed (a real, on-disk confirmation record keyed to that exact cluster_id, fixture-simulated in the test), when distributeIntakeEntries() runs, then it is written to the CONFIRMED real scope value instead of 'meta' — full provenance-metadata contract otherwise unchanged, verified by inspecting the actual destination remember() call's arguments"
  - "Given a confirmation record naming a cluster_id that does NOT match any intake entry this story is actually processing (a stale or mismatched confirmation, fixture-simulated), when distributeIntakeEntries() runs, then it is IGNORED for that entry — the entry's own cluster_id's actual candidate status governs, falling back to scope: 'meta' when no matching confirmation exists — never applied to a different entry by accident, never causing an error that silently skips the whole run"
  - "Given a successful destination write for an intake entry, when distributeIntakeEntries() runs, then it ALSO writes a new distribution_marker entry into the intake collection (via the same unchanged remember() call) carrying metadata.entry_type='distribution_marker', metadata.marks_entry_id=<the original entry's entry_id>, metadata.distributed_to_scope, and metadata.distributed_at — verified by inspecting the marker remember() call's arguments, and verified the ORIGINAL intake entry's own point is never itself re-written, mutated, or deleted by this story (only a new, additive point is created)"
  - "Given an intake entry that already has a matching distribution_marker entry (entry_id referenced by an existing marker, fixture-simulated as pre-existing intake state), when distributeIntakeEntries() runs, then it is SKIPPED entirely — no destination write occurs, no second marker is written — verified by a test asserting zero remember() calls reference that entry_id on a second run"
  - "Given this story's own read of the intake collection, when distributeIntakeEntries() runs, then it uses the new scroll_points() read-only primitive (never recall() with a placeholder query, never swarm-memory grep with a placeholder query) — verified by confirming the import/call is the real scroll_points() function, and that it is scoped to the intake collection's own name only, never any other collection"
  - "Given this story's own scroll_points() extension of HttpQdrantClient, when reviewed, then it is a pure read (no write/create/delete HTTP verb used) — verified by a test asserting only GET/POST-scroll-shaped read calls are made, and that create_collection()'s own existing additive-write exception is untouched/unmodified by this story"
  - "Given this story's own calls to ingestDocument()/remember(), when reviewed, then they are called UNCHANGED (same public signature, no forked/modified copy) for both the destination write and the marker write — verified by confirming the import is the real ro-10/ro-13/cm-07-established module, not a local reimplementation"

steps:
  - id: research
    description: |
      Confirm the real, current Qdrant scroll-endpoint request/response
      shape (POST /collections/{name}/points/scroll, payload-filter
      syntax) directly against the live cluster before implementing
      scroll_points() — mirroring this epic's own consistent
      "confirm against the live system, not assumed" discipline. Confirm
      the real, concrete shape of the operator's own scope-route
      confirmation record (where it lives, how a specific cluster_id's
      confirmation is represented) — this is the SAME confirmation-record
      research task cm-07's own round-3 research step originally owned
      (docs/design-discussion.md §10.2); re-confirm it directly here
      rather than assuming cm-07's own now-superseded research findings
      transfer unchanged. Confirm the real, safe implementation approach
      for passing a non-'project'|'enterprise'|'meta'|'intake' scope
      string through remember()'s own RememberOptions.scope parameter —
      the same real, small, cross-epic coordination point named in §10.2
      for 'arizona', re-confirmed here since this story (not cm-07) is
      now the one that actually calls remember() with that value.
    agent: researcher
  - id: test-spec
    description: |
      Write failing tests against a fake IngestClient (mirrors
      ingestDocument.ts's/cm-07's own testing convention, never live
      Qdrant) and a stubbed scroll_points() covering every acceptance
      criterion: confirmed/unconfirmed/mismatched-candidate routing,
      marker-write behavior, idempotent skip-on-existing-marker, and the
      scroll_points() read-only-scoped-to-intake behavior itself.
    agent: tester
    depends_on: [research]
  - id: implement
    description: |
      Implement lib/mnemosyne/conversation-memory/distributeIntakeEntries.ts
      (intake enumeration via scroll_points(), confirmed-candidate
      destination resolution, remember() destination write, remember()
      marker write, idempotent skip logic) and the new read-only
      scroll_points() method on mnemosyne/inventory/qdrant_inventory.py's
      HttpQdrantClient (additive, alongside its existing list_collections()/
      collection_info() read methods — no delete/write method touched or
      added).
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: |
      Independently re-verify (same highest-scrutiny bar cm-07's own
      persist-time scan checkpoint is held to, applied here to this
      story's own equivalent-severity concern): every non-meta scope
      write genuinely requires a real, on-disk, per-cluster_id
      confirmation (read the diff, confirm no code path bypasses this);
      the marker write is genuinely additive, never a mutation of the
      original entry; scroll_points() is genuinely read-only and scoped
      to the intake collection only; HttpQdrantClient's own "no
      delete/drop method exists anywhere in this module" contract is
      genuinely untouched by this story's addition.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feat/mnemosyne-conversation-memory.
    agent: developer
    depends_on: [review]

