design_decisions:
  - decision: "The confirmed-vs-unconfirmed resolved_scope_candidate consumption logic (round 3's own design) moves here verbatim in substance from cm-07, not reinvented."
    rationale: "docs/design-discussion.md §11.2/§11.3 (round 4) — the operator's own explicit framing this pass separates the landing write (cm-07, always intake) from the distribution write (this story, the real destination) — the confirmed-candidate logic belongs with the story that actually has a destination-selection responsibility, which is now this story, not cm-07."
  - decision: "Intake enumeration uses a new, read-only scroll_points() primitive — never recall()/grep with a placeholder query."
    rationale: "docs/design-discussion.md §11.3 — recall() is semantic/top-K and grep is keyword-scroll, both query-shaped; neither is a full-enumeration primitive, and reaching for either with a placeholder query risks silently missing entries that don't match whatever placeholder was chosen. scroll_points() is Qdrant's own native mechanism for exactly this need, added in the same low-risk read-only category as HttpQdrantClient's own existing list_collections()/collection_info() methods."
  - decision: "'Marking' an intake entry as distributed is a NEW, additive remember() call (a distribution_marker entry), never an in-place mutation of the original entry."
    rationale: "docs/design-discussion.md §11.1's own real-code re-read this pass: remember()/VectorLayerAdapter.remember() always write a brand-new file and a brand-new indexed point — no update-by-id primitive is exposed anywhere in this epic's real dependency surface, so an in-place mechanism does not exist to reuse and inventing one would be a bespoke new write path. Independently, this is also the RIGHT design under ways_of_working.md's own 'never wipe Qdrant... additive/upsert only, everywhere, no exceptions' rule, and it satisfies the operator's own 'keep an audit trail' words more literally than a mutation would — the original entry's content remains inspectable after marking."
  - decision: "Idempotent: an entry with an existing matching distribution_marker is skipped on any re-run."
    rationale: "Prevents duplicate destination writes and duplicate markers if this story is run more than once over the same intake state — a real, expected operational pattern (this story is designed to run repeatedly as new intake entries accumulate, not once)."
  - concern: conversation-privacy-safety
    action: "The confirmed-candidate consumption path defaults to 'meta' for every entry except one with an explicit, on-disk, per-cluster_id operator confirmation — verified by an independent reviewer re-reading every code path that could set a non-'meta' scope value, the same highest-scrutiny bar cm-07's own persist-time scan checkpoint was held to through round 3, now applied here since this is where that responsibility lives."
  - concern: provenance-completeness
    action: "Every destination write carries the full existing provenance-metadata contract unchanged (chat_source/session_id/project_slug/cluster_id/entry_id); every marker write carries marks_entry_id/distributed_to_scope/distributed_at, the audit-trail fields cm-14's own future precondition check depends on."
  - concern: existing-infrastructure
    action: "ingestDocument()/remember() called unchanged for both the destination and marker writes — no forked copy, no parallel persistence mechanism. scroll_points() is additive to HttpQdrantClient, not a new, parallel Qdrant-access client."
  - concern: loud-failure
    action: "A destination write failure (e.g. the confirmed scope's own collection is unreachable) must be reported explicitly per-entry, never silently skipped and never allowed to still produce a distribution_marker for an entry whose destination write did not actually succeed — the marker write only ever happens after a confirmed-successful destination write."

risks:
  - severity: critical
    description: "This story now owns the scope-routing risk cm-07 previously carried through round 3: a defect that used an unconfirmed or mismatched resolved_scope_candidate anyway would put the operator's own personal content into a client-facing collection — categorically worse than any failure mode 'meta' alone could produce, since 'meta' keeps content under the operator's own sole control."
    mitigation: "The confirmed-candidate consumption logic is moved verbatim in substance from cm-07's own round-3 design (§10.2), not reinvented — the same safe default (unconditionally 'meta' absent an explicit, on-disk, per-cluster_id confirmation) applies, verified by the same independent-reviewer re-verification bar cm-07's own persist-time scan checkpoint was held to."
  - severity: high
    description: "A marker-write failure immediately after a successful destination write (e.g. a transient error on the second remember() call) could leave an entry successfully distributed but not yet marked — a real, accepted possibility this story's own idempotency design must handle correctly (re-running the story should re-attempt only the marker write for that entry, never re-attempt the destination write and produce a duplicate)."
    mitigation: "Named explicitly, not assumed away — the implementation step's own acceptance criteria require idempotent behavior keyed on entry_id/marker-presence, not on a single all-or-nothing per-entry transaction; a future re-run naturally retries only the missing half. Deferred to cm-14's own precondition check (§11.4(b)), which independently re-verifies BOTH the marker's existence AND the destination copy's real presence before ever treating an entry as safe to decommission — a partial-write state here is caught there, not silently trusted."
  - severity: medium
    description: "scroll_points()'s own real Qdrant request/response shape is not yet pinned to a confirmed request body by this planning pass — a real, open implementation detail."
    mitigation: "Named explicitly as this story's own first research-step task — confirm the real, current shape directly against the live Qdrant cluster before implementing, mirroring this epic's own consistent 'confirm against the live system, not assumed' discipline (e.g. cm-06's own embedder/scope-shell-out research tasks)."

