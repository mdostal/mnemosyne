design_decisions:
  - decision: "Linearize by walking BACKWARD from current_node through parent pointers, never forward from the tree's root."
    rationale: "ChatGPT's message-editing feature creates real sibling branches off a shared parent (confirmed structurally possible from the real mapping/children[] shape); current_node is the export's own pointer to the currently-ACTIVE path — a forward walk risks wandering into an edited-away branch and producing a linearization that doesn't match what the operator actually saw/kept."
  - decision: "Attachment/image content (content_type other than text) is never read as conversational text."
    rationale: "This story's scope is conversational TEXT memory, matching this epic's own goal (design-discussion §1) — image/file attachment content is out of scope, named explicitly rather than silently attempted and mishandled."

cross_cutting:
  - concern: conversation-privacy-safety
    action: "cm-01's scanner runs over every extracted turn — identical parse-time checkpoint to cm-03."
  - concern: provenance-completeness
    action: "Every ConversationTurn carries sessionId (mapped from conversation_id), timestamp (from create_time), and a projectSlug of null (ChatGPT conversations have no repo/project association — explicitly null, not omitted, per interfaces.ts's own 'explicit empty over omission' convention already established in ingestDocument.ts)."
  - concern: existing-infrastructure
    action: "Zero new persistence mechanism — output feeds cm-05/cm-06/cm-07 exactly like cm-03's output does, through the same shared contract."

risks:
  - severity: medium
    description: "A naive/incorrect DAG-walk could silently produce a WRONG linearization for an edited/branched conversation (e.g. including an abandoned branch, or missing part of the real active path) without any obvious signal that something is wrong."
    mitigation: "Research step explicitly hunts for and confirms a real multi-branch example before implementation; test-spec requires a genuine multi-branch fixture, not only a single-branch happy path — this is a NAMED, first-class acceptance criterion, not an edge case left to chance."
  - severity: low
    description: "The real export's `moderation_results`, `plugin_ids`, `gizmo_id`/`gizmo_type` (custom-GPT metadata), and other top-level fields (research-brief §1.2's full key list) are not consumed by this story's first cut."
    mitigation: "Named explicitly as an accepted scope limitation — this story's job is turn extraction, not full export-fidelity preservation; a future story could extend the ConversationTurn shape's metadata if this proves valuable."

references:
  - path: .pHive/epics/mnemosyne-conversation-memory/docs/research-brief.md
    relevant_excerpt: "§1.2 — the full, real, confirmed conversations.json shape (258 conversations, mapping tree structure, scaffold-node metadata) this parser is built against, plus the real byte counts."
  - path: .pHive/epics/mnemosyne-conversation-memory/docs/design-discussion.md
    relevant_excerpt: "§3 Risks — 'ChatGPT export's tree-DAG structure is more complex to linearize... a naive mapping-dict walk could mis-thread branched/edited conversations' — the exact risk this story's test-spec step is required to address with a real multi-branch fixture."

