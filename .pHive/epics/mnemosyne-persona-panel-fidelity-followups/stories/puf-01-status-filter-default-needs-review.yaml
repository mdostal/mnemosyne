id: puf-01-status-filter-default-needs-review
epic: mnemosyne-persona-panel-fidelity-followups
title: Default the Personas panel's status filter to "Needs review" instead of "All"
status: planned
complexity: low
methodology: tdd
depends_on: []

description: |
  Closes pu-14's FLAGGED finding D1 (fidelity-review.md): pu-01's chosen
  synthesized option explicitly specified the status filter should default
  to "Needs review" ("an operator opening the panel sees *only* actionable
  rows by default" -- operator-efficiency.md), but the shipped
  #personas-status-filter defaults to "All" (`<option value="all"
  selected>`, ui/index.html). No code comment or story ever documented this
  as an intentional deviation -- it reintroduces exactly the "scan past
  already-live rows" cost the brief's default was chosen to avoid.

acceptance_criteria:
  - "Given the Personas panel loads for the first time in a session, when #personas-status-filter's initial state is inspected, then its value is 'needs-review', not 'all'"
  - "Given the changed default, when the panel is exercised with a mix of live/needs-review/history rows, then the initial render shows only needs-review rows (renderPersonas()'s existing personaMatchesStatusFilter() logic, unchanged) -- this ticket changes the DEFAULT selection only, not the filtering logic itself"
  - "Given an operator manually changes the filter to any other value, then that manual choice is respected for the rest of the session (this ticket does not add any auto-reset-to-default behavior)"

files_to_modify:
  - file: ui/index.html
    change: "Move the `selected` attribute from <option value=\"all\"> to <option value=\"needs-review\"> on #personas-status-filter."

references:
  - path: .pHive/design/mnemosyne-persona-ux/fidelity-review.md
    relevant_excerpt: |
      D1 | Status-filter default is `All`, not `Needs review` as the brief
      explicitly specifies ... FLAGGED ... Cheap, concrete follow-up.
  - path: .pHive/design/mnemosyne-persona-ux/synthesized/option-2.md
    relevant_excerpt: "§1: status filter default -- Needs review."
