id: qdrant-inventory
epic: ingest-a10ab2c1
title: Qdrant Collection Inventory
status: complete
note: "Built via PAN-ticket workflow on origin/dev. mnemosyne/inventory/qdrant_inventory.py (261 lines) and .pHive/epics/ingest-a10ab2c1/inventory/qdrant-collections.yaml (a real, populated manifest) both exist, covered by mnemosyne/tests/test_qdrant_inventory.py. Did not execute the Python test suite in this audit."
complexity: low
methodology: tdd
depends_on: []

description: |
  Connect to Qdrant Cloud and inventory all existing collections. This is the
  discovery phase that bounds the bulk ingestion work for Slice 1.

acceptance_criteria:
  - "Given Qdrant Cloud credentials at ~/.config/swarm-memory/qdrant.key, when inventory script runs, then all collections are listed via API"
  - "Given collections list returned, when metadata extraction runs, then name, entry count, and created date are captured for each collection"
  - "Given collection metadata extracted, when inventory manifest is written, then .pHive/epics/ingest-a10ab2c1/inventory/qdrant-collections.yaml exists and is valid YAML"

steps:
  - id: research
    description: Explore swarm-memory CLI for Qdrant connection patterns and API usage
    agent: researcher
  - id: test-spec
    description: |
      Write failing tests for Qdrant inventory:
      - Connection establishment with valid/invalid keys
      - Collection listing via API
      - Metadata extraction
      - Manifest writing
      Do NOT read implementation code — tests define expected behavior independently.
    agent: tester
    depends_on: [research]
  - id: implement
    description: |
      Write Qdrant inventory script to make tests pass:
      - Read key from ~/.config/swarm-memory/qdrant.key
      - Connect to Qdrant Cloud
      - List collections via qdrant-client API
      - Extract metadata per collection
      - Write YAML manifest
      Do not modify tests.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Review implementation and tests for correctness and convention compliance
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feat/ingest-a10ab2c1
    agent: developer
    depends_on: [review]

