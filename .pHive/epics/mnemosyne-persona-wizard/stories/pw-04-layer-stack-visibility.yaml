id: pw-04-layer-stack-visibility
epic: mnemosyne-persona-wizard
title: Layer-stack visibility section (reuses GET /layers) + Level 0 pointer
status: complete
complexity: low
methodology: tdd

note_on_completion: >
  Merged 2026-08-15 (commit 04d5069). Real TDD, independently verified:
  reran the new persona-layer-stack test (16/16), http-api tests, tsc
  clean. Real, sound related-gap fix: GET /layers needed the same CORS
  treatment pw-02 shipped for /persona/* (pw-02 explicitly confirmed
  /layers was untouched) -- extended the same reviewed applyPersonaCors()
  helper rather than duplicating logic. Built isolated/additive per
  instructions since pw-03 (touching the same files) wasn't merged yet;
  applied cleanly with no conflict. Level 0 confirmed genuinely view-only
  (no edit affordance anywhere). All acceptance criteria met.
depends_on: [pw-02-get-persona-routes-cors]

description: |
  Implements horizontal-plan.md H3's layer-stack section: a second,
  clearly-separated part of the Personas panel showing the active memory
  layer stack (mnemosyne.layers.json/MNEMOSYNE_LAYERS) via the ALREADY-
  SHIPPED GET /layers route -- no new backend work, this is purely a second
  loadX()-style call against existing infrastructure. Also carries forward
  Level 0's view-only status from Epic 1: a pointer to ~/.mnemosyne/level0-
  rules.md, never an edit affordance.

acceptance_criteria:
  - "Given the UI is opened, when the layer-stack section loads, then it shows the currently configured layer stack, fetched from the existing GET /layers route -- confirmed NOT a new route"
  - "The layer-stack section is visually/structurally distinct from the persona list -- never merged into one list (research-brief.md §6)"
  - "A Level 0 pointer (path to ~/.mnemosyne/level0-rules.md) is shown, with NO edit form or edit affordance anywhere"

steps:
  - id: research
    description: Confirm GET /layers's exact response shape (server.ts:142-147) and locate the existing Level 0 path constant (level0.ts's DEFAULT_LEVEL0_PATH) for the pointer display.
    agent: researcher
  - id: test-spec
    description: Write failing tests for the layer-stack section's rendering, asserting it calls GET /layers (not a new route) and that no edit-Level-0 UI element exists anywhere in the rendered output.
    agent: tester
    depends_on: [research]
  - id: implement
    description: Add the layer-stack section to the Personas panel (pw-03's markup), fetching GET /layers and rendering the result, plus a static Level 0 path pointer.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Confirm no new backend route was added for this story (GET /layers reused as-is) and that Level 0 stays genuinely view-only.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

