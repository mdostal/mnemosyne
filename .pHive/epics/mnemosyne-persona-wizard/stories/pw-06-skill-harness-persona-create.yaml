    description: Read bin/mnemosyne-skill-helper.mjs's personaSyncAction/personaSeedAction/personaShowAction and personaCliRun() in full (lines 239-298) to add personaCreateAction in the identical shape.
    agent: researcher
  - id: test-spec
    description: |
      Write failing tests extending test/skill-harness.mjs's persona-*
      action test block (added in the v0.7.0 MCP-tools follow-on) with
      personaCreateAction coverage -- real subprocess, fake $HOME, matching
      the existing pattern.
    agent: tester
    depends_on: [research]
  - id: implement
    description: Add personaCreateAction to bin/mnemosyne-skill-helper.mjs (following personaCliRun's exact shape), add to SIMPLE_ACTIONS, update skills/mnemosyne-standalone/SKILL.md's action table.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Confirm this story invents zero new logic -- personaCreateAction must be a pure subprocess pass-through to pw-05's CLI verb, matching the existing persona-* actions' exact shape.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

