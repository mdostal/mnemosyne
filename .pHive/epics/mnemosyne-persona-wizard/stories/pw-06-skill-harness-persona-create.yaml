  - "Given the skill-harness CLI dispatcher, when `node bin/mnemosyne-skill-helper.mjs persona-create '{...}'` runs, then it works end-to-end (matches the existing persona-sync/persona-seed/persona-show dispatcher entries)"
  - "skills/mnemosyne-standalone/SKILL.md's action table gains a persona-create row, documented the same way persona-sync/persona-seed/persona-show already are"

steps:
