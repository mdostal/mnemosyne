title: Crawl-and-feed - remember() wiring using resolved mapping
status: complete
complexity: medium
methodology: tdd

note_on_completion: >
  Merged 2026-08-16 (commit 3e1d95e, built directly on the branch).
  Independently verified: read persona-remember.mjs in full -- confirmed
  resolveRememberScopeViaCli() spawns a real tsx subprocess calling a new
  `mnemosyne persona resolve-remember-scope` CLI subcommand
  (bin/mnemosyne-persona.mjs), which is a genuine pass-through to persona.ts's
  real resolveRememberScope() (grep-confirmed: imports and calls it
  directly, no hand-copied table). Confirmed fireRememberCall() spawns a
  real `node bin/mnemosyne-skill-helper.mjs remember` subprocess (the real
  rememberAction -> POST /remember -> engine.mjs's remember()). Confirmed
  rememberInterviewSource() has no conditional no-op branch -- fires
  unconditionally since buildRememberText() always produces non-empty text
  given the non-blocking hard-fail rule's guarantee of 3 populated core
  sections. Reran the new persona-interview-crawl-and-feed.test.ts myself
  (5/5) -- confirmed it independently re-derives the expected scope via a
  DIRECT import of persona.ts's real resolveRememberScope() and asserts the
  subprocess-derived scope matches it exactly (not just internal
  self-consistency), and confirmed both the global-tier and code-architect
  max-skip cases (reusing pw-12's exact skip-all pattern) still fire a real
  remember() call. Reran tsc --noEmit (clean) and the full vitest suite
  (599/599, 45 files, no regressions) myself. Closes the epic's stated
  release-gate "initial crawl and feeding" requirement. All acceptance
  criteria met.
depends_on: [pw-09-remember-scope-mapping, pw-12-interview-skill-skip-all-regression]

description: |
  The convergence point of pw-09 (remember()-scope mapping) and pw-10/11/12
  (interview mechanics) -- cannot be built before either exists. Implements
  the epic's stated release-gate requirement (design-discussion.md §1):
  after the interview produces a Persona, the skill makes real remember()
  calls indexing whatever source material the interview surfaced, scoped
  via pw-09's resolved mapping.

acceptance_criteria:
  - "After a completed interview writes a Persona (pw-11), at least one real remember() call fires, indexing the interview's source material"
  - "The remember() call's scope is resolved via pw-09's mapping function -- not a hardcoded or ad-hoc scope choice inside this story's own code"
  - "A maximally-skipped interview (pw-12) still triggers a real remember() call (even if the indexed content is minimal) -- crawl-and-feed does not silently no-op just because most questions were skipped"

steps:
  - id: research
    description: Re-read pw-09's resolved mapping function and confirm which remember() implementation (engine.mjs's or client.ts's) the interview skill should call, matching whichever transport pw-11 already chose for the write primitive.
    agent: researcher
  - id: test-spec
    description: Write failing tests for a completed interview firing a real remember() call, correctly scoped via pw-09's resolver.
    agent: tester
    depends_on: [research]
  - id: implement
    description: Wire the remember() call into the interview skill's completion step, using pw-09's resolver for the scope argument.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Confirm the scope resolution genuinely goes through pw-09's function -- not a parallel, slightly-different scope decision made inline in this story.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

