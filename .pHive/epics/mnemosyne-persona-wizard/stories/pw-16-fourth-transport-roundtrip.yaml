    depends_on: [test-spec]
  - id: review
    description: Confirm this extends pw-08's existing test file rather than duplicating a parallel test harness.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

