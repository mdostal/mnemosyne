note_on_completion: >
  Merged 2026-08-15 (commit 738fe3c). Real TDD, independently verified:
  reran mcp-server-persona.mjs (all PASS, including global-tier write,
  repo-local write with content round-trip, bad-tier rejection, and
  mandateSections smuggling rejected before any disk write), mcp-server.mjs
  (tools/list count 11->12, confirmed), vitest lib/mnemosyne/layer1
  (150/150), tsc clean. Registration matches persona_sync/persona_seed/
  persona_show's exact shape; persona_create is a thin wrapAction() wrap of
  pw-06's personaCreateAction, zero new business logic. Judgment call
  (documented, agreed): the AC's "invalid arguments" case is exercised via a
  bad-tier YAML-content test rather than a missing --file test, since --file
  is a required zod string already correctly rejected at the MCP transport
  layer before the handler runs (consistent with persona_sync's existing
  required-arg behavior). All acceptance criteria met.
depends_on: [pw-06-skill-harness-persona-create]

description: |
  Implements horizontal-plan.md H4's MCP component. Depends on pw-06 --
  this story imports and wraps pw-06's skill-harness action directly,
  exactly matching how persona_sync/persona_seed/persona_show already
  import personaSyncAction/personaSeedAction/personaShowAction. Thinnest
  story in the write-primitive chain -- a real, low-complexity wrap once
  pw-06 exists.

acceptance_criteria:
  - "Given the MCP server is running, when the persona_create tool is called with valid arguments, then it produces the identical on-disk file pw-05/pw-06 alone would produce"
  - "The tool's inputSchema (zod) matches the same shape/naming convention persona_sync/persona_seed/persona_show already use"
  - "Given invalid arguments (bad tier, mandateSections smuggling), when persona_create is called, then it returns ok:false in its own JSON payload (not a thrown MCP transport error), matching wrapAction's existing contract"

