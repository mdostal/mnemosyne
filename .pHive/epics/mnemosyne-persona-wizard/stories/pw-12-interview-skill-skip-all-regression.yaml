id: pw-12-interview-skill-skip-all-regression
epic: mnemosyne-persona-wizard
title: Interview skill - maximally-skipped regression test
status: pending
complexity: low
methodology: tdd
depends_on: [pw-11-interview-skill-persona-output]

description: |
  Proves horizontal-plan.md H6.3's non-blocking hard-fail rule concretely:
  the interview MUST continue and still produce a valid, writable Persona
  record regardless of how many questions are skipped. This is a real,
  automatable regression test, not an assumption -- closes Slice 3's
  interview-mechanics work before crawl-and-feed (pw-13) builds on top of
  it.

acceptance_criteria:
  - "Given every skippable question is skipped, when the interview completes, then it still produces a Persona record that passes assertValidPersona"
  - "Skipped core fields carry the explicit placeholder convention (matching kickoff-protocol.md's pattern), never a missing/undefined field"
  - "The skill does not halt, error, or require operator escalation when maximally skipped -- confirmed by the test actually completing successfully, not just not crashing"

steps:
  - id: research
    description: Re-read pw-10/pw-11's shipped skill content to identify every skippable question and its exact placeholder convention.
    agent: researcher
  - id: test-spec
    description: Write the failing maximally-skipped regression test itself -- this IS the story's primary deliverable, not a separate step.
    agent: tester
    depends_on: [research]
  - id: implement
    description: "Fix anything the regression test surfaces in pw-10/pw-11's implementation (expected result: minor, if those stories are correct) -- this story is primarily test-authoring, not new feature work."
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Confirm the test genuinely exercises "everything skipped," not a partial-skip case that happens to still pass.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feature branch. Confirm pw-09 through pw-12 (everything except crawl-and-feed) is green together.
    agent: developer
    depends_on: [review]

