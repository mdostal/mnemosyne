description: |
  Proves horizontal-plan.md H6.3's non-blocking hard-fail rule concretely:
  the interview MUST continue and still produce a valid, writable Persona
  record regardless of how many questions are skipped. This is a real,
  automatable regression test, not an assumption -- closes Slice 3's
  interview-mechanics work before crawl-and-feed (pw-13) builds on top of
  it.

acceptance_criteria:
  - "Given every skippable question is skipped, when the interview completes, then it still produces a Persona record that passes assertValidPersona"
  - "Skipped core fields carry the explicit placeholder convention (matching kickoff-protocol.md's pattern), never a missing/undefined field"
  - "The skill does not halt, error, or require operator escalation when maximally skipped -- confirmed by the test actually completing successfully, not just not crashing"

