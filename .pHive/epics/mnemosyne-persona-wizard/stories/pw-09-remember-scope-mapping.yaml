    relevant_excerpt: |
      H7: real candidates worth naming as the starting option set: (a) map
      each global tier to a fixed client.ts Scope value with scopeId folded
      into remember()'s free-text/metadata; (b) map to engine.mjs's
      free-form lane vocabulary instead; (c) a hybrid reconciling the two
      remember() implementations as part of resolving this.
