design_decisions:
  - decision: "This story owns the decision itself, not just the implementation -- horizontal-plan.md H7 explicitly left the decision unmade ('explicitly out of scope for this planning pass'), naming 3 candidate options."
    rationale: "design-discussion.md's own bar: 'a wizard that guesses wrong here writes memory into the wrong lane silently... needs a real decision, not an assumption.'"

cross_cutting:
  - concern: documentation
    action: "Document the resolved mapping's rationale in both a code comment and a design-discussion.md addendum, per this story's own acceptance criteria."

risks:
  - severity: high
    description: "A wrong or under-specified mapping here means every future interview-driven remember() call writes into the wrong memory lane, silently -- this is the one open question the design discussion flagged as having no safe default."
    mitigation: "Explicit determinism tests + durable documentation of the rationale, not a quick implicit choice."

references:
