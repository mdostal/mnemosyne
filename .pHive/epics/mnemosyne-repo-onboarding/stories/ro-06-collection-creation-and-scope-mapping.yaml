    mitigation: "Additive-only module (no delete path exists); explicit before/after collection-list diff required in review, independently re-run by the reviewer, not trusted from the developer's own self-report."
  - severity: high
    description: "swarm-memory's real collection-create surface and scopes-config location are both unconfirmed going into this story."
    mitigation: "Research step is the story's first, blocking step — implementation does not proceed until both are confirmed against the real sibling repo/config, not assumed."

