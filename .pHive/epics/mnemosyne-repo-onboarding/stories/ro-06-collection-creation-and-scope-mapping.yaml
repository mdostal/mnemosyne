design_decisions:
  - decision: "Research spike is this story's own first step, gating the implementation path — not an assumption baked into planning."
    rationale: "Grill finding 2.1 — swarm-memory's real CLI surface was never read during this epic's research pass; discovering the wrong answer mid-implementation would be far more expensive than a dedicated first step."
  - decision: "Additive-only function signature — no delete/drop code path exists anywhere in this module, at all."
    rationale: "ways_of_working.md's hard rule: never wipe Qdrant. The absence of any delete capability in the module is a stronger guarantee than a runtime check that merely avoids calling delete."

cross_cutting:
  - concern: loud-failure
    action: "Partial-failure state (collection created, scope-mapping write failed) must be reported explicitly, per acceptance criterion #5 — never a generic error that hides which half succeeded."

