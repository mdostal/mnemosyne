design_decisions:
  - decision: "Vector-index sub-step is stubbed { ran: false, reason: 'not yet implemented' } in this story, wired for real in ro-07."
    rationale: "Vertical slicing (docs/vertical-plan.md Slice 1) — this story delivers Mode B fully working with zero live Qdrant Cloud dependency before any collection-creation risk is introduced."
  - decision: "Each sub-step records soft failure in its own result field rather than the orchestrator throwing on any partial failure."
    rationale: "Mirrors MnemosyneClient's own established recordDegradation/layers_skipped convention (client.ts) — never silently drop a failure, but also never let one optional sub-step (e.g. no graphify) block the rest of onboarding from completing."

cross_cutting:
  - concern: loud-failure
    action: "Level 0 missing must propagate as a hard, uncaught error through onboardRepo() — verified explicitly in review, not assumed from readLevel0Content's own existing contract."
  - concern: provenance-completeness
    action: "N/A for this story directly (no recall() hits produced yet) — flagged for ro-07 once the vector-index sub-step is real."

risks:
  - severity: medium
    description: "Two independently-maintained graphify-availability checks exist in this codebase (TS config.ts vs the JS zero-dep server's bin/graphify-bridge.mjs, per cr-01's own doc comment) — onboardRepo() only reuses the TS side."
    mitigation: "Explicitly named as a known, accepted gap in this story's design decisions and in structured-outline.md's risk registry (R4) rather than silently assumed fine."

