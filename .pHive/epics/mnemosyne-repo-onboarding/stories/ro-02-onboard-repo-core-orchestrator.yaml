id: ro-02-onboard-repo-core-orchestrator
epic: mnemosyne-repo-onboarding
title: Shared onboardRepo() orchestrator (Layer-1 sync, persona seed, first-time index, base-level report)
status: pending
complexity: high
methodology: tdd
depends_on: [ro-01-memory-levels-scoped-extraction]

description: |
  The one piece of new code both deployment modes share, per the design
  discussion's own elicitation Q5 proof: a mode-parameterized
  (`'tree' | 'standalone'`) orchestrator, `onboardRepo()`, that sequences
  ALREADY-SHIPPED primitives into one repeatable "bring a repo online"
  action:

  1. Layer 1 sync — `syncAllHarnesses(repoRoot, 'code-architect', scopeId)`
     (lib/mnemosyne/layer1/sync.ts, shipped, la-01). Installs Level 0
     (operator rules, hard-fails if missing — never swallowed by this
     orchestrator) + Level 1 (mnemosyne.md, if present) + code-architect
     tier content, INCLUDING the la-07 memory-lifecycle mandate (already
     spliced by syncAllHarnesses today) into CLAUDE.md/AGENTS.md/GEMINI.md.
     This is the concrete mechanism behind the operator's "continue to grow
     ... over time" ask — installing the mandate is what drives ongoing
     recall-on-entry/remember-on-exit usage by whatever agent works in this
     repo next.
  2. Persona seed — `writeRepoLocalPersona(repoRoot, ...)`
     (layer1/persona-store-repo-local.ts, shipped, pf-01), only if
     `repoLocalPersonaPath(repoRoot, scopeId)` doesn't already exist
     (never overwrite an operator-authored persona).
  3. First-time index — Level 4 via `writeFileStoreIndex` (ml-06/ml-08,
     shipped, same call path bin/mnemosyne-file-index.mjs already uses).
     Level 2 (graphify) only when the `graphify` binary is on PATH,
     reusing config.ts's exact `isCommandOnPath` check — never a
     re-implementation of that availability logic.
  4. Base-level report — constructs its OWN scoped
     `new MnemosyneClient({ rootDirectory: repoRoot })` and calls
     ro-01's extracted `computeMemoryLevels(scopedClient, repoRoot)`.

  Mode 'tree' additionally runs a vector-index sub-step (stubbed
  `{ ran: false, reason: 'not yet implemented' }` until ro-07 lands, which
  wires the real collection-creation path); mode 'standalone' never
  attempts it. No other branching exists between the two modes inside this
  orchestrator — confirming the design discussion's "one coherent
  capability" framing at the implementation level.

acceptance_criteria:
  - "Given a fresh temp directory with no prior Mnemosyne state, when onboardRepo({ mode: 'standalone', repoRoot, scopeId }) runs, then CLAUDE.md/AGENTS.md/GEMINI.md are created with the managed block present (Level 0 + tier content, la-07 mandate section included)"
  - "Given the same fresh temp directory, when onboardRepo() completes, then <repoRoot>/.mnemosyne/personas/<scopeId>.yaml exists and passes assertValidPersona"
  - "Given the same fresh temp directory, when onboardRepo() completes, then <repoRoot>/.mnemosyne/file-index.json exists with a non-empty files list"
  - "Given a temp directory where a persona file ALREADY exists at repoLocalPersonaPath, when onboardRepo() runs again, then the existing persona file is left byte-unchanged (never overwritten)"
  - "Given Level 0's ~/.mnemosyne/level0-rules.md is missing, when onboardRepo() runs, then it throws the same loud error readLevel0Content already throws — never silently completes a partial onboarding"
  - "Given the graphify binary is NOT on PATH, when onboardRepo() runs, then it completes successfully with graphIndex: { ran: false, reason: <matches config.ts's own soft-fallback reasoning> }, never a hard failure"
  - "Given onboardRepo() completes for either mode, when its return value's baseLevel field is inspected, then it matches exactly what GET /memory-levels would report for a service actually rooted at repoRoot (cross-checked against ro-01's computeMemoryLevels called directly)"

steps:
  - id: research
    description: >
      Read syncAllHarnesses (layer1/sync.ts), writeRepoLocalPersona +
      repoLocalPersonaPath (layer1/persona-store-repo-local.ts),
      writeFileStoreIndex (layers/FileStoreIndex.ts), isCommandOnPath
      (layers/GraphifyLayerAdapter.ts, referenced from config.ts), and
      ro-01's computeMemoryLevels signature — confirm exact call shapes
      before composing them.
    agent: researcher
  - id: test-spec
    description: >
      Write failing tests for onboardRepo() against real temp directories
      (mirroring test/agent-cli.mjs's mkdtemp-per-test-block isolation
      convention — never the operator's real $HOME or repo state): fresh
      repo (all steps run), already-personaed repo (persona step
      no-ops), missing Level 0 (loud throw), graphify absent (soft
      degrade), and a base-level cross-check against ro-01's function
      called directly on the same scoped client.
    agent: tester
    depends_on: [research]
  - id: implement
    description: >
      Create lib/mnemosyne/onboarding/onboardRepo.ts implementing the
      sequence above. Compose, never reimplement, each already-shipped
      primitive. Each sub-step's soft failure records { ran: false, reason
      } in the result rather than throwing; only Level 0's hard failure
      (already loud by design) is allowed to propagate uncaught.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: >
      Confirm no primitive is reimplemented (grep for duplicated logic
      from sync.ts/persona-store-repo-local.ts/FileStoreIndex.ts/
      GraphifyLayerAdapter.ts), confirm the mode field only gates whether
      Mode-A-only steps run (never changes shared-step behavior), confirm
      loud-failure contract for Level 0.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feat/mnemosyne-repo-onboarding.
    agent: developer
    depends_on: [review]

