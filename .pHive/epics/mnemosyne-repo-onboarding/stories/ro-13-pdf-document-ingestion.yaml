id: ro-13-pdf-document-ingestion
epic: mnemosyne-repo-onboarding
title: PDF text extraction into the SAME ingestDocument() primitive (no second ingestion path)
status: pending
complexity: medium
methodology: tdd
depends_on: [ro-10-document-ingestion-primitive]

description: |
  Amendment story, round 3 (design-discussion.md §7.9), closing open
  question #4 (§7.8): the operator's explicit answer is that PDF ingestion
  MUST happen, not be deferred to an unscoped future epic. `ro-10`
  deliberately excluded PDF because `package.json` confirmed no
  PDF-parsing dependency existed anywhere in this codebase — that gap is
  closed here, in the SAME `ingestDocument()` primitive `ro-10` shipped,
  never a second, parallel ingestion path.

  **Real dependency research (npm registry read directly, not assumed):**

  Two real candidates were pulled from the actual npm registry and
  compared on the exact axes this codebase already cares about (this repo
  already carries one native-binding dependency, `better-sqlite3`, whose
  native-binding crash is a named, already-documented pre-existing test
  flake per `mnemosyne-memory-levels`'s own horizontal-plan.md — a second,
  avoidable native-binding dependency is a real, concrete cost, not a
  theoretical one):

  - `pdf-parse@2.4.5` (the mehmet-kozan-maintained fork; the original
    `pdf-parse` package is unmaintained) — REJECTED. Its own registry
    metadata (`npm view pdf-parse dependencies`) shows a HARD, required
    dependency on `@napi-rs/canvas@0.1.80` — a native N-API addon with
    per-platform prebuilt binaries. Even though `@napi-rs/canvas` ships
    prebuilds (lighter-weight than a `node-gyp`-compiled dependency), it
    is still a second native-binding install-time surface in exactly the
    class this codebase already has one avoidable instance of and no
    reason to add a second. `pdf-parse`'s own declared `engines.node` is
    also an unusual, narrower range (`>=20.16.0 <21 || >=22.3.0` — Node 21
    excluded entirely).
  - `unpdf@1.8.1` — CHOSEN. Published by the UnJS collective (the team
    behind `unbuild`/`ofetch`/`h3`, an actively-maintained org with a real
    track record in this ecosystem), last published 2026-08-13 (six days
    before this amendment), ~2.3M weekly downloads
    (`api.npmjs.org/downloads/point/last-week/unpdf`, read directly).
    Its registry manifest has **zero required `dependencies`** — its only
    dependency is `@napi-rs/canvas`, and it is declared a `peerDependency`
    with `peerDependenciesMeta.optional: true`, used ONLY by
    `renderPageAsImage`/`createIsomorphicCanvasFactory` (page-to-image
    rendering), which this story never calls. Confirmed directly from the
    unpacked tarball: the entire package is 157 files, pure `.mjs`/`.cjs`/
    `.d.ts` — zero `.node`/`.wasm` binaries anywhere in the package
    (`tar tzf unpdf-1.8.1.tgz | grep -iE '\.wasm|\.node$'` — zero matches).
    It vendors Mozilla's own `pdf.js` engine directly inside
    `dist/pdfjs.mjs` (1.68MB minified JS, the same battle-tested parser
    shipped inside every Firefox install — one of the most heavily-fuzzed
    PDF parsers that exists) rather than pulling `pdfjs-dist` as an
    external dependency. `getDocumentProxy(data)` takes a plain
    `Uint8Array`/`ArrayBuffer` (not a Node-specific `Buffer` API — a
    `Buffer` from `fs.readFileSync()` satisfies this directly since
    `Buffer` extends `Uint8Array`, but the API itself is cross-runtime by
    design, not Node-coupled).

  **Real, honest tradeoff — not silently absorbed:** `unpdf@1.8.1`
  declares `engines: { node: ">=22" }`, stricter than this package's own
  current `package.json` (`engines.node: ">=20"`). This repo's actual CI
  (`ci.yml`, `node-version: '22'`) and local dev (`node --version` ->
  v24.18.1 at research time) both already satisfy `unpdf`'s floor, and the
  raw `pdfjs-dist` package itself (v6.2.108, the officially-maintained
  upstream) now requires an even stricter `>=22.13.0 || >=24` — confirming
  the entire modern pdf.js ecosystem has moved past Node 20, not a quirk
  unique to `unpdf`. This story's implementation step MUST bump this
  package's own `package.json` `engines.node` from `>=20` to `>=22` as
  part of landing PDF support (a real, named, package-wide floor raise —
  not silently absorbed as if it only affected the new PDF codepath) and
  call this out explicitly in `ro-09`'s CHANGELOG entry.

  **Bounded scope, same discipline as `ro-10` itself (never parse first,
  bound later):**

  - A NEW constant, `MAX_PDF_SOURCE_BYTES`, caps the RAW PDF file's byte
    size BEFORE `getDocumentProxy()` is ever called — checked from
    `Buffer.byteLength`/`fs.statSync` on the already-read/about-to-be-read
    bytes, never after a parse attempt has already started. Deliberately a
    SEPARATE constant from `ro-10`'s `MAX_INGEST_BYTES` (not the same
    literal cap reused) because the two measure structurally different
    things: `MAX_INGEST_BYTES` bounds already-extracted TEXT (`ro-10`'s
    existing enforcement, reused unchanged below); `MAX_PDF_SOURCE_BYTES`
    bounds the compressed BINARY PDF file's source bytes before parsing —
    a PDF's byte size is dominated by embedded images/fonts and is not a
    reliable proxy for how much text it contains, so conflating the two
    caps would either let a huge, image-heavy PDF through (if sized for
    text) or reject a legitimate, text-heavy, well-compressed multi-page
    PDF (if sized too small) — named explicitly as its own design decision
    below, not silently assumed equivalent to `ro-10`'s cap.
  - After extraction, the resulting text is handed to `ro-10`'s existing,
    UNCHANGED `ingestDocument()` — which already enforces `MAX_INGEST_BYTES`
    on that extracted text and already does the chunking/tagging/
    sequential-`remember()` work. This story adds NO second write path,
    NO second chunker, NO second tagging scheme — `.pdf` is a new INPUT
    FORMAT feeding the exact same primitive `.txt`/`.md` already feed.
  - **Page/chunk granularity, resolved explicitly (grill round 3, finding
    2 — not silently assumed):** `unpdf`'s `extractText(pdf, { mergePages:
    false })` (the default) returns one string PER PAGE, but `ro-10`'s
    existing chunker operates on a single flat string, splitting by
    character-count bounds with no concept of a page boundary. This story
    does NOT silently concatenate all pages into one flat string and let
    page identity disappear into `ro-10`'s existing chunk-N tagging.
    Instead: each PAGE's text is passed through `ro-10`'s existing
    chunker independently (a page whose text exceeds one chunk's bound
    still splits into multiple chunks, exactly as `ro-10`'s own
    multi-chunk behavior already works for a long `.txt`/`.md` file), and
    the resulting `Content.metadata`/`tag` for every chunk carries BOTH
    the page number AND the chunk-within-page index (e.g. "resume.pdf,
    page 2, chunk 1") — so a `recall()` hit's provenance traces back to a
    real page, not just an anonymous position in a fully-flattened blob.
    This is a small, explicit extension of `ro-10`'s existing tag shape
    (page number added alongside the filename/chunk-index fields it
    already carries), not a second tagging scheme.
  - Corrupt/unparseable/encrypted PDFs fail loudly, never a silent
    empty-content ingest. Confirmed directly from the vendored `pdf.js`
    source (`dist/pdfjs.mjs`) that it throws real, distinguishable,
    named exception classes: `PasswordException` (encrypted/password-
    protected PDF — `PasswordResponses`/`NeedPassword`/`IncorrectPassword`
    constants confirmed present) and `InvalidPDFException` (corrupt/
    malformed PDF structure). This story's implementation catches both by
    name and surfaces a distinguishable error message per class — never a
    generic catch-all that reports "ingestion failed" with no signal of
    which failure mode actually occurred.

acceptance_criteria:
  - "Given a well-formed, real multi-page PDF file's bytes under MAX_PDF_SOURCE_BYTES, when ingestDocument(client, { content: pdfBytes, filename: 'resume.pdf' }) is called, then unpdf's getDocumentProxy()/extractText({ mergePages: false }) successfully extracts one text string per page, each page's text is run through ro-10's SAME existing chunker independently, and every resulting remember() call's tag/metadata identifies BOTH 'resume.pdf' page P and chunk-within-page index N (never a single flattened chunk-N-of-file tag that loses page identity)"
  - "Given a PDF file whose raw byte size exceeds MAX_PDF_SOURCE_BYTES, when ingestDocument() is called, then it fails loudly (ok: false, a clear oversized-PDF-source error naming MAX_PDF_SOURCE_BYTES) BEFORE getDocumentProxy()/extractText() is ever invoked — verified directly by instrumenting/spying that the pdf-parsing call is never reached, never a silent truncate-then-parse"
  - "Given a PDF file protected by a password (a real, fixture-generated encrypted PDF, not a mocked exception), when ingestDocument() is called, then it fails loudly with a message distinguishing 'encrypted/password-protected' from any other failure class, catching unpdf/pdf.js's real PasswordException by name — never a silent empty-content ingest"
  - "Given a corrupt/malformed PDF (a real, deliberately-truncated/byte-mangled fixture, not a mocked exception), when ingestDocument() is called, then it fails loudly with a message distinguishing 'corrupt/unparseable PDF' from any other failure class, catching unpdf/pdf.js's real InvalidPDFException by name — never a silent empty-content ingest"
  - "Given extracted PDF text itself exceeds ro-10's existing MAX_INGEST_BYTES (a large multi-page PDF), when ingestDocument() is called, then ro-10's ALREADY-EXISTING oversized-content rejection fires unchanged on the post-extraction text — proving this story adds zero new, parallel size-enforcement logic for the post-extraction stage, only the new pre-parse MAX_PDF_SOURCE_BYTES gate"
  - "Given ingestDocument() completes successfully for a real, multi-page PDF fixture, when recall() is subsequently called against the same scope, then hits from at least one page/chunk are returned with full 7-field provenance (layer, source, chunk_span, index_timestamp, content_hash, embedder, retrieval_time) naming the source .pdf filename — proving real extracted PDF text landed and is recall()-able, not merely that extraction returned non-empty text"

steps:
  - id: research
    description: >
      Confirm (already done for this story's own planning, re-verify at
      implementation time against whatever unpdf/pdf-parse versions are
      then-current on the npm registry) unpdf@1.8.1's actual dependency
      manifest (zero required deps, @napi-rs/canvas as an unused optional
      peer), its vendored-pdfjs exception classes (PasswordException,
      InvalidPDFException), and its extractText()/getDocumentProxy() API
      shape. Confirm this package's engines.node bump (>=20 -> >=22) is
      the only package.json-wide side effect of adding this dependency.
    agent: researcher
  - id: test-spec
    description: >
      Write failing tests for ingestDocument()'s new PDF input path
      against a stubbed/fake MnemosyneClient (same convention ro-10's own
      tests use, never a live Qdrant call): a real well-formed multi-page
      PDF fixture (generated once, checked into the test fixtures
      directory), a real password-protected PDF fixture, a real corrupt/
      truncated-byte PDF fixture, an oversized-source-bytes case (spy
      confirming getDocumentProxy is never called), and a real recall()
      provenance round-trip mirroring ro-10's own acceptance criterion #6.
    agent: tester
    depends_on: [research]
  - id: implement
    description: >
      Add unpdf@^1.8.1 to package.json dependencies (caret range, matching
      this package.json's own existing convention for every current
      dependency — @modelcontextprotocol/sdk, better-sqlite3, tsx, yaml,
      zod all use ^-ranges, never exact pins); bump engines.node from
      >=20 to >=22. Extend lib/mnemosyne/ingest/ingestDocument.ts to detect
      a .pdf filename hint (or an explicit content-type option), route PDF
      bytes through MAX_PDF_SOURCE_BYTES check -> unpdf's
      getDocumentProxy()/extractText() -> the SAME existing
      chunk/tag/remember() path .txt/.md content already uses. Catch
      PasswordException/InvalidPDFException by name for distinguishable
      loud failures. No changes to the ingest_document MCP tool's,
      bin/mnemosyne-ingest.mjs's, or POST /ingest's existing external
      contract — .pdf is accepted through the SAME surfaces ro-10 already
      shipped, not a new tool/verb/route.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: >
      Confirm MAX_PDF_SOURCE_BYTES is genuinely checked before
      getDocumentProxy() is called (not after a partial parse attempt),
      confirm PasswordException/InvalidPDFException produce genuinely
      distinguishable error messages (not a shared generic string),
      confirm zero second ingestion/storage path was introduced (PDF text
      flows through the exact same chunk/tag/remember() code ro-10 already
      ships, verified by reading the diff, not assumed from the story
      description alone).
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feat/mnemosyne-repo-onboarding.
    agent: developer
    depends_on: [review]

