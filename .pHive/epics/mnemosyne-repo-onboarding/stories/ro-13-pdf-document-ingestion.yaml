design_decisions:
  - decision: "unpdf@^1.8.1 chosen over pdf-parse@2.4.5 (and over depending on pdfjs-dist directly)."
    rationale: "pdf-parse hard-requires the native-binding @napi-rs/canvas as a required dependency (registry-confirmed) — a second native-binding install-time surface this codebase already has one avoidable instance of (better-sqlite3) and no reason to add a second. unpdf vendors pdf.js directly with zero required dependencies (registry- and tarball-confirmed: no .node/.wasm files anywhere in the package), and its only dependency on @napi-rs/canvas is an unused, optional peer this story never imports. Depending on raw pdfjs-dist directly was also considered and rejected: its latest version (6.2.108) requires an even stricter Node floor (>=22.13.0 || >=24) than unpdf, with no packaging convenience unpdf doesn't already provide for text-only extraction. Grill round 3 pushed this verification one level deeper than 'no declared native dependency': the vendored dist/pdfjs.mjs bundle itself was grepped directly for require(...)/process.dlopen/.node dynamic-load patterns — zero matches — confirming no native module is loaded at runtime through an undeclared, dynamic path either, not just absent from the declared dependency graph."
  - decision: "engines.node is bumped from >=20 to >=22 as a real, named, package-wide side effect of this story, not hidden as a PDF-only change."
    rationale: "npm's engines field is package-wide, not conditional per feature — adding unpdf as an unconditional dependency (never lazy-loaded/optional, since PDF ingestion must always be available per the operator's explicit requirement) means the whole package's floor moves. This repo's actual CI (node 22) and dev environment (node 24) already satisfy the new floor; the bump is named explicitly in ro-09's CHANGELOG entry rather than silently absorbed."
  - decision: "MAX_PDF_SOURCE_BYTES is a new, separate constant from ro-10's MAX_INGEST_BYTES, not a reuse of the same literal cap."
    rationale: "The two constants bound structurally different things (compressed binary PDF source bytes vs. already-extracted plain text bytes) — a PDF's byte size is dominated by embedded images/fonts, not proportional to its text content, so a single shared cap would either be too permissive for image-heavy PDFs or too restrictive for well-compressed, text-heavy ones. Named explicitly rather than silently assumed equivalent to ro-11's own shared-MAX_INGEST_BYTES reuse (which is valid there because ro-11's crawled bytes and ro-10's ingested bytes are both already-decoded text/HTML, a genuinely comparable quantity)."
  - decision: "PDF support lands as a new input branch inside ro-10's existing ingestDocument(), never a second ingestion primitive, MCP tool, CLI verb, or HTTP route."
    rationale: "Operator's own explicit instruction for this amendment: PDF support must land in the SAME primitive. Consistent with this epic's own established discipline (ro-11 also feeds ro-10's ingestDocument() unchanged rather than inventing a parallel path)."

cross_cutting:
  - concern: loud-failure
    action: "Oversized PDF source bytes, encrypted PDFs, and corrupt PDFs each fail loudly with a distinguishable message before/instead of any silent empty-content ingest, per acceptance criteria #2-4."
  - concern: provenance-completeness
    action: "Extracted PDF text chunks must produce recall() hits with full 7-field provenance naming the source .pdf filename, verified directly in acceptance criterion #6, mirroring ro-10's own standard exactly."
  - concern: existing-infrastructure
    action: "PDF text is fed through ro-10's existing, unmodified chunk/tag/remember() path — no new storage mechanism, no second ingestion primitive, no new MCP tool/CLI verb/HTTP route."
  - concern: documentation
    action: "ro-10's existing 'ingest a document into memory' README mention is extended to name .pdf as a supported format; CHANGELOG entry (ro-09) explicitly names both the new unpdf dependency and the engines.node floor raise."

risks:
  - severity: medium
    description: "unpdf vendors its own copy of pdf.js rather than depending on the upstream pdfjs-dist package — future pdf.js security fixes land in unpdf on its own release cadence, not automatically via a transitive-dependency bump."
    mitigation: "unpdf's real release cadence (registry-confirmed: multiple releases within the week before this amendment, ~2.3M weekly downloads, UnJS-maintained) is active enough that this is a monitorable, not a blocking, risk — named explicitly rather than silently assumed safe forever."
  - severity: low
    description: "engines.node's bump from >=20 to >=22 could reject an install on an operator's older Node 20/21 runtime for the WHOLE package, not just the new PDF codepath."
    mitigation: "This repo's actual CI and documented dev environment already run Node >=22; named explicitly in this story's design decisions and ro-09's CHANGENLOG entry rather than silently absorbed as a PDF-only change."
  - severity: low
    description: "A PDF crafted to be small in raw byte size but pathologically expensive to parse (deeply nested object graphs, decompression-heavy streams) could still tie up CPU/memory even under MAX_PDF_SOURCE_BYTES, since the cap bounds bytes, not parse complexity."
    mitigation: "Same class of accepted, named risk ro-10 already carries for its own MAX_INGEST_BYTES (a byte cap, not a complexity cap) — not solved here; unpdf's vendored pdf.js is the same parser Firefox runs against arbitrary untrusted PDFs from the open web, the most heavily-adversarially-tested PDF parser realistically available to this codebase."

