design_decisions:
  - decision: "Default scope is exactly one page; same-domain multi-page crawling is a separate, explicit opt-in, hard-capped regardless of what's requested."
    rationale: "Operator's own task instruction: 'pick the SMALLEST safe default and make deeper crawling an explicit opt-in.' A single-page default has the smallest possible blast radius while still closing the literal 'crawl website' ask for the common case (a product's own about/description page, a CV hosted at a URL, etc.)."
  - decision: "First cut does naive tag-stripping text extraction, not a readability-grade content-extraction engine."
    rationale: "No HTML-parsing dependency exists anywhere in this codebase today (package.json, confirmed). Adding one is a genuinely separate risk/dependency decision, named as an explicit open question rather than silently bundled into an already-high-risk story."
  - decision: "robots.txt is checked and respected unconditionally — no flag exists anywhere in this module to bypass it."
    rationale: "Politeness/legal-safety requirement named explicitly by the operator's task instruction. The absence of any bypass code path is a stronger guarantee than a runtime check that merely defaults to respecting it, mirroring ro-06's own 'no delete path exists in the module at all' additive-only discipline."
  - decision: "Content-Type and byte-size checks happen before/during the body read, never after buffering the full response."
    rationale: "Guards against a malicious or merely huge response ballooning memory/storage from a single crawl call — a real, testable bound, not an after-the-fact truncation."

cross_cutting:
  - concern: external-fetch-safety
    action: "NEW, named concern (not in the generic .pHive/cross-cutting-concerns.yaml list, mirroring ro-06's own no-Qdrant-wipe precedent) — applies to this story by name. Its own acceptance criteria (robots.txt compliance, rate limiting, size/time ceilings, no-auth-bypass) ARE this concern's implementation checklist."
  - concern: loud-failure
    action: "robots.txt disallow, non-text Content-Type, oversized body, 401/403, and timeout all fail loudly with a distinguishable message each, per acceptance criteria — never a silent skip or a generic error."
  - concern: existing-infrastructure
    action: "Extracted content lands through ro-10's unmodified ingestDocument()/remember() cascade — no second storage mechanism, no new Qdrant/swarm-memory touchpoint outside that already-proven, additive-only path."
  - concern: documentation
    action: "New MCP tool/CLI verb/HTTP route each need a discoverable doc entry, PLUS this story's own non-goals (not a general scraper, no auth bypass, single-page default) must be stated in the same doc, not just this YAML."

risks:
  - severity: high
    description: "A naive tag-stripper could produce low-quality/garbled extracted text for complex pages (scripts, nav chrome, ads all stripped indiscriminately alongside real content), degrading recall() hit quality for crawled content without an obvious signal to the operator that quality is degraded."
    mitigation: "Named explicitly in this story's own docs/acceptance criteria as a known limitation (R10, design-discussion.md §7.6), not silently promised as high-fidelity; a real HTML-parsing dependency is named as a genuine, separate follow-on decision."
  - severity: medium
    description: "Repeated crawls of the same URL create new, additive chunks each time (remember()'s vector write path is --no-prune by design) — unbounded storage growth from repeat crawls over time."
    mitigation: "Named explicitly (R11, design-discussion.md §7.6) and deliberately NOT solved here — deferred to whoever eventually builds dedup/staleness handling, the same class of forward-compatibility note ro-02 already carries toward m-06-continuous-indexing for the file-index manifest."
  - severity: medium
    description: "A caller-supplied crawl target could point at an internal/private-network URL (e.g. a cloud-metadata endpoint or another service on the same host), turning this feature into an unintended network probe (R12, design-discussion.md §7.6)."
    mitigation: "This story's research step is a BLOCKING first step that must explicitly decide, and document, whether an SSRF guard is warranted for this story's real deployment context — not silently assumed safe because the primitive is 'just fetch().'"

