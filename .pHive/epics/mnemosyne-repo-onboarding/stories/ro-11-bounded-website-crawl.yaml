id: ro-11-bounded-website-crawl
epic: mnemosyne-repo-onboarding
title: Bounded, polite, single-page-default website crawl into the document-ingestion primitive
status: pending
complexity: high
methodology: tdd
depends_on: [ro-10-document-ingestion-primitive]

description: |
  Amendment story (design-discussion.md §7.3), deliberately isolated from
  `ro-10` — the highest-new-risk piece of this amendment per the
  operator's own instruction, held to `ro-06`'s exact rigor (research-
  gated, explicit non-goals, a NEW named cross-cutting safety concern, real
  before/after scrutiny) rather than treated as "just a fetch() call."

  Closes the "crawl website" third of the operator's ask: "product can...
  crawl website, etc to improve memory." Fetches a given URL (default:
  exactly that one page — same-domain multi-page crawling is a separate,
  explicit opt-in, hard-capped even when used), extracts best-effort text
  content, and feeds it through `ro-10`'s `ingestDocument()` UNCHANGED —
  never a second, parallel storage/ingestion mechanism.

  Real research first, not assumed: this codebase already uses the Node
  20+ global `fetch()` repeatedly (`server.ts:248`,
  `bin/mnemosyne-reindex.mjs:39`, `bin/mnemosyne-skill-helper.mjs:104/122/195`,
  `bin/mnemosyne-install-hooks:108`) with `AbortController`/`signal`-based
  timeouts — this story reuses that established pattern for its own
  per-request timeout rather than inventing a new HTTP-client convention.
  No HTML-parsing library (cheerio/jsdom/etc.) exists in this codebase
  (confirmed via `package.json`) — this story's first cut therefore does
  naive, best-effort tag-stripping text extraction, named explicitly as
  such, never claimed to be a readability-grade extraction engine.

  Explicit non-goals (never hand-waved, verified in review):
  - Not a general-purpose web scraper/spider.
  - Not unbounded or recursive crawling by default.
  - Not able to authenticate, inject credentials, use cookies, or bypass
    any access control — plain, unauthenticated GET only; 401/403 fails
    loudly, never worked around.
  - Not a scheduled/background crawler — one bounded, on-demand call.
  - Not a readability/content-extraction engine in this story's cut.

acceptance_criteria:
  - "Given a single URL and no depth/page-count option, when crawlAndIngest(url) runs, then it fetches EXACTLY that one page (never following any link) and feeds its extracted text through ro-10's ingestDocument() unchanged"
  - "Given a real robots.txt at the target host disallows the requested path, when crawlAndIngest(url) runs, then it fails loudly with a clear message naming the robots.txt disallow — the page is never fetched"
  - "Given multi-page crawling IS explicitly opted into (same-domain only) with a requested page count above this story's hard maximum, when crawlAndIngest() runs, then it caps at the hard maximum regardless of what was requested — never truly unbounded even when opted in"
  - "Given multi-page crawling is opted into, when successive same-host requests are made, then a real, enforced minimum delay elapses between them — measured directly in the test (real timestamps), not merely asserted present in code"
  - "Given a target URL responds with a Content-Type that is not text/* or application/xhtml+xml (e.g. an image or binary octet-stream), when crawlAndIngest() runs, then the response body is never read/buffered — the crawl fails loudly citing the rejected content type, checked from the header alone before consuming the body"
  - "Given a target URL's response body exceeds the SAME MAX_INGEST_BYTES constant ro-10 defines, when crawlAndIngest() runs, then it aborts the read once the cap is hit (never buffers the full oversized body into memory first) and fails loudly — one shared cap with ro-10, not a second, independently-drifting limit"
  - "Given a target URL returns 401 or 403, when crawlAndIngest() runs, then it fails loudly surfacing that status — no retry, no credential injection, no workaround attempted"
  - "Given a real per-request timeout is exceeded, when crawlAndIngest() runs, then the fetch is aborted (via the same AbortController/signal pattern already used elsewhere in this codebase) and the call fails loudly with a timeout-specific message, never hangs indefinitely"

steps:
  - id: research
    description: >
      Confirm real robots.txt fetch/parse behavior needed (no existing
      robots.txt parser in this codebase — decide a minimal, testable
      disallow-check implementation, not a full spec-compliant parser, and
      document that scope decision explicitly). Confirm this story's real
      deployment context (operator-supplied or a product's own agent-
      supplied URLs, not arbitrary untrusted end-user input) to decide
      whether an SSRF guard (reject non-public/loopback/link-local target
      hosts) is warranted for this story's acceptance criteria — document
      the decision explicitly either way (design-discussion.md §7.8 open
      question #5), never silently assumed safe. Read the existing
      AbortController/timeout pattern (bin/mnemosyne-skill-helper.mjs) to
      match it exactly.
    agent: researcher
  - id: test-spec
    description: >
      Write failing tests for crawlAndIngest() against a real, local,
      throwaway HTTP test server (never a live external site in the
      automated suite) covering: single-page default, robots.txt disallow,
      multi-page hard-cap, real-timestamp rate-limit enforcement, non-text
      Content-Type rejection before body read, oversized-body abort, 401/403
      loud failure, timeout loud failure, and (if research confirms it's
      warranted) the SSRF guard.
    agent: tester
    depends_on: [research]
  - id: implement
    description: >
      Create lib/mnemosyne/ingest/crawlAndIngest.ts implementing the
      sequence above: robots.txt check -> Content-Type/size-bounded fetch
      -> naive tag-stripping text extraction -> ro-10's ingestDocument()
      call. Add a new "crawl_website" MCP tool (same registerTool pattern),
      a CLI verb, and an HTTP route, mirroring ro-10's own three-surface
      shape exactly.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: >
      Independently re-verify every safety bound is real code, not
      documentation-only (mirrors ro-06's own independent-reviewer-re-runs-
      it precedent): robots.txt genuinely checked before fetch, rate-limit
      genuinely enforced with real elapsed-time proof, Content-Type checked
      before any body read, byte cap aborts an in-flight read rather than
      buffering first, no credential/auth-bypass code path exists anywhere
      in the module.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feat/mnemosyne-repo-onboarding.
    agent: developer
    depends_on: [review]

