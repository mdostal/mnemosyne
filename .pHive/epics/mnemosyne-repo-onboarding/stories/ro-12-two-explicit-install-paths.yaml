    change: "Quickstart gains an explicit 'choose your install path' fork naming sidecar (Mode B) vs. full/system (Mode A), each with real commands."
  - file: docs/install.sh
    change: "Additive-only extension of the existing step-4 print block naming both install paths; steps 1-3 unchanged."
  - file: bin/mnemosyne-agent.mjs
    change: "agent status gains one printed line naming both install paths as discoverable next steps."

design_decisions:
  - decision: "No new CLI verb, script, or install mechanism is introduced — every command this story documents already exists (agent init, agent init --build, mnemosyne onboard, mnemosyne onboard --create) by the time this story's own dependencies (ro-03, ro-07) land."
    rationale: "design-discussion.md §7.5 / operator's own task instruction: 'the new work is making the CHOICE between the two paths explicit and discoverable... never a third parallel install mechanism.' Confirmed via real code reading of docs/install.sh and README.md before design, not assumed."
  - decision: "'Sidecar' and 'full/system' are stated explicitly as the SAME concepts design-discussion.md already calls Mode B and Mode A, in both directions, not a silently-parallel vocabulary."
    rationale: "Grill round 2 finding 2.1.1 — mirrors round 1's own finding 1.1 resolution discipline (state the relationship between two names explicitly, never leave it to be inferred)."

cross_cutting:
  - concern: documentation
    action: "This IS the documentation story for the amendment's two-install-paths ask — README Quickstart, install.sh printed output, and agent status output all gain the same, consistently-worded fork."
  - concern: versioning
    action: "Docs/printed-output only, no consumer-visible API/CLI-flag change — folds into this epic's existing minor version bump (ro-09), no additional bump-level implication."

risks:
  - severity: low
    description: "Adding a third place (README, install.sh, agent status) that states the same fork risks the three drifting out of sync over time if one is edited later without the others."
    mitigation: "Acceptance criterion #1 requires all three to use the identical Mode A/Mode B <-> full-system/sidecar vocabulary; ro-09's own final cross-reference pass (its existing acceptance criterion for README/install.sh coherence) is extended by this story's own reference below to also re-check agent status's line."

