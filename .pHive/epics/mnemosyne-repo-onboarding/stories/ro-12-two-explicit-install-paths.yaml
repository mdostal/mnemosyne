id: ro-12-two-explicit-install-paths
epic: mnemosyne-repo-onboarding
title: Make sidecar (Mode B) vs. full/system (Mode A) install paths explicit and discoverable
status: pending
complexity: low
methodology: classic
depends_on: [ro-03-agent-init-build-flag, ro-07-onboard-new-collection-full-mode-a]

description: |
  Amendment story (design-discussion.md §7.5), closing the operator's
  second new-session ask verbatim: "I should be able to do 2 installs -- 1
  packaged as a sidecar with an application behind the scenes -- another as
  part of pantheon OR on a system to run and work with my harness /agents."

  Read `docs/install.sh` and `README.md`'s Quickstart in full before
  designing this (not assumed). Today there is genuinely ONE documented
  flow: `curl|bash install.sh` (clone + npm install + symlink
  `bin/mnemosyne`) -> prints (never runs) `mnemosyne agent init` as the
  single next step. `agent init --build` (`ro-03`, this epic, gains
  `--storage-dir` via this amendment's ro-02/ro-03 changes) and `mnemosyne
  onboard` (`ro-05`/`ro-07`, this epic) both already build on top of that
  one flow — but nothing in the docs or CLI output today frames them as
  two deliberate, named, discoverable choices. **The work here is
  discoverability, not re-architecture** — confirmed by real code reading:
  no new install mechanism, no third path, is introduced anywhere in this
  story.

  - **Sidecar / embedded install** — the README/CLI-facing name for exactly
    what design-discussion.md already calls Mode B: `mnemosyne agent init
    --build [--storage-dir <dir>]`.
  - **Full / system install** — the README/CLI-facing name for exactly what
    design-discussion.md already calls Mode A: `mnemosyne agent init`
    (unchanged, no `--build`) to register the operator's own harness, plus
    `mnemosyne onboard <path> --collection <name> [--create]` to join the
    operator's own Pantheon tree, or the same verb against whatever
    collection a standalone system's own swarm-memory/Qdrant Cloud
    configuration resolves to when there's no Pantheon tree involved at
    all — confirmed via real code reading that `mnemosyne onboard` has no
    dependency on "being inside" any particular tree beyond the collection
    name it's given; "part of Pantheon" vs. "standalone on a system" is an
    operator-side Qdrant/collection-naming choice, not a code branch this
    story adds.

acceptance_criteria:
  - "Given README.md's Quickstart section, when read top to bottom after the existing curl|bash install.sh step, then it names BOTH 'sidecar / embedded' and 'full / system' as explicit, labeled install paths, each with its real command(s), and each explicitly cross-referenced to the SAME 'Mode A'/'Mode B' vocabulary design-discussion.md already uses (never a third, unmapped term)"
  - "Given docs/install.sh's own printed output (real execution, not just source reading), when it runs to completion, then its final print block names both `agent init --build` (sidecar) and `agent init` + `mnemosyne onboard` (full/system) as two explicit next-step choices, in addition to (not replacing) its existing `mnemosyne agent init` line"
  - "Given `mnemosyne agent status` run in a repo where onboarding has not yet run, when its output is inspected, then it prints one line naming both the sidecar path (`agent init --build`) and the full/system path (`mnemosyne onboard <path> --collection <name>`) as discoverable next steps"
  - "Given docs/install.sh, when diffed before/after this story, then its existing clone/npm-install/symlink steps 1-3 are byte-unchanged — only the step-4 print block gains additive text, no new script logic, no new mutating step"
  - "Given this story's full diff, when reviewed against 'no third install mechanism,' then every new line traces to an ALREADY-shipped command (agent init, agent init --build, mnemosyne onboard, mnemosyne onboard --create) — zero new CLI verbs, zero new scripts beyond printed-text/output changes"

steps:
  - id: research
    description: >
      Re-read docs/install.sh and README.md's Quickstart in full (both
      already read during this amendment's own design pass — re-confirm
      exact current text before editing) plus bin/mnemosyne-agent.mjs's
      existing statusClaude/statusCodex output shape, to place new text
      consistently with each file's own existing style/conventions.
    agent: researcher
  - id: implement
    description: >
      Add the "choose your install path" fork to README.md's Quickstart;
      extend docs/install.sh's step-4 print block additively; add one
      printed line to `mnemosyne agent status`'s existing output naming
      both paths.
    agent: developer
    depends_on: [research]
  - id: review
    description: >
      Confirm docs/install.sh's steps 1-3 are byte-unchanged (diff-based,
      not assumed), confirm both README and install.sh use the same
      sidecar/full-system <-> Mode B/Mode A vocabulary mapping stated in
      design-discussion.md §7.5, confirm zero new CLI verbs were
      introduced anywhere in this story's diff.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feat/mnemosyne-repo-onboarding.
    agent: developer
    depends_on: [review]

