id: ro-10-document-ingestion-primitive
epic: mnemosyne-repo-onboarding
title: Bounded document-ingestion primitive (text/Markdown, CV/description) over the existing remember() floor
status: pending
complexity: medium
methodology: tdd
depends_on: [ro-02-onboard-repo-core-orchestrator]

description: |
  Amendment story (design-discussion.md §7.2), added after the operator's
  new ask: "product can get its own multi-level memory created and updated
  and can upload files, CV, description, crawl website, etc to improve
  memory." This story closes the "upload files, CV, description" half;
  `ro-11` closes "crawl website" by reusing this story's own primitive.

  Real reuse root, confirmed by reading the code, not assumed:
  `MnemosyneClient.remember()` (shipped, v0.14.0) already cascades a single
  write through every WRITABLE configured layer in stack order
  (`client.ts:447-531`) — the exact "multi-level memory... created and
  updated" mechanism the operator is asking for. This story does not
  reimplement that cascade; it feeds it.

  `lib/mnemosyne/ingest/ingestDocument.ts` (new): `ingestDocument(client,
  { content, filename?, tag?, scope? })` — chunks bounded input content and
  calls `client.remember()` once per chunk, sequentially (never parallel —
  no precedent for concurrent remember() calls anywhere in this codebase,
  and `VectorLayerAdapter.remember()`'s own doc comment already notes a
  single index call can take several seconds against live Qdrant Cloud).
  Each chunk's `tag`/`Content.metadata` (both already-existing fields,
  `interfaces.ts:368-372`, `LayerAdapter.ts:21-36` — no interface change
  needed) carry the source filename and chunk index, so a later recall()
  hit's provenance traces back to "chunk N of <filename>," never an
  anonymous blob.

  Bounded, explicit scope for this story's cut (never hand-waved): plain
  text (`.txt`) and Markdown (`.md`) content only — confirmed via
  `package.json` that no PDF-parsing dependency exists anywhere in this
  codebase today; adding one is named an explicit, separate follow-on (see
  design-discussion.md §7.8 open question #4), not silently promised in
  this story. A free-text description or CV/resume supplied as a plain
  string (no file at all) is the trivial subcase of the same path.

  Mirrors this codebase's one existing precedent for "read external content
  safely, without overdoing it" —
  `skills/mnemosyne-persona-interview/crawl-context.mjs`'s named-cap
  discipline (`MAX_LINES_PER_SOURCE`/`MAX_CHARS_PER_SOURCE`/
  `MAX_SOURCE_SUMMARY_CHARS`, every cap enforced in code, not just
  documented) — as a PATTERN only; that module is persona-interview- and
  local-file-specific and is not imported here.

acceptance_criteria:
  - "Given plain-text content under MAX_INGEST_BYTES, when ingestDocument(client, { content, filename: 'notes.txt' }) is called, then it produces exactly one remember() call whose tag/metadata identify 'notes.txt' chunk 0, and returns { ok: true, chunks: [...] } with that one chunk's real RememberResult"
  - "Given content larger than one chunk's bound but under MAX_INGEST_BYTES, when ingestDocument() is called, then it produces N sequential remember() calls (never concurrent — verified by call-order instrumentation in the test), each tagged with the same filename and its own chunk index 0..N-1"
  - "Given content that exceeds MAX_INGEST_BYTES, when ingestDocument() is called, then it fails loudly (ok: false, a clear oversized-content error) BEFORE calling remember() at all — never a silent partial ingest of only the first MAX_INGEST_BYTES"
  - "Given a .pdf filename hint (or any extension outside the explicit .txt/.md allowlist), when ingestDocument() is called, then it fails loudly naming the unsupported format, directing the caller to convert to text/Markdown — never a best-effort attempt to read binary content as text"
  - "Given one chunk's remember() call fails mid-sequence (e.g. layer degraded to failure), when ingestDocument() completes, then it reports EXACTLY which chunks succeeded and which failed (partial-result array, mirroring ro-06's own partial-state loud-failure convention) — never a generic all-or-nothing error that hides which chunks actually landed"
  - "Given ingestDocument() completes successfully for a multi-chunk document, when recall() is subsequently called against the same scope, then hits from at least one chunk are returned with full 7-field provenance (layer, source, chunk_span, index_timestamp, content_hash, embedder, retrieval_time) — proving real content landed, not merely that remember() returned ok:true"

steps:
  - id: research
    description: >
      Read client.ts's remember() cascade (lines ~447-531), interfaces.ts's
      Content/RememberOptions shapes, crawl-context.mjs's cap-enforcement
      pattern, and bin/mnemosyne-mcp.mjs's registerTool wiring (lines
      106-136) to confirm every call shape before composing them. Confirm
      no PDF/binary-parsing dependency exists in package.json.
    agent: researcher
  - id: test-spec
    description: >
      Write failing tests for ingestDocument() against a stubbed/fake
      MnemosyneClient (mirroring this codebase's existing fake-swarm-memory
      test convention, never a live Qdrant call), covering: single-chunk,
      multi-chunk sequential ordering, oversized-content loud rejection,
      unsupported-format loud rejection, partial mid-sequence failure
      reporting, and a real recall() provenance round-trip.
    agent: tester
    depends_on: [research]
  - id: implement
    description: >
      Create lib/mnemosyne/ingest/ingestDocument.ts per the acceptance
      criteria. Add the "ingest_document" MCP tool to bin/mnemosyne-mcp.mjs
      (same registerTool/wrapAction pattern as "recall"/"remember"), a new
      CLI verb bin/mnemosyne-ingest.mjs (mirrors bin/mnemosyne-reindex.mjs's
      thin-HTTP-client shape), and a new POST /ingest route in server.ts
      (added to its existing route-list header comment alongside POST
      /remember).
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: >
      Confirm chunk calls are genuinely sequential (not Promise.all/
      parallel), confirm the oversized/unsupported-format checks run BEFORE
      any remember() call (never a partial attempt), confirm partial-failure
      reporting names exactly which chunks succeeded.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feat/mnemosyne-repo-onboarding.
    agent: developer
    depends_on: [review]

