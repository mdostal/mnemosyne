design_decisions:
  - decision: "This story's cut supports .txt/.md content only; PDF/binary formats are an explicit, separate, not-yet-scoped follow-on."
    rationale: "package.json confirms no PDF-parsing dependency exists in this codebase today. Bundling a new binary-parsing dependency into the same story as the safe, zero-new-dependency text/markdown path would conflate two different risk profiles — named explicitly in design-discussion.md §7.8 rather than silently promised."
  - decision: "Chunks are ingested sequentially, never in parallel, and no background queue/worker system is introduced."
    rationale: "No precedent for concurrent remember() calls exists anywhere in this codebase; VectorLayerAdapter's own doc comment already flags real multi-second per-call latency against live Qdrant Cloud. A queue/worker system is materially bigger scope than 'a document-ingestion primitive' and is an explicit non-goal."
  - decision: "Oversized-content and unsupported-format checks run BEFORE any remember() call, never as a partial-then-fail sequence."
    rationale: "Loud-failure cross-cutting concern — an operator uploading a CV/description should get one clear reason for rejection up front, never a half-ingested document with no clear signal of what's missing."

cross_cutting:
  - concern: loud-failure
    action: "Oversized content and unsupported formats reject loudly before any write; mid-sequence chunk failures report exactly which chunks succeeded/failed, per acceptance criteria #3-5."
  - concern: provenance-completeness
    action: "Ingested chunks must produce recall() hits with full 7-field provenance, verified directly in acceptance criterion #6, not assumed from remember()'s own separately-tested contract."
  - concern: existing-infrastructure
    action: "All writes go through the existing, unmodified remember() cascade (additive-only, per VectorLayerAdapter's --no-prune design) — no new storage mechanism, no Qdrant/swarm-memory state touched outside that already-proven path."
  - concern: documentation
    action: "New MCP tool, CLI verb, and HTTP route each need a discoverable doc entry — README gains an 'ingest a document into memory' mention; bin/mnemosyne's usage comment header gains the ingest line."

risks:
  - severity: medium
    description: "A chosen MAX_INGEST_BYTES value that's too small rejects legitimate CVs/descriptions; too large risks a very slow multi-chunk sequential ingest tying up a single CLI/MCP/HTTP call for a long time."
    mitigation: "Value is a named, single constant (not scattered magic numbers), documented and easily revisited post-ship without a breaking change; the sequential-chunk design means a caller always gets partial results even if a large document times out partway, never total silent loss."
  - severity: low
    description: "Uploaded CV/description content could contain sensitive personal information (the operator's own literal example) landing in the SAME collection/scope other content uses."
    mitigation: "Out of scope for this story to solve (no new PII-redaction mechanism invented) — explicitly named so it is not silently assumed handled; ingested content is scoped exactly the same way any other remember() call already is (repo/product-local scope, never a shared/global default)."

