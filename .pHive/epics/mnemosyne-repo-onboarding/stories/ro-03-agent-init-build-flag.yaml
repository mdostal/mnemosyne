id: ro-03-agent-init-build-flag
epic: mnemosyne-repo-onboarding
title: "Mode B entry point: mnemosyne agent init --build"
status: pending
complexity: medium
methodology: tdd
depends_on: [ro-02-onboard-repo-core-orchestrator]

description: |
  Mode B's real entry point. `bin/mnemosyne-agent.mjs`'s existing `agent
  init` (epic mnemosyne-agent-harness-install, shipped: harness detection +
  MCP registration + skill copy) never runs a first-time index of the host
  product's own codebase and never runs Layer-1 sync/persona seed — this is
  the concrete, named gap the operator's "stand up, build" quote describes.

  Adds a new, OPT-IN `--build` flag (default OFF) that wires
  `onboardRepo({ mode: 'standalone', repoRoot: process.cwd(), scopeId:
  <derived or --scope-id> })` after MCP registration + skill copy complete.

  Grill finding 3.2 (docs/grill-record.md): originally scoped as opt-OUT
  (build on by default), reversed after the grill pass — `docs/install.sh`'s
  own established convention is that heavy/mutating actions stay separate,
  explicit, operator-confirmed steps (the exact reason install.sh itself
  prints but never runs `agent init`). `--build` extends that same
  convention one level up rather than introducing a second, inconsistent
  default.

  Also ships `docs/embedded-layers.json`, a recommended `mnemosyne.layers.json`
  template for a bare embedded install that explicitly omits `vector`
  (rather than relying on the existing, still-correct, silent-degrade-past-
  a-failing-layer behavior) — an explicit, documented choice for an
  operator deciding how to configure a fresh embedded install with no
  swarm-memory credential.

  **Amendment (design-discussion.md §7.1, §7.4):** two small, additive
  changes closing the operator's newer "specifying the location of
  storage" and "use the context fully to verify and inject as it works
  along" asks:
  1. A new, optional `--storage-dir <dir>` flag. When passed, `onboardRepo()`'s
     `repoRoot` becomes this directory (created via mkdir -p first if it
     doesn't exist) instead of `process.cwd()` — so a product packaging
     Mnemosyne as its own sidecar memory agent can pin ALL of its memory
     state under one directory it controls, from install tooling that
     isn't coupled to a specific invocation cwd. Omitted: byte-identical to
     this story's already-planned `repoRoot: process.cwd()` behavior.
  2. `--build`'s completion output gains one more printed line naming `bin/
     mnemosyne-install-hooks` as the next step for the SAME already-shipped
     pre-recall/post-remember hook loop (`hooks/README.md`) the operator's
     own harness already uses — never a second, bespoke verify-and-inject
     mechanism. This is a docs/printed-output addition only: the hook
     mechanism itself, and the mandate text naming it (already spliced into
     the onboarded repo's harness files by ro-02's existing
     syncAllHarnesses() call, per la-07/tiers.ts), are both already fully
     shipped and require zero new code (design-discussion.md §7.4).

acceptance_criteria:
  - "Given `mnemosyne agent init` run with no --build flag, when it completes, then it behaves byte-identically to today (MCP registration + skill copy only) and onboardRepo() is never called"
  - "Given `mnemosyne agent init --build` run in a fresh repo with no prior Mnemosyne state, when it completes, then onboardRepo({ mode: 'standalone', ... }) has run and its printed summary includes the base-level report (which of the 5 levels are now configured)"
  - "Given `mnemosyne agent init` run WITHOUT --build, when its output is inspected, then it prints a 'next step (not run automatically): mnemosyne agent init --build' line, mirroring install.sh's own existing 'prints, never runs agent init' convention"
  - "Given docs/embedded-layers.json, when read, then it is a valid mnemosyne.layers.json (per layers/config.ts's isLayerStackConfig shape) containing only graphify and file (vector omitted)"
  - "Given `mnemosyne agent init --build` run a second time (already built), when it completes, then it makes zero redundant writes beyond what onboardRepo() itself already guarantees idempotent (persona/harness-sync idempotency, inherited from ro-02, re-verified here at the CLI-flag level)"
  - "Given `mnemosyne agent init --build --storage-dir <dir>` where <dir> does not yet exist, when it completes, then <dir> was created (mkdir -p) and onboardRepo() ran with repoRoot: <dir> — every artifact (CLAUDE.md/AGENTS.md/GEMINI.md, persona, file-index.json) lands under <dir>, none under process.cwd()"
  - "Given `mnemosyne agent init --build` run WITHOUT --storage-dir, when it completes, then repoRoot resolves to process.cwd(), byte-identical to this story's pre-amendment behavior — --storage-dir is purely additive"
  - "Given `mnemosyne agent init --build` completes (with or without --storage-dir), when its printed output is inspected, then it includes a 'next step (not run automatically): bin/mnemosyne-install-hooks' line naming the same pre-recall/post-remember loop hooks/README.md documents — never a second, differently-named mechanism"

steps:
  - id: research
    description: >
      Read bin/mnemosyne-agent.mjs's existing initClaude/initCodex/
      harnessesToRun structure and runInit() dispatch, plus docs/install.sh's
      printed-next-step convention, to place the new --build step
      consistently with both.
    agent: researcher
  - id: test-spec
    description: >
      Extend test/agent-cli.mjs's real-subprocess pattern (isolated
      mkdtemp $HOME/cwd per test) to cover: --build absent (no
      onboardRepo call, byte-identical to today), --build present (real
      onboardRepo() effects verified on disk), printed next-step text
      when --build is absent, second-run idempotency.
    agent: tester
    depends_on: [research]
  - id: implement
    description: >
      Add --build flag parsing to bin/mnemosyne-agent.mjs's parseArgs,
      call onboardRepo() (ro-02) from runInit() when set, print the
      base-level report and the not-run-automatically guidance line when
      unset. Add docs/embedded-layers.json.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Confirm --build absent is truly byte-identical to pre-story behavior (no accidental default-on regression), confirm the printed guidance text matches install.sh's own established phrasing style.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feat/mnemosyne-repo-onboarding.
    agent: developer
    depends_on: [review]

