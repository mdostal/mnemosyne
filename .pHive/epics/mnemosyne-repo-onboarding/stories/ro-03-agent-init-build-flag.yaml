files_to_modify:
  - file: bin/mnemosyne-agent.mjs
    change: "Add --build flag; wire onboardRepo() call in runInit(); print base-level report + not-run-automatically guidance. Amendment: add --storage-dir <dir> flag (overrides repoRoot, default process.cwd() unchanged); print bin/mnemosyne-install-hooks next-step line on --build completion."
  - file: docs/embedded-layers.json
    change: "New file: recommended layer-stack config for a bare embedded install (graphify + file, no vector)."
  - file: docs/install.sh
    change: "Update printed next-steps text to also mention --build."
  - file: README.md
    change: "Quickstart section gains a one-line mention of --build for embedded/product installs."

design_decisions:
  - decision: "--build defaults OFF, not ON."
    rationale: "Grill finding 3.2 — matches install.sh's own established convention for heavy/mutating steps staying separate and explicit, rather than introducing a second, inconsistent default one layer up."
  - decision: "docs/embedded-layers.json omits vector rather than including it unconfigured."
    rationale: "The unconfigured-vector-layer-degrades-safely behavior already works (client.ts's cascade), but leaving it in an embedded install's config silently attempts and fails a layer on every call — an explicit, documented recommended config avoids that noise without removing the option to add vector back later."
  - decision: "--storage-dir is a new, optional flag; omitted behavior is byte-identical to this story's pre-amendment design (repoRoot: process.cwd())."
    rationale: "design-discussion.md §7.1 — real research confirmed FileLayerAdapter/persona-store/file-index manifest already accept an arbitrary rootDirectory; the only gap was agent init --build never exposing that as a CLI-level override. Purely additive, no regression risk to this story's already-planned acceptance criteria."
  - decision: "--build's printed output names bin/mnemosyne-install-hooks as a next step, but does not run it."
    rationale: "design-discussion.md §7.4 — mirrors this story's own established --build opt-in convention (grill 3.2) one more level: hooks/settings.json is a machine-global, harness-scoped file, and auto-mutating it as a side effect of onboarding ONE repo would be exactly the kind of surprise action this story's own --build design was written to avoid. The mechanism itself needs zero new code — only discoverability."

cross_cutting:
  - concern: documentation
    action: "README Quickstart + docs/install.sh printed text updated to mention --build; docs/embedded-layers.json is itself a discoverable, self-documenting artifact."
  - concern: versioning
    action: "Additive CLI flag, no breaking change — folds into this epic's overall minor version bump (ro-09)."

risks:
  - severity: medium
    description: "--build could turn a fast, cheap `agent init` into a slow first-time-index action on a large embedded host repo."
    mitigation: "Opt-in default OFF (see design decision above); the file/graph-index steps themselves are the same already-proven-fast primitives (ml-06/ml-08's shipped benchmarks), not new indexing code with unknown performance."

