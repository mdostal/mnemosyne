design_decisions:
  - decision: "Extraction is copy-then-parameterize, never a rewrite."
    rationale: "Minimizes regression risk for an already-shipped, tested route (ml-04); the new function's own tests plus the existing route's unchanged tests together prove behavior preservation."
  - decision: "level0Path stays a parameter with DEFAULT_LEVEL0_PATH as its default, not hardcoded."
    rationale: "Level 0 is operator-global by design (level0.ts) — every caller (route and onboarding orchestrator alike) should share the same default while still being test-overridable, mirroring level0.ts's own SyncOptions.level0Path convention."

cross_cutting:
  - concern: documentation
    action: "No user-facing doc change needed — GET /memory-levels' response contract is unchanged; this is an internal refactor only."

risks:
  - severity: medium
    description: "A subtle divergence between the extracted function and the original inline computation (e.g. a missed level0Path default) could silently change GET /memory-levels' real output."
    mitigation: "test/http-api.mjs's existing GET /memory-levels assertions run unmodified against the refactored route as the primary regression gate."

