id: ro-01-memory-levels-scoped-extraction
epic: mnemosyne-repo-onboarding
title: Extract GET /memory-levels computation into a repo-scoped, reusable function
status: pending
complexity: low
methodology: tdd
depends_on: []

description: |
  `lib/mnemosyne/server.ts`'s `GET /memory-levels` route (story ml-04,
  shipped) computes, for each of the 5 canonical memory levels
  (memory-levels/levels.ts's MEMORY_LEVELS), whether it is "configured
  right now" against ONE ambient, module-level MnemosyneClient singleton
  scoped to the running service's own ROOT_DIRECTORY. This story extracts
  that computation into a standalone function parameterized on
  `(client, repoRoot, level0Path?)` so it can be called against an
  ARBITRARY repo — the "get the base level" primitive every later story in
  this epic's onboarding orchestrator (ro-02) depends on.

  Grill finding 3.1 (docs/grill-record.md): this is real, new extraction
  work, not a zero-effort reuse — the route today reads its ambient
  singleton directly; there is no existing parameterized entry point.

  Zero behavior change for the existing route: GET /memory-levels becomes
  a thin caller of the extracted function with its own existing client +
  ROOT_DIRECTORY, byte-identical output to today.

acceptance_criteria:
  - "Given the existing test/http-api.mjs GET /memory-levels assertions, when this story's extraction lands, then every assertion passes unchanged (byte-identical route output, zero regression)"
  - "Given a MnemosyneClient constructed with an arbitrary rootDirectory (not the running service's own ROOT_DIRECTORY), when computeMemoryLevels(client, repoRoot) is called directly, then it returns the same 5-level configured/not-configured shape GET /memory-levels would return for a repo actually rooted there"
  - "Given level 0 (existsSync check) and level 1 (existsSync check), when repoRoot differs from the calling process's own ROOT_DIRECTORY, then the existsSync checks resolve against repoRoot's own paths (DEFAULT_LEVEL0_PATH is operator-global and unaffected; the mnemosyne.md check must resolve to path.join(repoRoot, 'mnemosyne.md'), not the server's own root)"
  - "Given levels 2-4, when computeMemoryLevels reads client.getConfiguredLayers(), then it reads ONLY that already-resolved cascade — never a second, independent layer-resolution call"

steps:
  - id: research
    description: >
      Read lib/mnemosyne/server.ts's GET /memory-levels handler in full
      (lines ~415-460) plus lib/mnemosyne/memory-levels/levels.ts's
      MEMORY_LEVELS taxonomy and test/http-api.mjs's existing assertions
      for this route, to confirm the exact current computation before
      extracting it.
    agent: researcher
  - id: test-spec
    description: >
      Write a failing test for the new standalone computeMemoryLevels(client,
      repoRoot, level0Path?) function BEFORE extraction: construct two
      MnemosyneClient instances rooted at two different temp directories
      with different mnemosyne.md presence, assert the function reports
      level 1 differently for each. Also add/adapt a regression assertion
      confirming GET /memory-levels' real HTTP response is unchanged.
    agent: tester
    depends_on: [research]
  - id: implement
    description: >
      Create lib/mnemosyne/memory-levels/computeMemoryLevels.ts by copying
      the route handler's existing computation verbatim, parameterizing
      `client`/`repoRoot`/`level0Path` (default DEFAULT_LEVEL0_PATH).
      Update server.ts's GET /memory-levels handler to call it with its
      existing client + ROOT_DIRECTORY. Do not modify MEMORY_LEVELS or
      any adapter/layer code.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Confirm zero behavior change for the existing route and that the extracted function makes no new I/O calls beyond what the original inline computation made.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feat/mnemosyne-repo-onboarding.
    agent: developer
    depends_on: [review]

