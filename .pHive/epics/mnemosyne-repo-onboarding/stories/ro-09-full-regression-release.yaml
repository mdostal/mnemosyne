id: ro-09-full-regression-release
epic: mnemosyne-repo-onboarding
title: Full-suite regression, version bump, CHANGELOG, README/install docs
status: pending
complexity: low
methodology: classic
depends_on: [ro-03-agent-init-build-flag, ro-07-onboard-new-collection-full-mode-a, ro-08-role-metadata-reachability-verification, ro-10-document-ingestion-primitive, ro-11-bounded-website-crawl, ro-12-two-explicit-install-paths, ro-13-pdf-document-ingestion]

description: |
  Closes the epic: full-suite regression (`npm test`, `npx tsc --noEmit`,
  the Python test suite under `mnemosyne/tests/`), minor version bump
  (additive CLI verbs/flags, no breaking change to any existing contract —
  per this epic's own `version_bump: minor`), a dated `CHANGELOG.md`
  section, and final README/`docs/install.sh` pass confirming both modes'
  documentation is discoverable and accurate end to end (not just each
  individual story's own local doc update).

  **Amendment (design-discussion.md §7):** `depends_on` extended to also
  require `ro-10`/`ro-11`/`ro-12` (document ingestion, website crawl, and
  the two-explicit-install-paths documentation story) — this story's own
  regression pass and final README/install.sh cross-reference must cover
  the amendment's additions too, not just the original six stories'
  surface. The CHANGELOG section (acceptance criterion #4) additionally
  lists: `--storage-dir` (ro-03 amendment), the `ingest`/`crawl` CLI
  verbs + `ingest_document`/`crawl_website` MCP tools + `POST
  /ingest`/`POST /crawl` routes (ro-10/ro-11), and the sidecar/full-system
  install-path documentation fork (ro-12).

  **Amendment, round 3 (design-discussion.md §7.9):** `depends_on` further
  extended to require `ro-13` (PDF ingestion). The CHANGELOG section
  additionally names: `.pdf` as a supported `ingestDocument()` format, the
  new `unpdf` dependency, and the resulting `engines.node` floor raise
  (`>=20` -> `>=22`) — named explicitly as a package-wide effect, not
  buried as a PDF-only footnote. This story's regression pass also
  confirms `npx tsc --noEmit` and `npm test` are clean under the new
  `engines.node` floor (i.e., the CI/dev Node version actually in use
  satisfies it), not merely that the PDF-path tests themselves pass.

  Also runs one real, end-to-end smoke test per mode against a disposable
  temp repo (mirroring `test/agent-cli.mjs`'s isolated-temp-directory
  convention throughout): Mode B (`agent init --build` in a throwaway repo,
  confirm base-level report), Mode A (`onboard --collection --create` in a
  throwaway repo against a disposable/test-scoped Qdrant target if
  available, or clearly documented as skipped-in-CI with a manual
  verification note otherwise — never silently skipped without a visible
  reason).

acceptance_criteria:
  - "Given the full epic's changes, when `npm test` runs, then it passes with zero NEW failures beyond this repo's own already-documented, pre-existing baseline (the same standard aha-01's own completion note established — confirmed by diffing against the pre-epic baseline, not assumed)"
  - "Given the full epic's changes, when `npx tsc --noEmit` runs, then it is clean"
  - "Given mnemosyne/tests/ (Python), when pytest (or the project's established Python test runner) runs, then test_onboarding.py (ro-06) and any other new/modified Python tests pass"
  - "Given package.json's version field, when this story completes, then it reflects a minor bump from its pre-epic value, and CHANGELOG.md gains a new dated section listing every consumer-visible addition from this epic (mnemosyne onboard verb, --create flag, agent init --build flag, GET /memory-levels' unchanged-but-now-shared computation)"
  - "Given README.md's Quickstart and docs/install.sh's printed guidance, when read together, then both onboarding modes (Mode A: mnemosyne onboard; Mode B: agent init --build) are discoverable from the top-level README without needing to already know a story ID or internal file path"
  - "Given the Mode B smoke test, when run against a throwaway temp repo, then it completes and its base-level report shows levels 0/1/4 configured=true (2 conditionally, depending on graphify availability in the test environment)"

steps:
  - id: research
    description: >
      Confirm the repo's current pre-epic baseline test/tsc state (mirrors
      aha-01's own "confirmed this is pre-existing, unrelated to this
      diff" verification discipline) so this story's own regression pass
      has an honest comparison point, not a guess.
    agent: researcher
  - id: implement
    description: >
      Bump package.json's version (minor), write the CHANGELOG.md dated
      section, finalize README.md/docs/install.sh cross-references for
      both modes, write the two end-to-end smoke test scripts.
    agent: developer
    depends_on: [research]
  - id: test
    description: >
      Run the full regression suite (npm test, npx tsc --noEmit, Python
      tests) and both mode smoke tests; diff results against the
      confirmed pre-epic baseline from the research step.
    agent: tester
    depends_on: [implement]
  - id: review
    description: >
      Independently re-run the full regression suite and both smoke
      tests (mirrors aha-01's own "orchestrating session ran it myself
      before merge" precedent) — do not trust the tester's self-report
      alone for a release-gating story.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to feat/mnemosyne-repo-onboarding; this is the last commit on the epic branch (version-bump commit last, per this repo's own versioning cross-cutting concern convention).
    agent: developer
    depends_on: [review]

