  - file: test/onboard-smoke-mode-b.mjs
    change: "New file: end-to-end Mode B smoke test against a disposable temp repo."

design_decisions:
  - decision: "Version-bump commit is the last commit on the epic branch."
    rationale: "Matches this repo's own established versioning cross-cutting concern convention (cross-cutting-concerns.yaml: 'Bump commit is the LAST commit on the epic branch')."
  - decision: "Mode A's smoke test is allowed to be documented-skip-in-CI if no disposable Qdrant target is available, but never silently skipped."
    rationale: "Live Qdrant Cloud access is a real external dependency this repo's own CI does not currently provision (config.ts's own doc comment: 'this repo's own CI does not install graphify' — the same class of CI-environment gap); a visible, explained skip is honest, a silent one is not."

cross_cutting:
  - concern: versioning
    action: "This IS the versioning story for the epic — package.json bump + CHANGELOG.md section, last commit on the branch."
  - concern: documentation
    action: "This IS the final documentation cross-check story for the epic — confirms every earlier story's own local doc update actually reads coherently end to end from the top-level README."

risks:
  - severity: low
    description: "The Mode A smoke test's dependency on real/disposable Qdrant Cloud access could make this story's own completion nondeterministic across different environments."
    mitigation: "Explicit, visible skip-with-reason path documented in the design decision above, rather than a flaky or silently-passing test."

