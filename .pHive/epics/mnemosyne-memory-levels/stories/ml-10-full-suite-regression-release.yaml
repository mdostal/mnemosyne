id: ml-10-full-suite-regression-release
epic: mnemosyne-memory-levels
title: Full-suite regression pass + version bump + release note
status: pending
complexity: low
methodology: tdd
depends_on: [ml-09-doc-reconciliation]

description: |
  The epic's closing, integrative story — gated on every other story
  (ml-02 through ml-09) being complete. Proves the whole epic, taken
  together, introduces zero regression anywhere in the existing suite,
  exactly per this repo's own established verification bar (la-01's
  completion note is the direct template: full `npm test` run, the two
  known-unrelated pre-existing failures independently reproduced on a clean
  stash to prove they predate and are unaffected by this epic's changes,
  not just asserted as pre-existing from memory).

  Version bump per epic.yaml's `minor` designation, matching both prior
  epics' (mnemosyne-persona-foundation, mnemosyne-persona-wizard) convention
  for a real, backward-compatible feature addition (new route, new file,
  new module — nothing this epic does changes any existing route's
  contract or removes any existing capability).

acceptance_criteria:
  - "Given the full npm test script (vitest suite + the .mjs subprocess suite), when run on this epic's final state, then it completes with only the two pre-existing, already-documented-as-unrelated failures (CodeGraphLayerAdapter.test.ts's better-sqlite3 native-binding crash; test/http-api.mjs's socket-close flake) — no NEW failures anywhere"
  - "Given those two pre-existing failures, when this epic's changes are stashed out (git stash) and the suite is re-run against the clean tree, then the same two failures reproduce identically — proving they predate this epic and are not caused by it, not merely asserted from a prior story's note"
  - "Given tsc --noEmit, when run, then it completes clean with zero new type errors"
  - "Given package.json's version field, when this story completes, then it reflects a minor version bump from the version at epic start"
  - "Given this story's completion note, when read, then it includes the actual full test-run output summary (pass/fail counts) and the actual stashed-tree comparison result, matching la-01's own completion-note verification detail level, not a bare 'tests pass' assertion"

steps:
  - id: research
    description: Confirm the current version in package.json and the exact current pre-existing-failure set by running the full suite once before this epic's final story lands, to have a real baseline to compare against.
    agent: researcher
  - id: implement
    description: Run the full npm test + tsc --noEmit against this epic's final state; if any NEW failure appears, fix it (this is a regression-fixing step, not a new-feature step) before proceeding.
    agent: developer
    depends_on: [research]
  - id: review
    description: git stash this epic's full changeset, re-run the suite, confirm the two known failures reproduce identically and nothing else fails on the clean tree; un-stash.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Bump version (minor), write the release note summarizing the epic's three deliverables, commit and push to feat/mnemosyne-memory-levels.
    agent: developer
    depends_on: [review]

context:
