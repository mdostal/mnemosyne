    description: "A regression could be masked if the stashed-tree comparison isn't actually performed (just assumed the two known failures are 'the usual ones')."
    mitigation: "Acceptance criteria explicitly require the stash-and-reproduce step to be performed for real, with its actual output recorded in the completion note, matching la-01's own precedent."

