id: ml-03-sync-three-source-composition
epic: mnemosyne-memory-levels
title: "sync.ts 3-part/2-part composition + idempotency regression + install-mechanism confirmation"
status: complete
complexity: medium
methodology: tdd

note_on_completion: >
  Merged 2026-08-16 (commit 98dbf14). Independently verified: manually
  traced buildManagedBody's new flatMap-based join for both the 2-part
  (Level 1 absent) and 3-part (present) cases and confirmed the 2-part case
  produces byte-identical output to the original array-join code, and the
  3-part case correctly orders Level 0 -> Level 1 -> tier content with the
  same divider convention. Confirmed via git diff --stat that block.ts,
  lock.ts, harness.ts, and bin/mnemosyne-persona.mjs all have zero diff --
  the install mechanism genuinely needed no new CLI surface. Confirmed
  buildManagedBody's external signature is unchanged (Level 1 resolved
  internally from the existing repoRoot parameter). Reran the 7 new tests
  plus the full suite (tsc --noEmit clean, vitest lib/mnemosyne/layer1
  210/210) myself. All acceptance criteria met.
depends_on: [ml-02-mnemosyne-md-source-reader]

description: |
  Wires ml-02's mnemosyne.md reader into the real, already-shipped
  splice/lock pipeline (block.ts/lock.ts/harness.ts, unchanged), closing out
  Level 1's install mechanism per the operator's ask: "include it INTO the
  others with an install script or something to lock that in easy."

  Resolved (design-discussion.md §4c/§7.1): the install mechanism is a
  full-content splice via the EXISTING sync pipeline, reusing
  spliceManagedBlock/withLock unmodified — not a new per-harness native
  `@include` directive (unverified for 2 of 3 target harnesses) and not a
  new bin script (bin/mnemosyne-persona.mjs's existing `sync` verb already
  is, today, the Layer-1-install verb — research-brief.md §8).

  sync.ts's buildManagedBody grows from a 2-part join (Level 0 + tier) to a
  3-part join (Level 0 + Level 1 + tier) WHEN mnemosyne.md is present, and
  stays byte-for-byte the existing 2-part join when it is absent — this is
  the one genuinely new correctness surface this story owns: a three-source
  composition has never been exercised in this codebase before (Level 0 +
  tier is the only composition tested to date).

acceptance_criteria:
  - "Given mnemosyne.md is present, when syncHarnessFile/syncAllHarnesses runs, then the managed block in every target harness file (CLAUDE.md/AGENTS.md/GEMINI.md) contains Level 0 content first (verbatim), Level 1 (mnemosyne.md) content second (verbatim), and tier/persona markdown third, in that exact order, never reordered"
  - "Given mnemosyne.md is absent, when sync runs, then the managed block is byte-for-byte identical to today's pre-epic 2-part output (Level 0 + tier only) — zero regression for every repo that has not yet adopted mnemosyne.md"
  - "Given a repo that previously had no mnemosyne.md and now has one added, when sync is re-run (the existing `bin/mnemosyne-persona.mjs sync` verb, no new CLI flag or command), then the managed block correctly grows to the 3-part composition on that very next run, with no manual re-trigger step beyond the existing verb — this IS the install mechanism, and this criterion is its acceptance proof"
  - "Given sync is run twice in succession with mnemosyne.md present both times, then the second run's output is byte-identical to the first (idempotent, no duplication of any of the 3 parts)"
  - "Given the block-splice mechanism (spliceManagedBlock/withLock), when this story's changes are reviewed, then zero modifications were made to block.ts or lock.ts themselves — only buildManagedBody's composition logic changed, confirming the existing mechanism truly needed no redesign"

steps:
  - id: research
    description: Re-read sync.ts's buildManagedBody and syncHarnessFile in full immediately before modifying them, to confirm the exact insertion point for Level 1 content without disturbing the existing Level 0-first/tier-content-last ordering guarantees.
    agent: researcher
  - id: test-spec
    description: Write failing tests for the 3-part composition (present case), the byte-identical 2-part fallback (absent case), the first-time-adoption re-sync scenario, and idempotency across repeated 3-part syncs — extending sync.test.ts/sync.integration.test.ts's existing conventions, not a new test file structure.
    agent: tester
    depends_on: [research]
  - id: implement
    description: Extend buildManagedBody to conditionally compose 2 or 3 parts based on ml-02's reader's return value; zero changes to block.ts/lock.ts/harness.ts.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Confirm zero regression for the absent-mnemosyne.md case via a real diff against pre-epic output, confirm ordering is never violated under any test permutation, confirm the existing `sync` CLI verb needs no changes to serve as the install trigger.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feat/mnemosyne-memory-levels.
    agent: developer
    depends_on: [review]

