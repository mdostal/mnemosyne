    rationale: "design-discussion.md §4d: sync already is, today, the Layer-1-install verb (research-brief.md §8) — extending what content it composes is a change to buildManagedBody, not a new install surface, matching this repo's own 'no bespoke god wiring' ways-of-working principle."
