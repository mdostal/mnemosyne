files_to_modify:
  - file: lib/mnemosyne/server.ts
    change: "New: GET /memory-levels route. Zero changes to the existing GET /layers route handler."
  - file: test/http-api.mjs
    change: "New tests: GET /memory-levels shape/correctness; GET /layers byte-for-byte-unchanged regression."

design_decisions:
  - decision: "New parallel route (GET /memory-levels), never extending or repurposing GET /layers"
    rationale: "design-discussion.md §5/§7.3: the retrieval cascade and the 5-level taxonomy are different data models answering different questions (runtime resolution vs. largely-static taxonomy); levels 0/1 are structurally unrepresentable inside GET /layers's existing shape; this repo's own prior epics already established 'never merge two data models into one list' as a standing convention this decision applies rather than reinvents."
  - decision: "activeInCascade is a READ of getConfiguredLayers()'s already-resolved output, never a second resolution"
    rationale: "Prevents GET /memory-levels and GET /layers from ever being able to disagree about what's currently active — a single source of resolution truth, two honestly-different views over it."

risks:
  - severity: high
    description: "Overloading or subtly changing GET /layers's behavior while adding the new route would regress pw-04's already-shipped, already-tested, operator-signed-off UI feature."
    mitigation: "A dedicated byte-for-byte regression test is a first-class acceptance criterion for this story, not an afterthought — see acceptance_criteria's explicit diff-based requirement."
  - severity: low
    description: "The level-to-adapter-name mapping (ml-01's data) could go stale if a future story adds a new adapter without updating it."
    mitigation: "ml-01's own acceptance criteria require the mapping to live as data in the taxonomy module itself, not duplicated inline in this route — one place to update."

