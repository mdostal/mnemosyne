design_decisions:
  - decision: "New top-level module (lib/mnemosyne/memory-levels/), not inside lib/mnemosyne/layer1/"
    rationale: "design-discussion.md §7's resolved judgment call: placing it inside layer1/ would compound the already-identified layer1/layers naming collision (research-brief.md §0) that is itself part of the miscommunication this epic corrects. Flagged as not fully closed at the product-naming level in §8 OQ2, but a concrete path is needed to build against."
