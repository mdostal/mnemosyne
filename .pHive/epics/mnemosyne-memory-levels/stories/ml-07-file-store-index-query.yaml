id: ml-07-file-store-index-query
epic: mnemosyne-memory-levels
title: "Query-time area-scoped narrowing + full-walk fallback + staleness-handling proof"
status: pending
complexity: high
methodology: tdd
depends_on: [ml-06-file-store-index-build]

description: |
  Wires ml-06's persisted index into query-time behavior: an area-matching
  query consults the manifest first and narrows the walk to that area's
  file set, instead of walking the entire tree on every call. This is the
  genuine correctness risk of the Level 4 sub-index (design-discussion.md
  §9's risk table) — the highest-complexity story in this epic, because the
  bar is strict in both directions:

  1. NEVER a false negative — an area-scoped query must return the SAME
     hits a full walk restricted to that area would have found. Narrowing
     that silently drops a real match is worse than no index at all.
  2. NEVER silently stale — if a file changed after being indexed (its live
     content hash no longer matches the manifest's recorded hash), the
     query must either exclude/flag that file explicitly or transparently
     re-read it live, never silently serve the old, now-wrong cached
     content as if it were current.
  3. NEVER a regression for the no-index case — a repo with no manifest
     built yet must behave EXACTLY as FileLayerAdapter does today, byte-for-
     byte, full walk every time. The sub-index is additive, never a
     required dependency for level 4 to keep working.

  The exact wiring point (extending FileLayerAdapter.recall() directly, vs.
  a thin sibling/wrapper adapter that consults the index then delegates to
  FileLayerAdapter for the fallback) is this story's own implementation
  call — design-discussion.md does not mandate one shape, only the
  behavioral guarantees above.

acceptance_criteria:
  - "Given a repo with a built index (ml-06) and a query matching a known area, when recall() runs, then the search is scoped to that area's file set (verified by proving fewer files are read/scanned than a full walk of the whole target directory would touch)"
  - "Given the same area-scoped query, when its results are compared against a full walk manually restricted to that same area, then the two produce IDENTICAL hit sets — no false negative introduced by narrowing"
  - "Given a repo with NO index built, when recall() runs any query, then behavior (hits returned, files scanned, provenance shape) is byte-for-byte identical to pre-epic FileLayerAdapter behavior — a regression test proves this directly against the existing FileLayerAdapter.test.ts suite, unmodified"
  - "Given a file indexed by ml-06's manifest is modified on disk after indexing (its live sha256 no longer matches the recorded hash), when a query touching that file's area runs, then the stale entry is either (a) excluded from the index-narrowed result set and the query falls through to a live read for that file, or (b) transparently re-read live and its current content used — but NEVER served as the old, now-incorrect cached content silently presented as a fresh hit"
  - "Given a query that matches no known area (or the index doesn't exist at all), when recall() runs, then it falls through to today's exact full-walk behavior for the unmatched portion — never a partial, silently-narrower-than-intended result with no indication anything was skipped"
  - "Given the implementation's chosen wiring shape (extended FileLayerAdapter vs. sibling adapter), when reviewed, then FileLayerAdapter's existing, already-tested recall() contract (RecallResult shape, layers_queried/layers_skipped/degraded/escalated semantics) is preserved exactly for both the indexed and non-indexed paths"

steps:
  - id: research
    description: Re-read FileLayerAdapter.ts's recall()/RecallResult contract in full, plus ml-06's manifest shape, and decide the wiring shape (extend vs. sibling adapter) before writing tests, documenting the reasoning as this story's own design decision.
    agent: researcher
  - id: test-spec
    description: Write failing tests for all six acceptance criteria above, INCLUDING a deliberately-staged staleness scenario (index built, then a fixture file modified before the next query) and a deliberately-staged no-index-present regression scenario reusing FileLayerAdapter.test.ts's existing fixtures where possible.
    agent: tester
    depends_on: [research]
  - id: implement
    description: Implement area-scoped narrowing + staleness handling + full-walk fallback, per the chosen wiring shape.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Adversarially attempt to construct a false-negative case (an area-scoped query that should have found a hit a full walk would find) and a silently-stale case — confirm both are impossible given the implementation, not just untested by the happy-path suite.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feat/mnemosyne-memory-levels.
    agent: developer
    depends_on: [review]

context:
