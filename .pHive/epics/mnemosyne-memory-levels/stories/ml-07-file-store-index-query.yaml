    - path: lib/mnemosyne/layers/FileLayerAdapter.ts
      purpose: "recall()'s existing RecallResult contract (lines 30-116) — this story's changes must preserve it exactly for both indexed and non-indexed paths."
    - path: lib/mnemosyne/layers/FileStoreIndex.ts
      purpose: "ml-06's manifest format and sha256-based staleness-detection data this story consumes."
    - path: lib/mnemosyne/layers/__tests__/FileLayerAdapter.test.ts
      purpose: "The existing test suite this story's no-index-present regression criterion must pass unmodified."

files_to_modify:
  - file: lib/mnemosyne/layers/FileLayerAdapter.ts
    change: "Area-scoped narrowing + staleness-aware fallback wired into recall() (or a thin wrapper, per this story's own chosen wiring shape)."
  - file: lib/mnemosyne/layers/__tests__/FileLayerAdapter.test.ts
    change: "New tests: area-scoped narrowing correctness (no false negatives), staleness handling, no-index-present regression."

design_decisions:
  - decision: "Never a false negative from narrowing, never a silently stale hit — both are hard, non-negotiable acceptance criteria, not best-effort goals"
    rationale: "design-discussion.md §9's risk table names both explicitly as the sub-index's real correctness risk — a sub-index that's fast but occasionally wrong is strictly worse than the current, always-correct-but-slow full walk it's meant to complement, not replace."

risks:
  - severity: high
    description: "This is the highest-complexity story in the epic precisely because 'narrower AND never wrong' is a genuinely hard correctness bar, not a routine feature addition."
    mitigation: "Adversarial review step explicitly tasked with trying to break the false-negative and staleness guarantees before this story can be considered done, per the review step's own description above."
  - severity: medium
    description: "Wiring the index into FileLayerAdapter.recall() directly risks accidentally changing its existing, already-tested RecallResult contract for callers that never use area-scoped queries."
    mitigation: "Explicit acceptance criterion requiring the no-index-present case to pass FileLayerAdapter.test.ts's existing suite unmodified — the strongest possible proof of contract preservation."

