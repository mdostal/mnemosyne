design_decisions:
  - decision: "Directory + markdown-heading granularity, not semantic/embedding-based area clustering"
    rationale: "design-discussion.md §7.4: the operator's ask doesn't specify granularity; this is the simplest mechanism delivering real narrowing value without a new dependency or duplicating level 3/vector's already-existing semantic-search job inside level 4."
  - decision: "Reuse FileLayerAdapter's own walk()/sha256() logic rather than a second implementation"
    rationale: "A divergent directory-scan or hash convention could disagree with what FileLayerAdapter itself actually walks/hashes at query time (ml-07), silently breaking the staleness-detection contract this story's manifest exists to serve."

risks:
  - severity: low
    description: "A second, subtly-different directory-walk implementation could index files FileLayerAdapter itself would never actually return (or vice versa)."
    mitigation: "Explicit acceptance criterion requiring identical ignored-directory behavior, verified by reusing the exact same walk()/ignoredDirectories code path rather than reimplementing it."

references:
