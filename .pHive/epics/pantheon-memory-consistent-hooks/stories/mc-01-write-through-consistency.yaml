id: mc-01-write-through-consistency
epic: pantheon-memory-consistent-hooks
title: Implement write-through consistency for POST /remember
status: pending
complexity: medium
methodology: tdd

description: |
  Implement atomic write-through for POST /remember so that file write + Qdrant
  upsert are verified as a transaction. Currently, /remember writes a note file
  and calls swarm-memory, but doesn't verify the Qdrant upsert succeeded. This
  creates a divergence risk where the file exists but the Qdrant point doesn't.

  This story makes the write operation LOUD-FAIL on divergence: if the Qdrant
  upsert fails, we log loudly, keep the file (recovery artifact), and return
  an error to the caller.

acceptance_criteria:
  - "Given a POST /remember request, when the file write succeeds but Qdrant upsert fails, then the response returns 500 with error detail and keeps the file"
  - "Given a POST /remember request, when both file write and Qdrant upsert succeed, then the response confirms chunks_upserted > 0"
  - "Given a Qdrant upsert failure, when it occurs, then stderr logs the error with ERROR prefix"
  - "Given a successful /remember, when checking the file system, then the note file exists at the returned path"

steps:
  - id: test-spec
    description: |
      Write failing tests for write-through transaction contract:
      - Test: file write succeeds + upsert fails → 500 error + file kept
      - Test: both succeed → 200 + chunks_upserted > 0
      - Test: upsert failure logs to stderr with ERROR prefix
      Use test doubles to simulate swarm-memory CLI failures.
    agent: tester
    depends_on: []
  - id: implement
    description: |
      Modify src/engine.mjs remember() to verify swarm-memory exit code and
      parse JSON output for chunks_upserted. On failure: log to stderr, keep
      file, throw error. On success: return chunks_upserted count.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Review implementation and tests for loud-failure contract compliance
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feature branch
    agent: developer
    depends_on: [review]

