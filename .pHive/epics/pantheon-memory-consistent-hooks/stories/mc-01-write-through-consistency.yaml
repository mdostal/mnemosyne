    change: Add exit code check and chunks_upserted verification to remember()
  - file: test/e2e.mjs
    change: Extend with write-through failure scenario tests

code_examples:
  - title: Current remember() implementation pattern
    file: src/engine.mjs
    snippet: |
      export async function remember(text, scope, opts = {}) {
        const noteFile = await writeNoteFile(text, scope, opts.tag);
        const { stdout } = await run(['remember', '--scope', scope, '--file', noteFile]);
        const result = JSON.parse(stdout);
        return { ...result, file: noteFile };
      }

design_decisions:
  - decision: Keep file on Qdrant upsert failure
    rationale: File is the recovery artifact for manual reconciliation
  - decision: Return 500 (not 200 with warning) on upsert failure
    rationale: Loud failure contract - caller must know write didn't fully succeed
  - decision: Verify chunks_upserted > 0 instead of trusting exit code alone
    rationale: Exit code 0 doesn't guarantee indexing happened

cross_cutting:
  - concern: loud-failure
    action: "Emit ERROR log on upsert failure, return 500 to caller, include failure detail in response"
  - concern: existing-infrastructure
    action: "Preserve swarm-memory CLI contract - use existing --scope --file flags, don't modify internal state"

risks:
  - severity: medium
    description: swarm-memory CLI might return exit 0 even on partial failure
    mitigation: Parse JSON output for chunks_upserted field as definitive signal
  - severity: low
    description: File accumulation if upserts fail repeatedly
    mitigation: Document that files are recovery artifacts, add reconcile helper in later story

references:
  - path: SERVICE.md
    relevant_excerpt: |
      Guardrails honored:
      - Wraps the existing engine — no new store, no re-embed
      - remember is additive (--no-prune, upsert of a brand-new note file only)
      - Qdrant collections (SSOT) are never wiped
  - path: hooks/README.md
    relevant_excerpt: |
      Resilience contract: this hook NEVER blocks the agent loop. Any failure →
      exit 0 with no effect — a memory problem never breaks a ticket.

