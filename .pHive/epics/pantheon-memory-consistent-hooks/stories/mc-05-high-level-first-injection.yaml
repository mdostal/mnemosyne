id: mc-05-high-level-first-injection
epic: pantheon-memory-consistent-hooks
title: Implement high-level-first memory injection in pre-recall hook
status: pending
complexity: medium
methodology: tdd
depends_on: [mc-04-hook-installer]

description: |
  Modify hooks/lib/format.mjs buildMemoryBundle() to rank recall hits by layer
  priority FIRST (meta > enterprise > project > vector > file), then by score
  within layer. Reserve token budget for high-level hits so they're never
  crowded out by low-level noise.

  This implements the "inject the high level first" pattern from the
  dostal-orchestrator qdrant-hooks era.

acceptance_criteria:
  - "Given recall hits from multiple layers, when buildMemoryBundle sorts them, then meta layer hits appear before enterprise, enterprise before project, etc."
  - "Given token budget of 900, when high-level hits exist, then at least 300 tokens reserved for meta+enterprise layer hits"
  - "Given no high-level hits, when building bundle, then full budget available for lower layers (no wasted space)"
  - "Given cache-safe layout, when bundle is built, then stable prefix (layer descriptions) appears before variable delta (hits)"

steps:
  - id: test-spec
    description: |
      Write failing tests for high-level-first ranking:
      - Test: meta layer hits ranked above vector layer (even if lower score)
      - Test: within layer, hits ranked by score descending
      - Test: token budget reserved for high-level (300 of 900)
      - Test: cache-safe layout preserved (stable prefix | breakpoint | delta)
    agent: tester
    depends_on: []
  - id: implement
    description: |
      Modify hooks/lib/format.mjs:
      1. Define layer priority map: {meta: 0, enterprise: 1, project: 2, vector: 3, file: 4}
      2. In buildMemoryBundle, sort hits by (layer priority, -score)
      3. Reserve HIGH_LEVEL_TOKEN_BUDGET (default 300) for meta+enterprise
      4. Fill remaining budget with lower-priority hits
      5. Preserve cache-safe layout (stable prefix unchanged)
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Review ranking logic and verify it doesn't break existing cache-safe layout
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feature branch
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/dostal/.minerva/runs/d0aee757-47fc-4df8-98dc-c61b726bf01f/workspace
  tech_stack:
    runtime: Node.js
    modules: ESM
  key_files:
    - path: hooks/lib/format.mjs
      purpose: Contains buildMemoryBundle() that formats recall hits
    - path: hooks/pre-recall.mjs
      purpose: Calls buildMemoryBundle() and injects result as context
    - path: test/bundle.mjs
      purpose: Tests cache-safe layout and bundle formatting

files_to_modify:
  - file: hooks/lib/format.mjs
    change: Add layer-priority sorting to buildMemoryBundle()
  - file: test/bundle.mjs
    change: Add tests for high-level-first ranking

code_examples:
  - title: Cache-safe layout pattern (existing)
    file: hooks/lib/format.mjs
    snippet: |
      // Stable prefix (deterministic per repo/role)
      const prefix = buildStablePrefix(scope, role);
      // Cache breakpoint
      const breakpoint = '<!-- mnemosyne-cache-breakpoint: variable-ticket-memory-below -->';
      // Variable delta (per-ticket recall)
      const delta = formatHits(hits, tokenBudget);
      return { text: prefix + breakpoint + delta, ... };

design_decisions:
  - decision: Reserve 1/3 of budget for high-level (300 of 900 tokens)
    rationale: Prevents high-level context from being crowded out by noisy low-level hits
  - decision: Sort by layer priority first, score second
    rationale: A high-scoring file hit is less valuable than a low-scoring meta hit
  - decision: Env var MNEMOSYNE_HIGH_LEVEL_TOKEN_BUDGET for tuning
    rationale: Operators can adjust reservation based on their layer distribution

cross_cutting:
  - concern: provenance-completeness
    action: "Preserve provenance.layer field so ranking can use it"
  - concern: documentation
    action: "Document layer priority order in hooks/README.md"

risks:
  - severity: low
    description: If meta layer has many hits, might consume entire budget
    mitigation: Cap high-level reservation at 1/3, not unlimited
  - severity: low
    description: Layer field might be missing from older swarm-memory versions
    mitigation: Treat missing layer as file (lowest priority)

references:
  - path: hooks/README.md
    relevant_excerpt: |
      Pointers, not files. pre-recall feeds an index of relevant hits, each with
      its layer (collection), file, and line range (chunk_span), plus a short
      excerpt.
  - path: .pHive/CONTEXT.md
    relevant_excerpt: |
      Layer stack: meta → enterprise → project → code-graph → vector → file

