description: |
  Make Mnemosyne's memory CONSISTENT across all layers (no divergence between
  file memory, Qdrant, and service) and AUTO-LOADING (pre/post hooks that
  inject high-level context first before every turn and persist learnings
  after). This is the HARD GATE before Firefly onboarding - the 8 Firefly repos
  cannot integrate until memory is reliable and truthful.

  Requirements addressed:
  1. SINGLE CONSISTENT READ/WRITE - Qdrant as SSOT, write-through verification
  2. PRE/POST RECALL HOOKS - Auto-installer, high-level-first injection
  3. CONSISTENCY TEST - E2E coherence verification, drift detection
  4. REDUCE BESPOKE LAYER - Inventory existing scripts, migrate or justify
  5. VERIFY HEALTH SURFACE - Drift reporting in /health for god-cards

