# Design-pass handoff index.
#
# Registers each design-exploration topic under .pHive/design/<topic>/ so
# downstream tickets (UI build-out, design-fidelity review) can find the
# chosen output without re-deriving intent from a chat transcript. No prior
# index.yaml existed in this repo when this entry was created (pu-01) --
# this is a minimal, sensible shape (topic / output_dir / selected_option /
# date), not a reuse of a pre-established convention.

topics:
  - topic: mnemosyne-persona-ux
    output_dir: .pHive/design/mnemosyne-persona-ux/
    process: 3-option-generation -> 7-lens-review-panel -> 3-option-synthesis
    artifacts:
      initial_options:
        - .pHive/design/mnemosyne-persona-ux/options/option-1.md
        - .pHive/design/mnemosyne-persona-ux/options/option-2.md
        - .pHive/design/mnemosyne-persona-ux/options/option-3.md
      lens_critiques:
        - .pHive/design/mnemosyne-persona-ux/critiques/operator-efficiency.md
        - .pHive/design/mnemosyne-persona-ux/critiques/onboarding-clarity.md
        - .pHive/design/mnemosyne-persona-ux/critiques/accessibility.md
        - .pHive/design/mnemosyne-persona-ux/critiques/agent-provenance-trust.md
        - .pHive/design/mnemosyne-persona-ux/critiques/information-density.md
        - .pHive/design/mnemosyne-persona-ux/critiques/design-language-consistency.md
        - .pHive/design/mnemosyne-persona-ux/critiques/hierarchy-legibility.md
      synthesized_options:
        - .pHive/design/mnemosyne-persona-ux/synthesized/option-1.md
        - .pHive/design/mnemosyne-persona-ux/synthesized/option-2.md
        - .pHive/design/mnemosyne-persona-ux/synthesized/option-3.md
      selection: .pHive/design/mnemosyne-persona-ux/selection.md
    selected_option: synthesized-option-2
    selected_option_name: "Trust-Gated Unified Queue"
    selection_mechanism: "documented, reasoned pick inside pu-01 itself (no interactive operator available -- design-discussion.md §9 judgment call #2), not a blocking touchpoint"
    consumers:
      - pu-10-personas-panel-redesign-shell
      - pu-11-layer-stack-integration-redesign
      - pu-12-draft-review-approve-ui
      - pu-14-design-fidelity-review
    date: 2026-08-16
    fidelity_review:
      status: complete
      artifact: .pHive/design/mnemosyne-persona-ux/fidelity-review.md
      summary: >
        Section-by-section comparison of the shipped Personas panel
        (post pu-10/pu-11/pu-12) against synthesized option-2.md, plus a
        spot-check of the shipped code against all 7 original lenses.
        8 deviations logged, each with an explicit disposition: 4 ACCEPTED
        (documented/reasoned substitutions), 4 FLAGGED for follow-up
        (status-filter default, missing batch-approve strip, missing
        post-approval provenance note, code-architect/repo data
        unreachable in the shipped UI).
      date: 2026-08-16

  - topic: mnemosyne-icon-set
    output_dir: .pHive/design/mnemosyne-icon-set/
    process: 10-option-generation -> 7-lens-review-panel -> 3-finalist-synthesis -> operator final pick -> production assets
    artifacts:
      final_assets:
        - path: ui/favicon.png
          note: >
            Real RGBA PNG (1024x1024), genuine alpha channel (verified via
            PIL: transparent corners, real opaque/transparent pixel
            populations, not just mode metadata). Regenerated via Gemini 3
            Pro Image (gemini-3-pro-image) with the operator-picked
            refinement (thick, wide-aperture positive-space handles),
            background made transparent via PIL background removal since
            two regeneration attempts both came back as checkerboard JPEG
            despite explicit real-alpha prompting (per design-discussion.md
            OQ1's fallback).
        - path: ui/favicon.ico
          note: >
            Multi-resolution ICO, verified via PIL to contain real embedded
            RGBA frames at 16x16, 32x32, 48x48, 64x64, 128x128, 256x256.
      initial_options:
        - .pHive/design/mnemosyne-icon-set/options/icon-01-memory-spiral-brain.jpg
        - .pHive/design/mnemosyne-icon-set/options/icon-02-laurel-profile.jpg
        - .pHive/design/mnemosyne-icon-set/options/icon-03-neural-node-network.jpg
        - .pHive/design/mnemosyne-icon-set/options/icon-04-scroll-quill.jpg
        - .pHive/design/mnemosyne-icon-set/options/icon-05-infinity-recall-loop.jpg
        - .pHive/design/mnemosyne-icon-set/options/icon-06-hourglass-memory.jpg
        - .pHive/design/mnemosyne-icon-set/options/icon-07-owl-minimal.jpg
        - .pHive/design/mnemosyne-icon-set/options/icon-08-ancient-urn-vessel.jpg
        - .pHive/design/mnemosyne-icon-set/options/icon-09-monogram-m-thread.jpg
        - .pHive/design/mnemosyne-icon-set/options/icon-10-concentric-memory-rings.jpg
      lens_critiques:
        - .pHive/design/mnemosyne-icon-set/critiques/legibility-16px.md
        - .pHive/design/mnemosyne-icon-set/critiques/mythological-brand-fit.md
        - .pHive/design/mnemosyne-icon-set/critiques/dark-ui-context-fit.md
        - .pHive/design/mnemosyne-icon-set/critiques/tab-bar-distinctiveness.md
        - .pHive/design/mnemosyne-icon-set/critiques/accessibility-contrast.md
        - .pHive/design/mnemosyne-icon-set/critiques/multi-resolution-scalability.md
        - .pHive/design/mnemosyne-icon-set/critiques/visual-language-cohesion.md
      synthesized_finalists:
        - .pHive/design/mnemosyne-icon-set/synthesized/finalist-1.md
        - .pHive/design/mnemosyne-icon-set/synthesized/finalist-2.md
        - .pHive/design/mnemosyne-icon-set/synthesized/finalist-3.md
    generator: "Gemini 3 Pro Image (\"Nano Banana Pro\", gemini-3-pro-image), via portunus resolve --exec -- key never read into this session's context"
    status: shipped
    operator_pick: "Ancient Urn (icon-08), refined -- see is-02-operator-pick-and-assets.yaml's operator_pick field for the verbatim operator answer"
    review_note: >
      All 3 independent synthesis agents converged unanimously on the same
      refinement: Ancient Urn (icon-08), with thickened/wider-aperture
      handles. The mythological-brand-fit lens ranked it #1 of 10 (the only
      concept where the Greek-antiquity silhouette and the "holds/stores,
      can be drawn from later" metaphor are the same image); 5 of the other
      6 lenses independently converged on the handles as the mark's one
      liability, all describing the failure mode as graceful (degrades to a
      simpler correct shape, not to mud/noise). No autonomous pick was
      made -- this is real input for is-02's operator touchpoint, not a
      final decision. The operator's own early favorite, icon-01
      (memory-spiral-brain), was flagged as the single worst performer on
      the legibility-16px lens ("most purpose-built to fail this test") and
      near-bottom on mythological-brand-fit (generic brain silhouette, no
      antiquity/myth signal).
    selection_mechanism: "3 finalists only -- final pick is a real, blocking operator touchpoint (is-02), never autonomous, per the operator's own explicit process note this session."
    consumers:
      - is-02-operator-pick-and-assets
    date: 2026-08-17

  - topic: mnemosyne-ui-redesign
    output_dir: .pHive/design/mnemosyne-ui-redesign/
    process: 3-real-html-mockup-generation -> 7-lens-review-panel -> 3-finalist-synthesis (real HTML) -> operator final pick (pending)
    artifacts:
      initial_options:
        - .pHive/design/mnemosyne-ui-redesign/options/collapsible-clusters.html
        - .pHive/design/mnemosyne-ui-redesign/options/sidebar-glanceable.html
        - .pHive/design/mnemosyne-ui-redesign/options/minimal-jump-chips.html
      lens_critiques:
        - .pHive/design/mnemosyne-ui-redesign/critiques/navigation-wayfinding.md
        - .pHive/design/mnemosyne-ui-redesign/critiques/glanceable-monitoring.md
        - .pHive/design/mnemosyne-ui-redesign/critiques/accessibility.md
        - .pHive/design/mnemosyne-ui-redesign/critiques/visual-identity-cohesion.md
        - .pHive/design/mnemosyne-ui-redesign/critiques/consistency-with-existing-conventions.md
        - .pHive/design/mnemosyne-ui-redesign/critiques/scale-realism.md
        - .pHive/design/mnemosyne-ui-redesign/critiques/build-feasibility.md
      synthesized_finalists:
        - .pHive/design/mnemosyne-ui-redesign/synthesized/finalist-1.html
        - .pHive/design/mnemosyne-ui-redesign/synthesized/finalist-2.html
        - .pHive/design/mnemosyne-ui-redesign/synthesized/finalist-3.html
    status: review-complete-awaiting-operator-pick
    review_note: >
      Unlike the icon-set review (10 options generated), this pass generated
      3 genuinely distinct STRUCTURAL directions per design-discussion.md
      §2.1's own requirement for real rendered mockups over prose: grouped
      collapsible <details> clusters, a persistent sidebar with live status
      badges + single-active-panel, and a flat document with a jump-chip
      nav (no collapsing/hiding at all). All 3 synthesis agents,
      independently, converged on minimal-jump-chips as the strongest base
      (won 3 of 7 lenses outright -- glanceable-monitoring, accessibility,
      consistency-with-existing-conventions -- never placed last on any),
      then diverged on refinement: finalist-1 adds always-visible status
      dots + an inline Approve/Discard draft-review block + a CSS-only
      :target landing highlight; finalist-2 is the most conservative
      (3 defect fixes + a progressive-enhancement scroll-spy, structure
      otherwise untouched); finalist-3 adds status rings + a <details>
      -collapsed Personas "tail" section (draft tools + layer stack only,
      not the whole panel) + dedicated graph-node color tokens. sidebar-
      glanceable and collapsible-clusters were NOT chosen as any finalist's
      base -- both were independently found to have real, cited defects
      (sidebar-glanceable hides 7/8 panels behind JS with no ARIA state;
      collapsible-clusters bundles Liveliness+Settings+Operations behind
      one collapse toggle with zero status signal when collapsed, and
      ships fully open by default so it doesn't even solve its own stated
      goal). No autonomous pick was made -- real HTML for all 3 finalists
      is the deliverable; the operator's own pick is design-discussion.md
      §3's hard, blocking checkpoint before any implement work touches
      production ui/* files.
    selection_mechanism: "3 real HTML finalists only -- final pick is a real, blocking operator touchpoint (design-discussion.md §3), never autonomous."
    consumers:
      - mnemosyne-ui-redesign build-out (H/V planning + stories, not yet written -- deferred until the operator's pick is known)
    date: 2026-08-17
